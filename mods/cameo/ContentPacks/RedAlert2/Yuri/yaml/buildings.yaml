yuri_constructionyard:
	Inherits: ^RA2Building
	Inherits@conyard: ^Conyard
	Inherits@shape: ^4x3Shape
	Inherits@sell: ^RA2YSpawnActorsOnSell
	Tooltip:
		Name: Yuri Construction Yard
	Building:
		Footprint: xxxx xxxx xxxx
		Dimensions: 4,3
	Transforms:
		IntoActor: yuri_mobileconstructionvehicle
		Offset: 1,1
		Facing: 432
	WithIdleOverlay@top:
		Sequence: idle-top
		RequiresCondition: !build-incomplete
	WithIdleOverlay@normal:
		Sequence: idle-normal
		RequiresCondition: !build-incomplete
	WithBuildingPlacedAnimation:
		RequiresCondition: !build-incomplete
	Exit@1:
		SpawnOffset: 213,-128,0
		ExitCell: 1,2
	WithDeathAnimation:
		DeathSequencePalette: playerra2
	ProvidesPrerequisite@ra2ywall:
		Prerequisite: ra2ywall
	Targetable@TechStealerInfiltrate:
		TargetTypes: TechStealerInfiltrate
	InfiltrateForSupportPower:
		Proxy: yrnacnst.infiltrated
		Types: TechStealerInfiltrate

yuri_warfactory:
	Inherits: ^RA2DefaultWeap
	Inherits@sell: ^RA2YSpawnActorsOnSell
	Tooltip:
		Name: Yuri War Factory
	Buildable:
		Prerequisites: ~yuri_constructionyard, yuri_slaveminer_deployed
		Description: Produces vehicles.
	WithIdleOverlay@lights:
		Sequence: idle-lights
		RequiresCondition: !build-incomplete
	WithIdleOverlay@bib:
		Sequence: bib

yuri_bioreactor:
	Inherits: ^RA2Building
	Inherits@shape: ^2x2Shape
	Inherits@sell: ^RA2YSpawnActorsOnSell
	Inherits@power: ^PowerPlant
	Inherits@gar: ^ClearableGarrison
	Inherits@BotMicro: ^BotMicromanageable
	HitShape:
		TargetableOffsets: 630,299,0
	Valued:
		Cost: 600
	Tooltip:
		Name: Bio Reactor
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~yuri_constructionyard
		Queue: Building, RABuilding
		Description: actor_yapowr.description
	Building:
		Footprint: xX xx __
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 125000
	Armor:
		Type: Wood
	RevealsShroud:
		Range: 4c0
	ScalePowerWithHealth:
	Selectable:
		Class: yuri_bioreactor
	AcceptsDeliveredExperience:
		ValidTypes: building
	ProvidesPrerequisite@buildingname:
	WithIdleOverlay@lights:
		Sequence: idle-lights
		RequiresCondition: !build-incomplete
	WithIdleOverlay@idle-tier2:
		Sequence: idle-tier2
		RequiresCondition: PowerLoad >= 1 && !build-incomplete
	Cargo:
		Types: Infantry, Hacker, Fremen
		MaxWeight: 5
		EjectOnDeath: false
		LoadedCondition: PowerLoad
	WithCargoSounds:
		EnterSounds: bbioenta.wav
		ExitSounds: bbioenta.wav
	Power@0:
		Amount: 150
		RequiresCondition: PowerLoad == 0
	Power@1:
		Amount: 200
		RequiresCondition: PowerLoad == 1
	Power@2:
		Amount: 250
		RequiresCondition: PowerLoad == 2
	Power@3:
		Amount: 300
		RequiresCondition: PowerLoad == 3
	Power@4:
		Amount: 350
		RequiresCondition: PowerLoad == 4
	Power@5:
		Amount: 400
		RequiresCondition: PowerLoad >= 5
	PowerMultiplier@yuri_upgrade_bioreactorefficiency:
		Modifier: 200
		RequiresCondition: yuri_upgrade_bioreactorefficiency
	GrantConditionOnPrerequisite@yuri_upgrade_bioreactorefficiency:
		Condition: yuri_upgrade_bioreactorefficiency
		Prerequisites: yuri_upgrade_bioreactorefficiency
	FireWarheadsOnDeathCA@4:
		Weapon: ReactorNukeWeak
		EmptyWeapon: ReactorNukeWeak
		RequiresCondition: !chronobeamed && (PowerLoad >= 1)
	FirepowerMultiplier@Load1:
		Modifier: 10
		RequiresCondition: PowerLoad == 1
	FirepowerMultiplier@Load2:
		Modifier: 20
		RequiresCondition: PowerLoad == 2
	FirepowerMultiplier@Load3:
		Modifier: 30
		RequiresCondition: PowerLoad == 3
	FirepowerMultiplier@Load4:
		Modifier: 40
		RequiresCondition: PowerLoad == 4
	FirepowerMultiplier@Load5:
		Modifier: 50
		RequiresCondition: PowerLoad >= 5
	WithCargoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
	ActorStatValues:
		Stats: Armor, Sight, Power, Cargo
		Upgrades: yuri_upgrade_bioreactorefficiency

