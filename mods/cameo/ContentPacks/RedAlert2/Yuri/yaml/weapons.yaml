	Inherits@xRA2Magnet0: ^Warhead_Laser_Heavy
	Inherits@xRA2Magnet1: ^Projectile_Laser_Heavy
	Inherits@xRA2Magnet2: ^Effect_Laser_Heavy
	-Warhead@Effect:
	Range: 7032
	ValidTargets: Vehicle, Structure
	ReloadDelay: 200
	Burst: 100
	BurstDelays: 1
	TargetActorCenter: true
	Projectile: LaserZap
		Shape: Flat
		Width: 350
		Duration: 100
		Color: FF55F505
		-HitAnim:
	Warhead@Laser_Heavy:
		Range: 0, 32
		Falloff: 100, 100
		Damage: 2000
		ValidTargets: Vehicle, Structure
	# 20000-point Magnetism meter over `Burst: 100` shots = 200 a shot, so a full volley
	# is a full lock -- exactly what the 100 stacked `Magnet` tokens used to mean. Neither
	# firepower nor the target's damage modifiers touched the old grant, and the magnetron
	# carries `FirepowerMultiplier@MultiWeapon: 50` while not elite, so both stay OFF.
	Warhead@Condition: ApplyPhysicalState
		PhysicalStateName: Magnetism
		Amount: 200
		ApplyFirepowerModifiers: false
		ApplyDamageModifiers: false
		Range: 500
		ValidTargets: Vehicle
	-Warhead@EffectAir:

