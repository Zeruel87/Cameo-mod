yuri_psychicdominator:
	Inherits: ^RA2Building
	Inherits@SW: ^PrimarySuperweapon
	Inherits@shape: ^3x3Shape
	Inherits@sell: ^RA2YSpawnActorsOnSell
	Tooltip:
		Name: Psychic Dominator
	Buildable:
		Prerequisites: ~yuri_constructionyard, yuri_battlelab, !psydom, ~techlevel.superweapons
		Description: actor_yappet.description
	Building:
		Footprint: =x= xxx xxx
		Dimensions: 3,3
	SelectionDecorations:
	DetonateWeaponPowerCA@psi:
		AllowMultiple: true
		OrderName: PsychicDominator
		Prerequisites:
			1: ~techlevel.superweapons
		PauseOnCondition: disabled
		Icons:
			1: ra2domin
		Cursor: ability
		ChargeInterval: 10500
		ActivationDelay: 25
		ActivationSequence:
		Names:
			1: power_psychicdominator.name
		Descriptions:
			1: power_psychicdominator.description
		EndChargeSpeechNotification: NuclearWeaponAvailable
		EndChargeTextNotification: Psychic Dominator ready.
		EndChargeSound: spsyopen.wav
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		InsufficientPowerSpeechNotification: InsufficientPower
		LaunchSpeechNotification: NuclearWeaponLaunched
		LaunchTextNotification: Warning: Psychic Dominator activated.
		IncomingSpeechNotification: NuclearWarheadApproaching
		IncomingTextNotification: Warning: Psychic Dominator activated.
		Weapons:
			1: ra2psiatomic
		DisplayRadarPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		CameraRemoveDelay: 100
		TargetCircleRanges:
			1: 5000, 10000
		TargetCircleColors: 66339988, ff000080
		PostProcessEffectType: PsychicDominator
		LaunchSound: spsyopen.wav
		IncomingSound: spsyopen.wav
		BeaconActor: blastradius.dominate
		CameraRange: 10000
	MindControllerCA:
		Capacity: 0
		ControllingCondition: controlling
		RequiresCondition: !disabled && !build-incomplete
	WithIdleOverlay@controlling:
		Sequence: active
		RequiresCondition: controlling
	SupportPowerChargeBar:
	ProvidesPrerequisite@swlimit:
		Prerequisite: psydom

