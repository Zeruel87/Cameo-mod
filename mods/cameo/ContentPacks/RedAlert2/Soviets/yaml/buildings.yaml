		Name: Soviet Construction Yard
	Building:
		Footprint: xxxx xxxx xxxx
		Dimensions: 4,3
	Transforms:
		IntoActor: ra2_soviets_mobileconstructionvehicle
		Offset: 1,1
		Facing: 432
