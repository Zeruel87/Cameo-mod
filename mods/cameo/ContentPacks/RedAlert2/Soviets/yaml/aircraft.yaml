	Tooltip:
		Name: Siege Chopper
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 98
		Prerequisites: ~ra2_soviets_radar
		Queue: Vehicle, Aircraft, RAAircraft
		Description: actor_schp.description
	Aircraft:
		TurnSpeed: 30
		Speed: 150
		RepulsionSpeed: 30
		CanForceLand: false
		#LandableTerrainTypes: Clear, ClearTemperat, ClearWinter, ClearJungle, ClearSnow, ClearDesert, ClearInterior, Rough, Road, Beach, Tiberium, BlueTiberium, RedTiberium, GoldTiberium, Ore, Gems, SCMinerals, ClearDune, Dune, Concrete, Sand, SpiceSand, Spice
		VTOL: true
		Voice: Move
		PauseOnCondition: !undeployed || disabled
	Health:
		HP: 55000
	ChangesHealth@SelfHealing:
		Step: 22
	Armament@PRIMARY:
		Weapon: BlackHawkCannon
		LocalOffset: 320,0,0
		MuzzleSequence: muzzle
		RequiresCondition: undeployed
	WithMuzzleOverlay:
	Armament@DeployTargeter:
		Weapon: deploytargeting_5c0
		RequiresCondition: botmicro
	Armament@Deployed:
		Name: deployed
		Weapon: RA160mm
		LocalOffset: 410,0,650
		RequiresCondition: !rank-elite && !ra2_soviets_doctrine_nuclearmunitions && !ra2_soviets_doctrine_firemunitions && !ra2_soviets_doctrine_teslamunitions && deployed
		Voice: DeployedAttack
	Armament@DeployedRad:
		Name: deployed
		Weapon: RA160mm_rad
		LocalOffset: 410,0,650
		RequiresCondition: !rank-elite && ra2_soviets_doctrine_nuclearmunitions && deployed
		Voice: DeployedAttack
	Armament@DeployedFire:
		Name: deployed
		Weapon: RA160mm_fire
		LocalOffset: 410,0,650
		RequiresCondition: !rank-elite && ra2_soviets_doctrine_firemunitions && deployed
		Voice: DeployedAttack
	Armament@DeployedTesla:
		Name: deployed
		Weapon: RA160mm_tesla
		LocalOffset: 410,0,650
		RequiresCondition: !rank-elite && ra2_soviets_doctrine_teslamunitions && deployed
		Voice: DeployedAttack
	Armament@DeployedElite:
		Name: deployed
		Weapon: RA160mmE_elite
		LocalOffset: 410,0,650
		RequiresCondition: rank-elite && !ra2_soviets_doctrine_nuclearmunitions && !ra2_soviets_doctrine_firemunitions && !ra2_soviets_doctrine_teslamunitions && deployed
		Voice: DeployedAttack
	Armament@DeployedEliteRad:
		Name: deployed
		Weapon: RA160mmE_rad_elite
		LocalOffset: 410,0,650
		RequiresCondition: rank-elite && ra2_soviets_doctrine_nuclearmunitions && deployed
		Voice: DeployedAttack
	Armament@DeployedEliteFire:
		Name: deployed
		Weapon: RA160mmE_fire_elite
		LocalOffset: 410,0,650
		RequiresCondition: rank-elite && ra2_soviets_doctrine_firemunitions && deployed
		Voice: DeployedAttack
	Armament@DeployedEliteTesla:
		Name: deployed
		Weapon: RA160mmE_tesla_elite
		LocalOffset: 410,0,650
		RequiresCondition: rank-elite && ra2_soviets_doctrine_teslamunitions && deployed
		Voice: DeployedAttack
	FirepowerMultiplier@FirerateCompensation:
		Modifier: 50
	RenderRangeCircle:
		RangeCircleType: vehicle
		RequiresCondition: deployed && !airborne
	Turreted:
		TurnSpeed: 30
	-AttackAircraft:
	AttackTurreted:
		Armaments: primary, deployed
		Voice: Attack
		PauseOnCondition: disabled
	HeliGrantConditionOnDeploy:
		DeployAnimation: deploy
		DeployedCondition: deployed
		UndeployedCondition: undeployed
		DeploySound: vchodepa.wav
		UndeploySound: vchodepa.wav
		AllowedTerrainTypes: Clear, ClearTemperat, ClearWinter, ClearJungle, ClearSnow, ClearDesert, ClearInterior, Rough, Road, Beach, Tiberium, BlueTiberium, RedTiberium, GoldTiberium, Ore, Gems, SCMinerals, ClearDune, Dune, Concrete, Sand, SpiceSand, Spice, ZergSoil
		DeployVoice: Deploy
		UndeployVoice: Move
		CanDeployOnRamps: true
		SynchronizeDeployment: True
		PauseOnCondition: disabled
	RejectsOrders@deployment:
		Reject: Move
		RequiresCondition: !undeployed && !airborne
	RejectsOrders@wierdtakeoff:
		RequiresCondition: !undeployed && airborne
	-WithShadow:
	WithMoveAnimation:
		MoveSequence: move
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1536, 1536
	SpawnActorOnDeath:
		Actor: yrschp.Husk
	RenderSprites:
		PlayerPalette: ra2buildinghack
	WithVoxelBody:
		Sequence: deployed
		RequiresCondition: deployed && !airborne
	WithVoxelTurret:
		RequiresCondition: deployed && !airborne
	WithVoxelHelicopterBody:
		TickRate: 1
		RequiresCondition: undeployed
	Voiced:
		VoiceSet: SiegeChopperVoice
	DeathSounds:
	-DamagedByTintedCells@rad:
	-DamagedByTintedCells@genrad:
	-DamagedByTintedCells@tib:
	ActorStatValues:
		Upgrades: ra2_soviets_doctrine_heavyarmorplatings, ra2_soviets_doctrine_reactivearmor, ra2_soviets_doctrine_tesladischargearmor, ra2_soviets_doctrine_nuclearmunitions, ra2_soviets_doctrine_firemunitions, ra2_soviets_doctrine_teslamunitions

