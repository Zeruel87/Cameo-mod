ra2_soviets_kirovairship:
	Inherits: ^Helicopter
	Inherits@Template: ^SpaceshipTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@announce: ^AnnounceGlobal
	Inherits@priority: ^PrioritizeBuilding
	Inherits@ra2sovietsRadShells: ^RA2SovietsRadShells
	Inherits@ra2sovietsFireShells: ^RA2SovietsFireShells
	Inherits@ra2sovietsTeslaShells: ^RA2SovietsTeslaShells
	Inherits@ra2sovietsArmorPlatings: ^RA2SovietsArmorPlatings
	Inherits@ra2sovietsReactiveArmor: ^RA2SovietsReactiveArmor
	Inherits@ra2sovietsTeslaDischargeArmor: ^RA2SovietsTeslaDischargeArmor
	Inherits@RA2KirovArmorPlatings: ^RA2KirovArmorPlatings
	Inherits@RA2KirovGastroburners: ^RA2KirovGastroburners
	Inherits@RA2KirovAtomicBombs: ^RA2KirovAtomicBombs
	Tooltip:
		Name: Kirov Airship
	Valued:
		Cost: 4000
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 99
		Prerequisites: ~ra2_soviets_warfactory, ra2_soviets_battlelab
		Queue: Vehicle, Aircraft, RAAircraft
		Description: actor_zep.description
	Aircraft:
		InitialFacing: 896
		TurnSpeed: 6
		Speed: 30
		RepulsionSpeed: 24
		CanSlide: False
	Health:
		HP: 800000
	ChangesHealth@SelfHealing:
		Step: 320
	Armament@PRIMARY:
		Weapon: RA2KirovBomb
		LocalOffset: 256,0,-512
		RequiresCondition: !rank-elite && !ra2_soviets_doctrine_nuclearmunitions && !ra2_soviets_doctrine_firemunitions && !ra2_soviets_doctrine_teslamunitions && !ra2_soviets_upgrade_kirovatomicbombs
	Armament@PRIMARYRad:
		Weapon: RA2KirovBomb_rad
		LocalOffset: 256,0,-512
		RequiresCondition: !rank-elite && ra2_soviets_doctrine_nuclearmunitions && !ra2_soviets_upgrade_kirovatomicbombs
	Armament@PRIMARYFire:
		Weapon: RA2KirovBomb_fire
		LocalOffset: 256,0,-512
		RequiresCondition: !rank-elite && ra2_soviets_doctrine_firemunitions && !ra2_soviets_upgrade_kirovatomicbombs
	Armament@PRIMARYTesla:
		Weapon: RA2KirovBomb_tesla
		LocalOffset: 256,0,-512
		RequiresCondition: !rank-elite && ra2_soviets_doctrine_teslamunitions && !ra2_soviets_upgrade_kirovatomicbombs
	Armament@PRIMARYNuclear:
		Weapon: RA2KirovBomb_nuclear
		LocalOffset: 256,0,-512
		RequiresCondition: (rank-elite && !ra2_soviets_upgrade_kirovatomicbombs) || (!rank-elite && ra2_soviets_upgrade_kirovatomicbombs)
	Armament@PRIMARYNuclearELITE:
		Weapon: RA2KirovBomb_nuclear_elite
		LocalOffset: 256,0,-512
		RequiresCondition: rank-elite && ra2_soviets_upgrade_kirovatomicbombs
	AttackAircraft:
		Voice: Attack
		AttackType: Strafe #Hover
		#StrafeRunLength: 3333
		#FacingTolerance: 20
	WithShadow:
	SelectionDecorations:
	Selectable:
		DecorationBounds: 2560, 2560
	SpawnActorOnDeath:
		Actor: RA2ZEP.Husk
	Voiced:
		VoiceSet: KirovVoice
	DeathSounds:
	-DamagedByTintedCells@rad:
	-DamagedByTintedCells@genrad:
	-DamagedByTintedCells@tib:
	RenderSprites:
		PlayerPalette: playerra2
	ActorStatValues:
		Upgrades: ra2_soviets_doctrine_heavyarmorplatings, ra2_soviets_doctrine_reactivearmor, ra2_soviets_doctrine_tesladischargearmor, ra2_soviets_doctrine_nuclearmunitions, ra2_soviets_doctrine_firemunitions, ra2_soviets_doctrine_teslamunitions, ra2_soviets_upgrade_kirovarmorplatings, ra2_soviets_upgrade_gastroburners, ra2_soviets_upgrade_kirovatomicbombs

