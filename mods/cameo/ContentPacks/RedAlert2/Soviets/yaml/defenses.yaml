ra2_soviets_teslacoil:
	Inherits: ^RA2Defense
	Inherits@Template: ^AdvancedDefenseTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetGround
	Inherits@detect: ^GenericGroundDetector
	Inherits@sell: ^RA2SSpawnActorsOnSell
	Inherits@TeslaTargeting: ^PrioritizeTesla
	Inherits@arc: ^RA2TeslaOverload
	Buildable:
		Queue: Defence, RADefence
		BuildPaletteOrder: 80
		Prerequisites: ~ra2_soviets_constructionyard, ra2_soviets_battlelab
		Description: actor_ra2tesla.description
	Valued:
		Cost: 2000
	Tooltip:
		Name: Tesla Coil
	Selectable:
		Bounds: 1024, 2048, 0, -512
	SelectionDecorations:
	Health:
		HP: 120000
	WithTeslaChargeOverlay:
	Armament:
		Weapon: RA2CoilBolt
		LocalOffset: 120,0,1100
		RequiresCondition: ((!TeslaCoilCharge && !unpowered) || (TeslaCoilCharge == 1 && unpowered)) && (!ra2_soviets_upgrade_teslaoverload && !rank-elite)
	Armament@2:
		Weapon: RA2CoilBolt2
		LocalOffset: 120,0,1100
		RequiresCondition: ((!TeslaCoilCharge && !unpowered) || (TeslaCoilCharge == 1 && unpowered)) && (ra2_soviets_upgrade_teslaoverload && !rank-elite) || (!ra2_soviets_upgrade_teslaoverload && rank-elite)
	Armament@3:
		Weapon: RA2CoilBolt3
		LocalOffset: 120,0,1100
		RequiresCondition: ((!TeslaCoilCharge && !unpowered) || (TeslaCoilCharge == 1 && unpowered)) && (ra2_soviets_upgrade_teslaoverload && rank-elite)
	Armament@Charged1:
		Weapon: RA2OPCoilBolt1
		LocalOffset: 120,0,1100
		RequiresCondition: ((TeslaCoilCharge && !unpowered) || (TeslaCoilCharge > 1 && unpowered)) && (!ra2_soviets_upgrade_teslaoverload && !rank-elite)
	Armament@Charged2:
		Weapon: RA2OPCoilBolt2
		LocalOffset: 120,0,1100
		RequiresCondition: ((TeslaCoilCharge && !unpowered) || (TeslaCoilCharge > 1 && unpowered)) && (ra2_soviets_upgrade_teslaoverload && !rank-elite) || (!ra2_soviets_upgrade_teslaoverload && rank-elite)
	Armament@Charged3:
		Weapon: RA2OPCoilBolt3
		LocalOffset: 120,0,1100
		RequiresCondition: ((TeslaCoilCharge && !unpowered) || (TeslaCoilCharge > 1 && unpowered)) && (ra2_soviets_upgrade_teslaoverload && rank-elite)
	AttackTesla:
		RequiresCondition: !build-incomplete
		PauseOnCondition: disabled
		ChargeAudio: btespow.wav
		MaxCharges: 1
		ReloadDelay: 75
		# Maintainer 2026-08-15: RA1 charges 25, RA2 charges 20. Written OUT rather
		# than left to the engine's default of 22 — an absent key silently pinned
		# this coil's charge to whatever the engine ships, and W16 prices the
		# charge share, so the number has to be a decision rather than a leftover.
		InitialChargeDelay: 20
	WithMakeAnimation:
	WithIdleOverlay@powered:
		Sequence: idle-powered
		RequiresCondition: !disabled && !build-incomplete
	GrantCondition@power:
		Condition: unpowered
		RequiresCondition: lowpower || powerdown
	GrantCondition@disable:
		RequiresCondition: ((empdisable || chronobeamed || diskdrain || being-captured) && !invulnerability) || (unpowered && !TeslaCoilCharge) || build-incomplete
	Targetable@TeslaCoil:
		TargetTypes: TeslaCoil
		RequiresCondition: !build-incomplete && !chronobeamed
	ExternalCondition@TeslaCoilCharge:
		Condition: TeslaCoilCharge
		SourceCap: 1
	RangeMultiplier@Charge2:
		Modifier: 110
		RequiresCondition: (TeslaCoilCharge == 2 && !unpowered) || (TeslaCoilCharge == 3 && unpowered)
	RangeMultiplier@Charge3:
		Modifier: 120
		RequiresCondition: (TeslaCoilCharge == 3 && !unpowered) || TeslaCoilCharge > 3
	FirepowerMultiplier@Charge2:
		Modifier: 125
		RequiresCondition: (TeslaCoilCharge == 2 && !unpowered) || (TeslaCoilCharge == 3 && unpowered)
	FirepowerMultiplier@Charge3:
		Modifier: 150
		RequiresCondition: (TeslaCoilCharge == 3 && !unpowered) || TeslaCoilCharge > 3
	DroneSpawnerMasterCA:
		Actors: ra2shk.bot, ra2shk.bot, ra2shk.bot
		SpawnOffset: 511,1c0,0, -511,-1c0,0, -1c0,1c0,0
		RespawnTicks: 250
		InitialActorCount: 0
		SlavesTargetSelf: true
		SlaveDisposalOnKill: DoNothing
		SlaveDisposalOnOwnerChange: DoNothing
		LoadedCondition: TeslaCoilCharge
		PauseOnCondition: !teslaChargeUpgrade
	Production:
		Produces: ra2tesla.upgrade
		RequiresCondition: !teslaChargeUpgrade
	ProductionBar:
		ProductionType: ra2tesla.upgrade
	ProductionQueue:
		Type: ra2tesla.upgrade
		DisplayOrder: 0
		Group: Addon
		LowPowerModifier: 200
		QueueLimit: 1
		ItemLimit: 1
	GrantConditionOnPrerequisite@teslaChargeUpgrade:
		Condition: teslaChargeUpgrade
		Prerequisites: ra2_soviets_upgrade_teslacoilchargers
	Power:
		Amount: -100
	RevealsShroud:
		Range: 10000
	DetectCloaked:
		Range: 5000
		RequiresCondition: !disabled
	ActorStatValues:
		Upgrades: ra2_soviets_upgrade_teslaoverload, ra2_soviets_upgrade_teslacoilchargers
