		Description: actor_gaweat.description
	Tooltip:
		Name: Weather Control Center
	Building:
		Footprint: xxx xxx xxx
		Dimensions: 3,3
	DetonateWeaponPowerCA:
		AllowMultiple: true
		OrderName: LightningStorm
		PauseOnCondition: disabled
		Prerequisites:
			1: ~techlevel.superweapons
		Icons:
			1: bolticon
		Cursor: ability
		AirburstAltitude: 4c512
		ChargeInterval: 7500
		ActivationDelay: 50
		ActivationSequence:
		Names:
			1: power_lightningstorm.name
		Descriptions:
			1: power_lightningstorm.description
		Weapons:
			1: LightningStorm
		BeginChargeSpeechNotification: IonCannonCharging
		EndChargeSpeechNotification: IonCannonReady
		EndChargeTextNotification: Lightning Storm ready.
		EndChargeSound: swearead.wav
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		LaunchSpeechNotification: NuclearWeaponLaunched
		LaunchTextNotification: Warning: Lightning Storm created.
		IncomingSpeechNotification: NuclearWarheadApproaching
		IncomingTextNotification: Warning: Lightning Storm created.
		InsufficientPowerSpeechNotification: InsufficientPower
		DisplayRadarPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		CameraRemoveDelay: 420
		Duration: 420
		ActiveCondition: active
		TargetCircleRanges:
			1: 10000
		TargetCircleColors: ff000080
		PostProcessEffectType: LightningStorm
		LaunchSound: sweaintr.wav
		IncomingSound: sweaintr.wav
		BeaconActor: BLASTRADIUS.atomic
		CameraRange: 10000
	SupportPowerChargeBar:
	MustBeDestroyed:
		RequiredForShortGame: false
	ProvidesPrerequisite@swlimit:
		Prerequisite: weatherstorm

