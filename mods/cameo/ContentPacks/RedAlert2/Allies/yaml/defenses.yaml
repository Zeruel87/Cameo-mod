ra2_allies_weathercontrolcenter:
	Inherits: ^RA2Building
	Inherits@SW: ^PrimarySuperweapon
	Inherits@shape: ^3x3Shape
	Inherits@sell: ^RA2ASpawnActorsOnSell
	Buildable:
