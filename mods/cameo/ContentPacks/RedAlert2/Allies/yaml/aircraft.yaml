ra2_allies_nighthawk:
	Inherits: ^Helicopter
	Inherits@Template: ^HelicopterTemplate
	Inherits@cargo: ^CargoAircraft
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@bot: ^BotAutoDeployTransport
	Valued:
		Cost: 2100
	Tooltip:
		Name: Night Hawk
	UpdatesPlayerStatistics:
		AddToArmyValue: true
		OverrideActor: ra2_allies_nighthawk
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~ra2_allies_airforcecommandhq
		Queue: Aircraft, RAAircraft
		Description: actor_shad.description
	Aircraft:
		TurnSpeed: 24
		Speed: 120
		RepulsionSpeed: 24
	Health:
		HP: 87500
	Repairable:
		HpPerStep: 4375
	ChangesHealth@SelfHealing:
		Step: 35
	Armament@PRIMARY:
		Weapon: BlackHawkCannon
		LocalOffset: 150,-200,-25, 150,200,-25
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
	WithMuzzleOverlay:
	WithIdleOverlay@ROTOR1AIR:
		Offset: 197,0,180
		Sequence: rotor
		RequiresCondition: airborne
		PauseOnCondition: disabled
	WithIdleOverlay@ROTOR1GROUND:
		Offset: 197,0,180
		Sequence: slow-rotor
		RequiresCondition: !airborne
		PauseOnCondition: disabled
	WithIdleOverlay@ROTOR2AIR:
		Offset: -1097,0,200
		Sequence: rotor
		RequiresCondition: airborne
		PauseOnCondition: disabled
	WithIdleOverlay@ROTOR2GROUND:
		Offset: -1097,0,200
		Sequence: slow-rotor
		RequiresCondition: !airborne
		PauseOnCondition: disabled
	Cargo:
		InitialUnits: ra2_allies_gi, ra2_allies_gi, ra2_allies_guardiangi, ra2_allies_guardiangi, ra2_allies_seal
		Types: Infantry, Hacker, Fremen
		MaxWeight: 5
		AfterLoadDelay: 0
		BeforeUnloadDelay: 0
		AfterUnloadDelay: 0
	AttackAircraft:
		FacingTolerance: 10
		AttackType: Hover
	SpawnActorOnDeath:
		Actor: ra2shad.Husk
	SelectionDecorations:
	Selectable:
		Class: ra2_allies_nighthawk
		DecorationBounds: 1280, 1024
	RenderSprites:
		Image: ra2_allies_nighthawk
		PlayerPalette: playerra2
	Voiced:
		VoiceSet: NighthawkVoice
	DeathSounds:
	FirepowerMultiplier@FirerateCompensation:
		Modifier: 50
