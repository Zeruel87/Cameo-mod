ra2_allies_harrier:
	Inherits: ^RANeutralPlane
	Inherits@Template: ^FighterTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@upgrade: ^RA2AlliedAdvancedAeronautics
	Inherits@RA2AlliedThunderboltMissiles: ^RA2AlliedThunderboltMissiles
	Valued:
		Cost: 2100
	Tooltip:
		Name: Harrier
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~ra2_allies_airforcecommandhq
		Queue: Aircraft, RAAircraft
		Description: actor_falc.description
	Aircraft:
		CruiseAltitude: 2560
		TurnSpeed: 12
		Speed: 180
		IdleTurnSpeed: 10
		IdleSpeed: 100
		TakeoffSounds: vintupa.wav
		LandingSounds: vintdna.wav
		CanHover: false
		CanSlide: false
		VTOL: true
		Voice: Move
	Health:
		HP: 72000
	Repairable:
		HpPerStep: 3600
	ChangesHealth@SelfHealing:
		Step: 72
	Armament@PRIMARY:
		Name: primary
		Weapon: HarrierMissiles
		LocalOffset: 425,-250,-225, 425,250,-225, 425,-150,-225, 425,150,-225
		LocalYaw: 100, -100, 50, -50
		PauseOnCondition: !ammo
		RequiresCondition: !rank-elite
	Armament@PRIMARYELITE:
		Name: primary
		Weapon: HarrierMissiles_elite
		LocalOffset: 425,-250,-225, 425,250,-225, 425,-150,-225, 425,150,-225
		LocalYaw: 100, -100, 50, -50
		PauseOnCondition: !ammo
		RequiresCondition: rank-elite
	FirepowerMultiplier@Harrier:
		Modifier: 75
	AmmoPool:
		Ammo: 8
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 52
		Count: 1
	SpawnActorOnDeath:
		Actor: RA2FALC.Husk
	WithMoveAnimation:
		MoveSequence: move
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1280, 1024
	Contrail@1:
		Offset: -100,256,0
		TrailLength: 15
	Contrail@2:
		Offset: -100,-256,0
		TrailLength: 15
	Voiced:
		VoiceSet: HarrierVoice
	DeathSounds:
	AttackAircraft:
		Voice: Attack
		FacingTolerance: 80
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 8
	RenderSprites:
		PlayerPalette: playerra2
	ActorStatValues:
		Upgrades: ra2_allies_upgrade_advancedaeronautics, ra2_allies_upgrade_thunderboltmissiles

