	ChangesHealth@SelfHealing:
		Step: 48
	Mobile:
		Voice: Move
		Speed: 38
	Armament@PRIMARY:
		Weapon: RA2PortaTesla
		LocalOffset: 427,0,341
		RequiresCondition: (!ra2_soviets_upgrade_teslaoverload && !rank-elite)
	Armament@PRIMARY2:
		Weapon: RA2PortaTesla2
		LocalOffset: 427,0,341
		RequiresCondition: (ra2_soviets_upgrade_teslaoverload && !rank-elite) || (!ra2_soviets_upgrade_teslaoverload && rank-elite)
	Armament@PRIMARY3:
		Weapon: RA2PortaTesla3
		LocalOffset: 427,0,341
		RequiresCondition: (ra2_soviets_upgrade_teslaoverload && rank-elite)
	Armament@TeslaCoilCharge:
