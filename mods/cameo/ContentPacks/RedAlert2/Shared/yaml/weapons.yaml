####################################################################################################
#		Red Alert 2 Weapon Templates
####################################################################################################

## RA2 per-game EFFECT templates (extracted from the inline explosions that used to sit
## on the RA2 weapon bases). Classic CnC logic: small arms = piff, chaingun = piffs; RA2
## mirrors it (ra2_piff / ra2_piffs on ra2effect). Bullet_Heavy has no classic heavier
## puff, so it reuses ra2_piffs. Each inherits the generic ^Effect_Bullet_<lvl> and swaps
## the impact for the RA2 look. Naming: ^Effect_<Fam>_<Level>_RA2 (game = last section).
^Effect_Bullet_Light_RA2:
	Inherits: ^Effect_Bullet_Light
	Warhead@Effect: CreateEffect
		Explosions: ra2_piff
		ExplosionPalette: ra2effect
	Warhead@EffectAir: CreateEffect
		Explosions: ra2_piff
		ExplosionPalette: ra2effect

^Effect_Bullet_Medium_RA2:
	Inherits: ^Effect_Bullet_Medium
	Warhead@Effect: CreateEffect
		Explosions: ra2_piffs
		ExplosionPalette: ra2effect
	Warhead@EffectAir: CreateEffect
		Explosions: ra2_piffs
		ExplosionPalette: ra2effect

## No classic heavier puff -> reuse ra2_piffs (there is no generic ^Effect_Bullet_Heavy,
## so this inherits ^Effect_Bullet_Medium, the piffs base).
^Effect_Bullet_Heavy_RA2:
	Inherits: ^Effect_Bullet_Medium
	Warhead@Effect: CreateEffect
		Explosions: ra2_piffs
		ExplosionPalette: ra2effect
	Warhead@EffectAir: CreateEffect
		Explosions: ra2_piffs
		ExplosionPalette: ra2effect


