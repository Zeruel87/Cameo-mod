^RA2SovietsTeslaDischargeArmor:
	Inherits@EnemyInProximity: ^EnemyInProximity
	SpeedMultiplier@ra2_soviets_upgrade_tesladischargearmor1:
		Modifier: 85
		RequiresCondition: ra2_soviets_doctrine_tesladischargearmor && EnemyInProximity
	SpeedMultiplier@ra2_soviets_upgrade_tesladischargearmor2:
		Modifier: 115
		RequiresCondition: ra2_soviets_doctrine_tesladischargearmor && !EnemyInProximity
	# Tesla-discharge plating is an ENERGY skin, so it reads the REFLECTOR row: strong
	# against beams and bolts, weak against fire and chemicals. Modifier 85 -> 90 to match
	# the sibling reactive-armor branch, since the type now carries the bulk of the value.
	Armor@REFLECTOR:
		Type: REFLECTOR
		RequiresCondition: ra2_soviets_doctrine_tesladischargearmor
	DamageMultiplier@ra2_soviets_doctrine_tesladischargearmor:
		Modifier: 90
		RequiresCondition: ra2_soviets_doctrine_tesladischargearmor
	FireWarheads@Tesla:
		Weapons: TeslaArmorDischargeDummy
		Interval: 1
		RequiresCondition: tesladischargearmor && !tesladischargearmorcooldown && EnemyInMaxProximity
	GrantTimedCondition@tesladischargearmorcooldown:
		RequiresCondition: tesladischargearmor
		PauseOnCondition: !tesladischargearmor
		Condition: tesladischargearmorcooldown
		Duration: 5
	GrantConditionOnDamage@tesladischargearmor:
		RequiresCondition: ra2_soviets_doctrine_tesladischargearmor && !disabled
		Condition: tesladischargearmor
		Duration: 10
		PlayerRelationship: Ally, Neutral, Enemy
	ChangesPhysicalState@tesladischargearmor:
		PhysicalStateName: EnemyProximity
		Amount: -10000
		Delay: 1
		RequiresCondition: tesladischargearmor && !tesladischargearmorcooldown && EnemyInMaxProximity
	PhysicalStateBar@EnemyProximity:
		RequiresCondition: ra2_soviets_doctrine_tesladischargearmor
	WithPhysicalStateColoredOverlay@EnemyProximity:
		RequiresCondition: ra2_soviets_doctrine_tesladischargearmor
	GrantConditionOnPrerequisite@ra2_soviets_doctrine_tesladischargearmor:
		Condition: ra2_soviets_doctrine_tesladischargearmor
		Prerequisites: ra2_soviets_doctrine_tesladischargearmor
	ActorStatValues:
		Upgrades: ra2_soviets_doctrine_tesladischargearmor

