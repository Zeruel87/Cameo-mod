		BuildPaletteOrder: 20
		Prerequisites: ~cncsyrd
		Queue: Naval, RANaval
		Description: actor_ra1_allies_gunboat.description
	Mobile:
		Speed: 100
		TurnSpeed: 20
	Health:
		HP: 75000
	ChangesHealth@SelfHealing:
		Step: 30
	Armor:
		Type: Heavy
	Turreted:
		TurnSpeed: 20
		Offset: 384,0,64
	Armament@Ground:
		Weapon: GunboatMissile
		LocalOffset: 100,-100,0, 100,100,0
		RequiresCondition: !td_gdi_upgrade_advancedmissiletargeting
	Armament@AdvancedMissileTargeting:
