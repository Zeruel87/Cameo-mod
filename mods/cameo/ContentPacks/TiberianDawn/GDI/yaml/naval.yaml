		MuzzleSequence: muzzle
	Armament@DC2:
		Weapon: DepthCharge
		LocalOffset: 100,100,0, 100,-100,0
		LocalYaw: 80, -80
		FireDelay: 5
		MuzzleSequence: muzzle
	AttackTurreted:
	WithSpriteTurret:
	RenderDetectionCircle:
	Selectable:
		DecorationBounds: 1536, 1536
	AcceptsDeliveredExperience:
		ValidTypes: vehicle
	ActorStatValues:
		Upgrades: td_gdi_upgrade_longrangesensors, td_gdi_upgrade_advancedmissiletargeting, td_gdi_upgrade_cuttingedgeequipment, td_gdi_upgrade_lightweightarmorplating

