	Inherits@MissileTargeting: ^AdvancedMissileTargeting
	Inherits@ArmorPiercingBullets: ^ArmorPiercingBullets
	Inherits@LightWeightArmorPlating: ^LightWeightArmorPlating
	Inherits@HighVelocityCannons: ^HighVelocityCannons
	Inherits@CuttingEdge: ^CuttingEdgeEquipment
	Inherits@decoration: ^GDIRankDecoration
	Tooltip:
		Name: GDI Defense Rig
	Valued:
		Cost: 5000
	Buildable:
		BuildLimit: 1
		BuildPaletteOrder: 60
		Prerequisites: ~td_gdi_weaponsfactory, td_gdi_advancedcommunicationscenter, ~td_gdi_promotion_gdidefenserig
		Queue: Vehicle, RAVehicle
		Description: actor_htnk.description
	Mobile:
		Speed: 60
		TurnSpeed: 12
		RequireForceMoveCondition: !undeployed
		ImmovableCondition: !undeployed
	Crushable:
		CrushClasses: hugevehicle
	Health:
		HP: 400000
	Repairable:
		HpPerStep: 20000
	ChangesHealth@SelfHealing:
		Step: 160
	RevealOnFire:
		ArmamentNames: primary, deployed
	Armor:
		Type: Superheavy
		RequiresCondition: !shielded
	# DEPLOYING ADDS THE STEEL DEFENCE ARMOUR ON TOP OF THE UNIT'S OWN CLASS ARMOUR.
	# Maintainer 2026-08-22: *"activate the steel armor type on deploy but keep the underlying
	# regular armor intact and then create the average between them"* — a deployed unit is a
	# static defence, and Steel is what defences wear.
	#
	# Both traits stay ENABLED together, which is the whole point:
	# `AreaDamageWarhead.MultiArmorCombination` defaults to `Average`, so the class row and the
	# Steel row meet in the middle instead of one replacing the other. Gating the class armour
	# on `undeployed` — what the defence rig, siege tank and matador used to do — makes Steel a
	# REPLACEMENT and throws the unit's own class away.
	#
	# ⚠ Averaging only happens for warheads routing through AreaDamage (62.9% of the tree).
	# The legacy inline-Versus SpreadDamage nodes still MULTIPLY, and under multiplication the
	# class row cancels out entirely (the ratio becomes just Steel/100) — so those weapons see a
	# flatter effect than designed until item A5 retires them onto ^Warhead_* templates.
	Armor@deployed:
		Type: Steel
		RequiresCondition: !shielded && deployed
	AutoTargetPriority@Repair:
		Priority: 0
	Turreted@pointdefense:
		Turret: pointdefense
		TurnSpeed: 128
		Offset: -800,0,480
		RealignDelay: -1
		RequiresCondition: undeployed
	Turreted@pointdefensedeployed:
		Turret: pointdefensedeployed
		TurnSpeed: 128
		#Offset: -800,0,480
		RealignDelay: -1
		RequiresCondition: deployed
	Turreted@targeting:
		Turret: targeting
		TurnSpeed: 128
		Offset: -800,0,480
		RealignDelay: -1
		RequiresCondition: undeployed
	Turreted@targetingdeployed:
		Turret: targetingdeployed
		TurnSpeed: 128
		#Offset: -800,0,480
		RealignDelay: -1
		RequiresCondition: deployed
	Turreted@mobile:
		TurnSpeed: 24
		Offset: -800,0,480
		RequiresCondition: undeployed
	Turreted@Phalanx:
		Turret: tower
		# Offset: -128,128,1800
		TurnSpeed: 24
		RealignDelay: -1
		RequiresCondition: deployed
	Turreted@Railgun:
		Turret: railgun
		Offset: -480,800,1280
		TurnSpeed: 24
		RealignDelay: -1
		RequiresCondition: deployed
	Turreted@MissilePod:
		Turret: missilepod
		Offset: 480,-640,1280
		TurnSpeed: 24
		RealignDelay: -1
		RequiresCondition: deployed
	Armament@pointdefense:
		Weapon: GDIRigPDLaser
		Turret: pointdefense
		LocalOffset: 640,0,480
		ForceTargetRelationships: Enemy, Neutral
		RequiresCondition: undeployed
	Armament@pointdefensedeployed:
		Weapon: GDIRigPDLaserTower
		Turret: pointdefensedeployed
		LocalOffset: 512,128,2280
		ForceTargetRelationships: Enemy, Neutral
		RequiresCondition: deployed
	Armament@DroneTargeting:
		Name: targeting
		Turret: targeting
		Weapon: GDIRigDroneTargeting
		LocalOffset: 640,0,480
		TargetRelationships: Ally
		ForceTargetRelationships: Ally
		RequiresCondition: undeployed
	Armament@DroneTargetingDeployed:
		Name: targetingdeployed
		Turret: targetingdeployed
		Weapon: GDIRigDroneTargetingTower
		LocalOffset: 512,128,2280
		TargetRelationships: Ally
		ForceTargetRelationships: Ally
		RequiresCondition: deployed
	Armament@mobile:
		Weapon: GDIRigPhalanx
		LocalOffset: 640,0,480
		Recoil: 32
		RecoilRecovery: 32
		MuzzleSequence: muzzle
		ForceTargetRelationships: Enemy, Neutral
		RequiresCondition: undeployed
	Armament@Phalanx:
		Name: deployed
		Turret: tower
		Weapon: GDIRigPhalanxTower
		# LocalOffset: 640,0,480
		LocalOffset: 512,128,2280
		# Recoil: 64
		# RecoilRecovery: 32
		MuzzleSequence: muzzle
		ForceTargetRelationships: Enemy, Neutral
		RequiresCondition: deployed
	Armament@Railgun:
		Name: deployed
		Turret: railgun
		Weapon: GDIRigRailgun
		LocalOffset: 512,0,0
		Recoil: 32
		RecoilRecovery: 32
		MuzzleSequence: muzzle
		ForceTargetRelationships: Enemy, Neutral
		RequiresCondition: deployed
	Armament@MissilePod:
		Name: deployed
		Turret: missilepod
