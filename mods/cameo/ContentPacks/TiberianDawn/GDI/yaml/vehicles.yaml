td_gdi_defenserig:
	Inherits: ^Tank
	Inherits@Template: ^EpicVehicleTemplate
	Inherits@exp: ^GainsExperienceTDBuilding
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
