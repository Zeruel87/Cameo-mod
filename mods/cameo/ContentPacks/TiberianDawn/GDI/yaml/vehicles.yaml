		LocalOffset: 640,0,480
		Recoil: 32
		RecoilRecovery: 32
		MuzzleSequence: muzzle
		ForceTargetRelationships: Enemy, Neutral
		RequiresCondition: !td_gdi_upgrade_advancedmissiletargeting && deployed
	Armament@AdvancedMissileTargeting:
		Turret: missilepod
		Weapon: GDIRigMissilePodAMT
		LocalOffset: 640,0,480
		Recoil: 32
		RecoilRecovery: 32
		MuzzleSequence: muzzle
		ForceTargetRelationships: Enemy, Neutral
		RequiresCondition: td_gdi_upgrade_advancedmissiletargeting && deployed
	FirepowerMultiplier@deployed:
		Modifier: 33
		RequiresCondition: deployed
	RevealsShroudMultiplier@deployed:
		Modifier: 125
		RequiresCondition: deployed
	AttackTurreted:
		Turrets: primary, tower, railgun, missilepod, pointdefense, pointdefensedeployed, targeting, targetingdeployed
