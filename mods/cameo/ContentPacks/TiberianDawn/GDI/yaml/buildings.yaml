		EndChargeSpeechNotification: IonCannonReady
		EndChargeTextNotification: Ion Cannon ready.
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		InsufficientPowerSpeechNotification: InsufficientPower
		DisplayTimerRelationships: Ally, Neutral, Enemy
		DisplayRadarPing: True
		CameraRange: 6000
		CameraRemoveDelay: 125
		CameraActor: CAMERA.small
		SupportPowerPaletteOrder: 20
	RevealsShroud@SWReveal:
		RequiresCondition: swreveal && ionc
	SupportPowerChargeBar:
	ProvidesPrerequisite@swlimit:
		Prerequisite: ionc
		RequiresCondition: ionc
	ProvidesPrerequisite@techcenter:
		Prerequisite: techcenter
		RequiresCondition: !(powerdown || infiltrated)
	ProvidesPrerequisite@tdtechcenter:
		Prerequisite: tdtechcenter
		RequiresCondition: !(powerdown || infiltrated)
	DamageMultiplier@ionc:
		Modifier: 50
		RequiresCondition: ionc
	PowerMultiplier@ionc:
		Modifier: 200
		RequiresCondition: ionc
	Pluggable:
		Offset: 0,0
		Conditions:
			td_gdi_advancedcommunicationscenter: ionc
		Requirements:
			td_gdi_advancedcommunicationscenter: !build-incomplete && !ionc

