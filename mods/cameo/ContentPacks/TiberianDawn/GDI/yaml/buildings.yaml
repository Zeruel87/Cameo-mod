		Queue: Building, RABuilding
		Description: actor_eye.description
	Building:
		Footprint: X_ xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	SelectionDecorations:
	WithSpriteBody:
		PauseOnCondition: lowpower
	WithBuildingBib:
	IonCannonPower:
		AllowMultiple: True
		PauseOnCondition: disabled
		RequiresCondition: ionc
		Prerequisites:
			1: ~techlevel.superweapons
		Icons:
			1: ioncannon
		Cursor: ioncannon
		ChargeInterval: 6000
		WeaponDelay: 0
		Weapon: TDIonCannon
		Effect: tsioncannon
		EffectSequence: targeting
		EffectPalette: ra2effect
		Names:
			1: power_ioncannon.name
		Descriptions:
			1: power_ioncannon.description
