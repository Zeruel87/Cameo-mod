^GainsExperienceTD:
	GainsExperience:
		LevelUpNotification: LevelUp
		Conditions:
			200: rank-veteran
			400: rank-veteran
			600: rank-veteran
			800: rank-veteran

^GainsExperienceTDBuilding:
	GainsExperience:
		LevelUpNotification: LevelUp
		Conditions:
			250: rank-veteran
			500: rank-veteran
			750: rank-veteran
			1000: rank-veteran

^TiberiumCloakAnimation:
	Cloak:
		CloakStyle: Palette
		CloakedPalette: cloak_stealth
		IsPlayerPalette: true
		EffectImage: stealthfade
		EffectPalette: greenspark
		CloakEffectSequence: reversed
		UncloakEffectSequence: idle
		EffectTracksActor: True

