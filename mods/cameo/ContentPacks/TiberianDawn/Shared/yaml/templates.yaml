^TDMCV:
	Inherits: ^Vehicle
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@selection: ^SelectableSupportUnit
	Inherits@mcv: ^MCV
	Transforms:
		IntoActor: fact
		Offset: -1,-1
		Facing: 432
		TransformSounds: constru2.aud, hvydoor1.aud
		NoTransformNotification: BuildingCannotPlaceAudio
	FireWarheadsOnDeath:
		Weapon: UnitExplodeBig

^TDHARV:
	Inherits: ^Tank
	Inherits@Template: ^HarvesterTemplate
	Inherits@selection: ^SelectableEconomicUnit
	Inherits@harv: ^Harvester
	Tooltip:
		Name: Tiberium Harvester
	Valued:
		Cost: 1000
	Harvester:
		BaleLoadDelay: 4
		BaleUnloadDelay: 1
		EmptyCondition: no-tiberium
	StoresResources:
		Capacity: 45
	Mobile:
		Speed: 60
		TurnSpeed: 12
	Health:
		HP: 150000
	Repairable:
		HpPerStep: 7500
	ChangesHealth@SelfHealing:
		Step: 60
	Armor:
		Type: Heavy
	WithHarvestAnimation:
	WithDockingAnimation:
	FireWarheadsOnDeath:
		RequiresCondition: !no-tiberium
		Weapon: TiberiumExplosion
	FireWarheadsOnDeath@empty:
		RequiresCondition: no-tiberium
		Weapon: UnitExplodeHarvEmpty
	SelectionDecorations:
	RenderSprites:
		Image: harv

^TDBuilding:
	Inherits: ^BaseBuilding
	Building:
		BuildSounds: constru2.aud, hvydoor1.aud
	SoundOnDamageTransition:
		DamagedSounds: xplobig4.aud
		DestroyedSounds: crumble.aud, xplobig4.aud
	# TD buildings render with the default 'player' palette; the death animation
	# must use the same palette (the ^BaseBuilding ra2player default is for TS).
	WithDeathAnimation:
		DeathSequencePalette: player
	FireWarheadsOnDeath:
		Type: Footprint
		Weapon: TDBuildingExplode
		EmptyWeapon: TDBuildingExplode

^TDDefense:
	Inherits: ^Defense
	Building:
		BuildSounds: constru2.aud, hvydoor1.aud
	SoundOnDamageTransition:
		DamagedSounds: xplobig4.aud
		DestroyedSounds: crumble.aud, xplobig4.aud
	# See ^TDBuilding: death palette must match the default 'player' render palette.
	WithDeathAnimation:
		DeathSequencePalette: player
	FireWarheadsOnDeath:
		Type: Footprint
		Weapon: TDBuildingExplode
		EmptyWeapon: TDBuildingExplode

