# This pack defines no faction actors of its own that the bot modules key on, so it carries no
# AI rows yet. A faction pack owns its AI rows in its own yaml/ai.yaml (see the sibling faction
# packs). Packs can ADD rows to the modules declared in mods/cameo/ai/ai.yaml, never override
# or remove them: docs/design/AI_ARCHITECTURE.md section 1.2 and 2.7, docs/MIGRATION.md.
Player:
	# Engineers (maintainer 2026-09-30: bots must build them again). Share 1, as the RA2 and D2k packs already do; the
	# engineer owner (CaptureManagerBotModuleCA / EngineerBotModule) sends them to capture and to repair bridge huts.
	UnitBuilderBotModuleCA@generic:
		UnitsToBuild:
			e6: 1
