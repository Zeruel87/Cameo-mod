^WC2HumansUpgradeRangerLongbow:
	GrantConditionOnPrerequisite@RLongBowUpg:
		Condition: rangerlb_upg
		Prerequisites: wc2_humans_upgrade_rangerlongbow
	RangeMultiplier@RLongBowUpg:
		Modifier: 120
