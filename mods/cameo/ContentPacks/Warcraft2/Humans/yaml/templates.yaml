^WC2HumansUpgradeRangerScouting:
	GrantConditionOnPrerequisite@RScoutUpg:
		Condition: rangersc_upg
		Prerequisites: wc2_humans_upgrade_rangerscouting
	RevealsShroudMultiplier@RScoutUpg:
