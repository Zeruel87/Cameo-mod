^WC2HumanDefense:
	Inherits: ^Defense
	Inherits@2: ^WC2Building
	-WithDeathAnimation:
	AmbientSound:
		SoundFiles: wc2_shared_sounds|pswrkdon.aud
	-AutoTarget:

^WC2HumansUpgradeSwordStrength:
	GrantConditionOnPrerequisite@WC2SwordUpg:
		Condition: wc2sword_upg
		Prerequisites: wc2_humans_upgrade_swordstrength
	GrantConditionOnPrerequisite@WC2SwordUpg2:
		Condition: wc2sword_upg2
		Prerequisites: wc2_humans_upgrade_swordstrengthii
	FirepowerMultiplier@WC2SwordUpg:
		Modifier: 115
		RequiresCondition: wc2sword_upg && !wc2sword_upg2
	FirepowerMultiplier@WC2SwordUpg2:
		Modifier: 135
		RequiresCondition: wc2sword_upg2

^WC2HumansUpgradeArmorStrength:
	GrantConditionOnPrerequisite@WC2HShieldUpg:
		Condition: wc2hshield_upg
		Prerequisites: wc2_humans_upgrade_armorstrength
	GrantConditionOnPrerequisite@WC2HShieldUpg2:
		Condition: wc2hshield_upg2
		Prerequisites: wc2_humans_upgrade_armorstrengthii
	DamageMultiplier@WC2HShieldUpg:
		Modifier: 90
		RequiresCondition: wc2hshield_upg && !wc2hshield_upg2
	DamageMultiplier@WC2HShieldUpg2:
		Modifier: 80
		RequiresCondition: wc2hshield_upg2

^WC2HumansUpgradeArrowStrength:
	GrantConditionOnPrerequisite@WC2ArrowUpg:
		Condition: wc2arrow_upg
		Prerequisites: wc2_humans_upgrade_arrowstrength
	GrantConditionOnPrerequisite@WC2ArrowUpg2:
		Condition: wc2arrow_upg2
		Prerequisites: wc2_humans_upgrade_arrowstrengthii
	FirepowerMultiplier@WC2ArrowUpg:
		Modifier: 115
		RequiresCondition: wc2arrow_upg && !wc2arrow_upg2
	FirepowerMultiplier@WC2ArrowUpg2:
		Modifier: 135
		RequiresCondition: wc2arrow_upg2

^WC2HumansUpgradeBallistaStrength:
	GrantConditionOnPrerequisite@BallUpg:
		Condition: ballista_upg
		Prerequisites: wc2_humans_upgrade_ballistastrength
	GrantConditionOnPrerequisite@BallUpg2:
		Condition: ballista_upg2
		Prerequisites: wc2_humans_upgrade_ballistastrengthii
	FirepowerMultiplier@BallUpg:
		Modifier: 115
		RequiresCondition: ballista_upg && !ballista_upg2
	FirepowerMultiplier@BallUpg2:
		Modifier: 135
		RequiresCondition: ballista_upg2

^WC2HumansUpgradeRanger:
	GrantConditionOnPrerequisite@RangerUpg:
		Condition: ranger_upg
		Prerequisites: wc2_humans_upgrade_ranger
	DamageMultiplier@RangerUpg:
