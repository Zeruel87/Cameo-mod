		Weapon: wc2visualexplode
		EmptyWeapon: wc2visualexplode
	ActorStatValues:
		Upgrades: wc2_humans_upgrade_ballistastrength, wc2_humans_upgrade_ballistastrengthii, wc2_humans_upgrade_armorstrength, wc2_humans_upgrade_armorstrengthii

wc2_humans_demolitionsquad:
	Inherits@WC2INFANTRY: ^WC2Infantry
	Inherits@WC2Template: ^WC2Demolitioner
	Inherits@BallUpg: ^WC2HumansUpgradeBallistaStrength
	Inherits@WC2HShieldUpg: ^WC2HumansUpgradeArmorStrength
	Tooltip:
		Name: Demolition Squad
	Buildable:
		Prerequisites: ~wc2_humans_gnomishinventor
		Queue: Vehicle, RAVehicle
		Description: Explosive suicide infantry. Can attack normally.
	#Weapons and demolition
	AttackFrontal:
		Armaments: detonate, primary
		FacingTolerance: 0
	Armament:
		Name: detonate
		Weapon: wc2demolitionsquadTargeting
		RequiresCondition: !cond_deployed
	Armament@Melee:
		Weapon: wc2demolitionsquadMelee
		RequiresCondition: cond_deployed
	GrantConditionOnAttack:
		Condition: cond_detonate
		ArmamentNames: detonate
		RequiresCondition: !cond_deployed
	FireWarheadsOnDeath:
		Weapon: wc2demolitionsquadTrigger
		EmptyWeapon: wc2demolitionsquadTrigger
		RequiresCondition: !chronobeamed
	GrantConditionOnDeploy:
		DeployedCondition: cond_deployed
	KillsSelf:
		RequiresCondition: cond_detonate
	Voiced:
		VoiceSet: wc2voicehumandemolitionsquad
	ActorStatValues:
		Upgrades: wc2_humans_upgrade_ballistastrength, wc2_humans_upgrade_ballistastrengthii, wc2_humans_upgrade_armorstrength, wc2_humans_upgrade_armorstrengthii
	# DEPLOYING ADDS THE STEEL DEFENCE ARMOUR ON TOP OF THE UNIT'S OWN CLASS ARMOUR.
	# Maintainer 2026-08-22: *"activate the steel armor type on deploy but keep the underlying
	# regular armor intact and then create the average between them"* — a deployed unit is a
	# static defence, and Steel is what defences wear.
	#
	# Both traits stay ENABLED together, which is the whole point:
	# `AreaDamageWarhead.MultiArmorCombination` defaults to `Average`, so the class row and the
	# Steel row meet in the middle instead of one replacing the other. Gating the class armour
	# on `undeployed` — what the defence rig, siege tank and matador used to do — makes Steel a
	# REPLACEMENT and throws the unit's own class away.
	#
	# ⚠ Averaging only happens for warheads routing through AreaDamage (62.9% of the tree).
	# The legacy inline-Versus SpreadDamage nodes still MULTIPLY, and under multiplication the
	# class row cancels out entirely (the ratio becomes just Steel/100) — so those weapons see a
	# flatter effect than designed until item A5 retires them onto ^Warhead_* templates.
	Armor@deployed:
		Type: Steel
		RequiresCondition: !shielded && deployed
