wc2_humans_mobileconstructionvehiclehuman:
	Inherits@WC2INFANTRY: ^WC2Vehicle
	Inherits@WC2Template: ^WC2MCV
	Mobile:
		TurnSpeed: 30
	Buildable:
		Prerequisites: ~wc2_humans_blacksmith
		Description: Transforms into a Town Hall.
	Tooltip:
		Name: Mobile Construction Vehicle (Human)
	Transforms:
		IntoActor: wc2_humans_townhall
		Offset: -1,-1
		Facing: 432
		TransformSounds:
		NoTransformNotification: BuildingCannotPlaceAudio
	Voiced:
		VoiceSet: wc2voicehumanpeasant
	# Animation stuff
	-WithFacingSpriteBody:
	-WithMoveAnimation:
	-WithAttackAnimation:
	WithInfantryBody:
		IdleSequences: idle-n, idle-ne, idle-e, idle-se, idle-s, idle-sw, idle-w, idle-nw
		StandSequences: idle
		MoveSequence: run

wc2_humans_peasant:
	Inherits@WC2INFANTRY: ^WC2Infantry
	Inherits@WC2Template: ^WC2Peasant
	Inherits@WC2HShieldUpg: ^WC2HumansUpgradeArmorStrength
	Tooltip:
		Name: Peasant
	Buildable:
		Prerequisites: ~wc2_humans_townhall, wc2_humans_elvenlumbermill
		Description: Harvester.
	Armament:
		Weapon: wc2peasantsmack
		FireDelay: 7
	-WithInfantryBody:
	WithHarvesterSpriteBody:
		ImageByFullness: wc2_humans_peasant, wc2_human_peasantgold
	WithMoveAnimation:
		MoveSequence: run
	Voiced:
		VoiceSet: wc2voicehumanpeasant
	-DamagedByTerrain:
	ActorStatValues:
		Upgrades: wc2_humans_upgrade_armorstrength, wc2_humans_upgrade_armorstrengthii

wc2_humans_paladin:
	Inherits@wc2_humans_knight: wc2_humans_knight
	Tooltip:
		Name: Paladin
	Buildable:
		Prerequisites: ~wc2_humans_upgrade_paladin, wc2_humans_church, wc2_humans_stables, ~!wc2_humans_upgrade_warcraft3knightwip
		Description: Mounted holy infantry. Very fast and quite durable.\nCan cast healing magicks.
	Voiced:
		VoiceSet: wc2voicehumanpaladin
	Selectable:
		Class: wc2_humans_knight
	-WithInfantryBody@Paladin:
	WithInfantryBody:
		-RequiresCondition:
	# Paladin should always be considered to have the paladin upgrade researched.
	GrantCondition@Paladin:
		Condition: paladin_upg
	#Weapons
	Inherits@attacks_and_spells: ^WC2KnightPaladinAttacksSpells
	Mobile:
		TurnSpeed: 46

