# Arhcer also has built-in ranger stuff so that ranger's upgrades and spells will be applied to already-built archers, just as in WC2.

wc2_humans_elvenarcher:
	Inherits@WC2INFANTRY: ^WC2Infantry
	Inherits@Template: ^AntiTankAntiAirInfantryTemplate
	Inherits@EXP: ^GainsExperienceTD
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@WC2HShieldUpg: ^WC2HumansUpgradeArmorStrength
	Inherits@WC2ArrowUpg: ^WC2HumansUpgradeArrowStrength
	Inherits@RLongBowUpg: ^WC2HumansUpgradeRangerLongbow
	Inherits@RScoutUpg: ^WC2HumansUpgradeRangerScouting
	Inherits@RMarksmanUpg: ^WC2HumansUpgradeRangerMarksman
	Inherits@RangerUpg: ^WC2HumansUpgradeRanger
	Tooltip:
		Name: Elven Archer
	Valued:
		Cost: 600
	Power:
		Amount: -30
	Health:
		HP: 25000
	ChangesHealth@SelfHealing:
		Step: 25
	Mobile:
		Speed: 75
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~wc2_humans_elvenlumbermill, ~!wc2_humans_upgrade_ranger, ~!wc2_humans_upgrade_highelvenarcher
		Queue: Infantry, RAInfantry
		Description: Basic ranged infantry. Not as durable as Footman.\nCan attack air.
	Armament:
		Weapon: wc2arrowFire
		FireDelay: 7
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: wc2arrowFire
	FirepowerMultiplier@Arrows:
		Modifier: 75
	Voiced:
		VoiceSet: wc2voicehumanelvenarcher
	# Animation and upgrade stuff
	# Archer body
	WithInfantryBody:
		RequiresCondition: !ranger_upg
	# Ranger body
	WithInfantryBody@Ranger:
		IdleSequences: idle-ranger
		StandSequences: idle-ranger
		MoveSequence: run-ranger
		DefaultAttackSequence: shoot-ranger
		RequiresCondition: ranger_upg
	ActorStatValues:
		Upgrades: wc2_humans_upgrade_arrowstrength, wc2_humans_upgrade_arrowstrengthii, wc2_humans_upgrade_armorstrength, wc2_humans_upgrade_armorstrengthii, wc2_humans_upgrade_ranger, wc2_humans_upgrade_rangerlongbow, wc2_humans_upgrade_rangerscouting

