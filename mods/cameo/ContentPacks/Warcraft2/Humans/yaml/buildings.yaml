wc2_humans_farm:
	Inherits@WC2BUILDING: ^WC2HumanBuilding
	Inherits@wc2_farm: ^WC2Farm
	Tooltip:
		Name: Farm
	Valued:
		Cost: 1200
	Power:
		Amount: 300
	StoresResources:
		Capacity: 6000
	Health:
		HP: 300000
	Buildable:
		Prerequisites: ~wc2_humans_townhall
		Queue: Building, RABuilding
		Description: Provides food and supply for units.
	SpawnActorsOnSell:
		ActorTypes: wc2_humans_footman
	Voiced:
		VoiceSet: wc2humanfarmvoice
	### Upgrade stuff ###
	# Un upgraded sprite
	WithSpriteBody:
		RequiresCondition: !wc2_humans_upgrade_betterfarm && !wc2_humans_upgrade_bestfarm

	# Better Farm Upgrade
	GrantConditionOnPrerequisite@betterfarm:
		Condition: wc2_humans_upgrade_betterfarm
		Prerequisites: wc2_humans_upgrade_betterfarm
	WithSpriteBody@betterfarm:
		Sequence: wc2_humans_upgrade_betterfarm
		RequiresCondition: wc2_humans_upgrade_betterfarm && !wc2_humans_upgrade_bestfarm
	PowerMultiplier@betterfarm:
		Modifier: 150
		RequiresCondition: wc2_humans_upgrade_betterfarm && !wc2_humans_upgrade_bestfarm
	DamageMultiplier@betterfarm:
		Modifier: 66
		RequiresCondition: wc2_humans_upgrade_betterfarm && !wc2_humans_upgrade_bestfarm

	# Best Farm Upgrade
	GrantConditionOnPrerequisite@bestfarm:
		Condition: wc2_humans_upgrade_bestfarm
		Prerequisites: wc2_humans_upgrade_bestfarm
	WithSpriteBody@bestfarm:
		Sequence: wc2_humans_upgrade_bestfarm
		RequiresCondition: wc2_humans_upgrade_bestfarm
	PowerMultiplier@bestfarm:
		Modifier: 200
		RequiresCondition: wc2_humans_upgrade_bestfarm
	DamageMultiplier@bestfarm:
		Modifier: 50
		RequiresCondition: wc2_humans_upgrade_bestfarm
	SpawnActorsOnSell@bestfarm:
		ActorTypes: wc2_critter_sheep
		ValuePercent: 4
		RequiresCondition: wc2_humans_upgrade_bestfarm

