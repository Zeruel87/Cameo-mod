wc2_humans_magetower:
	Inherits@WC2BUILDING: ^WC2HumanBuilding
	Inherits@wc2_temple: ^WC2Temple
	Tooltip:
		Name: Mage Tower
	Buildable:
		Prerequisites: ~wc2_humans_townhall, wc2_humans_castle, !wc2_humans_magetower_swlimit
		Queue: Building, RABuilding
		Description: Teaches men in arcane magicks.\nTrains Mages.\nUnlocks Blizzard superweapon.
	ProvidesPrerequisite@swlimit:
		Prerequisite: wc2_humans_magetower_swlimit
	SpawnActorsOnSell:
		ActorTypes: wc2_humans_footman
	Voiced:
		VoiceSet: wc2magetowervoice
	# Support powers
	# Slow
	GrantExternalConditionPower@SLOW:
		AllowMultiple: true
		OrderName: wc2_slow
		#PauseOnCondition: lowpower
		Icon: slow
		ChargeInterval: 3000
		Name: Slow
		Description: Decreases movement speed and attack rate.
		Durations:
			1: 500
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		#BeginChargeSpeechNotification: IronCurtainCharging
		#EndChargeSpeechNotification: IronCurtainReady
		DisplayRadarPing: True
		Conditions:
			1: wc2_cond_slow
		OnFireSound: wc2_slow.aud
		#IncomingSound: ironcur9.aud
		SupportPowerPaletteOrder: 20
		ValidRelationships: Enemy, Neutral, Ally
		Dimensions: 5, 5
		Footprints:
			1: __x__ _xxx_ xxxxx _xxx_ __x__
	# Invisibility
	GrantExternalConditionPower@INVISIBILITY:
		AllowMultiple: true
		OrderName: wc2_invisibility
		#PauseOnCondition: lowpower
		Icon: invisibility
		ChargeInterval: 3000
		Name: Invisibility
		Description: Cloaks units.
		Durations:
			1: 500
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		#BeginChargeSpeechNotification: IronCurtainCharging
		#EndChargeSpeechNotification: IronCurtainReady
		DisplayRadarPing: True
		Conditions:
			1: wc2_cond_invisibility
		OnFireSound: wc2_invisibl.aud
		#IncomingSound: ironcur9.aud
		SupportPowerPaletteOrder: 30
		ValidRelationships: Enemy, Neutral, Ally
		Dimensions: 5, 5
		Footprints:
			1: __x__ _xxx_ xxxxx _xxx_ __x__
	# Blizzard super weapon
	IonCannonPower@BLIZZARD:
		AllowMultiple: true
		OrderName: wc2_blizzard
		PauseOnCondition: lowpower
		Prerequisites:
			1: ~techlevel.superweapons
		Icons:
			1: blizzard
		Names:
			1: Blizzard
		Descriptions:
			1: Rain down icy death in a large area.
		Cursor: ioncannon
		ChargeInterval: 7500
		BeginChargeSpeechNotification: IonCannonCharging
		EndChargeSpeechNotification: IonCannonReady
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		OnFireSound: wc2_icestorm.aud
		DisplayTimerRelationships: Ally, Neutral, Enemy
		DisplayRadarPing: True
		CameraActor: camera.small
		SupportPowerPaletteOrder: 90
		Weapon: wc2blizzardSuper
		WeaponDelay: 0
		TargetCircleRanges:
			1: 7000
		Effect: wc2_effect_blizzard
		EffectSequence: hit

