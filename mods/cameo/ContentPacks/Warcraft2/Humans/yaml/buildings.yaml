wc2_humans_townhall:
	Inherits: ^BaseBuilding
	Inherits@ref: ^Refinery
	Inherits@shape: ^3x2Shape
	Inherits@bot: ^BotMicromanageable
	Inherits@conyard: ^Conyard
	Tooltip:
		Name: Town Hall
		RequiresCondition: !wc2_humans_keep && !wc2_humans_castle
	Tooltip@2:
		Name: Keep
		RequiresCondition: wc2_humans_keep && !wc2_humans_castle
	Tooltip@3:
		Name: Castle
		RequiresCondition: wc2_humans_castle
	Production@INFANTRY:
		Produces: Infantry
		PauseOnCondition: disabled
	ProductionQueue@INFANTRY:
		Type: Infantry
		DisplayOrder: 2
		Group: Infantry
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		InfiniteBuildLimit: 10
	ProductionBar@INFANTRY:
		ProductionType: Infantry
	# Production@NORMAL:
	# 	-RequiresCondition:
	# -Production@CLASSICPRODUCTIONQUEUES:
	# ProductionBar@BUILDING:
	# 	-RequiresCondition:
	# ProductionBar@DEFENCE:
	# 	-RequiresCondition:
	# -ProductionBar@RABUILDING:
	# -ProductionBar@RADEFENCE:
	ProductionQueue@Building:
		LowPowerModifier: 100
	ProductionQueue@Defense:
		LowPowerModifier: 100
	Selectable:
		Bounds: 3072, 2048
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@wc2_humans_keep:
		Prerequisite: wc2_humans_keep
		RequiresCondition: wc2_humans_keep
	ProvidesPrerequisite@wc2_humans_castle:
		Prerequisite: wc2_humans_castle
		RequiresCondition: wc2_humans_castle
	ProvidesPrerequisite@keepupgradeavailable:
		Prerequisite: keepupgradeavailable
		RequiresCondition: !wc2_humans_keep
	ProvidesPrerequisite@castleupgradeavailable:
		Prerequisite: castleupgradeavailable
		RequiresCondition: wc2_humans_keep && !wc2_humans_castle
	Pluggable:
		Offset: 0,0
		Conditions:
			wc2_humans_townhall: wc2_humans_keep
		Requirements:
			wc2_humans_townhall: !wc2_humans_keep
	Pluggable@2:
		Offset: 0,0
		Conditions:
			wc2_humans_keep: wc2_humans_castle
		Requirements:
			wc2_humans_keep: wc2_humans_keep && !wc2_humans_castle
	WithSpriteBody@keep:
		RequiresCondition: wc2_humans_keep && !wc2_humans_castle
		Sequence: wc2_humans_keep
		Name: keep
	WithSpriteBody@castle:
		Sequence: wc2_humans_castle
		Name: castle
		RequiresCondition: wc2_humans_castle
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
		BuildSounds: wc2_constrct.aud
		TerrainTypes: Clear,ClearTemperat,ClearWinter,ClearJungle,ClearSnow,ClearDesert,Road,Concrete,ClearDune,ZergSoil
	DamageMultiplier@keep:
		Modifier: 75
		RequiresCondition: wc2_humans_townhall && !wc2_humans_castle
	DamageMultiplier@castle:
		Modifier: 50
		RequiresCondition: wc2_humans_castle
	GrantConditionOnPowerState@supply:
		Condition: lowpower
		ValidPowerStates: Low, Critical
	ProvidesPrerequisite@supplylimit:
		Prerequisite: supplylimit
		RequiresCondition: lowpower
	RallyPoint:
		Path: 0,2
	Exit@1:
		SpawnOffset: -1024,1024,0 #-1323,1280,0
		ExitCell: 0,2
		Facing: 540
	ProvidesRadar:
		RequiresCondition: !jammed
	ExternalCondition@JAMMED:
		Condition: jammed
	GivesBuildableArea:
		AreaTypes: building, cityi, hatchery
	WithMakeAnimation:
	-WithDeathAnimation:
	DockHost:
		Type: Unload
		DockAngle: 0
		DockOffset: 0, 1c512, 0
		MaxQueueLength: 10
	DockHost@DOCK2:
		Type: Unload
		DockAngle: 0
		DockOffset: -1c512, 1c512, 0
		MaxQueueLength: 10
	DockHost@DOCK3:
		Type: Unload
		DockAngle: 0
		DockOffset: 1c512, 1c512, 0
		MaxQueueLength: 10
	Sellable:
	Refinery:
		DockOffset: 0,2
	StoresResources:
		Capacity: 1000
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
		FullSequence: pip-yellow
	Transforms:
		IntoActor: wc2_humans_mobileconstructionvehiclehuman

