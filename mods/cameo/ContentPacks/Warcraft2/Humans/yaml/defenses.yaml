wc2_humans_humanscouttower:
	Inherits: ^Defense
	Inherits@Template: ^BasicDefenseTemplate
	-WithTurretSearchlight:
	Inherits@exp: ^GainsExperienceTDBuilding
	Inherits@shape: ^2x2Shape
	Inherits@AUTOTARGET: ^AutoTargetAll
	Inherits@EXPERIENCE: ^GainsExperienceBuildings
	Inherits@WC2HShieldUpg: ^WC2HumansUpgradeArmorStrength
	Inherits@plug: ^BuildingPlugProducer
	Tooltip:
		Name: Human Scout Tower
		RequiresCondition: !guard && !cannon
	Tooltip@2:
		Name: Human Guard Tower
		RequiresCondition: guard
	Tooltip@3:
		Name: Human Cannon Tower
		RequiresCondition: cannon
	Valued:
		Cost: 1200
	ProductionCostMultiplier@guardtower:
		Multiplier: 50
	ProductionTimeMultiplier@guardtower:
		Multiplier: 50
	ProvidesPrerequisite@buildingname:
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~wc2_humans_townhall, wc2_humans_barracks
		Queue: Defence, RADefence
		Description: Can be upgraded to Guard or Cannon Tower.
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		BuildSounds: wc2_constrct.aud
		TerrainTypes: Clear,ClearTemperat,ClearWinter,ClearJungle,ClearSnow,ClearDesert,Road,Concrete,ClearDune,ZergSoil
	Health:
		HP: 100000
	Armor:
		Type: Wood
		RequiresCondition: !(guard || cannon)
	Armor@Upgrade:
		Type: Concrete
		RequiresCondition: guard || cannon
	DamageMultiplier@evo:
		Modifier: 50
		RequiresCondition: guard || cannon
	ProvidesPrerequisite@guard:
		Prerequisite: guard
		RequiresCondition: guard
	ProvidesPrerequisite@cannon:
		Prerequisite: cannon
		RequiresCondition: cannon
	ProvidesPrerequisite@scouttowerupgradeavailable:
		Prerequisite: scouttowerupgradeavailable
		RequiresCondition: !guard && !cannon
	Pluggable:
		Offset: 0,0
		Conditions:
			wcscouttower: guard
		Requirements:
			wcscouttower: !guard && !cannon
	Pluggable@2:
		Offset: 0,0
		Conditions:
			wcscouttower2: cannon
		Requirements:
			wcscouttower2: !guard && !cannon
	Sellable:
	-WithDeathAnimation:
	##########
	WithSpriteBody:
		RequiresCondition: !guard && !cannon
	WithSpriteBody@guard:
		Sequence: guard
		Name: guard
		RequiresCondition: guard && !cannon
	WithSpriteBody@cannon:
		Sequence: cannon
		Name: cannon
		RequiresCondition: cannon && !guard
	-WithMakeAnimation:
	BodyOrientation:
		QuantizedFacings: 16
	WithSpriteTurret:
	Turreted:
		TurnSpeed: 1023
		RealignDelay: -1
	AttackTurreted:
		Armaments: primary, cannon, guard
		PauseOnCondition: disabled
	Armament@guard:
		Weapon: wc2_tower_arrow
		RequiresCondition: guard
		LocalOffset: 0,0,500
	Armament@cannon:
		Name: cannon
		Weapon: wc2cannontowerFire
		RequiresCondition: cannon
	RevealOnFire:
		ArmamentNames: primary, cannon
	RevealsShroud:
		Range: 5000
		RequiresCondition: !(guard || cannon)
	RevealsShroud@upgraded:
		Range: 10000
		RequiresCondition: guard || cannon
	DetectCloaked@cannon:
		Range: 5000
		RequiresCondition: (guard || cannon) && !disabled
	Selectable:
		Bounds: 2048, 2048
	GrantConditionOnPrerequisite@WC2ArrowUpg:
		Condition: wc2arrow_upg
		Prerequisites: wc2_humans_upgrade_arrowstrength
	GrantConditionOnPrerequisite@WC2ArrowUpg2:
		Condition: wc2arrow_upg2
		Prerequisites: wc2_humans_upgrade_arrowstrengthii
	FirepowerMultiplier@WC2ArrowUpg:
		Modifier: 125
		RequiresCondition: wc2arrow_upg && guard
	FirepowerMultiplier@WC2ArrowUpg2:
		Modifier: 125
		RequiresCondition: wc2arrow_upg2 && guard
	GrantConditionOnPrerequisite@HCannonUpg:
		Condition: hcannon_upg
		Prerequisites: wc2_humans_upgrade_cannondamage
	GrantConditionOnPrerequisite@HCannonUpg2:
		Condition: hcannon_upg2
		Prerequisites: wc2_humans_upgrade_cannondamageii
	FirepowerMultiplier@HCannonUpg:
		Modifier: 125
		RequiresCondition: hcannon_upg && cannon
	FirepowerMultiplier@HCannonUpg2:
		Modifier: 125
		RequiresCondition: hcannon_upg2 && cannon
	ActorStatValues:
		Upgrades: wc2_humans_upgrade_arrowstrength, wc2_humans_upgrade_arrowstrengthii, wc2_humans_upgrade_cannondamage, wc2_humans_upgrade_cannondamageii, wc2_humans_upgrade_armorstrength, wc2_humans_upgrade_armorstrengthii

wc2_humans_guardtower:
	Inherits: wc2_humans_humanscouttower
	-ProductionCostMultiplier@guardtower:
	Tooltip:
		Name: Guard Tower
	Valued:
		Cost: 1500
	Buildable:
		Prerequisites: ~wc2_humans_townhall, wc2_humans_elvenlumbermill
		Description: Guard tower, attacks land, sea, and air with fast arrows.
	GrantCondition:
		Condition: guard
	Selectable:
		Class: wc2_humans_humanscouttower
	RenderSprites:
		Image: wc2_humans_guardtower

wc2_humans_cannontower:
	Inherits: wc2_humans_humanscouttower
	-ProductionCostMultiplier@guardtower:
	Tooltip:
		Name: Cannon Tower
	Valued:
		Cost: 1500
	Buildable:
		Prerequisites: ~wc2_humans_townhall, wc2_humans_blacksmith
		Description: Cannon tower, attacks land. Has huge splash damage.
	GrantCondition:
		Condition: cannon
	Selectable:
		Class: wc2_humans_humanscouttower
	RenderSprites:
		Image: wc2_humans_cannontower

