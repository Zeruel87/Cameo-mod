wc2_humans_wall:
	Inherits: ^Wall
	Valued:
		Cost: 300
	CustomSellValue:
		Value: 0
	Tooltip:
		Name: Wall
	Buildable:
		BuildPaletteOrder: 30
		Prerequisites: ~wc2_humans_townhall
		Queue: Defence, RADefence
		Description: Stops infantry and most tanks.\nBlocks some projectiles.
	Health:
		HP: 25000
	Armor:
		Type: Heavy
	BlocksProjectiles:
	Crushable:
		CrushClasses: heavywall
		-CrushSound:
	SoundOnDamageTransition:
		DestroyedSounds: crumble.aud
	# WithMakeAnimation:
	# 	Condition: build-incomplete
	LineBuild:
		NodeTypes: wc2_humans_wall
	LineBuildNode:
		Types: wc2_humans_wall
	WithWallSpriteBody:
		Type: wc2_humans_wall
		RequiresCondition: !cond_timer
	WithIdleOverlay@wc2walltimer:
		Sequence: make
		RequiresCondition: cond_timer
	GrantTimedCondition@wc2walltimer:
		Condition: cond_timer
		Duration: 30
	RenderSprites:
		Palette: player
