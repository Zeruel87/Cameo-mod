wc2_orcs_greathall:
	Inherits: ^BaseBuilding
	Inherits@ref: ^Refinery
	Inherits@shape: ^3x2Shape
	Inherits@bot: ^BotMicromanageable
	Inherits@conyard: ^Conyard
	Tooltip:
		Name: Great Hall
		RequiresCondition: !wc2_orcs_stronghold && !wc2_orcs_fortress
	Tooltip@2:
		Name: Stronghold
		RequiresCondition: wc2_orcs_stronghold && !wc2_orcs_fortress
	Tooltip@3:
		Name: Fortress
		RequiresCondition: wc2_orcs_fortress
	Production@INFANTRY:
		Produces: Infantry
		PauseOnCondition: disabled
	ProductionQueue@INFANTRY:
		Type: Infantry
		DisplayOrder: 2
		Group: Infantry
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		InfiniteBuildLimit: 10
	ProductionBar@INFANTRY:
		ProductionType: Infantry
	# Production@NORMAL:
	# 	-RequiresCondition:
	# -Production@CLASSICPRODUCTIONQUEUES:
	# ProductionBar@BUILDING:
	# 	-RequiresCondition:
	# ProductionBar@DEFENCE:
	# 	-RequiresCondition:
	# -ProductionBar@RABUILDING:
	# -ProductionBar@RADEFENCE:
	ProductionQueue@Building:
		LowPowerModifier: 100
	ProductionQueue@Defense:
		LowPowerModifier: 100
	Selectable:
		Bounds: 3072, 2048
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@wc2_orcs_stronghold:
		Prerequisite: wc2_orcs_stronghold
		RequiresCondition: wc2_orcs_stronghold
	ProvidesPrerequisite@wc2_orcs_fortress:
		Prerequisite: wc2_orcs_fortress
		RequiresCondition: wc2_orcs_fortress
	ProvidesPrerequisite@strongholdupgradeavailable:
		Prerequisite: strongholdupgradeavailable
		RequiresCondition: !wc2_orcs_stronghold
	ProvidesPrerequisite@fortressupgradeavailable:
		Prerequisite: fortressupgradeavailable
		RequiresCondition: wc2_orcs_stronghold && !wc2_orcs_fortress
	Pluggable:
		Offset: 0,0
		Conditions:
			wc2_orcs_greathall: wc2_orcs_stronghold
		Requirements:
			wc2_orcs_greathall: !wc2_orcs_stronghold
	Pluggable@2:
		Offset: 0,0
		Conditions:
			wc2_orcs_stronghold: wc2_orcs_fortress
		Requirements:
			wc2_orcs_stronghold: wc2_orcs_stronghold && !wc2_orcs_fortress
	WithSpriteBody:
		RequiresCondition: !wc2_orcs_stronghold && !wc2_orcs_fortress
	WithSpriteBody@keep:
		Sequence: wc2_orcs_stronghold
		Name: stronghold
		RequiresCondition: wc2_orcs_stronghold && !wc2_orcs_fortress
	WithSpriteBody@castle:
		Sequence: wc2_orcs_fortress
		Name: fortress
		RequiresCondition: wc2_orcs_fortress
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
		BuildSounds: wc2_constrct.aud
		TerrainTypes: Clear,ClearTemperat,ClearWinter,ClearJungle,ClearSnow,ClearDesert,Road,Concrete,ClearDune,ZergSoil
	DamageMultiplier@keep:
		Modifier: 75
		RequiresCondition: wc2_orcs_greathall && !wc2_orcs_fortress
	DamageMultiplier@castle:
		Modifier: 50
		RequiresCondition: wc2_orcs_fortress
	GrantConditionOnPowerState@supply:
		Condition: lowpower
		ValidPowerStates: Low, Critical
	ProvidesPrerequisite@supplylimit:
		Prerequisite: supplylimit
		RequiresCondition: lowpower
	RallyPoint:
		Path: 0,2
	Exit@1:
		SpawnOffset: -1024,1024,0 #-1323,1280,0
		ExitCell: 0,2
		Facing: 540
	ProvidesRadar:
		RequiresCondition: !jammed
	ExternalCondition@JAMMED:
		Condition: jammed
	GivesBuildableArea:
		AreaTypes: building, cityi, hatchery
	WithMakeAnimation:
	-WithDeathAnimation:
	DockHost:
		Type: Unload
		DockAngle: 0
		DockOffset: 0, 1c512, 0
		MaxQueueLength: 10
	DockHost@DOCK2:
		Type: Unload
		DockAngle: 0
		DockOffset: -1c512, 1c512, 0
		MaxQueueLength: 10
	DockHost@DOCK3:
		Type: Unload
		DockAngle: 0
		DockOffset: 1c512, 1c512, 0
		MaxQueueLength: 10
	Sellable:
	Refinery:
		DockOffset: 0,2
	StoresResources:
		Capacity: 1000
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
		FullSequence: pip-yellow
	Transforms:
		IntoActor: wc2_orcs_mobileconstructionvehicleorc

wc2_orcs_stronghold:
	Inherits: ^BuildingPlug
	Tooltip:
		Name: Stronghold
	Valued:
		Cost: 2500
	Buildable:
		BuildPaletteOrder: 80
		Queue: BuildingAddons
		Prerequisites:  ~wc2_orcs_greathall, strongholdupgradeavailable, wc2_orcs_blacksmith
		Description: Unlocks more advanced buildings.
	Plug:
		Type: wc2_orcs_greathall

wc2_orcs_fortress:
	Inherits: ^BuildingPlug
	Tooltip:
		Name: Fortress
	Valued:
		Cost: 5000
	Buildable:
		BuildPaletteOrder: 80
		Queue: BuildingAddons
		Prerequisites: ~wc2_orcs_greathall, wc2_orcs_stronghold, fortressupgradeavailable, wc2_orcs_golbinalchemist, wc2_orcs_ogremound
		Description: Unlocks more advanced buildings.
	Plug:
		Type: wc2_orcs_stronghold

wc2_orcs_pigfarm:
	Inherits@WC2BUILDING: ^WC2OrcBuilding
	Inherits@wc2_farm: ^WC2Farm
	Tooltip:
		Name: Pigfarm
	Valued:
		Cost: 1000
	Power:
		Amount: 250
	StoresResources:
		Capacity: 5000
	Health:
		HP: 250000
	Buildable:
		Prerequisites: ~wc2_orcs_greathall
		Queue: Building, RABuilding
		Description: Provides food and supply for units.
	SpawnActorsOnSell:
		ActorTypes: wc2_orcs_grunt
	Voiced:
		VoiceSet: wc2orcfarmvoice
	### Upgrade stuff ###
	# Un upgraded sprite
	WithSpriteBody:
		RequiresCondition: !wc2_orcs_upgrade_betterfarm && !wc2_orcs_upgrade_bestfarm

	# Better Farm Upgrade
	GrantConditionOnPrerequisite@betterfarm:
		Condition: wc2_orcs_upgrade_betterfarm
		Prerequisites: wc2_orcs_upgrade_betterfarm
	WithSpriteBody@betterfarm:
		Sequence: wc2_orcs_upgrade_betterfarm
		RequiresCondition: wc2_orcs_upgrade_betterfarm && !wc2_orcs_upgrade_bestfarm
	PowerMultiplier@betterfarm:
		Modifier: 150
		RequiresCondition: wc2_orcs_upgrade_betterfarm && !wc2_orcs_upgrade_bestfarm
	DamageMultiplier@betterfarm:
		Modifier: 66
		RequiresCondition: wc2_orcs_upgrade_betterfarm && !wc2_orcs_upgrade_bestfarm

	# Best Farm Upgrade
	GrantConditionOnPrerequisite@bestfarm:
		Condition: wc2_orcs_upgrade_bestfarm
		Prerequisites: wc2_orcs_upgrade_bestfarm
	WithSpriteBody@bestfarm:
		Sequence: wc2_orcs_upgrade_bestfarm
		RequiresCondition: wc2_orcs_upgrade_bestfarm
	PowerMultiplier@bestfarm:
		Modifier: 200
		RequiresCondition: wc2_orcs_upgrade_bestfarm
	DamageMultiplier@bestfarm:
		Modifier: 50
		RequiresCondition: wc2_orcs_upgrade_bestfarm
	SpawnActorsOnSell@bestfarm:
		ActorTypes: wc2_critter_boar
		ValuePercent: 4
		RequiresCondition: wc2_orcs_upgrade_bestfarm

