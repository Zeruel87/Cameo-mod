	Inherits@WC2INFANTRY: ^WC2Infantry
	Inherits@Template: ^AntiTankAntiAirInfantryTemplate
	Inherits@EXP: ^GainsExperienceTD
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@TAxeUpg: ^WC2OrcsUpgradeThrowingAxeStrength
	Inherits@WC2OShieldUpg: ^WC2OrcsUpgradeArmorStrength
	Inherits@BLighterUpg: ^WC2OrcsUpgradeBerserkerLightAxes
	Inherits@BScoutUpg: ^WC2OrcsUpgradeBerserkerScouting
	Inherits@BRegenUpg: ^WC2OrcsUpgradeBerserkerRegeneration
	Inherits@BerserkerUpg: ^WC2OrcsUpgradeBerserker
	Tooltip:
		Name: Troll Axethrower
	Valued:
		Cost: 500
	Power:
		Amount: -25
	Health:
		HP: 30000
	ChangesHealth@SelfHealing:
		Step: 30
	Mobile:
		Speed: 60
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~wc2_orcs_trolllumbermill, ~!wc2_orcs_upgrade_berserker
