## Paired effect+sound templates — D2k visuals with their canonical D2k sounds.
## Per docs/design/EFFECT_SOUND_TEMPLATES.md: one template per real effect,
## named after the source game and the effect's own file name, carrying BOTH
## the visual (Explosions) and the audio (ImpactSounds) together.
## These are the 7 UNAMBIGUOUS pairings (exactly one sound in the D2k reference).
## Ambiguous pairings await maintainer rulings (see fleet conflict report).

^d2k_devastator:
	Warhead@Effect: CreateEffect
