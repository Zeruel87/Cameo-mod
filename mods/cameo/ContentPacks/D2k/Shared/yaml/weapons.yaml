## Shared D2k turret weapons — moved from Ixian/yaml/weapons.yaml.
## These are used by Atreides, Corrino, Harkonnen, and Ixian turrets/infantry.
## Defining them here ensures all factions resolve them regardless of which
## ContentPacks are lobby-selected (dynamic faction loading).

110mm_Gun:
	Inherits@finalmain: ^Warhead_CannonAP_Light_Flat
	ValidTargets: Ground, Water
	ReloadDelay: 50
	Range: 7979
	TargetActorCenter: true
	Inherits@2: ^Projectile_Shell_Heavy
	Inherits@6: ^Effect_CannonAP_Light
