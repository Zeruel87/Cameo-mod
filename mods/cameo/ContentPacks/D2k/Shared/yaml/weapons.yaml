	Inherits@w83: ^Effect_CannonHE_Medium_D2K  # W7MAT covering-edge
	Report: TURRET1.WAV
	Projectile: Bullet
		Speed: 797
	Warhead@CannonAP_Light_Flat:
		ValidTargets: Ground, Water
		Damage: 30000
		PercentageScale: 9997

D2K_TowerMissile:
	Inherits: ^D2KMissile
	Inherits@fx: ^d2k_shared_d2k_towermissile
	MinRange: 2135
	ValidTargets: Ground, Water, Air
	ReloadDelay: 42
	Range: 10684
	TargetActorCenter: true
	InvalidTargets: wall
	Burst: 2
	BurstDelays: 5
	Projectile: Missile
		Speed: 3333
		Blockable: false
		LaunchAngle: 66
		Inaccuracy: 33
		Image: d2k_missile2
		ContrailZOffset: 4000
		ContrailStartColor: FF884400
		ContrailEndColor: 000000FF
		ContrailStartWidth: 50
		ContrailEndWidth: 100
		ContrailLength: 0
		Arm: 0
		AllowSnapping: true
		Shadow: true
		HorizontalRateOfTurn: 80
		VerticalRateOfTurn: 12
		TrailImage: large_trail
		TrailInterval: 1
		MaximumLaunchSpeed: 200
		MinimumLaunchSpeed: 200
		CloseEnough: 666
		Acceleration: 6
		HomingActivationDelay: 3
		RangeLimit: 33333
		PointDefenseTypes: Missile
		Palette: d2keffect
		CruiseAltitude: 1000
		MinimumLaunchAngle: 64
	Warhead@MissileAP_Heavy:
		Damage: 16000
	Warhead@ShieldHit: GrantExternalCondition
