d2k_spicesifter:
	Inherits@D2kBLD: ^D2KBuilding
	Inherits@cashtrickler: ^CashTricklerWithExperience
	Inherits@cashtricklerlimit: ^CashTricklerLimited
	Inherits@shape: ^2x2Shape
	Inherits@D2KSprite: ^D2KPaletteRender
	Buildable:
		Prerequisites: ~construction_yard, research_centre, derricklimit
		Description: actor_oilb.description
		IconPalette: d2kunit
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		BuildSounds: BUILD1.WAV
	Tooltip:
		Name: Spice Sifter
	RenderSprites:
		Image: d2k_spice_sifter
	FireWarheadsOnDeath:
		Type: Footprint
		Weapon: D2kBuildingExplode
		EmptyWeapon: D2kBuildingExplode
	FireProjectilesOnDeath:
		Weapons: Debris, Debris2, Debris3, Debris4
		Pieces: 3, 5
		Range: 1500, 2500
	CashTricklerMultiplier@d2k_spice_sifter_upgrade:
		Modifier: 125
		RequiresCondition: d2k_spice_sifter_upgrade
	GrantConditionOnPrerequisite@d2k_spice_sifter_upgrade:
		Condition: d2k_spice_sifter_upgrade
		Prerequisites: d2k_spice_sifter_upgrade
	ActorStatValues:
		Upgrades: d2k_spice_sifter_upgrade
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Heavy, Critical
	WithIdleOverlay:
		RequiresCondition: !damaged && !build-incomplete
	WithSpriteBody:
	WithMakeAnimation:
		Condition: build-incomplete
	WithCrumbleOverlay:
		RequiresCondition: !build-incomplete
	-WithDeathAnimation:

# Generic construction yard template. Common traits here; each faction actor below
# sets its tooltip name, the MCV it deploys back into, and its sprite image.

^HeavyFactory:
	Inherits: ^D2KBuilding
	Inherits@UPGRADEABLE: ^D2kUpgradeable
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@shape: ^3x3Shape
	Inherits@td_gdi_weaponsfactory: ^IsWeaponFactory
	Buildable:
		Prerequisites: ~disabled
		Description: Produces heavy vehicles.
		IconPalette: d2kunit
	Tooltip:
		Name: Heavy Factory
	Building:
		Footprint: _x_ xxx =xX ===
		Dimensions: 3,4
		LocalCenterOffset: 0,-512,0
	HitShape:
		TargetableOffsets: -1155,-704,0, -1365,832,0
		Type: Rectangle
			TopLeft: -1536, -512
			BottomRight: 1536, 1536
	HitShape@TOP:
		Type: Rectangle
			TopLeft: -512, -1536
			BottomRight: 512, -512
	RallyPoint:
	Exit@1:
		SpawnOffset: 256,192,0
		ExitCell: 0,2
	ProvidesPrerequisite@atreides:
		Prerequisite: atreides_heavy
	ProvidesPrerequisite@ordos:
		Prerequisite: ordos_heavy
	ProvidesPrerequisite@harkonnen:
		Prerequisite: harkonnen_heavy
	RenderSprites:
		Image: atreides_heavy
	WithIdleOverlay@TOP:
		RequiresCondition: !build-incomplete
		Sequence: idle-top
	WithProductionOverlay@WELDING:
		RequiresCondition: !build-incomplete
		Queues: Vehicle, RAVehicle
		Sequence: production-welding
	ProvidesPrerequisite@heavy_factory:
		Prerequisite: heavy_factory
	ProductionBar@upgrade:
		ProductionType: Upgrades
	GrantConditionOnPrerequisite@UPGRADEABLE:
		Condition: upgrade_heavy
		Prerequisites: upgrade_heavy
	DamageMultiplier@upgrade_heavy:
		RequiresCondition: upgrade_heavy
		Modifier: 75
	ActorStatValues:
		Upgrades: upgrade_heavy
	-WithDeathAnimation:
	FireProjectilesOnDeath:
		Weapons: Debris2, Debris3
		Pieces: 6, 9
		Range: 1c512, 2c768
	SpawnActorOnDeath@death1:
		Actor: light_inf
	SpawnActorOnDeath@death2:
		Actor: light_inf
	SpawnActorOnDeath@death3:
		Actor: trooper
	SpawnActorOnDeath@death4:
		Actor: trooper
	Production@upgrade:
		Produces: Addons

