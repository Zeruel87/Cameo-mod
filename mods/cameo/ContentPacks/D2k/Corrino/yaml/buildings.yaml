corrino_constructionyard:
	Inherits: ^ConstructionYard
	Tooltip:
		Name: Corrino Construction Yard
	Transforms:
		IntoActor: corrino_mobileconstructionvehicle
		Offset: 1,1
		Facing: 432
	RenderSprites:
		Image: harkonnen_conyard

corrino_windtrap:
	Inherits: ^WindTrap
	Buildable:
		Prerequisites: ~corrino_constructionyard
		Description: Provides power to the base.
	RenderSprites:
		Image: harkonnen_power

corrino_barracks:
	Inherits: ^D2KBuilding
	Inherits@UPGRADEABLE: ^D2kUpgradeable
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@ra1_soviets_barracks: ^IsBarrack
	Inherits@shape: ^2x2Shape
	Buildable:
		Prerequisites: ~corrino_constructionyard, corrino_windtrap
		Description: Trains infantry units.
		IconPalette: d2kunit
	Tooltip:
		Name: Corrino Barracks
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	RallyPoint:
	Exit@1:
		SpawnOffset: 352,576,0
		ExitCell: 0,2
	Exit@2:
		SpawnOffset: 512,480,0
		ExitCell: 1,2
	RenderSprites:
		Image: harkonnen_barracks
	ProvidesPrerequisite@d2kbarracks:
		Prerequisite: d2k_barracks
	ProvidesPrerequisite@barracks:
		Prerequisite: barracks
	ProvidesPrerequisite@factionbarracks:
		Prerequisite: corrino_barracks
	-WithDeathAnimation:
	SpawnActorOnDeath@death1:
		Actor: light_inf
	SpawnActorOnDeath@death2:
		Actor: light_inf
	FireProjectilesOnDeath:
		Weapons: Debris2, Debris3
		Pieces: 1, 2
		Range: 1c512, 2c768

corrino_refinery:
	Inherits: ^D2KRefinery
	Tooltip:
		Name: Refinery
	Buildable:
		Prerequisites: ~corrino_constructionyard, corrino_windtrap
		Description: Processes spice into credits.
	FreeActor:
		Actor: corrino_spiceharvester
		SpawnOffset: 0,2
		Facing: 160
	FreeActorWithDelivery@1:
		Actor: corrino_spiceharvester
		DeliveryOffset: 2,2
		DeliveringActor: carryall.reinforce
		Facing: 160
	RenderSprites:
		Image: harkonnen_refinery

corrino_storagesilo:
	Inherits: ^D2KSilo
	Buildable:
		Prerequisites: ~corrino_constructionyard, corrino_refinery
		Description: Stores excess spice.
	RenderSprites:
		Image: harkonnen_silo

corrino_heavyfactory:
	Inherits: ^HeavyFactory
	Tooltip:
		Name: Corrino Heavy Factory
	RenderSprites:
		Image: harkonnen_heavy
	Buildable:
		Prerequisites: ~corrino_constructionyard, corrino_refinery
		Description: Produces heavy vehicles.
		IconPalette: d2kunit
	ProvidesPrerequisite@vehicle_production:
		Prerequisite: corrino_vehicle_production
	ProvidesPrerequisite@corrino_combat:
		Prerequisite: heavy.corrino_combat
	ProvidesPrerequisite@missile_tank:
		Prerequisite: heavy.missile_tank
	ProvidesPrerequisite@mcv_production:
		Prerequisite: corrino_mcv_production

corrino_lightfactory:
	Inherits: ^D2KBuilding
	Inherits@UPGRADEABLE: ^D2kUpgradeable
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@shape: ^2x2Shape
	Inherits@td_gdi_weaponsfactory: ^IsWeaponFactory
	Buildable:
		Prerequisites: ~corrino_constructionyard, corrino_refinery
		Description: Produces light vehicles.
		IconPalette: d2kunit
	Tooltip:
		Name: Corrino Light Factory
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	RallyPoint:
	Exit@1:
		SpawnOffset: 352,576,0
		ExitCell: 0,2
	Exit@2:
		SpawnOffset: 512,480,0
		ExitCell: 1,2
	RenderSprites:
		Image: harkonnen_light
	ProvidesPrerequisite@vehicle_production:
		Prerequisite: corrino_light_vehicle_production
	ProvidesPrerequisite@light:
		Prerequisite: light.corrino
	ProvidesPrerequisite@factionlight:
		Prerequisite: corrino_lightfactory

corrino_repairpad:
	Inherits: ^D2KBuilding
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@shape: ^2x2Shape
	Buildable:
		Prerequisites: ~corrino_heavyfactory
		Description: Repairs vehicles.
		IconPalette: d2kunit
	Tooltip:
		Name: Corrino Repair Pad
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	RenderSprites:
		Image: harkonnen_repair_pad
	RepairsUnits:
		FinishRepairingNotification: Repaired
		StartRepairingNotification: Repairing
	RallyPoint:

corrino_outpost:
	Inherits: ^D2KBuilding
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@shape: ^2x2Shape
	Buildable:
		Prerequisites: ~corrino_constructionyard, corrino_refinery, corrino_barracks
		Description: Provides radar and reveals terrain.
		IconPalette: d2kunit
	Tooltip:
		Name: Corrino Outpost
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	RenderSprites:
		Image: harkonnen_outpost
	ProvidesPrerequisite@outpost:
		Prerequisite: outpost
	DetectCloaked:
		Range: 5c0
	RevealsShroud:
		Range: 8c0

corrino_hightechfactory:
	Inherits: ^D2KBuilding
	Inherits@hpad: ^IsAircraftFactory
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@shape: ^3x2Shape
	Buildable:
		Prerequisites: ~corrino_heavyfactory
		Description: Produces aircraft and provides tech upgrades.
		IconPalette: d2kunit
	Tooltip:
		Name: Corrino High Tech Factory
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	Armor:
		Type: Concrete
	Exit:
		SpawnOffset: 0,0,728
		ExitCell: 0,0
	WithProductionOverlay@WELDING:
		RequiresCondition: !build-incomplete
		Queues: Aircraft
		Sequence: production-welding
	ProductionCostMultiplier@dune:
		Multiplier: 150
	ProductionTimeMultiplier@dune:
		Multiplier: 150
	RenderSprites:
		Image: harkonnen_hightech
	ProvidesPrerequisite@hightech:
		Prerequisite: hightech.corrino

corrino_ixresearchcenter:
	Inherits: ^D2KBuilding
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@shape: ^2x2Shape
	Buildable:
		Queue: Building, RABuilding
		Prerequisites: ~corrino_heavyfactory
		Description: Unlocks advanced technology.
		IconPalette: d2kunit
	Tooltip:
		Name: Corrino Research Centre
	Building:
