corrino_carryall:
	Inherits: ^RANeutralPlane
	Inherits@D2KSprite: ^D2KPaletteRender
	Tooltip:
		Name: Corrino Carryall
	Valued:
		Cost: 600
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 10
		Prerequisites: ~hightech.corrino
		Description: Lifts and transports vehicles across the battlefield.\n  Unarmed
		IconPalette: d2kunit
	Health:
		HP: 50000
	Armor:
		Type: Light
	Aircraft:
		CruiseAltitude: 1920
		Speed: 180
		TurnSpeed: 20
		Repulsable: False
		CanSlide: True
		VTOL: True
	Carryall:
		LocalOffset: 0,0,-256
		CarryCondition: carrying
	SpawnActorOnDeath:
		Actor: carryall_husk.corrino
	RevealsShroud:
		Range: 4c0
		Type: GroundPosition
	-RevealsShroud@lockon:
	-WithFacingSpriteBody:
	WithFacingSpriteBody:
		RequiresCondition: airborne
	WithFacingSpriteBody@LANDED:
		Name: body-landed
		Sequence: idle-landed
		RequiresCondition: !airborne
	Selectable:
		Class: carryall
		Bounds: 1536, 1280, 0, 0
	Targetable:
		TargetTypes: Air
	RenderSprites:
		Image: carryall
		PlayerPalette: playerd2k
	Voiced:
		VoiceSet: D2KVehicleVoice
	MapEditorData:
		Categories: Aircraft

carryall_husk.corrino:
	Inherits: ^PlaneHusk
	Tooltip:
		Name: Carryall
	Aircraft:
		TurnSpeed: 20
		Speed: 180
	RenderSprites:
		Image: carryall
		PlayerPalette: playerd2k
	FallsToEarth:
		Explosion: D2KUnitExplodeMed

corrino_gunship:
	Inherits: ^RANeutralPlane
	Inherits@reload: ^RearmableAircraft
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@D2KSprite: ^D2KPaletteRender
	-SpawnActorOnDeath:
	Valued:
		Cost: 1200
	Tooltip:
		Name: Corrino Gunship
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 20
		Prerequisites: ~hightech.corrino
		Description: Heavily armed gunship.\n  Strong vs Vehicles, Infantry\n  Weak vs Anti-Air
		IconPalette: d2kunit
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 50000
	Aircraft:
		CruiseAltitude: 2160
		CruisingCondition: cruising
		InitialFacing: 0
		Speed: 192
		TurnSpeed: 20
		Repulsable: False
		CanSlide: True
		VTOL: True
		IdleTurnSpeed: 4
	Armament:
		Weapon: OrniGun
		LocalOffset: 0,0,-128
	AttackAircraft:
		FacingTolerance: 0
	AmmoPool:
		Ammo: 10
		ReloadCount: 10
		RearmSound: REARM1.WAV
	Targetable:
		TargetTypes: Air
	-WithDeathAnimation:
	-RevealsShroud@lockon:
	RenderSprites:
		Image: harkonnen_gunship
		PlayerPalette: player_rgba
	Voiced:
		VoiceSet: D2KVehicleVoice
	MapEditorData:
		Categories: Aircraft

