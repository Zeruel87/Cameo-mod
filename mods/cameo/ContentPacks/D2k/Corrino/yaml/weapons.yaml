# Corrino faction-specific weapons.
# Sardaukar Bazooka uses D2K_Rocket_Trooper and D2K_TowerMissile from shared/global weapons.

corrino_cannon:
	Inherits@wh: ^Warhead_CannonHE_Medium
	Inherits@proj: ^Projectile_Shell_Medium_D2K
	Inherits@fx: ^Effect_CannonHE_Medium_D2K
	ReloadDelay: 55
	Report: MEDTANK1.WAV
	Warhead@CannonHE_Medium:
		PercentageScale: 2500
		Damage: 8000

corrino_buggy_gun:
	# PILOT (Aedis 2026-09-10 02:10/02:14, scoped): repointed onto the live
	# ^Warhead_CannonAP continuous base. Heaviness 0 = ACTIVE h=0 (thousandths,
	# NOT the disabled sentinel); reproduces the old Light geometry (Spread
	# 120 x 2/3 = 80). Damage 3000, ReloadDelay 30, Range, projectile and effect
	# resolve exactly as before; the Versus shift is the intentional provisional
	# role-profile migration.
	Inherits@wh: ^Warhead_CannonAP
	Inherits@proj: ^Projectile_Shell_Light
	Inherits@fx: ^Effect_CannonAP_Light
	ReloadDelay: 30
	Range: 5c0
	Report: MEDTANK1.WAV
	ValidTargets: Ground, Water
	Warhead@CannonAP:
		Heaviness: 0
		Damage: 3000

# Sardaukar specialist infantry weapons (3-way split, template defaults).

corrino_sardaukar_berserker_axe:
	Inherits: ^Warhead_Melee_Heavy

corrino_sardaukar_sword:
	Inherits: ^Warhead_Melee_Heavy

corrino_sardaukar_javelin_spear:
	Inherits@missilerole: ^Warhead_MissileHE_Heavy
	Inherits@proj: ^Projectile_Missile_Light
	Inherits@fx: ^Effect_MissileAP_Heavy_D2K_Rocket_Trooper
	ValidTargets: Ground, Water
	Projectile:
		Image: spearfire
	Warhead@ShieldHit:
		InvalidTargets: Air
	Warhead@MissileHE_Heavy: AreaDamage
		ValidRelationships: Ally, Neutral, Enemy
		FriendlyFireDamage: 50
		FriendlyFireSpread: 50
		ValidTargets: Ground, Water, Air
		Damage: 2000
		DamageTypes: Prone75Percent, TriggerProne, ExplosionDeath
		PercentageScale: 10000
		PercentageSpread: 50
		InvalidTargets: Air

corrino_sardaukar_laser:
	Inherits@wh: ^Warhead_Laser_Heavy
	Inherits@proj: ^Projectile_Laser_Heavy
	Inherits@fx: ^Effect_Laser_Heavy
