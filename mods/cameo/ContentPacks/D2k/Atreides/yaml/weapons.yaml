	Warhead@1Dam: SpreadDamage
		Damage: 2000
		Versus:
			None: 100
			Wood: 30
			Light: 50
			Medium: 15
			Heavy: 10
			Concrete: 15
	Warhead@Concrete: DamagesConcrete
		Damage: 1800
