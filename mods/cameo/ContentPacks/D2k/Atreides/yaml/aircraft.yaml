atreides_advancedcarryall:
	Inherits: ^RANeutralPlane
	Inherits@D2KSprite: ^D2KPaletteRender
	-SpawnActorOnDeath:
	Tooltip:
		Name: Atreides Advanced Carryall
	Valued:
		Cost: 800
	Buildable:
		Factions: atreides
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 40
		Prerequisites: ~hightech.atreides
		Description: Advanced transport aircraft.\n  Unarmed
		IconPalette: d2kunit
	Health:
		HP: 50000
	Armor:
		Type: Light
	Aircraft:
		CruiseAltitude: 1920
		Speed: 180
		TurnSpeed: 20
		Repulsable: False
		CanSlide: True
		VTOL: True
	Carryall:
		LocalOffset: 0,0,-256
		CarryCondition: carrying
	-WithFacingSpriteBody:
	WithFacingSpriteBody:
		RequiresCondition: airborne
	WithFacingSpriteBody@LANDED:
		Name: body-landed
		Sequence: idle-landed
		RequiresCondition: !airborne
	RevealsShroud:
		Range: 4c0
		Type: GroundPosition
	Selectable:
		Class: carryall
		Bounds: 1536, 1280, 0, 0
	Targetable:
		TargetTypes: Air
	-WithDeathAnimation:
	-RevealsShroud@lockon:
	RenderSprites:
		Image: atreides_advancedcarryall
		PlayerPalette: player_rgba
	Voiced:
		VoiceSet: D2KVehicleVoice
	MapEditorData:
		Categories: Aircraft
