atreides_constructionyard:
	Inherits: ^ConstructionYard
	Tooltip:
		Name: Atreides Construction Yard
	Transforms:
		IntoActor: atreides_mobileconstructionvehicle
	RenderSprites:
		Image: conyard.atreides

atreides_windtrap:
	Inherits: ^WindTrap
	Buildable:
		Factions: atreides
		Prerequisites: ~atreides_constructionyard
		Description: Provides power to the base.
	RenderSprites:
		Image: power.atreides

atreides_refinery:
	Inherits: ^D2KRefinery
	Buildable:
		Factions: atreides
		Prerequisites: ~atreides_constructionyard, atreides_windtrap
		Description: Processes spice into credits.
	FreeActor:
		Actor: atreides_spiceharvester
		SpawnOffset: 0,2
		Facing: 160
	FreeActorWithDelivery@1:
		Actor: atreides_spiceharvester
		DeliveryOffset: 2,2
		DeliveringActor: carryall.reinforce
		Facing: 160
	RenderSprites:
		Image: refinery.atreides

atreides_storagesilo:
	Inherits: ^D2KSilo
	Buildable:
		Factions: atreides
		Prerequisites: ~atreides_constructionyard, atreides_refinery
		Description: Stores excess spice.
	RenderSprites:
		Image: silo.atreides

atreides_barracks:
	Inherits: ^D2KBuilding
	Inherits@UPGRADEABLE: ^D2kUpgradeable
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@ra1_soviets_sovietbarracks: ^IsBarrack
	Inherits@shape: ^2x2Shape
	Buildable:
		Factions: atreides
		Prerequisites: ~atreides_constructionyard, atreides_windtrap
		Description: Trains infantry units.
		IconPalette: d2kunit
	Tooltip:
		Name: Atreides Barracks
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	RallyPoint:
	Exit@1:
		SpawnOffset: 352,576,0
		ExitCell: 0,2
	Exit@2:
		SpawnOffset: 512,480,0
		ExitCell: 1,2
	RenderSprites:
		Image: barracks.atreides
	ProvidesPrerequisite@d2kbarracks:
		Prerequisite: d2k_barracks
	ProvidesPrerequisite@barracks:
		Prerequisite: barracks
	ProvidesPrerequisite@factionbarracks:
		Prerequisite: atreides_barracks
	GrantConditionOnPrerequisite@UPGRADEABLE:
		Prerequisites: upgrade_barracks.atreides
	DamageMultiplier@upgrade_barracks:
		RequiresCondition: upgrade_barracks
		Modifier: 75
	ActorStatValues:
		Upgrades: upgrade_barracks.atreides
	-WithDeathAnimation:
	SpawnActorOnDeath@death1:
		Actor: light_inf
	SpawnActorOnDeath@death2:
		Actor: light_inf
	FireProjectilesOnDeath:
		Weapons: Debris2, Debris3
		Pieces: 1, 2
		Range: 1c512, 2c768

