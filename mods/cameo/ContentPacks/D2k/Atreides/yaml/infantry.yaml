atreides_fremen:
	Inherits: ^D2KInfantry
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@anim: ^D2KPaletteRenderInfantry
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@EXT: ^ExternalConditions
	Inherits@bot: ^BotMicromanageable
	Inherits@AntiBuil: ^PrioritizeBuilding
	Inherits@decoration: ^DuneRankDecoration
	Tooltip:
		Name: Desert Phantom
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		Factions: atreides
		Queue: Infantry, RAInfantry
		BuildPaletteOrder: 80
		Prerequisites: ~atreides_barracks, ~hightech.atreides, upgrade_barracks, ~atreides_promotion_fremen
		Icon: phantomicon
		IconPalette: windows256
		Description: Fast Elite infantry units armed with assault rifles and machine guns. When grouped, they can take down buildings extremely quickly.\nDetector\n  Strong vs Buildings\n  Weak vs Infantry, Vehicles\n  Special Ability: Invisibility
		BuildDuration: 300
		BuildDurationModifier: 100
	Mobile:
		Speed: 68
	Valued:
		Cost: 400
	Health:
		HP: 15000
	RevealsShroud:
		Range: 5c256
	Armament@PRIMARY:
		Weapon: Fremen_S
	Armament@SECONDARY:
		Weapon: Fremen_L
	WithInfantryBody:
		DefaultAttackSequence: shoot
	Cloak:
		InitialDelay: 80
		CloakDelay: 40
		UncloakOn: Attack, Unload, Demolish, Dock, Damage, Heal
		IsPlayerPalette: true
		PauseOnCondition: cloak-force-disabled || base-reveal
		CloakStyle: Palette
		CloakedPalette: d2kcloak
		CloakedCondition: cloaked
	GrantConditionOnDamageState@UNCLOAK:
		Condition: cloak-force-disabled
		ValidDamageStates: Critical
	-MustBeDestroyed:
	Voiced:
		VoiceSet: D2KFremenVoice
	DetectCloaked:
		Range: 3c256
	Passenger:
		CargoType: Fremen
	RenderSprites:
		Image: fremen

