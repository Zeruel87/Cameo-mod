# Generic starport. Common traits here; each faction actor sets its build
# prerequisite and sprite image.

ixian_starport:
	Inherits: ^Starport
	Buildable:
		Prerequisites: ~ixian_constructionyard, ixian_ixresearchcenter, derricklimit
		Description: Purchase units from off-world suppliers.
	ProvidesPrerequisite@vehicle_production:
		Prerequisite: ixian_vehicle_production
	ProvidesPrerequisite@mcv_production:
		Prerequisite: ixian_mcv_production
	RenderSprites:
		Image: starport.smuggler

ixian_supercomputer:
	Inherits: ^D2KBuilding
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@shape: ^4x3Shape
	Inherits@SW: ^PrimarySuperweapon
	Buildable:
		Prerequisites: ~ixian_constructionyard, ixian_ixresearchcenter, !ixian_supercomputer_swlimit, ~techlevel.superweapons
		Description: Provides a nuclear weapon support power.
		IconPalette: player
	Tooltip:
		Name: Ixian Supercomputer
	Building:
		Footprint: xxxx xxxx ====
		Dimensions: 4,3
	WithMakeAnimation:
	NukePowerCA:
		OrderName: PulseMissile
		AllowMultiple: True
		PauseOnCondition: disabled
		Prerequisites:
			1: ~techlevel.superweapons
		Cursor: nuke
		Icons:
			1: abomb
		ChargeInterval: 10500
		Names:
			1: power_nuke.d2kname
		Descriptions:
			1: power_nuke.d2kdescription
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		InsufficientPowerSpeechNotification: InsufficientPower
		EndChargeSpeechNotification: NuclearWeaponAvailable
		EndChargeTextNotification: Nuclear weapon ready.
		LaunchSpeechNotification: NuclearWeaponLaunched
		LaunchTextNotification: Warning: Nuclear weapon launched.
		IncomingSpeechNotification: NuclearWarheadApproaching
		IncomingTextNotification: Warning: Nuclear weapon impact imminent.
		MissileWeapons:
			1: PulseMissile
		MissileDelay: 25
		SpawnOffset: 0,0,1024
		DisplayTimerRelationships: Ally, Neutral, Enemy
		ArrowSequence: arrow
		ClockSequence: clocklarge
		CircleSequence: circles
		DisplayBeacon: true
		DisplayRadarPing: True
		BeaconPosters:
			1: atomic
		CameraRange: 10000
		CameraRemoveDelay: 125
		CircleRanges:
			1: 10000
		SupportPowerPaletteOrder: 70
		MissileImage: raatomic
		BeaconActor: BLASTRADIUS.atomic
	WithBuildingBib:
	WithSupportPowerActivationAnimation:
		RequiresCondition: !build-incomplete
	-WithDeathAnimation:
	RenderSprites:
		Image: ixian_supercomputer
		Palette: td_temperat
	ProvidesPrerequisite@swlimit:
		Prerequisite: ixian_supercomputer_swlimit
	-WithCrumbleOverlay:

