ixian_constructionyard:
	Inherits: ^ConstructionYard
	Tooltip:
		Name: Ixian Construction Yard
	Transforms:
		IntoActor: ixian_mobileconstructionvehicle
	RenderSprites:
		Image: conyard.atreides

ixian_windtrap:
	Inherits: ^WindTrap
	Buildable:
		Prerequisites: ~ixian_constructionyard
		Description: Provides power to the base.
	RenderSprites:
		Image: power.atreides

ixian_barracks:
	Inherits: ^D2KBuilding
	Inherits@UPGRADEABLE: ^D2kUpgradeable
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@ra1_soviets_barracks: ^IsBarrack
	Inherits@shape: ^2x2Shape
	Buildable:
		Prerequisites: ~ixian_constructionyard, ixian_windtrap
		Description: Trains infantry units.
		IconPalette: d2kunit
	Tooltip:
		Name: Ixian Barracks
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	RallyPoint:
	Exit@1:
		SpawnOffset: 352,576,0
		ExitCell: 0,2
	Exit@2:
		SpawnOffset: 512,480,0
		ExitCell: 1,2
	RenderSprites:
		Image: barracks.ixian
	ProvidesPrerequisite@d2kbarracks:
		Prerequisite: d2k_barracks
	ProvidesPrerequisite@barracks:
		Prerequisite: barracks
	ProvidesPrerequisite@factionbarracks:
		Prerequisite: ixian_barracks
	GrantConditionOnPrerequisite@UPGRADEABLE:
		Prerequisites: upgrade_barracks
	DamageMultiplier@upgrade_barracks:
		RequiresCondition: upgrade_barracks
		Modifier: 75
	ActorStatValues:
		Upgrades: upgrade_barracks
	-WithDeathAnimation:
	SpawnActorOnDeath@death1:
		Actor: light_inf
	SpawnActorOnDeath@death2:
		Actor: light_inf
	FireProjectilesOnDeath:
		Weapons: Debris2, Debris3
		Pieces: 1, 2
		Range: 1c512, 2c768

ixian_refineryixian:
	Inherits: ^D2KRefinery
	Tooltip:
		Name: Refinery
	Buildable:
		Prerequisites: ~ixian_constructionyard, ixian_windtrap
		Description: Processes ore into credits.
	FreeActor:
		Actor: ixian_spiceharvester
		SpawnOffset: 0,2
		Facing: 160
	FreeActorWithDelivery@1:
		Actor: ixian_spiceharvester
		DeliveryOffset: 2,2
		DeliveringActor: carryall.reinforce
		Facing: 160
	# FreeActorWithDelivery@2:
	# 	Actor: ixian_spiceharvester
	# 	DeliveryOffset: 0,2
	# 	DeliveringActor: carryall.reinforce
	# 	Facing: 160
	RenderSprites:
		Image: refinery.atreides

ixian_storagesilo:
	Inherits: ^D2KSilo
	Buildable:
		Prerequisites: ~ixian_constructionyard, ixian_refineryixian
		Description: Stores excess resources.
	RenderSprites:
		Image: silo.atreides

ixian_munitionssilo:
	Inherits: ^D2KBuilding
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@shape: ^1x1Shape
	Buildable:
		Prerequisites: ~ixian_constructionyard, ixian_barracks
		Queue: Defence, RADefence
		BuildPaletteOrder: 310
		Description: actor_d2k_munitions.description
		IconPalette: player
	D2kActorPreviewPlaceBuildingPreview:
		TilesetPalettes:
			VOLCANIC: ra_temperat
	Valued:
		Cost: 500
	Tooltip:
		Name: Ixian Munitions Silo
	RequiresBuildableArea:
		AreaTypes: building
		Adjacent: 4
	Health:
		HP: 50000
	Armor:
		Type: Wood
	RevealsShroud:
		Range: 4c0
	RenderSprites:
		Image: d2k_munitions.atreides
	WithSpriteBody:
	Power:
		Amount: -10
	MustBeDestroyed:
		RequiredForShortGame: false
	FireProjectilesOnDeath:
		Weapons: Debris, Debris2, Debris3, Debris4
		Pieces: 2, 4
		Range: 2c0, 4c0
	-WithDeathAnimation:
	FireWarheadsOnDeath:
		Type: Footprint
		Weapon: d2k_munitions_explosion
		EmptyWeapon: d2k_munitions_explosion
	ProximityExternalCondition@d2krearm:
		Condition: d2k_rearm
		Range: 7500
		ValidRelationships: Ally
	WithRangeCircle:
		Range: 7500

