ixian_lightinfantry:
	Inherits: ^D2KInfantry
	Inherits@Template: ^ScoutInfantryTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^D2KPaletteRenderInfantry
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@Armor: ^D2K_GeneralPurposeArmor
	Inherits@NeedleGuns: ^D2K_NeedleGuns
	# Re-inherit last: the Scout/Anti-Tank templates pull in ^RA2YuriStealthSuits,
	# which redefines the shield traits keyed to its own upgrade and overwrites the
	# Personal Shield condition. Re-applying ^D2KPersonalShield here restores it.
	Inherits@personalshield: ^D2KPersonalShield
	Tooltip:
		Name: Ixian Light Infantry
	Valued:
		Cost: 150
	Buildable:
		BuildPaletteOrder: 10
		Queue: Infantry, RAInfantry
		Description: actor_ixian_lightinfantry.description
		IconPalette: d2kunit
		Prerequisites: ~ixian_barracks
	Health:
		HP: 32000
	ChangesHealth@SelfHealing:
		Step: 32
	DamageMultiplier@ScoutInfantryBuff:
		Modifier: 100
	FirepowerMultiplier@ScoutInfantryBuff:
		Modifier: 100
	FirepowerMultiplier@ixian_lightinfantry:
		Modifier: 113
	Mobile:
		Speed: 56
	Armament@PRIMARY:
		Weapon: light_inf_lmg
		LocalOffset: 128,0,256
		RequiresCondition: !ixian_upgrade_tungstenneedleguns
	Armament@Upgrade:
		Weapon: light_inf_lmg_upgrade
		LocalOffset: 128,0,256
		RequiresCondition: ixian_upgrade_tungstenneedleguns
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: light_inf_lmg
		MuzzleSequence: garrison-muzzle
		MuzzlePalette: d2keffect
		RequiresCondition: !ixian_upgrade_tungstenneedleguns
	Armament@UpgradeGARRISONED:
		Name: garrisoned
		Weapon: light_inf_lmg_upgrade
		MuzzleSequence: garrison-muzzle
		MuzzlePalette: d2keffect
		RequiresCondition: ixian_upgrade_tungstenneedleguns
	WithInfantryBody:
		IdleSequences: idle1,idle2,idle3,idle4
		DefaultAttackSequence: shoot
	Parachutable:
	RenderSprites:
		Image: light_inf
	ActorStatValues:
		Upgrades: ixian_upgrade_personalshield, ixian_upgrade_tungstenneedleguns, ixian_upgrade_generalpurposearmor, ixian_upgrade_advancedixiantechnology

