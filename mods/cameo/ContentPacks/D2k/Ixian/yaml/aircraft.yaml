	Valued:
		Cost: 1800
	Tooltip:
		Name: Ixian Air Drone
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 10
		Prerequisites: ~ixian_launchpad
		Description: actor_air_drone.description
		IconPalette: windows256
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 62500
	Repairable:
		HpPerStep: 3125
	ChangesHealth@SelfHealing:
		Step: 25
	Shielded:
		RegenAmount: 50
	AmmoPool:
		Name: primary
		Ammo: 8
		ReloadDelay: 25
		AmmoCondition: ammo
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
	AttackAircraft:
		FacingTolerance: 64
	Armament:
		Weapon: ixian_airdrone
		LocalOffset: 0,-256,0, 0,256,0
		LocalYaw: 64, -64
		PauseOnCondition: !ammo
	Armament@PRIMARY:
		Weapon: d2k_air_drone_guns
		LocalOffset: 0,-256,0, 0,256,0
		RequiresCondition: !ixian_upgrade_tungstenneedleguns
		PauseOnCondition: !ammo
	Armament@Upgrade:
		Weapon: d2k_air_drone_guns_upgrade
		LocalOffset: 0,-256,0, 0,256,0
		RequiresCondition: ixian_upgrade_tungstenneedleguns
		PauseOnCondition: !ammo
	Aircraft:
		CruiseAltitude: 1800
		Speed: 165
		RepulsionSpeed: 50
		MaximumPitch: 50
		Repulsable: true
		CanHover: false
		TurnSpeed: 11
	WithFacingSpriteBody:
	Selectable:
		Bounds: 1536, 1280, 0, 0
	SpawnActorOnDeath:
		Actor: air_drone_husk.ixian
	EjectOnDeath:
		PilotActor: ixian_shockinfantry
	Voiced:
		VoiceSet: D2KVehicleVoice
	RenderSprites:
		Image: ixian_airdrone
	MapEditorData:
		Categories: Aircraft
	FireProjectilesOnDeath:
		Weapons: Debris2, Debris3
		Pieces: 1, 2
		Range: 1c0, 3c0
	Cloak:
		CloakSound: appear1.aud
		UncloakSound: trans1.aud
		UncloakOn: Unload, Infiltrate, Demolish, Dock, Damage, Heal, Attack
	ActorStatValues:
		Upgrades: ixian_upgrade_heavymissiles, ixian_upgrade_generalpurposearmor, ixian_upgrade_tungstenneedleguns, ixian_upgrade_advancedixiantechnology

