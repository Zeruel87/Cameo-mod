ixian_airdrone:
	Inherits: ^RANeutralPlane
	Inherits@reload: ^RearmableAircraft
	Inherits@Template: ^BomberTemplate
	Inherits@detect: ^GenericAllDetector
	Inherits@exp: ^GainsExperienceRA
