ordos_spiceharvester:
	Inherits@D2KT: ^D2KTank
	Inherits@Template: ^HarvesterTemplate
	Inherits@selection: ^SelectableEconomicUnit
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@harv: ^Harvester
	Inherits@VehicleShieldsUpgradeOrdos: ^VehicleShieldsUpgradeOrdos
	Buildable:
		Factions: ordos
		Queue: Vehicle, RAVehicle, Starport
		Prerequisites: ~spice_refinery, ~ordos_heavy_vehicle_production
		BuildPaletteOrder: 10
		Description: template_harvester.description
		IconPalette: d2kunit
	Valued:
		Cost: 500
	Tooltip:
		Name: Ordos Spice Harvester
	Selectable:
		DecorationBounds: 1536, 1536
	Harvester:
		BuildDuration: 250
		BuildDurationModifier: 100
		HarvestFacings: 8
		BaleUnloadDelay: 1
	StoresResources:
		Capacity: 45
	CarryableHarvester:
	Health:
		HP: 200000
	Repairable:
		HpPerStep: 10000
	ChangesHealth@SelfHealing:
		Step: 80
	Armor:
		Type: Heavy
	Shielded:
		RegenAmount: 160
	Mobile:
		Speed: 45
		TurnSpeed: 9
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeLarge
		EmptyWeapon: D2KUnitExplodeLarge
	WithHarvestOverlay:
		Palette: effect50alpha
	WithDockingAnimation:
	-RevealOnFire:
	Voiced:
		VoiceSet: EBFDOHarvester
	WithMoveAnimation:
		MoveSequence: move
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: ordos_upgrade_shields

