ordos_apc:
	Inherits: ^D2KTank
	Inherits@HoverDrive: ^Ordos_HoverDrive
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@botmicro: ^BotAutoDeployTransport
	Inherits@IXEMP: ^D2K_Ix_Turret_EMP
	Inherits@cargo: ^CargoVehicle
	Inherits@VehicleShieldsUpgradeOrdos: ^VehicleShieldsUpgradeOrdos
	Inherits@ContrabandUpgradeOrdos: ^ContrabandUpgradeOrdos
	Buildable:
		Factions: ordos
		Queue: Vehicle, RAVehicle, Starport
		BuildPaletteOrder: 100
		Prerequisites: ~ordos_heavy_vehicle_production, ordos_outpost, ~!ordos_promotion_laboratorycrawler
		Description: Ordos Universal Battle Tank\nHighly Mobile Hover unit\nFires laser beams\nWeak durability\n  Strong vs Everything
		IconPalette: windows256
	Valued:
		Cost: 2100
	Tooltip:
		Name: Ordos APC
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 67500
	Repairable:
		HpPerStep: 3375
	ChangesHealth@SelfHealing:
		Step: 27
	Shielded:
		RegenAmount: 54
	Armor:
		Type: Medium
	Mobile:
		Speed: 105
		TurnSpeed: 21
		Locomotor: hover
		Voice: Move
	Turreted:
		TurnSpeed: 21
		Offset: -100,20,10
	Armament:
		Weapon: D2K_APC_Rocket
		LocalOffset: 256,64,512, 256,-64,512
	AttackTurreted:
	Hovers:
	WithSpriteTurret:
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeMed
		EmptyWeapon: D2KUnitExplodeMed
	Voiced:
		VoiceSet: EBFDOAPC
	Cargo:
		InitialUnits: ordos_lightinfantry, ordos_lightinfantry, ordos_lightinfantry, ordos_lightinfantry, ordos_rockettrooper, ordos_rockettrooper, ordos_antiairtrooper, ordos_antiairtrooper
		Types: Infantry, Hacker, Fremen
		MaxWeight: 8
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: ordos_upgrade_shields, ordos_upgrade_contraband, ordos_upgrade_hoverdrive

ordos_laboratorycrawler:
	Inherits: ^D2KTank
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@botmicro: ^BotAutoDeployTransport
	Inherits@IXEMP: ^D2K_Ix_Frontal_EMP
	Inherits@cargo: ^CargoVehicle
	Inherits@VehicleShieldsUpgradeOrdos: ^VehicleShieldsUpgradeOrdos
	Inherits@BiologicalWarfareUpgradeOrdos: ^BiologicalWarfareUpgradeOrdos
	Buildable:
		Factions: ordos
		Queue: Vehicle, RAVehicle, Starport
		BuildPaletteOrder: 100
		Prerequisites: ~ordos_heavy_vehicle_production, ordos_ixresearchcenter, ~ordos_promotion_laboratorycrawler
		Description: Tleilaxu Mobile Laboratory. Can contaminate enemy infantry and heal friendlies. Equipped with AA Rockets.
		IconPalette: windows256
	Valued:
		Cost: 4500
	Tooltip:
		Name: Laboratory Crawler
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 137500
	Repairable:
		HpPerStep: 6875
	ChangesHealth@SelfHealing:
		Step: 55
	Shielded:
		RegenAmount: 110
	Armor:
		Type: Medium
	Mobile:
		Speed: 105
		TurnSpeed: 42
		Voice: Move
	Armament:
		Weapon: Laboratory_Bioball
	Armament@aa1:
		Weapon: D2K_APC_Rocket_AA
		LocalOffset: 256,256,256
	Armament@aa2:
		Weapon: D2K_APC_Rocket_AA
		LocalOffset: 256,-256,256
	FirepowerMultiplier@ordos_upgrade_biologicalwarfare:
		RequiresCondition: ordos_upgrade_biologicalwarfare
		Modifier: 150
	AttackFrontal:
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeMed
		EmptyWeapon: D2KUnitExplodeMed
	Voiced:
		VoiceSet: EBFDOAPC
	Cargo:
		InitialUnits: ordos_contaminator, ordos_contaminator, ordos_chemicaltrooper, ordos_chemicaltrooper, ordos_mortartrooper, ordos_mortartrooper, ordos_antiairtrooper, ordos_antiairtrooper, ordos_rockettrooper, ordos_rockettrooper
		Types: Infantry, Hacker, Fremen
		MaxWeight: 10
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: ordos_upgrade_shields, ordos_upgrade_biologicalwarfare

ordos_mobileconstructionvehicle:
	Inherits@D2KT: ^D2KTank
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@selection: ^SelectableSupportUnit
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@mcv: ^MCV
	Buildable:
		Factions: ordos
		Queue: Vehicle, RAVehicle, Starport
		Prerequisites: ~ordos_heavy_vehicle_production, ordos_mcv_production
		Description: Deploys into a Construction Yard.\n  Unarmed
		IconPalette: d2kunit
	Tooltip:
		Name: Ordos Mobile Construction Vehicle
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeLarge
		EmptyWeapon: D2KUnitExplodeLarge
	Transforms:
		IntoActor: ordos_constructionyard
		Offset: -1,-1
		TransformSounds: BUILD1.WAV
		Facing: 64
		NoTransformNotification: BuildingCannotPlaceAudio
	-RevealOnFire:
	Voiced:
		VoiceSet: EBFDOMCV
	RenderSprites:
		Image: d2k_mcv

