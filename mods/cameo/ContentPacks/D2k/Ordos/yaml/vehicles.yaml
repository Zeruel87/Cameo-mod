ordos_cobratank:
	Inherits@D2KT: ^D2KTank
	Inherits@Template: ^ArtilleryTankTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@EMP: ^FrontalEMP
	Inherits@VehicleShieldsUpgradeOrdos: ^VehicleShieldsUpgradeOrdos
	Inherits@ContrabandUpgradeOrdos: ^ContrabandUpgradeOrdos
	Tooltip:
		Name: Cobra Tank
	Valued:
		Cost: 1500
	Buildable:
		Factions: ordos
		Queue: Vehicle, RAVehicle, Starport
		Prerequisites: ~ordos_heavy_vehicle_production, ordos_outpost, ~!ordos_promotion_python
		BuildPaletteOrder: 50
		Description: Siege Artillery\n  Strong vs Infantry, Buildings\n  Weak vs Tanks
		IconPalette: d2kunit
	Health:
		HP: 45000
	Repairable:
		HpPerStep: 2250
	ChangesHealth@SelfHealing:
		Step: 18
	Shielded:
		RegenAmount: 36
	Mobile:
		Speed: 45
		TurnSpeed: 9
		RequireForceMoveCondition: deployed
	Turreted:
		TurnSpeed: 9
		Turret: deployed
	RevealOnFire:
		ArmamentNames: primary, deployed
	FirepowerMultiplier@undeployed:
		RequiresCondition: undeployed
		Modifier: 50
	RangeMultiplier@deployed:
		RequiresCondition: deployed
		Modifier: 160
	Armament@PRIMARY:
		Weapon: 120mm_cobra
		LocalOffset: 600,0,300
		RequiresCondition: undeployed
		MuzzleSequence: muzzle
	Armament@deployed:
		Name: deployed
		Turret: deployed
		Weapon: 120mm_cobra_deploy
		LocalOffset: 750,0,750
		RequiresCondition: deployed
		MuzzleSequence: muzzle
	WithMuzzleOverlay:
	AttackFrontal:
		RequiresCondition: undeployed
		FacingTolerance: 0
	AttackTurreted@deployed:
		RequiresCondition: deployed
		Armaments: deployed
		Turrets: deployed
		PauseOnCondition: disabled
		Voice: Attack
	SelectionDecorations:
	WithSpriteBody@deployed:
		RequiresCondition: deployed
		Sequence: deploy-idle
	WithSpriteTurret:
		Turret: deployed
		RequiresCondition: deployed
	WithFacingSpriteBody:
		RequiresCondition: !deployed
	WithMakeAnimation:
	GrantConditionOnDeploy:
		PauseOnCondition: disabled
		DeployedCondition: deployed
		UndeployedCondition: undeployed
		UndeployOnMove: true
		UndeployOnPickup: true
		Facing: 640
		DeploySounds: KobraDeploy.wav
		UndeploySounds: KobraDeploy.wav
		Voice: Move
	Passenger:
		RequireForceMoveCondition: !undeployed
	Voiced:
		VoiceSet: EBFDOrdosCobra
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: ordos_upgrade_shields, ordos_upgrade_contraband
	# DEPLOYING ADDS THE STEEL DEFENCE ARMOUR ON TOP OF THE UNIT'S OWN CLASS ARMOUR.
	# Maintainer 2026-08-22: *"activate the steel armor type on deploy but keep the underlying
	# regular armor intact and then create the average between them"* — a deployed unit is a
	# static defence, and Steel is what defences wear.
	#
	# Both traits stay ENABLED together, which is the whole point:
	# `AreaDamageWarhead.MultiArmorCombination` defaults to `Average`, so the class row and the
	# Steel row meet in the middle instead of one replacing the other. Gating the class armour
	# on `undeployed` — what the defence rig, siege tank and matador used to do — makes Steel a
	# REPLACEMENT and throws the unit's own class away.
	#
	# ⚠ Averaging only happens for warheads routing through AreaDamage (62.9% of the tree).
	# The legacy inline-Versus SpreadDamage nodes still MULTIPLY, and under multiplication the
	# class row cancels out entirely (the ratio becomes just Steel/100) — so those weapons see a
	# flatter effect than designed until item A5 retires them onto ^Warhead_* templates.
	Armor@deployed:
		Type: Steel
		RequiresCondition: !shielded && deployed

