ordos_contaminator:
	Inherits: ^D2KInfantry
	Inherits@Template: ^MeleeInfantryTemplate
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMoveMelee
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@anim: ^RA2Infantry
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@BiologicalWarfareUpgradeOrdos: ^BiologicalWarfareUpgradeOrdos
	Valued:
		Cost: 500
	Tooltip:
		Name: Contaminator
	Buildable:
		Queue: Infantry, RAInfantry
		BuildPaletteOrder: 10
		Prerequisites: ~ordos_barracks, ~ordos_promotion_contaminator
		Description: The Contaminator is a genetically engineered organism\nthat infects a target organic unit to create another Contaminator\nwhen the target dies. They are quite\nresilient to gunfire.\n  Strong vs Buildings, Infantry, Air, Vehicles\n  Weak vs Siege
	Health:
		HP: 75000
	ChangesHealth@SelfHealing:
		Step: 75
	Mobile:
		Speed: 60
	AttackFrontal:
		FacingTolerance: 0
	WithInfantryBody:
		DefaultAttackSequence: shoot
		StandSequences: stand
	Armament:
		Weapon: contaminator_attack
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: contaminator_attack
	FirepowerMultiplier@ordos_upgrade_biologicalwarfare:
		RequiresCondition: ordos_upgrade_biologicalwarfare
		Modifier: 150
	Voiced:
		VoiceSet: EBFDContaminator
	-DamagedByTerrain:
	RenderSprites:
		PlayerPalette: player_rgba
	Targetable@ra1_soviets_attackdog:
		TargetTypes: DogImmune
	ActorStatValues:
		Upgrades: ordos_upgrade_biologicalwarfare

