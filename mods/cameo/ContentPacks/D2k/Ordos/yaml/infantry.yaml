ordos_leech:
	Inherits: ^D2KInfantry
	Inherits@corr: ^Corrodible
	Inherits@Template: ^ScoutVehicleTemplate
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@cloak: ^CloakedVehicle
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@BiologicalWarfareUpgradeOrdos: ^BiologicalWarfareUpgradeOrdos
	Inherits@VehicleTurnRateInfantry: ^VehicleTurnRateInfantry
	Buildable:
		Queue: Infantry, RAInfantry
		BuildPaletteOrder: 130
		Prerequisites: ~ordos_barracks, ~ordos_promotion_leecher
		Description: Stealth creature that can attack infantry and infect vehicles.
		IconPalette: player
	Selectable:
		Bounds: 1024, 1024
	Valued:
		Cost: 1100
	Tooltip:
		Name: Leech
	Mobile:
		Speed: 150
		TurnSpeed: 60
	Crushable:
		CrushClasses: vehicle
	Health:
		HP: 50000
	ChangesHealth@SelfHealing:
		Step: 20
	Armament@PRIMARY:
		Weapon: LeechJump
		LocalOffset: 0,0,200
	FirepowerMultiplier@ordos_upgrade_biologicalwarfare:
		RequiresCondition: ordos_upgrade_biologicalwarfare
		Modifier: 150
	WithInfantryBody:
		DefaultAttackSequence: jump
		RequiresCondition: !jousting
	WithFacingSpriteBody:
		Sequence: shoot
		RequiresCondition: jousting
	-InfectableCA:
	AttackInfectCA:
		Voice: Attack
		Damage: 4000
		DamageInterval: 1
		DamageTypes: DroneInfection, BulletDeath
		SurviveHostDamageTypes: DroneInfection
		JoustRange: 3000
		RequiresCondition: !disabled
	RejectsOrders:
		RequiresCondition: jousting
	SpeedMultiplier@JOUSTING:
		Modifier: 1000
		RequiresCondition: jousting
	Targetable:
		RequiresCondition: !parachute && !untargetable && !jousting
	AutoTarget:
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: TerrorDronable
	# Selectable:
	# 	Bounds: 2048, 2048
	# 	DecorationBounds: 2448, 2448, 0, 0
	# WithIdleOverlay@Shadow:
	# 	Offset: 0,0,-320
	Passenger:
		CustomPipType: blue
	Voiced:
		VoiceSet: EBFDLeecher
	AcceptsDeliveredExperience:
		ValidTypes: infantry
	Cloak:
		CloakStyle: Alpha
	RenderSprites:
		PlayerPalette: player_rgba
	Targetable@vehicleexplodedamage:
		TargetTypes: TerrorDrone
	Targetable@ra1_soviets_attackdog:
		TargetTypes: DogImmune
	-TemporaryOwnerManager:
	ActorStatValues:
		Upgrades: ordos_upgrade_biologicalwarfare

