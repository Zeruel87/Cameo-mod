ordos_antiairtrooper:
	Inherits: ^Soldier
	Inherits@Template: ^AntiTankAntiAirInfantryTemplate
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^RA2Infantry
	Inherits@vo: ^AttackFrontalVoice
	Inherits@BiologicalWarfareUpgradeOrdos: ^BiologicalWarfareUpgradeOrdos
	Inherits@ContrabandUpgradeOrdos: ^ContrabandUpgradeOrdos
	Valued:
		Cost: 450
	Tooltip:
		Name: Anti Air Trooper
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~ordos_barracks, ~ordos_upgrade_antiairtrooper
		Queue: Infantry, RAInfantry
		Description: template_antitank_antiair_infantry.description
	Health:
		HP: 15000
	ChangesHealth@SelfHealing:
		Step: 15
	Mobile:
		Speed: 45
	Armament:
		Weapon: D2K_Rocket_Trooper_AA
		LocalOffset: 128,0,256
	Armament@SECONDARY:
		Weapon: D2K_Rocket_Trooper_AGOnly
		LocalOffset: 128,0,256
	Armament@garrisoned:
		Name: garrisoned
		Weapon: D2K_Rocket_Trooper_AA
	Armament@SECONDARYgarrisoned:
		Name: garrisoned
		Weapon: D2K_Rocket_Trooper_AGOnly
	AttackFrontal:
		FacingTolerance: 0
	Voiced:
		VoiceSet: EBFDAATroop
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: ordos_upgrade_biologicalwarfare, ordos_upgrade_contraband

ordos_lightinfantry:
	Inherits: ^D2KInfantry
	Inherits@Template: ^ScoutInfantryTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^D2KPaletteRenderInfantry
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@BiologicalWarfareUpgradeOrdos: ^BiologicalWarfareUpgradeOrdos
	Inherits@ContrabandUpgradeOrdos: ^ContrabandUpgradeOrdos
	Inherits@LaserGuns: ^Ordos_LaserGuns
	Tooltip:
		Name: Ordos Light Infantry
	Valued:
		Cost: 120
	Buildable:
		BuildPaletteOrder: 10
		Queue: Infantry, RAInfantry
		Description: actor_ordos_lightinfantry.description
		IconPalette: d2kunit
		Prerequisites: ~ordos_barracks
	Health:
		HP: 28000
	ChangesHealth@SelfHealing:
		Step: 28
	DamageMultiplier@ScoutInfantryBuff:
		Modifier: 100
	FirepowerMultiplier@ScoutInfantryBuff:
		Modifier: 100
	FirepowerMultiplier@ordos_lightinfantry:
		Modifier: 67
	Mobile:
		Speed: 62
	Armament@PRIMARY:
		Weapon: light_inf_lmg
		LocalOffset: 128,0,256
		RequiresCondition: !ordos_upgrade_lasercartridges
	Armament@Upgrade:
		Weapon: light_inf_lmg_ordos_upgrade
		LocalOffset: 128,0,256
		RequiresCondition: ordos_upgrade_lasercartridges
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: light_inf_lmg
		MuzzleSequence: garrison-muzzle
		MuzzlePalette: d2keffect
		RequiresCondition: !ordos_upgrade_lasercartridges
	Armament@UpgradeGARRISONED:
		Name: garrisoned
		Weapon: light_inf_lmg_ordos_upgrade
		MuzzleSequence: garrison-muzzle
		MuzzlePalette: d2keffect
		RequiresCondition: ordos_upgrade_lasercartridges
	WithInfantryBody:
		IdleSequences: idle1,idle2,idle3,idle4
		DefaultAttackSequence: shoot
	Parachutable:
	RenderSprites:
		Image: light_inf
	ActorStatValues:
		Upgrades: ordos_upgrade_biologicalwarfare, ordos_upgrade_contraband, ordos_upgrade_lasercartridges

ordos_rockettrooper:
	Inherits: ^D2KInfantry
	Inherits@Template: ^AntiTankAntiAirInfantryTemplate
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
