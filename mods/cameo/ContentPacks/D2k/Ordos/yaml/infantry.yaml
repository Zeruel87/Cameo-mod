		PlayerPalette: raplayer
	Voiced:
		VoiceSet: D2KChemTrooperVoice
	WithDeathAnimation:
		DeathSequencePalette: raplayer
		CrushedSequencePalette: raplayer
		CrushedPaletteIsPlayerPalette: True
	ActorStatValues:
		Upgrades: ordos_upgrade_biologicalwarfare

