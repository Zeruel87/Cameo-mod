ordos_outpost:
	Inherits: ^D2KBuilding
	Inherits@radar: ^RadarBuilding
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@shape: ^3x3Shape
	Buildable:
		Factions: ordos
		Prerequisites: ~ordos_constructionyard, ordos_refineryordos
		Description: Expands buildable area and provides radar.
		IconPalette: d2kunit
	Tooltip:
		Name: Ordos Outpost
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	RenderSprites:
		Image: ordos_outpost
	WithIdleOverlay@DISH:
		RequiresCondition: !build-incomplete && !severe-damaged
		Sequence: idle-dish
		PauseOnCondition: disabled
		# Offset: -30,-60,0
	GrantConditionOnDamageState@STOPDISH:
		Condition: severe-damaged
	-WithDeathAnimation:
	FireProjectilesOnDeath:
		Weapons: Debris2, Debris3
		Pieces: 5, 9
		Range: 1c512, 2c768
	SpawnActorOnDeath@death1:
		Actor: light_inf
	SpawnActorOnDeath@death2:
		Actor: light_inf
	ProvidesPrerequisite@outpost:
		Prerequisite: outpost.d2k
	Production@Upgrades:
		Produces: Upgrades
	ProductionBar@Upgrades:
		ProductionType: Upgrades
	ParatroopersPower@paratroopers:
		OrderName: OrdosSmugglers
		Prerequisites:
			1: upordos_outpost.ordos
		IconImage: ordos_upgrade_para
		Icons:
			1: icon
		Names:
			1: Ordos Contraband
		ChargeInterval: 6000
		Descriptions:
			1: power_paratroopers.description
		DropItems:
			1: ordos_stealthraider, ordos_stealthraider, ordos_deviatorartillery, ordos_deviatorartillery, ordos_deviatorartillery, ordos_stealthraider, ordos_stealthraider, ordos_deviatorartillery, ordos_deviatorartillery, ordos_deviatorartillery, ordos_stealthraider, ordos_stealthraider, ordos_deviatorartillery, ordos_deviatorartillery, ordos_deviatorartillery
		SelectTargetSpeechNotification: SelectTarget
		AllowImpassableCells: false
		QuantizedFacings: 16
		CameraActor: camera.paradrop
		DisplayBeacon: true
		BeaconPosters:
			1: pinficon
		ArrowSequence: arrow
		ClockSequence: clocklarge
		CircleSequence: circles
		#UseDirectionalTarget: True
		DirectionArrowAnimation: airstrikedirection
		UnitTypes:
			1: frigate.paradrop
		SquadSizes:
			1: 3
		SquadOffset: 1792,1792,0

