# Generic spice refinery template. Common traits here; each faction actor below sets
# its build prerequisite, its ixian_spiceharvester/delivery actors, and its sprite image.

ordos_refineryordos:
	Inherits: ^D2KRefinery
	Tooltip:
		Name: Refinery
	Buildable:
		Factions: ordos
		Prerequisites: ~ordos_constructionyard, ordos_windtrap
		Description: Processes ore into credits.
	FreeActor:
		Actor: ordos_spiceharvester
		SpawnOffset: 0,2
		Facing: 160
	FreeActorWithDelivery@1:
		Actor: ordos_spiceharvester
		DeliveryOffset: 2,2
		DeliveringActor: carryall_reinforce.ordos
		Facing: 160
	# FreeActorWithDelivery@2:
	# 	Actor: ordos_spiceharvester
	# 	DeliveryOffset: 0,2
	# 	DeliveringActor: carryall_reinforce.ordos
	# 	Facing: 160
	RenderSprites:
		Image: ordos_refineryordos

