			1: ~techlevel.superweapons
		IconImage: asianalliance_chaosstorminductor
		Icons:
			1: icon2
		Cursor: ioncannon
		ChargeInterval: 7500
		ActivationDelay: 25
		ActivationSequence:
		Names:
			1: power_chaos.name
		Weapons:
			1: AsianChaosSuperweapon
		Descriptions:
			1: power_chaos.description
