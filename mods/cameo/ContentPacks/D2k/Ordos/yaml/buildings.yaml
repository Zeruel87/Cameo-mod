		Factions: ordos
		Queue: Building, RABuilding
		Prerequisites: ~ordos_constructionyard, ordos_ixresearchcenter, !opalace, ~techlevel.superweapons
		Description: This structure unlocks support powers.
		IconPalette: d2kunit
	Tooltip:
		Name: Palace
	Building:
		Footprint: xxx xxx XXX
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	HitShape:
		TargetableOffsets: -1574,-158,0, -1050,-1024,0, -1155,960,0
		Type: Rectangle
			TopLeft: -1536, -512
			BottomRight: 1536, 1536
	HitShape@TOP:
		TargetableOffsets: 1312,0,0
		Type: Rectangle
			TopLeft: -512, -1536
			BottomRight: 512, -512
	RenderSprites:
		Image: ordos_palace
	ProvidesPrerequisite@palace:
		Prerequisite: palace
	-WithDeathAnimation:
	FireProjectilesOnDeath:
		Weapons: Debris2, Debris3
		Pieces: 8, 12
		Range: 1c512, 2c768
	SpawnActorOnDeath@death1:
		Actor: light_inf
	SpawnActorOnDeath@death2:
		Actor: light_inf
	SpawnActorOnDeath@death3:
		Actor: light_inf
	SpawnActorOnDeath@death4:
		Actor: trooper
