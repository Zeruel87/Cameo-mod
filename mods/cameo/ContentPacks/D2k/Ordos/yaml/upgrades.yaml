ordos_upgrade_lightfactory:
	Inherits: ^ResearchedUpgradeTemplate
	Tooltip:
		Name: Light Factory Upgrade
	Buildable:
		Factions: ordos
		BuildPaletteOrder: 50
		Prerequisites: ~light_factory, research_centre, !ordos_upgrade_lightfactory
		Queue: Upgrades
		BuildLimit: 1
		BuildDuration: 1500
		BuildDurationModifier: 100
		Description: Light Factory gets 25% more armor. Reduces cost and production time by 10% for all light vehicles.
		IconPalette: d2kunit
	Valued:
		Cost: 1250
	RenderSprites:
		Image: light.ordos

