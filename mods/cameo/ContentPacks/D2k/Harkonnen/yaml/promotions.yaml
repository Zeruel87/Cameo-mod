####################################################################################################
#		Promotion Units Harkonnen
#
#		Three explicit branches keep each doctrine independent:
#		Brute force: Assault Tank -> Flame Tank -> Devastator Mech
#		Siege/control: Buzzsaw -> Rocket Tank -> Inkvine Catapult
#		Air: Gunship -> Air Defense Platform -> Advanced Carryall
####################################################################################################

harkonnen_promotion_assaulttank:
	Inherits: ^PromotionUpgradeTemplate
	Tooltip:
		Name: Unlock Harkonnen Assault Tank
	Buildable:
		Factions: harkonnen
		BuildPaletteOrder: 109
		Queue: Promotions
		IconPalette: d2kunit
		Description: Enables construction of the Harkonnen Assault Tank.
		Prerequisites: ~harkonnen_constructionyard, !harkonnen_promotion_assaulttank, rank1
	RenderSprites:
		Image: harkonnen_assaulttank
	ProvidesPrerequisite:

