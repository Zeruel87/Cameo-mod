devastator:
	Inherits@D2KT: ^D2KTank
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@EXT: ^ExternalConditions
	Inherits@IXEMP: ^D2K_Ix_Frontal_EMP
	Inherits@AntiTank: ^PrioritizeTank
	Buildable:
		Queue: Vehicle, RAVehicle, Starport
		Prerequisites: ~harkonnen_vehicle_production, ~heavy.harkonnen, research_centre
		BuildPaletteOrder: 100
		BuildDuration: 1000
		BuildDurationModifier: 100
		Description: Super Heavy Tank\n  Strong vs Tanks\n  Weak vs Artillery
		IconPalette: d2kunit
	Valued:
		Cost: 3000
	Tooltip:
		Name: Harkonnen Devastator Tank
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 550000
	Repairable:
		HpPerStep: 31250
	DamageMultiplier@SIEGEMAMMOTHPARITY:
		Modifier: 67
	Armor:
		Type: Superheavy
	Mobile:
		TurnSpeed: 12
		Speed: 31
		Locomotor: heavytracked
		RequiresCondition: !overload
		PauseOnCondition: notmobile || disabled || being-demolished
	AutoCarryable:
		RequiresCondition: !overload
	RevealsShroud:
		Range: 4c768
	Armament:
		Weapon: DevBullet
		LocalOffset: 640,0,32
		MuzzleSequence: muzzle
		MuzzlePalette: d2keffect
	AttackFrontal:
		FacingTolerance: 0
	WithMuzzleOverlay:
		IgnoreOffset: true
	WithMuzzleGlow:
		Color: A060E8
		CoreColor: E8D8FF
		Intensity: 1.5
		CoreIntensity: 2.4
		FlashBrightness: 1.0
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeLarge
		EmptyWeapon: D2KUnitExplodeLarge
		RequiresCondition: !overload
	FireWarheadsOnDeath@OVERLOAD:
		Weapon: PlasmaExplosion
		EmptyWeapon: PlasmaExplosion
		RequiresCondition: meltdown
	GrantConditionOnDeploy@REACTOR:
		DeployedCondition: overload
		PauseOnCondition: overload
		RequiresCondition: !unit-captured
	WithIdleOverlay@OVERLOAD:
		Sequence: active
		RequiresCondition: overload
	WithIdleOverlay@OVERLOAD2:
		Sequence: active-2
		RequiresCondition: overload
	KillsSelf@MELTDOWN:
		Delay: 150
		RequiresCondition: overload
		GrantsCondition: meltdown
	AmbientSound@onMeltDown:
		SoundFiles: DEVASTATORMELTDOWN.WAV
		RequiresCondition: overload
		Interval: 250
	ChangesHealth@SelfHealing:
		Step: 250
	Selectable:
		DecorationBounds: 1408, 1216, 0, 0
	FireProjectilesOnDeath@MELTDOWN:
		Weapons: Debris2, Debris3, Debris4, ExplosiveDebris
		Pieces: 7, 15
		Range: 3c512, 6c0
		RequiresCondition: meltdown
	FireProjectilesOnDeath@STANDARD:
		Weapons: Debris
		Pieces: 1, 2
		RequiresCondition: !meltdown
	ActorStatValues:
		Stats: Armor, Sight, Speed, Damage, ReloadDelay, MaxRange, Kills, Experience
	Voiced:
		VoiceSet: D2KVehicleVoice