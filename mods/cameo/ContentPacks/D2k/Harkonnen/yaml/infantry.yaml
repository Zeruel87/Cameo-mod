harkonnen_sardaukar:
	Inherits: ^D2KInfantry
	Inherits@Template: ^AntiTankAntiAirInfantryTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@anim: ^D2KPaletteRenderInfantry
	Inherits@Armor: ^D2K_GeneralPurposeArmor
	Inherits@AntiVeh: ^PrioritizeVehicle
	Inherits@AntiAir: ^PrioritizeAir
	Tooltip:
		Name: actor_harkonnen_sardaukar.name
	Valued:
		Cost: 500
	Buildable:
		BuildPaletteOrder: 40
		Queue: Infantry, RAInfantry
		Description: actor_harkonnen_sardaukar.description
		IconPalette: d2kunit
		Prerequisites: ~harkonnen_barracks, harkonnen_palace
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 120000
	ChangesHealth@SelfHealing:
		Step: 50
	Mobile:
		Speed: 56
	Armor:
		Type: Heavy
	Armament@PRIMARY:
		Weapon: D2K_Rocket_Trooper
		LocalOffset: 128,0,256
		RequiresCondition: !rank-elite
	Armament@ELITE:
		Weapon: D2K_TowerMissile
		LocalOffset: 128,0,256
		RequiresCondition: rank-elite
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: D2K_Rocket_Trooper
		MuzzleSequence: garrison-muzzle
		MuzzlePalette: d2keffect
		RequiresCondition: !rank-elite
	WithInfantryBody:
		IdleSequences: stand
		StandSequences: stand
		DefaultAttackSequence: shoot
	RenderSprites:
		Image: harkonnen_sardaukar_baron_elite
	Voiced:
		VoiceSet: D2KInfantryVoice
