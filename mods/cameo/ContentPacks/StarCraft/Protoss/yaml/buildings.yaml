protoss_nexus:
	Inherits: ^BaseBuildingProtoss
	Inherits@ref: ^SCRefineryCommon
	Inherits@shape: ^3x2Shape
	Inherits@radar: ^RadarBuilding
	-Production@Upgrades:
	-ProductionBar@Upgrades:
	Inherits@conyard: ^Conyard
	Inherits@POWERDOWN: ^DisableOnPowerDown
	Inherits@explode: ^BuildingExplodeProtoss
	Inherits@shieldgenerator: ^ProtossPersonalShield
	Tooltip:
		Name: Nexus
	Power:
		Amount: 100
	Selectable:
		Bounds: 3072, 2560, 0, 0
		DecorationBounds: 3072, 2560, 0, 0
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
		BuildSounds: pshbld03.aud
	WithIdleOverlay@shield1:
		RequiresCondition: !disabled && shielded && !shieldhit && !build-incomplete
	WithIdleOverlay@shield_damage:
		RequiresCondition: !disabled && shielded && shieldhit && !build-incomplete
	Production@INFANTRY:
		Produces: Infantry
		PauseOnCondition: disabled
	ProductionQueue@INFANTRY:
		Type: Infantry
		DisplayOrder: 2
		Group: Infantry
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		InfiniteBuildLimit: 10
	ProductionBar@INFANTRY:
		ProductionType: Infantry
	# Production@NORMAL:
	# 	-RequiresCondition:
	# -Production@CLASSICPRODUCTIONQUEUES:
	# ProductionBar@BUILDING:
	# 	-RequiresCondition:
	# ProductionBar@DEFENCE:
	# 	-RequiresCondition:
	# -ProductionBar@RABUILDING:
	# -ProductionBar@RADEFENCE:
	ProductionQueue@Building:
		LowPowerModifier: 100
	ProductionQueue@Defense:
		LowPowerModifier: 100
	WithBuildingPlacedAnimation:
	ProvidesPrerequisite@buildingname:
	RallyPoint:
		Path: 0,2
	Exit@1:
		SpawnOffset: -1024,1024,0 #-1323,1280,0
		ExitCell: 0,2
		Facing: 540
	ProvidesRadar:
		RequiresCondition: !jammed
	Refinery:
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
		FullSequence: pip-yellow
	WithProductionOverlay@WELDING:
		RequiresCondition: !build-incomplete
		Queues: Building, Defence, RABuilding, RADefence
		Sequence: build
	Transforms:
		IntoActor: protoss_mobilenexus
	RenderSprites:
		PlayerPalette: player_rgba

protoss_pylon:
	Inherits: ^BaseBuildingProtoss
	Inherits@shape: ^2x2Shape
	Inherits@power: ^PowerPlant
	Inherits@storage: ^StoresResources
