	Valued:
		Cost: 1000
	Power:
		Amount: 250
	ProvidesPrerequisite@buildingname:
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~protoss_nexus
		Queue: Building, RABuilding
		Description: actor_scpylon.description
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		BuildSounds: pshbld03.aud
	Health:
		HP: 250000
	StoresResources:
		Capacity: 5000
	RevealsShroud:
		Range: 5c0
	GrantConditionOnPrerequisite@protoss_upgrade_upgradepylonlevel1:
		Condition: protoss_upgrade_upgradepylonlevel1
		Prerequisites: protoss_upgrade_upgradepylonlevel1
	Power@protoss_upgrade_upgradepylonlevel1:
		Amount: 150
		RequiresCondition: protoss_upgrade_upgradepylonlevel1 && !protoss_upgrade_upgradepylonlevel2
	GrantConditionOnPrerequisite@protoss_upgrade_upgradepylonlevel2:
		Condition: protoss_upgrade_upgradepylonlevel2
		Prerequisites: protoss_upgrade_upgradepylonlevel2
	Power@protoss_upgrade_upgradepylonlevel2:
		Amount: 200
		RequiresCondition: protoss_upgrade_upgradepylonlevel2
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
		FullSequence: pip-yellow
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: protoss_upgrade_upgradepylonlevel1, protoss_upgrade_upgradepylonlevel2

protoss_assimilator:
	Inherits: ^BaseBuildingProtoss
	Inherits@shape: ^3x2Shape
	Inherits@ref: ^SCRefineryCommon
	Inherits@explode: ^BuildingExplodeProtoss
	Inherits@shieldgenerator: ^ProtossPersonalShield
	Inherits@plug: ^BuildingPlugProducer
	Tooltip:
		Name: Assimilator
	Power:
		Amount: 0
	Buildable:
		Prerequisites: ~protoss_nexus
		BuildPaletteOrder: 20
		Queue: Building, RABuilding
		Description: actor_scassimilator.description
	Building:
		Footprint: _x_ xxx ===
		BuildSounds: pshbld03.aud
		Dimensions: 3,3
	FreeActor@1:
		Actor: protoss_probe
		SpawnOffset: 0,2
		Facing: 540
	FreeActor@2:
		Actor: protoss_probe
		SpawnOffset: 0,2
		Facing: 540
	SelectionDecorations:
	Refinery:
	DamageMultiplier@assimilatorupg:
		RequiresCondition: assimilatorupg
		Modifier: 50
	WithIdleOverlay@smoke:
		RequiresCondition: assimilatorupg
		Sequence: smoke
		Palette: greyscale
	SeedsResource:
		ResourceType: SCGas2
		Interval: 125
		RequiresCondition: assimilatorupg
	CashTrickler@assimilatorupg:
		RequiresCondition: assimilatorupg
		Interval: 50
		Amount: 25
		ShowTicks: True
	ProvidesPrerequisite:
		Prerequisite: scprefineryupgradeavailable
		RequiresCondition: !assimilatorupg
	Pluggable:
		Offset: 1,0
		Conditions:
			protoss_assimilator: assimilatorupg
		Requirements:
			protoss_assimilator: !build-incomplete && !assimilatorupg
	Voiced:
		VoiceSet: SCRefineryVoice
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: protoss_vespenegascollector

