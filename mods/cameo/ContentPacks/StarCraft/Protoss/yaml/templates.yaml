	HitShape:
		Type: Circle
			Radius: 1024

^AirProtoss:
	Inherits: ^Helicopter
	Inherits@ProtossPersonalShield: ^ProtossPersonalShield
	-ChangesShield@shielddischarge:

^BuildingExplodeProtoss:
