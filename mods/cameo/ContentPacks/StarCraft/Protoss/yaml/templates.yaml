	Inherits@cloak: ^AcceptsCloakCrate
	Inherits@heal: ^MachineShopRepairable
	Inherits@chrono: ^Chronoshiftable
	Inherits@corr: ^Corrodible
	Mobile:
		Locomotor: hover
		PauseOnCondition: disabled
	-ExternalCondition@REAPERTRAP:
	-Cloneable:
	-GrantConditionOnPrerequisite@HOSPITAL:
	-Captures@DRIVER_KILL:
	Targetable:
		TargetTypes: Ground, Vehicle
		RequiresCondition: !parachute && !chronobeamed && !invulnerability
	Targetable@ivan:
		RequiresCondition: !ivanbomb && !chronobeamed && !invulnerability
	Passenger:
