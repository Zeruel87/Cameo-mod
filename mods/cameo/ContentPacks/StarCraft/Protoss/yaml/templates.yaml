^ProtossRankDecoration:
	WithDecoration@RANK-1:
		Image: protossrank
		Sequence: rank-veteran-1
		Palette: greyscale
	WithDecoration@RANK-2:
		Image: protossrank
		Sequence: rank-veteran-2
		Palette: greyscale
	WithDecoration@RANK-3:
		Image: protossrank
		Sequence: rank-veteran-3
		Palette: greyscale
	WithDecoration@RANK-ELITE:
		Image: protossrank
		Sequence: rank-elite
		Palette: greyscale

^SingularityChargeUpgrade:
	RangeMultiplier@protoss_upgrade_singularitycharge:
		RequiresCondition: protoss_upgrade_singularitycharge
		Modifier: 120
	GrantConditionOnPrerequisite@protoss_upgrade_singularitycharge:
		Condition: protoss_upgrade_singularitycharge
		Prerequisites: protoss_upgrade_singularitycharge
	ActorStatValues:
		Upgrades: protoss_upgrade_singularitycharge

^ResonatingGlaves:
	ReloadDelayMultiplier@protoss_upgrade_resonatingglaves:
		RequiresCondition: protoss_upgrade_resonatingglaves
		Modifier: 60
	GrantConditionOnPrerequisite@protoss_upgrade_resonatingglaves:
		Condition: protoss_upgrade_resonatingglaves
		Prerequisites: protoss_upgrade_resonatingglaves
	ActorStatValues:
		Upgrades: protoss_upgrade_resonatingglaves

^ProtossGroundWeaponUpgrades:
	FirepowerMultiplier@protoss_upgrade_groundweaponslevel1:
		Modifier: 115
		RequiresCondition: protoss_upgrade_groundweaponslevel1 && !protoss_upgrade_groundweaponslevel2
	GrantConditionOnPrerequisite@protoss_upgrade_groundweaponslevel1:
		Condition: protoss_upgrade_groundweaponslevel1
		Prerequisites: protoss_upgrade_groundweaponslevel1
	FirepowerMultiplier@protoss_upgrade_groundweaponslevel2:
		Modifier: 135
		RequiresCondition: protoss_upgrade_groundweaponslevel2
	GrantConditionOnPrerequisite@protoss_upgrade_groundweaponslevel2:
		Condition: protoss_upgrade_groundweaponslevel2
		Prerequisites: protoss_upgrade_groundweaponslevel2
	ActorStatValues:
		Upgrades: protoss_upgrade_groundweaponslevel1

^ProtossGroundArmorUpgrades:
	DamageMultiplier@protoss_upgrade_groundarmorlevel1:
		Modifier: 90
		RequiresCondition: protoss_upgrade_groundarmorlevel1 && !protoss_upgrade_groundarmorlevel2
	GrantConditionOnPrerequisite@protoss_upgrade_groundarmorlevel1:
		Condition: protoss_upgrade_groundarmorlevel1
		Prerequisites: protoss_upgrade_groundarmorlevel1
	DamageMultiplier@protoss_upgrade_groundarmorlevel2:
		Modifier: 80
		RequiresCondition: protoss_upgrade_groundarmorlevel2
	GrantConditionOnPrerequisite@protoss_upgrade_groundarmorlevel2:
		Condition: protoss_upgrade_groundarmorlevel2
		Prerequisites: protoss_upgrade_groundarmorlevel2
	ActorStatValues:
		Upgrades: protoss_upgrade_groundarmorlevel1

^BaseBuildingProtoss:
	Inherits: ^BaseBuilding
	-ChangesShield@shielddischarge:

^ProtossVehicle:
	Inherits: ^Vehicle
	-ChangesShield@shielddischarge:

^LargeProtoss:
	Inherits: ^BasicProtoss
	Inherits@2: ^IronCurtainable
	Inherits@EMP: ^UnitDisable
	Inherits@cloak: ^AcceptsCloakCrate
	Inherits@heal: ^MachineShopRepairable
	Inherits@chrono: ^Chronoshiftable
	Inherits@corr: ^Corrodible
	Mobile:
		Locomotor: hover
		PauseOnCondition: disabled
	-ExternalCondition@REAPERTRAP:
	-Cloneable:
	-GrantConditionOnPrerequisite@HOSPITAL:
	-Captures@DRIVER_KILL:
	Targetable:
		TargetTypes: Ground, Vehicle
		RequiresCondition: !parachute && !chronobeamed && !invulnerability
	Targetable@ivan:
		RequiresCondition: !ivanbomb && !chronobeamed && !invulnerability
	Passenger:
		CargoType: Vehicle
	HitShape:
		Type: Circle
			Radius: 1024

^AirProtoss:
	Inherits: ^Helicopter
	Inherits@ProtossPersonalShield: ^ProtossPersonalShield
	-ChangesShield@shielddischarge:

^BuildingExplodeProtoss:
	FireWarheadsOnDeath:
		Type: Footprint
		Weapon: BuildingExplodeProtoss
		EmptyWeapon: BuildingExplodeProtoss

^UnitExplodeSmallProtoss:
	FireWarheadsOnDeath:
		Weapon: UnitExplodeSmallProtoss
		EmptyWeapon: UnitExplodeSmallProtoss
