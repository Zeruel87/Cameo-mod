	Inherits@armor: ^ProtossGroundArmorUpgrades
	Tooltip:
		Name: Zealot
	Valued:
		Cost: 300
	Power:
		Amount: -15
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~protoss_gateway, ~!protoss_promotion_legionnaire
		Queue: Infantry, RAInfantry
		Description: actor_sczealot.description
	Mobile:
		Speed: 70
	Health:
		HP: 40000
	ChangesHealth@SelfHealing:
