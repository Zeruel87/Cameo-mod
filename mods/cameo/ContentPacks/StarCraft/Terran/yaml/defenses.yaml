	ActorStatValues:
		Upgrades: terran_upgrade_vehicleweaponslevel1, terran_upgrade_vehicleweaponslevel2, terran_upgrade_vehicleplatinglevel1, terran_upgrade_vehicleplatinglevel2

terran_missilesilo:
	Inherits: ^BaseBuilding
	Inherits@shape: ^2x2Shape
	Inherits@SW: ^PrimarySuperweapon
	Inherits@POWERDOWN: ^DisableOnPowerDown
	Tooltip:
		Name: Terran Missile Silo
	Power:
		Amount: 0
	Buildable:
		Prerequisites: ~terran_commandcenter, terran_sciencefacility, ~techlevel.superweapons, !terran_missilesilo_swlimit
		Description: actor_mslo.description
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		BuildSounds: tscupd00.aud
	NukePowerCA:
		OrderName: NukePowerInfoOrder
		AllowMultiple: True
		PauseOnCondition: disabled
		Prerequisites:
			1: ~techlevel.superweapons
		Cursor: nuke
		Icons:
			1: abomb
		ChargeInterval: 10500
		Names:
			1: power_nuke.raname
		Descriptions:
			1: power_nuke.description
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		InsufficientPowerSpeechNotification: InsufficientPower
		EndChargeSpeechNotification: NuclearWeaponAvailable
		EndChargeTextNotification: Nuclear Missile ready.
		LaunchSpeechNotification: NuclearWeaponLaunched
		LaunchTextNotification: Warning: Nuclear Missile launched.
		IncomingSpeechNotification: NuclearWarheadApproaching
		IncomingTextNotification: Warning: Nuclear Missile launched.
		MissileWeapons:
			1: raatomic
		MissileDelay: 5
		SpawnOffset: 1c0,427,0
		DisplayTimerRelationships: Ally, Neutral, Enemy
		DisplayBeacon: True
		DisplayRadarPing: True
		BeaconPosters:
			1: atomic
		CameraRange: 10000
		CameraRemoveDelay: 125
		CircleRanges:
			1: 10000
		ArrowSequence: arrow
		ClockSequence: clocklarge
		CircleSequence: circles
		SupportPowerPaletteOrder: 70
		MissileImage: scatomic
		MissilePalette: greyscale
		BeaconActor: BLASTRADIUS.atomic
	WithBuildingBib:
	# WithSupportPowerActivationAnimation:
	# 	RequiresCondition: !build-incomplete
	ProvidesPrerequisite@swlimit:
		Prerequisite: terran_missilesilo_swlimit
	Voiced:
		VoiceSet: SCNuclearSiloVoice
	RenderSprites:
		PlayerPalette: player_rgba

