terran_bunker:
	Inherits: ^Defense
	Inherits@Template: ^BunkerTemplate
	Inherits@exp: ^GainsExperienceTDBuilding
	Inherits@decoration: ^TerranRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAll
	Inherits@shape: ^2x2Shape
	Inherits@speedup: ^SCUnitProductionSpeedBoost
	Inherits@gar: ^ClearableGarrison
	Inherits@bot: ^BotAutoDeployEvacuateCargo
	Inherits@weapon: ^TerranVehicleArmorUpgrades
	Tooltip:
		Name: Bunker
	Power:
		Amount: 0
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		LocalCenterOffset: 0,-512,0
		BuildSounds: tscupd00.aud
	Buildable:
		Queue: Defence, RADefence
		BuildPaletteOrder: 20
		Prerequisites: ~terran_commandcenter, terran_barracks
		Description: actor_scbunker.description
	Valued:
		Cost: 1200
	Health:
		HP: 240000
	Turreted:
		TurnSpeed: 1023
		RealignDelay: -1
	BodyOrientation:
		QuantizedFacings: 8
	Cargo:
		Types: Infantry, Hacker, Fremen
		MaxWeight: 4
		EjectOnDeath: false
		# InitialUnits: terran_marine, terran_firebat, terran_marauder, terran_marine
	WithCargoSounds:
		EnterSounds: tdrtra00.wav
		ExitSounds: tdrtra00.wav
	FireWarheadsOnDeath@healer:
		Weapon: FakeHealtAPC
	AttackOpenTopped:
		Armaments: garrisoned
		PortOffsets: 300,400,200, -400,500,200, 300,-400,200, -400,-500,200
		PauseOnCondition: chronobeamed
	DamageMultiplier@2x2Shape:
		Modifier: 50
	RevealsShroud:
		Range: 6666
	-QuantizeFacingsFromSequence:
	WithCargoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
	Voiced:
		VoiceSet: SCGenericBuildingVoice
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: terran_upgrade_vehicleplatinglevel1, terran_upgrade_vehicleplatinglevel2

terran_missileturret:
	Inherits: ^Defense
	Inherits@Template: ^AntiAirDefenseTemplate
	-WithTurretSearchlight:
	Inherits@exp: ^GainsExperienceTDBuilding
	Inherits@decoration: ^TerranRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAir
	Inherits@shape: ^2x2Shape
	Inherits@POWERDOWN: ^DisableOnPowerDown
	Inherits@armor: ^TerranVehiclesWeaponUpgrades
	Inherits@weapon: ^TerranVehicleArmorUpgrades
	Valued:
		Cost: 1200
	Tooltip:
		Name: Missile Turret
	Buildable:
		BuildPaletteOrder: 30
		Prerequisites: ~terran_commandcenter, terran_engineeringbay
		Queue: Defence, RADefence
		Description: actor_scmissileturret.description
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		BuildSounds: tscupd00.aud
	Health:
		HP: 200000
	Turreted:
		TurnSpeed: 40
		InitialFacing: 0
	-WithSpriteBody:
	WithEmbeddedTurretSpriteBody:
	Armament@1:
		Weapon: MissileTurret
		LocalOffset: 200,-200,200
	Armament@2:
		Weapon: MissileTurret
		LocalOffset: 200,200,200
	AttackPopupTurreted:
		CloseDelay: 25
		RequiresCondition: !build-incomplete
		PauseOnCondition: disabled
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		TilesetPalettes:
			VOLCANIC: ra_temperat
		Sequence: place
	DamageMultiplier@2x2Shape:
		Modifier: 50
	RevealsShroud:
		Range: 11626
	DetectCloaked:
		Range: 5813
	Power:
		Amount: -60
	Voiced:
		VoiceSet: SCAATowerVoice
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: terran_upgrade_vehicleweaponslevel1, terran_upgrade_vehicleweaponslevel2, terran_upgrade_vehicleplatinglevel1, terran_upgrade_vehicleplatinglevel2

terran_sentinel:
	Inherits: ^Defense
