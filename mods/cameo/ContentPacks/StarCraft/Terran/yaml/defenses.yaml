	Inherits@weapon: ^TerranVehicleArmorUpgrades
	Buildable:
		Queue: Defence, RADefence
		BuildPaletteOrder: 20
		Prerequisites: ~terran_commandcenter, terran_barracks
		Description: template_anti_infantry_defense.description
	Valued:
		Cost: 800
	Tooltip:
		Name: Sentinel
	Building:
		Footprint: x
		Dimensions: 1,1
		BuildSounds: tscupd00.aud
	Health:
		HP: 160000
	Selectable:
		Bounds: 1024, 1024
	Turreted:
		TurnSpeed: 40
		InitialFacing: 896
		Offset: -1,1,1
	AttackTurreted:
		Voice: Attack
	Armament:
		Weapon: NaxLaserT
		LocalOffset: 600,0,600
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		RequiresCondition: !schwarzermond_upgrade_crystallens
	ProvidesPrerequisite@buildingname:
