terran_commandcenter:
	Inherits: ^BaseBuilding
	Inherits@ref: ^SCRefineryCommon
	Inherits@shape: ^3x2Shape
	Inherits@radar: ^RadarBuilding
	-Production@Upgrades:
	-ProductionBar@Upgrades:
	Inherits@conyard: ^Conyard
	Inherits@POWERDOWN: ^DisableOnPowerDown
	Tooltip:
		Name: Command Center
	Power:
		Amount: 100
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
		BuildSounds: tscupd00.aud
	Transforms:
		IntoActor: sccommandcenterm
		Offset: 1,1
		Facing: 432
	Production@INFANTRY:
		Produces: Infantry
		PauseOnCondition: disabled
	ProductionQueue@INFANTRY:
		Type: Infantry
		DisplayOrder: 2
		Group: Infantry
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		InfiniteBuildLimit: 10
	ProductionBar@INFANTRY:
		ProductionType: Infantry
	# Production@NORMAL:
	# 	-RequiresCondition:
	# -Production@CLASSICPRODUCTIONQUEUES:
	# ProductionBar@BUILDING:
	# 	-RequiresCondition:
	# ProductionBar@DEFENCE:
	# 	-RequiresCondition:
	# -ProductionBar@RABUILDING:
	# -ProductionBar@RADEFENCE:
	ProductionQueue@Building:
		LowPowerModifier: 100
	ProductionQueue@Defense:
		LowPowerModifier: 100
	WithBuildingPlacedAnimation:
	ProvidesPrerequisite@buildingname:
	WithBuildingBib:
	RallyPoint:
		Path: 0,2
	Exit@1:
		SpawnOffset: -1024,1024,0 #-1323,1280,0
		ExitCell: 0,2
		Facing: 540
	ProvidesRadar:
		RequiresCondition: !jammed
	Refinery:
	Selectable:
		Bounds: 3072, 2560, 0, 0
		DecorationBounds: 3072, 2560, 0, 0
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
		FullSequence: pip-yellow
	WithProductionOverlay@WELDING:
		RequiresCondition: !build-incomplete
		Queues: Building, Defence, RABuilding, RADefence
		Sequence: build
	Voiced:
		VoiceSet: SCCommandCenterVoice
	RenderSprites:
		PlayerPalette: player_rgba

terran_supplydepot:
	Inherits: ^BaseBuilding
	Inherits@shape: ^2x2Shape
	Inherits@power: ^PowerPlant
	Inherits@storage: ^StoresResources
	Inherits@plug: ^BuildingPlugProducer
	Tooltip:
		Name: Supply Depot
	Valued:
		Cost: 800
	Power:
		Amount: 200
	ProvidesPrerequisite@buildingname:
	Buildable:
		Prerequisites: ~terran_commandcenter
		Queue: Building, RABuilding
		Description: actor_scsupplydepot.description
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		BuildSounds: tscupd00.aud
	Health:
		HP: 200000
	StoresResources:
		Capacity: 4000
	RevealsShroud:
		Range: 5c0
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
		FullSequence: pip-yellow
	WithIdleOverlay@fans:
		RequiresCondition: supplydepotupg
		Sequence: fans
		Palette: greyscale
	DamageMultiplier@supplydepotupg:
		RequiresCondition: supplydepotupg
		Modifier: 50
	StoresPlayerResources@supplydepotupg:
		Capacity: 4000
		RequiresCondition: supplydepotupg
	GrantConditionOnPrerequisite@terran_upgrade_upgradesupplydepotlevel1:
		Condition: terran_upgrade_upgradesupplydepotlevel1
		Prerequisites: terran_upgrade_upgradesupplydepotlevel1
	PowerMultiplier@terran_upgrade_upgradesupplydepotlevel1:
		Modifier: 150
		RequiresCondition: terran_upgrade_upgradesupplydepotlevel1 && !terran_upgrade_upgradesupplydepotlevel2
	GrantConditionOnPrerequisite@terran_upgrade_upgradesupplydepotlevel2:
		Condition: terran_upgrade_upgradesupplydepotlevel2
		Prerequisites: terran_upgrade_upgradesupplydepotlevel2
	PowerMultiplier@terran_upgrade_upgradesupplydepotlevel2:
		Modifier: 200
		RequiresCondition: terran_upgrade_upgradesupplydepotlevel2
	ProvidesPrerequisite:
		Prerequisite: supplydepotupgradeavailable
		RequiresCondition: !supplydepotupg
	PowerMultiplier@supplydepotupg:
		Modifier: 200
		RequiresCondition: supplydepotupg
	Pluggable:
		Offset: 0,0
		Conditions:
			terran_supplydepot: supplydepotupg
		Requirements:
			terran_supplydepot: !build-incomplete && !supplydepotupg
	WithBuildingBib:
	Voiced:
		VoiceSet: SCSupplyCenterVoice
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: terran_upgrade_upgradesupplydepotlevel1, terran_upgrade_upgradesupplydepotlevel2

terran_expandedstorage:
	Inherits: ^BuildingPlug
	Tooltip:
		Name: Expanded Storage
	Valued:
		Cost: 800
	Buildable:
		BuildPaletteOrder: 80
		Queue: BuildingAddons
		Prerequisites: ~terran_commandcenter, supplydepotupgradeavailable
		Description: actor_supplydepotexpand.description
	Plug:
		Type: terran_supplydepot
	RenderSprites:
		Image: terran_supplydepot

terran_refinery:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x2Shape
	Inherits@ref: ^SCRefineryCommon
	Inherits@plug: ^BuildingPlugProducer
	Tooltip:
		Name: Refinery
	Power:
		Amount: 0
	Buildable:
		Prerequisites: ~terran_commandcenter
		BuildPaletteOrder: 20
		Queue: Building, RABuilding
		Description: actor_screfinery.description
	Building:
		Footprint: _x_ xxx ===
		BuildSounds: tscupd00.aud
		Dimensions: 3,3
	WithBuildingBib:
	FreeActor@1:
		Actor: terran_scv
		SpawnOffset: 0,2
		Facing: 540
	FreeActor@2:
		Actor: terran_scv
		SpawnOffset: 0,2
		Facing: 540
	SelectionDecorations:
	Refinery:
	DamageMultiplier@refineryupg:
		RequiresCondition: refineryupg
		Modifier: 50
	WithIdleOverlay@smoke:
		RequiresCondition: refineryupg
		Sequence: smoke
		Palette: greyscale
	SeedsResource:
		ResourceType: SCGas
		Interval: 125
		RequiresCondition: refineryupg
	CashTrickler@refineryupg:
		RequiresCondition: refineryupg
		Interval: 50
		Amount: 25
		ShowTicks: True
	ProvidesPrerequisite:
		Prerequisite: sctrefineryupgradeavailable
		RequiresCondition: !refineryupg
	Pluggable:
		Offset: 1,0
		Conditions:
			terran_refinery: refineryupg
		Requirements:
			terran_refinery: !build-incomplete && !refineryupg
	Voiced:
		VoiceSet: SCRefineryVoice
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: terran_vespenegascollector

