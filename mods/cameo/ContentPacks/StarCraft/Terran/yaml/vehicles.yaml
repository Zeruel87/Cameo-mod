terran_siegetank:
	Inherits: ^Tank
	Inherits@SC: ^SCTVEHICLE
	Inherits@decoration: ^TerranRankDecoration
	Inherits@speedup: ^SCUnitProductionSpeedBoost
	Inherits@Template: ^ArtilleryTankTemplate
	Inherits@EXP: ^GainsExperienceTD
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@announce: ^AnnounceOnBuild
	Inherits@Crushes: ^VehicleCrusher
	Inherits@SHADOWS: ^Shadows
	Inherits@armor: ^TerranVehiclesWeaponUpgrades
	Inherits@weapon: ^TerranVehicleArmorUpgrades
	Inherits@bot: ^SiegeModeVehicle
	Tooltip:
		Name: Siege Tank
	Valued:
		Cost: 2800
	Power:
		Amount: -140
	Buildable:
		BuildPaletteOrder: 30
		Prerequisites: ~terran_engineeringbay
		Description: actor_scsiegetank.description
	Mobile:
		Speed: 75
		TurnSpeed: 15
	Health:
		HP: 150000
	Repairable:
		HpPerStep: 7500
	ChangesHealth@SelfHealing:
		Step: 60
	RevealOnFire:
		ArmamentNames: primary, deployed
	Armor:
		Type: Heavy
		RequiresCondition: !shielded
	# DEPLOYING ADDS THE STEEL DEFENCE ARMOUR ON TOP OF THE UNIT'S OWN CLASS ARMOUR.
	# Maintainer 2026-08-22: *"activate the steel armor type on deploy but keep the underlying
	# regular armor intact and then create the average between them"* — a deployed unit is a
	# static defence, and Steel is what defences wear.
	#
	# Both traits stay ENABLED together, which is the whole point:
	# `AreaDamageWarhead.MultiArmorCombination` defaults to `Average`, so the class row and the
	# Steel row meet in the middle instead of one replacing the other. Gating the class armour
	# on `undeployed` — what the defence rig, siege tank and matador used to do — makes Steel a
	# REPLACEMENT and throws the unit's own class away.
	#
	# ⚠ Averaging only happens for warheads routing through AreaDamage (62.9% of the tree).
	# The legacy inline-Versus SpreadDamage nodes still MULTIPLY, and under multiplication the
	# class row cancels out entirely (the ratio becomes just Steel/100) — so those weapons see a
	# flatter effect than designed until item A5 retires them onto ^Warhead_* templates.
	Armor@deployed:
		Type: Steel
		RequiresCondition: !shielded && deployed
	Turreted:
		TurnSpeed: 15
		Offset: -256,0,256
		RequiresCondition: undeployed
	Turreted@deployed:
		Turret: deployed
		RealignDelay: -1
		TurnSpeed: 30
		RequiresCondition: deployed
	Armament:
		Weapon: SiegeTankCannon
		MuzzleSequence: muzzle
		LocalOffset: 512,256,0
		RequiresCondition: undeployed
	Armament@DEPLOYED:
		Name: deployed
		Turret: deployed
		MuzzleSequence: muzzle
		Weapon: SiegeTankSiegeCannon
		LocalOffset: 750,0,250
		RequiresCondition: deployed
	# FirepowerMultiplier@deployed:
	# 	Modifier: 50
	# 	RequiresCondition: deployed
	RevealsShroudMultiplier@deployed:
		Modifier: 150
		RequiresCondition: deployed
	RevealsShroudMultiplier@terran_upgrade_advancedsiegemode:
		Modifier: 120
		RequiresCondition: deployed && terran_upgrade_advancedsiegemode
	RangeMultiplier@terran_upgrade_advancedsiegemode:
		Modifier: 110
		RequiresCondition: deployed && terran_upgrade_advancedsiegemode
	GrantConditionOnPrerequisite@terran_upgrade_advancedsiegemode:
		Condition: terran_upgrade_advancedsiegemode
		Prerequisites: terran_upgrade_advancedsiegemode
	AttackTurretedCharged:
		Turrets: primary,deployed
		Armaments: primary,deployed
		PauseOnCondition: disabled
	WithMuzzleOverlay:
	WithSpriteTurret:
		RequiresCondition: undeployed
	WithSpriteTurret@deployed:
		Sequence: deployed
		Turret: deployed
		RequiresCondition: deployed
	WithFacingSpriteBody:
		RequiresCondition: !deployed
	WithMakeAnimation:
	WithMoveAnimation:
		MoveSequence: run
	RenderRangeCircle:
	WithRangeCircle:
		Range: 3980
		Type: pillbox
		RequiresCondition: deployed
	Selectable:
		Bounds: 1280, 1280
		DecorationBounds: 1536, 1536
	GrantConditionOnDeploy:
		DeploySounds: TankSiege.aud
		UndeploySounds: TankSiege.aud
	Passenger:
		CustomPipType: blue
	IssueOrderToBot@AI:
		OrderTrigger: Attack
		OrderChance: 75
		OrderInterval: 1000
	Voiced:
		VoiceSet: SCSiegeTankVoice
	DeathSounds:
	WithShadow:
		Offset: 108, 48, 0
		ZOffset: -512
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: terran_upgrade_vehicleweaponslevel1, terran_upgrade_vehicleweaponslevel2, terran_upgrade_vehicleplatinglevel1, terran_upgrade_vehicleplatinglevel2, terran_upgrade_advancedsiegemode

