		InitialDelay: 25
		CloakDelay: 25
		MinCloakedAlpha: 0.25
		MaxCloakedAlpha: 0.25
	WithShadow:
		Offset: 128, 128, 0
		ZOffset: -512
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: zerg_upgrade_meleeattackslevel1, zerg_upgrade_meleeattackslevel2, zerg_upgrade_carapacelevel1, zerg_upgrade_carapacelevel2

