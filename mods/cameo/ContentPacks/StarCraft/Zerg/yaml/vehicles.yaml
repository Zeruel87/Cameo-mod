		Image: zerg_drone
		Sequence: deployed
		Palette: greyscale
	WithHarvesterSpriteBody:
		ImageByFullness: zerg_drone, scdronefull
	-WithFacingSpriteBody:
	-WithInfantryBody:
	-Targetable@disguise:
	-WithSpriteBody@deployed:
