		TurnSpeed: 40
	FireWarheadsOnDeath:
		Weapon: SCWorkerExplode
		EmptyWeapon: SCWorkerExplode
	Tooltip:
		Name: Zerg Drone
	Buildable:
		Queue: SCZergInfantry
		Prerequisites: ~zerg_extractor
		Description: actor_scdrone.description
	WithDeathAnimation:
		UseDeathTypeSuffix: false
	Armament:
		Weapon: DroneAttack
	Voiced:
		VoiceSet: SCDroneVoice
	-WithMakeAnimation:
