zerg_hatchery:
	Inherits: ^BaseBuildingZerg
	Inherits@ref: ^SCRefineryCommon
	Inherits@shape: ^3x2Shape
	Inherits@bot: ^BotMicromanageable
	Inherits@breedfaster: ^SCBREEDFASTER
	#Inherits@ra1_soviets_barracks: ^IsBarrack
	Inherits@conyard: ^Conyard
	Tooltip:
		Name: Hatchery
		RequiresCondition: !zerg_lair && !zerg_hive
	Tooltip@2:
		Name: Lair
		RequiresCondition: zerg_lair && !zerg_hive
	Tooltip@3:
		Name: Hive
		RequiresCondition: zerg_hive
	Selectable:
		Bounds: 3072, 2048
		DecorationBounds: 3300, 2448, 0, 0
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@zerg_lair:
		Prerequisite: zerg_lair
		RequiresCondition: zerg_lair
	ProvidesPrerequisite@zerg_hive:
		Prerequisite: zerg_hive
		RequiresCondition: zerg_hive
	ProvidesPrerequisite@lairupgradeavailable:
		Prerequisite: lairupgradeavailable
		RequiresCondition: !zerg_lair
	ProvidesPrerequisite@hiveupgradeavailable:
		Prerequisite: hiveupgradeavailable
		RequiresCondition: zerg_lair && !zerg_hive
	Pluggable:
		Offset: 0,0
		Conditions:
			zerg_hatchery: zerg_lair
		Requirements:
			zerg_hatchery: !zerg_lair
	Pluggable@2:
		Offset: 0,0
		Conditions:
			zerg_lair: zerg_hive
		Requirements:
			zerg_lair: zerg_lair && !zerg_hive
	WithSpriteBody:
		RequiresCondition: !zerg_lair && !zerg_hive
	WithSpriteBody@lair:
		Sequence: lair
		Name: lair
		RequiresCondition: zerg_lair && !zerg_hive
	WithSpriteBody@hive:
		Sequence: hive
		Name: hive
		RequiresCondition: zerg_hive
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
		BuildSounds: zchrdy00.aud
		TerrainTypes: Clear,ClearTemperat,ClearWinter,ClearJungle,ClearSnow,ClearDesert,Road,Concrete,ClearDune,ZergSoil
	DamageMultiplier@lair:
		Modifier: 75
		RequiresCondition: zerg_lair && !zerg_hive
	DamageMultiplier@hive:
		Modifier: 50
		RequiresCondition: zerg_hive
	RallyPoint:
		Path: 1,2
	PrimaryBuilding:
		PrimaryCondition: primary
		SelectionNotification: PrimaryBuildingSelected
	WithDecoration@primary:
		RequiresSelection: true
		Image: rapips
		Sequence: tag-primary
		Position: Top
		RequiresCondition: primary
	LarvaProductionQueue@ZINFANTRY:
		Type: SCZergInfantry
		DisplayOrder: 2
		Group: Infantry
		LowPowerModifier: 100
		ReadyAudio: UnitReady
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		InfiniteBuildLimit: 10
		MaxParallel: 3
	ProductionBar@ZINFANTRY:
		ProductionType: SCZergInfantry
	LarvaConsumingProduction:
		Produces: SCZergInfantry
		EggCondition: sc_zerg_egg
	Exit@0:
		SpawnOffset: 0,0,0
		ExitCell: 0,2
		Facing: 540
	Exit@1:
		SpawnOffset: 0,0,0 #-1323,1280,0
		ExitCell: 1,2
		Facing: 540
	Exit@2:
		SpawnOffset: 0,0,0
		ExitCell: 2,2
		Facing: 540
	ProvidesRadar:
		RequiresCondition: !jammed
	ExternalCondition@JAMMED:
		Condition: jammed
	GivesBuildableArea:
		AreaTypes: building, cityi, hatchery, creep
	-WithMakeAnimation:
	WithLoopedMakeAnimation:
		Duration: 3000
		BodyNames: body, lair, hive
	-WithDeathAnimation:
	Refinery:
	##########
	Sellable:
	##########
	GrantConditionOnProduction@botpowerrestriction:
		Condition: botpowerrestriction
		Duration: 1000
		ShowSelectionBar: False
		Actors: zerg_overlord
	ProvidesPrerequisite@botpowerrestriction:
		Prerequisite: botpowerrestriction
		RequiresCondition: botpowerrestriction
		RequiresPrerequisites: !Extractor
	SpawnActorOnDeath@death1:
		Actor: SCBROODLING
	SpawnActorOnDeath@death2:
		Actor: SCBROODLING
	SpawnActorOnDeath@death3:
		Actor: SCBROODLING
	SpawnActorOnDeath@death4:
		Actor: SCBROODLING
	SpawnActorOnDeath@death5:
		Actor: SCBROODLING
	StoresResources:
		Capacity: 1000
	DroneSpawnerMaster:
		Actors: sc_zerg_larva, sc_zerg_larva, sc_zerg_larva
		SpawnOffset: -1024,1024,0, 0,1024,0, 1024,1024,0
		RespawnTicks: 125
		InitialActorCount: 0
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
		FullSequence: pip-yellow
	Transforms:
		IntoActor: zerg_hatcherydrone
	WithCreepOverlay:
		Adjacent: 5
	RenderSprites:
		PlayerPalette: player_rgba

