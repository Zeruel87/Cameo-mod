ts_nod_constructionyard:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x3Shape
	Inherits@sell: ^TSSpawnActorsOnSell
	Inherits@conyard: ^Conyard
	Valued:
		Cost: 2500
	Tooltip:
		Name: Construction Yard (Nod)
	Building:
		Footprint: _xx_ xxxx _xx_
		Dimensions: 4,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 1000000
	Transforms:
		IntoActor: ts_nod_mobileconstructionvehicle
		Offset: 1,1
		Facing: 432
	ProvidesPrerequisite@tsoilderrick:
		Prerequisite: tsoilderrick
	ProvidesPrerequisite@tslaserfence:
		Prerequisite: tslaserfence
	WithProductionOverlay@WELDING:
		RequiresCondition: !build-incomplete
		Queues: Building, Defence, RABuilding, RADefence
		Sequence: build
	WithIdleOverlay@TOP:
		RequiresCondition: !build-incomplete
		Sequence: idle-top
	WithIdleOverlay@SIDE:
		RequiresCondition: !build-incomplete
		Sequence: idle-side
	WithIdleOverlay@FRONT:
		RequiresCondition: !build-incomplete
		Sequence: idle-front
	WithBuildingPlacedOverlay:
		RequiresCondition: !build-incomplete
	Selectable:
		Bounds: 3072, 2560, 0, 0
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@fact.tsnod:
		Prerequisite: fact.tsnod
	WithDeathAnimation:
		DeathSequencePalette: playerra2
		DeathPaletteIsPlayerPalette: true
	RenderSprites:
		Image: tsgtcnst
		PlayerPalette: playerra2

ts_nod_tiberiumrefinery:
	Inherits: ^BaseBuilding
	Inherits@sell: ^TSSpawnActorsOnSell
