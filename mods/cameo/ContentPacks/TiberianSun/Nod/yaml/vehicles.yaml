	Inherits@AdvancedTiberiumRefinement: ^AdvancedTiberiumRefinement
	Inherits@deploy: ^LurkerMode
	Inherits@bot: ^SiegeModeVehicle
	Valued:
		Cost: 1300
	Tooltip:
		Name: Artillery
		RequiresCondition: !deployed
	Tooltip@DEPLOYED:
		Name: Artillery (deployed)
		RequiresCondition: deployed
	Buildable:
		BuildPaletteOrder: 60
		Prerequisites: ~ts_nod_warfactory, ts_nod_radar
		Queue: Vehicle, RAVehicle
		Description: actor_ts_nod_artillery.description
	Mobile:
		Locomotor: tracked
		Speed: 60
		TurnSpeed: 12
	Health:
		HP: 30000
	Repairable:
		HpPerStep: 1500
	ChangesHealth@SelfHealing:
		Step: 12
	Turreted:
		TurnSpeed: 12
		InitialFacing: 384
	Armament@Dummy:
		Weapon: TSArtyTargeting
	Armament@Deployed:
		Weapon: TS155mm
		LocalOffset: 407,0,362
		RequiresCondition: (deployed || undeployed) && !ts_nod_upgrade_auxiliaryweapon
	Armament@DeployedUpgrade:
		Name: deployed
		Turret: deploy
		Weapon: TSAux155mm
		LocalOffset: 407,0,362
		PauseOnCondition: undeployed
		RequiresCondition: (deployed || undeployed) && ts_nod_upgrade_auxiliaryweapon
	AttackTurreted:
		Voice: Attack
		TargetFrozenActors: True
		ForceFireIgnoresActors: True
		OutsideRangeRequiresForceFire: True
	GrantConditionOnDeploy:
		Facing: 384
		DeploySounds: place2.aud
		UndeploySounds: clicky1.aud
		Voice: Move
	GrantCondition@PREVIEWWORKAROUND:
		Condition: real-actor
	WithVoxelBody:
		RequiresCondition: undeployed
	WithFacingSpriteBody:
		Sequence: deploy
		RequiresCondition: !undeployed && real-actor
	WithVoxelTurret:
		Turret: deploy
		RequiresCondition: !undeployed
	WithVoxelBarrel:
		Armament: deployed
		RequiresCondition: !undeployed
	Voiced:
		VoiceSet: TSVehicle
	RenderSprites:
		PlayerPalette: playerra2
	ActorStatValues:
		Upgrades: ts_nod_upgrade_mobilityspecialization, ts_nod_upgrade_auxiliaryweapon, ts_nod_upgrade_advancedtiberiumrefinement
	# DEPLOYING ADDS THE STEEL DEFENCE ARMOUR ON TOP OF THE UNIT'S OWN CLASS ARMOUR.
	# Maintainer 2026-08-22: *"activate the steel armor type on deploy but keep the underlying
	# regular armor intact and then create the average between them"* — a deployed unit is a
	# static defence, and Steel is what defences wear.
	#
	# Both traits stay ENABLED together, which is the whole point:
	# `AreaDamageWarhead.MultiArmorCombination` defaults to `Average`, so the class row and the
	# Steel row meet in the middle instead of one replacing the other. Gating the class armour
	# on `undeployed` — what the defence rig, siege tank and matador used to do — makes Steel a
	# REPLACEMENT and throws the unit's own class away.
	#
	# ⚠ Averaging only happens for warheads routing through AreaDamage (62.9% of the tree).
	# The legacy inline-Versus SpreadDamage nodes still MULTIPLY, and under multiplication the
	# class row cancels out entirely (the ratio becomes just Steel/100) — so those weapons see a
	# flatter effect than designed until item A5 retires them onto ^Warhead_* templates.
	Armor@deployed:
		Type: Steel
		RequiresCondition: !shielded && deployed

