ts_nod_ticktank:
	Inherits: ^Tank
	Inherits@Template: ^MainBattleTankTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^NodRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@Voxel: ^TSRenderVoxel
	Inherits@EMP: ^FrontalEMP
	Inherits@detect: ^EliteDetector
	Inherits@vo: ^AttackFrontalVoice
	Inherits@TiberiumLenses: ^TiberiumLenses
	Inherits@AuxiliaryWeapon: ^AuxiliaryWeapon
	Inherits@AdvancedTiberiumRefinement: ^AdvancedTiberiumRefinement
	Inherits@bot: ^SiegeModeVehicle
	Valued:
		Cost: 800
	Tooltip:
		Name: Tick Tank
	Buildable:
		BuildPaletteOrder: 60
		# BuildDurationModifier: 100
		# BuildDuration: 300
		Prerequisites: ~ts_nod_warfactory
		Queue: Vehicle, RAVehicle
		Description: Nod's main battle tank.\nDeploys into concrete armour: resists anti-tank fire,\nbut siege weapons hit it much harder.\n  Strong vs Vehicles\n  Weak vs Infantry, Aircraft
	Mobile:
		Locomotor: tracked
		TurnSpeed: 18
		Speed: 90
	Health:
		HP: 100000
	Repairable:
		HpPerStep: 5000
	ChangesHealth@SelfHealing:
		Step: 40
	RevealOnFire:
		ArmamentNames: primary, deployed
	# DEPLOYING SWAPS THE ARMOUR TYPE, IT DOES NOT GRANT BLANKET DAMAGE REDUCTION.
	# Maintainer 2026-08-22: *"What it should do instead is switching the armor type from heavy
	# to concrete like in the original TS, which means anti building weapons will be more
	# effective when it's deployed but anti vehicle weapons will be less effective. Right now
	# everything is equally less effective at 50% reduced damage."*
	#
	# It used to carry `DamageMultiplier: 50 / RequiresCondition: deployed` — the STRONGEST
	# deploy bonus in the tree (every other deployable sits at 60-75, and the only other
	# vehicle-scale one is the 5000-credit `td_gdi_defenserig` at 70). Because damage
	# multipliers MULTIPLY, it compounded with the whole veterancy ladder: deployed +
	# rank-elite = x0.30, and a realistic late-game stack reached ~613,000 effective HP on an
	# 800-credit tank. It was also invisible to pricing — `extract_stats` only reads a
	# `DamageMultiplier` gated on the SHIELD-up condition — so the 2x was free.
	#
	# Measured across all 137 generated profiles, Concrete vs Heavy: anti-vehicle fire is far
	# WEAKER against it (MissileAP 0.41x, Railgun 0.51x, MissileChem 0.50x) while siege fire is
	# far STRONGER (Demolition 2.34x/2.06x, Flame 1.85x, Thermobaric 1.57x). Median 0.94x, so
	# deploying is now a genuine trade-off instead of a flat 2x.
	#
	# ⚠ The three Armor traits MUST stay mutually exclusive. `DamageWarhead.DamageVersus` does
	# `Util.ApplyPercentageModifiers(100, armor)` over EVERY enabled Armor trait, so two active
	# at once MULTIPLY their Versus (Heavy 74 x Concrete 136 = 101, i.e. armour cancels itself).
	# Gated on `!deployed` rather than `undeployed` so the deploy transition can never leave the
	# actor with NO armour trait — that would resolve to a flat 100% and ignore Versus entirely.
	Armor:
		Type: Heavy
		RequiresCondition: !shielded
	# DEPLOYING ADDS THE STEEL DEFENCE ARMOUR ON TOP OF THE UNIT'S OWN CLASS ARMOUR.
	# Maintainer 2026-08-22: *"activate the steel armor type on deploy but keep the underlying
	# regular armor intact and then create the average between them"* — a deployed unit is a
	# static defence, and Steel is what defences wear.
	#
	# Both traits stay ENABLED together, which is the whole point:
	# `AreaDamageWarhead.MultiArmorCombination` defaults to `Average`, so the class row and the
	# Steel row meet in the middle instead of one replacing the other. Gating the class armour
	# on `undeployed` — what the defence rig, siege tank and matador used to do — makes Steel a
	# REPLACEMENT and throws the unit's own class away.
	#
	# ⚠ Averaging only happens for warheads routing through AreaDamage (62.9% of the tree).
	# The legacy inline-Versus SpreadDamage nodes still MULTIPLY, and under multiplication the
	# class row cancels out entirely (the ratio becomes just Steel/100) — so those weapons see a
	# flatter effect than designed until item A5 retires them onto ^Warhead_* templates.
	Armor@deployed:
		Type: Steel
		RequiresCondition: !shielded && deployed
	Turreted:
		TurnSpeed: 18
		Turret: deployed
		Offset: 220,-20,296
	Armament@PRIMARY:
		Weapon: TS90mm
		LocalOffset: 407,0,362
		RequiresCondition: undeployed && !ts_nod_upgrade_tiberiumlenses
		MuzzleSequence: muzzle
	Armament@UPGRADE:
		Weapon: TSLaser90mm
		LocalOffset: 407,0,362
		RequiresCondition: undeployed && ts_nod_upgrade_tiberiumlenses
		MuzzleSequence: muzzle
	# Armament@ELITE:
	# 	Weapon: TS120mmx
	# 	LocalOffset: 407,0,362
	# 	# RequiresCondition: rank-elite && undeployed
	# 	MuzzleSequence: muzzle
	Armament@deployed:
		Name: deployed
		Turret: deployed
		Weapon: TS90mmDep
		LocalOffset: 543,75,362
		RequiresCondition: deployed && !ts_nod_upgrade_tiberiumlenses
		MuzzleSequence: muzzle
	Armament@UPGRADEdeployed:
		Name: deployed
		Turret: deployed
		Weapon: TSLaser90mmDep
		LocalOffset: 543,75,362
		RequiresCondition: deployed && ts_nod_upgrade_tiberiumlenses
		MuzzleSequence: muzzle
	# Armament@elitedeployed:
	# 	Name: deployed
	# 	Turret: deployed
	# 	Weapon: TS120mmx
	# 	LocalOffset: 543,0,362
	# 	RequiresCondition: rank-elite && deployed
	# 	MuzzleSequence: muzzle
	Armament@SECONDARY:
		Name: deployed
		Turret: deployed
		Weapon: TS25mmDep
		LocalOffset: 543,-75,362
		RequiresCondition: deployed && ts_nod_upgrade_auxiliaryweapon && !ts_nod_upgrade_tiberiumlenses
		MuzzleSequence: muzzle
	Armament@UPGRADESECONDARY:
		Name: deployed
		Turret: deployed
		Weapon: TSLaser25mmDep
		LocalOffset: 543,-75,362
		RequiresCondition: deployed && ts_nod_upgrade_auxiliaryweapon && ts_nod_upgrade_tiberiumlenses
		MuzzleSequence: muzzle
	WithMuzzleOverlay:
	AttackFrontal:
		RequiresCondition: undeployed
		FacingTolerance: 0
	AttackTurreted@deployed:
		RequiresCondition: deployed
		Armaments: deployed
		Turrets: deployed
		PauseOnCondition: disabled
		Voice: Attack
	WithVoxelBody:
		RequiresCondition: undeployed
	WithSpriteBody@deployed:
		RequiresCondition: deployed
		Sequence: deploy-idle
	WithVoxelTurret:
		Turret: deployed
		RequiresCondition: deployed
	WithVoxelBarrel:
		Armament: deployed
		LocalOffset: 90,0,180
		RequiresCondition: deployed
	WithFacingSpriteBody:
		RequiresCondition: !deployed
	WithMakeAnimation:
	GrantConditionOnDeploy:
		Facing: 640
		DeploySounds: place2.aud
		UndeploySounds: place2.aud
		Voice: Move
	Voiced:
		VoiceSet: TSVehicle
	RenderSprites:
		PlayerPalette: playerra2
	ActorStatValues:
		Upgrades: ts_nod_upgrade_tiberiumlenses, ts_nod_upgrade_auxiliaryweapon, ts_nod_upgrade_advancedtiberiumrefinement
