		Prerequisites: ~ts_nod_handof
		Description: Captures and repairs structures.\n  Unarmed
	Voiced:
		VoiceSet: TSInfantry
	-TemporaryOwnerManager:
	RenderSprites:
		PlayerPalette: playerra2
		Image: altengi

ts_nod_rocketinfantry:
