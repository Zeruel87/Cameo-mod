ts_nod_shadowteam_air:
	Inherits: ^JumpjetInfantry
	Inherits@Template: ^FlyingInfantryTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^NodRankDecoration
	Inherits@CLOAK: ^CloakedAircraft
	Inherits@detect: ^GenericGroundDetector
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Tooltip:
		Name: actor_ts_nod_shadowteam.name
	Valued:
		Cost: 900
	UpdatesPlayerStatistics:
		AddToArmyValue: true
		OverrideActor: ts_nod_shadowteam
	Buildable:
		IconPalette: tscameo
		BuildPaletteOrder: 90
		Description: actor_ts_nod_shadowteam.description
	Aircraft:
		TurnSpeed: 20
		Speed: 150
		VTOL: false
		CanHover: false
		CanForceLand: false
	TakeOffOnMake:
	Health:
		HP: 30000
	ChangesHealth@SelfHealing:
		Step: 30
	Armament@PRIMARY:
		Weapon: TSShadowTeamTargeting
		LocalOffset: 128,0,256
		ReloadingCondition: reloading
	ReloadArmamentsBar:
	AttackAircraft:
		FacingTolerance: 10
		AttackType: Default
		PersistentTargeting: false
		OpportunityFire: false
		RequiresCondition: !reloading
	DeathSounds:
	-WithShadow:
	WithInfantryBody@Air:
		StandSequences: fly
		MoveSequence: fly
		RequiresCondition: airborne
	WithInfantryBody:
		IdleSequences: idle1, idle2
		DefaultAttackSequence: shoot
		RequiresCondition: !airborne
	QuantizeFacingsFromSequence:
		Sequence: stand
	Selectable:
		Bounds: 512, 768
	ActorStatValues:
		Upgrades: ts_nod_upgrade_infiltrationkit
	WithSpriteBody@shadow:
		Name: shadow
		Sequence: shadow
		ForceToGround: true
		RequiresCondition: airborne
	-SpawnActorOnDeath:
	Voiced:
		VoiceSet: TSSpy
	Transforms:
		IntoActor: ts_nod_shadowteam
	RenderSprites:
		Image: ts_nod_shadowteam
		PlayerPalette: playerra2

