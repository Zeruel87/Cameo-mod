ts_gdi_vulcantower:
	Inherits: ^Defense
	Inherits@Template: ^BasicDefenseTemplate
	Inherits@exp: ^TSGainsExperienceTD
	Inherits@decoration: ^TSGDIRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAll
	Inherits@sell: ^TSSpawnActorsOnSell
	Inherits@EMP: ^DefenseTurretedEMP
	Inherits@SonicWeaponry: ^SonicWeaponry
	Valued:
		Cost: 600
	Tooltip:
		Name: Vulcan Tower
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: ~ts_gdi_constructionyard, ts_gdi_barracks
		Queue: Defence, RADefence
		BuildDurationModifier: 40
		Description: Basic base defense.\nDoes not require power to operate.\n  Strong vs Infantry, Light armor\n  Weak vs Aircraft
	RequiresBuildableArea:
		AreaTypes: building
	Selectable:
		Bounds: 1024, 1024
	SelectionDecorations:
	Health:
		HP: 80000
	RevealsShroud:
		Range: 7c0
	Turreted:
		TurnSpeed: 48
		Offset: 0,0,0
	WithSpriteBody:
	Armament@PRIMARY:
		Weapon: TSVulcanGun
		LocalOffset: 300,60,600
		CasingWeapon: generic_bullet_casing
		CasingSpawnLocalOffset: 150,60,600
		CasingTargetOffset: 0,660,0
		RequiresCondition: !ts_gdi_upgrade_sonicweaponry
	Armament@Upgrade:
		Weapon: TSVulcanGunSonic
		LocalOffset: 300,60,600
		RequiresCondition: ts_gdi_upgrade_sonicweaponry
	#Armament@VULCSECONDARY:
	#	Weapon: TurretGun
	#	LocalOffset: 300,-60,600
	AttackTurreted:
		RequiresCondition: !build-incomplete
	WithSpriteTurret:
		RequiresCondition: !build-incomplete
	DetectCloaked:
		Range: 3c0
	-SpawnActorsOnSell:
	-WithDeathAnimation:
	Power:
		Amount: -20
	RenderSprites:
		PlayerPalette: playerra2
	ActorStatValues:
		Upgrades: ts_gdi_upgrade_sonicweaponry

