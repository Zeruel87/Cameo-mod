ts_gdi_empulsecannon:
	Inherits: ^Defense
	Inherits@Template: ^AdvancedDefenseTemplate
	Inherits@shape: ^2x2Shape
	Inherits@sell: ^TSSpawnActorsOnSell
	Selectable:
		Bounds: 2048, 2048
	Buildable:
		BuildPaletteOrder: 140
		Prerequisites: ~ts_gdi_constructionyard, ts_gdi_techcenter
		Queue: Defence, RADefence
		BuildDurationModifier: 40
		Description: actor_ts_gdi_empulsecannon.description
		BuildLimit: 1
	Valued:
		Cost: 2000
	Tooltip:
		Name: E.M. Pulse Cannon
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Health:
		HP: 250000
	Armor:
		Type: Concrete
	RevealsShroud:
		Range: 7c0
	Power:
		Amount: -100
	ProvidesPrerequisite@buildingname:
	Turreted:
		TurnSpeed: 40
		InitialFacing: 896
		RealignDelay: -1
	WithSpriteTurret:
		RequiresCondition: !build-incomplete
		Sequence: turret
	Armament@PRIMARY:
		Name: superweapon
		Weapon: TSPulseCannon_EMP
		LocalOffset: 212,0,1768
		LocalYaw: 0,100
	AttackTurreted:
		RequiresCondition: !build-incomplete && !empdisable && !disabled
	FireArmamentPower:
		AllowMultiple: true
		ArmamentName: superweapon
		Prerequisites:
			1: ~techlevel.superweapons
		Cursor: ioncannon
		IconImage: tsntpuls
		Icons:
			1: icon2
		TargetCircleRange: 6000
		ChargeInterval: 3375
		Names:
			1: power_empulse.name
		Descriptions:
			1: power_empulse.description
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		InsufficientPowerSpeechNotification: InsufficientPower
		EndChargeSpeechNotification: EmPulseCannonReady
		EndChargeTextNotification: EMP ready.
		LaunchSpeechNotification:
		LaunchTextNotification: EMP launched.
		IncomingSpeechNotification:
		IncomingTextNotification: Warning: EMP launched.
		OrderName: SteelEmpCannon
		DisplayTimerRelationships: Ally, Neutral, Enemy
		CameraRange: 6000
		CameraRemoveDelay: 125
		PauseOnCondition: disabled
	SupportPowerChargeBar:
	RenderSprites:
		PlayerPalette: playerra2
		Image: tsntpuls

