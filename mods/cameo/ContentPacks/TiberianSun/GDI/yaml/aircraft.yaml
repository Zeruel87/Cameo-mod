ts_gdi_orcafighter:
	Inherits: ^Helicopter
	Inherits@Template: ^HelicopterTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^GDIRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@Voxel: ^TSRenderVoxel
	Inherits@TSProjectileImprovements: ^TSProjectileImprovements
	Inherits@CeramicArmor: ^CeramicArmor
	Inherits@FieldMaintenance: ^FieldMaintenance
	Inherits@SonicWeaponry: ^SonicWeaponry
	Tooltip:
		Name: Orca Fighter
	Valued:
		Cost: 2200
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 10
		Queue: Aircraft, RAAircraft
		Prerequisites: ~ts_gdi_helipad, ~!ts_gdi_promotion_zoneorca
		Description: Fast assault gunship with\ndual missile launchers.\n  Strong vs Aircraft, Vehicles
	Aircraft:
		Speed: 145
		TurnSpeed: 29
		TakeoffSounds: orcaup1.aud
		LandingSounds: orcadwn1.aud
		AltitudeVelocity: 128
		CanSlide: false
		TakeOffOnResupply: true
	Health:
		HP: 62500
	Repairable:
		HpPerStep: 3125
	ChangesHealth@SelfHealing:
		Step: 25
	Armament@PRIMARY:
		Weapon: TSHellfire
		LocalOffset: 0,0,0
		PauseOnCondition: !ammo
		RequiresCondition: !ts_gdi_upgrade_sonicweaponry
	Armament@Upgrade:
		Weapon: TSHellfireSonic
		LocalOffset: 0,0,0
		PauseOnCondition: !ammo
		RequiresCondition: ts_gdi_upgrade_sonicweaponry
	AttackAircraft:
		FacingTolerance: 80
		PersistentTargeting: false
		Voice: Attack
		PauseOnCondition: disabled
		AttackType: Hover
	-WithShadow:
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1536, 1536
	WithVoxelBody:
	Voiced:
		VoiceSet: TSHeli
	AmmoPool:
		Ammo: 4
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 64
		Count: 1
	SpawnActorOnDeath:
		Actor: ts_gdi_orcafighter_husk
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 4
	ActorStatValues:
		Upgrades: ts_gdi_upgrade_projectileimprovements, ts_gdi_upgrade_ceramicarmor, ts_gdi_upgrade_fieldmaintenance, ts_gdi_upgrade_sonicweaponry

