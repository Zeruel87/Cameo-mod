ts_gdi_orcafighter_husk:
	Inherits: ^PlaneHusk
	Inherits@Voxel: ^TSRenderVoxel
	Tooltip:
		Name: Orca Fighter
	Aircraft:
		TurnSpeed: 80
		Speed: 186
	RenderSprites:
		Image: ts_gdi_orcafighter
	RenderVoxels:
		Image: ts_gdi_orcafighter
	-WithShadow:
	-Cloak@TDcloak:
	-Cloak@TScloak:

ts_gdi_orcabomber_husk:
	Inherits: ^PlaneHusk
	Inherits@Voxel: ^TSRenderVoxel
	Tooltip:
		Name: Orca Bomber
	Aircraft:
		TurnSpeed: 40
		Speed: 96
	RevealsShroud:
		Range: 7c0
		Type: GroundPosition
	RenderSprites:
		Image: ts_gdi_orcabomber
	RenderVoxels:
		Image: ts_gdi_orcabomber
		Scale: 15
	-WithShadow:
	-Cloak@TDcloak:
	-Cloak@TScloak:

ts_gdi_kodiakcommandship_husk:
	Inherits: ^PlaneHusk
	Tooltip:
		Name: Kodiak Command Ship
	Aircraft:
		TurnSpeed: 15
		Speed: 30
	RenderSprites:
		Image: ts_gdi_kodiakcommandship
		PlayerPalette: playerra2
	FallsToEarth:
		Explosion: KirovExplode

