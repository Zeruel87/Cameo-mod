		Modifier: 50
		RequiresCondition: powerupgrade
	PowerMultiplier@powerupgrade:
		Modifier: 200
		RequiresCondition: powerupgrade
	Pluggable:
		Offset: 0,0
		Conditions:
			ts_gdi_powerplant: powerupgrade
		Requirements:
			ts_gdi_powerplant: !build-incomplete && !powerupgrade
