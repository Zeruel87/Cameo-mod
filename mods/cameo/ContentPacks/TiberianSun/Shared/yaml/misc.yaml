ts_sedan:
	Inherits: ^CivilianVehicle
	RenderSprites:
		Image: ts_sedan
		PlayerPalette: playerra2
	TransformOnCapture:
		IntoActor: ts_sedan_demo
		CaptureTypes: bombcar
	TransformOnCapture@driveby:
		IntoActor: ts_sedan_driveby
