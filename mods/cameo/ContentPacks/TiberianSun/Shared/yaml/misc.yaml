##############################################
#   Tiberian Sun Civilian Infantry
##############################################

^TSCivInfantry:
	Inherits: ^CivInfantry
	-WithDeathAnimation:
	-WithDeathAnimation@effect:
	WithDeathAnimation:
		DeathSequencePalette: playerra2
		DeathPaletteIsPlayerPalette: true
		DeathTypes:
			DefaultDeath: 1
			BulletDeath: 2
			RippedApartDeath: 2
			TiberiumDeath: 1
			RA2VirusDeath: 1
	WithDeathAnimation@EXPLOSION:
		DeathSequencePalette: tseffect
		DeathPaletteIsPlayerPalette: false
		DeathTypes:
			SmallExplosionDeath: 4
			ExplosionDeath: 4
	Crushable:
		CrushSound: squish6.aud
	RenderSprites:
		PlayerPalette: playerra2

ts_civ1:
	Inherits: ^TSCivInfantry
	Inherits@armed: ^ArmedCivilian
ts_civ2:
	Inherits: ^TSCivInfantry
	Inherits@armed: ^ArmedCivilian
ts_civ3:
	Inherits: ^TSCivInfantry
	Inherits@armed: ^ArmedCivilian

