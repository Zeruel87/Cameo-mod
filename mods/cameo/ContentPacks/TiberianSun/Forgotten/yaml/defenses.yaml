forgotten_silo:
	Inherits: ^BaseBuilding
	Inherits@shape: ^2x2Shape
	Inherits@sell: ^TSSpawnActorsOnSell
	Selectable:
		Bounds: 2048, 2048
	Valued:
		Cost: 300
	Tooltip:
		Name: actor_forgotten_silo.name
	ProvidesPrerequisite@buildingname:
	Buildable:
		BuildPaletteOrder: 100
		Queue: Defence, RADefence
		Description: actor_forgotten_silo.description
		Prerequisites: ~forgotten_constructionyard, forgotten_refinery
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Health:
		HP: 200000
	RevealsShroud:
		Range: 4c0
	Power:
		Amount: -10
	SelectionDecorations:
	StoresResources:
		Capacity: 3000
	WithResourceLevelOverlay@FILLSTAGE:
		RequiresCondition: !build-incomplete
		Sequence: stages
	WithSpriteBody:
		Sequence: idle-underlay
	MustBeDestroyed:
		RequiredForShortGame: false
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 8
	RenderSprites:
		PlayerPalette: player_rgba
		Image: forgot_silo
forgotten_veinhole:
	Inherits: ^BaseBuilding
	Inherits@sell: ^TSSpawnActorsOnSell
	Inherits@shape: ^2x2Shape
	Inherits@SW: ^PrimarySuperweapon
	Selectable:
		Bounds: 2048, 2048
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Buildable:
		Description: actor_forgotten_veinhole.description
		Queue: Defence, RADefence
		BuildPaletteOrder: 140
		Prerequisites: ~forgotten_constructionyard, forgotten_church, ~techlevel.superweapons, !forgotten_veinhole_swlimit
	Tooltip:
		Name: actor_forgotten_veinhole.name
	Armor:
		Type: Wood
	RevealsShroud:
		Range: 5c0
	Power:
		Amount: -150
	AttackFollow:
	# Armament@superweapon:
	# 	Name: superweapon
	# 	Weapon: TSTacticalMissile
	NukePowerCA:
		OrderName: NukePowerInfoOrder
		AllowMultiple: True
		PauseOnCondition: disabled
		Prerequisites:
			1: ~techlevel.superweapons
		Cursor: nuke
		Icons:
			1: abomb
		ChargeInterval: 10500
		Names:
			1: power_nuke.raname
		Descriptions:
			1: power_nuke.description
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		InsufficientPowerSpeechNotification: InsufficientPower
		EndChargeSpeechNotification: NuclearWeaponAvailable
		EndChargeTextNotification: Nuclear Missile ready.
		LaunchSpeechNotification: NuclearWeaponLaunched
		LaunchTextNotification: Warning: Nuclear Missile launched.
		IncomingSpeechNotification: NuclearWarheadApproaching
		IncomingTextNotification: Warning: Nuclear Missile launched.
		MissileWeapons:
			1: raatomic
		MissileDelay: 5
		SpawnOffset: 1c0,427,0
		DisplayTimerRelationships: Ally, Neutral, Enemy
		DisplayBeacon: True
		DisplayRadarPing: True
		BeaconPosters:
			1: atomic
		CameraRange: 10000
		CameraRemoveDelay: 125
		CircleRanges:
			1: 10000
		ArrowSequence: arrow
		ClockSequence: clocklarge
		CircleSequence: circles
		SupportPowerPaletteOrder: 70
		MissileImage: scatomic
		MissilePalette: greyscale
		BeaconActor: BLASTRADIUS.atomic
	# WithSupportPowerActivationOverlay@1:
