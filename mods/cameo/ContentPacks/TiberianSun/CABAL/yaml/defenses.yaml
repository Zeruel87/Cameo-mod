cabal_silo:
	Inherits: ^BaseBuilding
	Inherits@shape: ^2x2Shape
	Inherits@sell: ^CABALSpawnActorsOnSell
	Selectable:
		Bounds: 2048, 2048
	Valued:
		Cost: 150
	Tooltip:
		Name: Silo
	ProvidesPrerequisite@buildingname:
	Buildable:
		BuildPaletteOrder: 100
		Queue: Defence, RADefence
		Description: actor_cabal_silo.description
		Prerequisites: ~cabal_constructionyard, cabal_refinery
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Health:
		HP: 100000
	RevealsShroud:
		Range: 4c0
	Power:
		Amount: -8
	SelectionDecorations:
	WithIdleOverlay@LIGHTS:
		RequiresCondition: !build-incomplete
		Sequence: idle-lights
	StoresResources:
		Capacity: 8000
	WithResourceLevelOverlay@FILLSTAGE:
		RequiresCondition: !build-incomplete
		Sequence: stages
	WithSpriteBody:
		Sequence: idle-underlay
	MustBeDestroyed:
		RequiredForShortGame: false
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 5
	RenderSprites:
		PlayerPalette: playerra2
		Image: tsgtsilo.cabal

cabal_missilesilo:
	Inherits: ^BuildingPlug
	Tooltip:
		Name: CABAL Missile Silo
	Valued:
		Cost: 5000
	Buildable:
		Queue: BuildingAddons
		BuildPaletteOrder: 100
		BuildDuration: 1500
		BuildDurationModifier: 100
		Prerequisites: ~cabal_core, cabal_core, !cabalnuke_swlimit, ~techlevel.superweapons
		Description: actor_cabal_missilesilo.description
	Power:
		Amount: -100
	Plug:
		Type: cabalcore_silo
	RenderSprites:
		PlayerPalette: playerra2
		Image: tsgtsilo.cabal
cabal_stealthgenerator:
	Inherits: ^BaseBuilding
	Inherits@sell: ^CABALSpawnActorsOnSell
	Inherits@SHAPE: ^3x2Shape
	Inherits@cloak: ^CloakedVehicle
	Inherits@cloakanim: ^TiberiumCloakAnimation
	Valued:
		Cost: 2500
	Tooltip:
		Name: Stealth Generator
	Buildable:
		BuildLimit: 1
		Queue: Defence, RADefence
		BuildPaletteOrder: 170
		Prerequisites: ~cabal_constructionyard, cabal_techcenter
		Description: actor_cabal_stealthgenerator.description
	Building:
		Footprint: xxx xxx
		Dimensions: 3,2
	Health:
		HP: 100000
	Armor:
		Type: Concrete
	RevealsShroud:
		Range: 6c0
	Power:
		Amount: -125
	WithIdleOverlay@pulse:
		RequiresCondition: !disabled && !lowpower && !damaged
		Sequence: pulse
	WithIdleOverlay@pulse-damaged:
		RequiresCondition: !disabled && !lowpower && damaged
		Sequence: damaged-pulse
	ProximityExternalCondition@StealthGen:
		Range: 12c0
		Condition: tscloak
		EnableSound: cloak5.aud
		DisableSound: cloak5.aud
		RequiresCondition: !disabled && !lowpower
	ProvidesPrerequisite@buildingname:
	WithRangeCircle@GenRange:
		Range: 12c0
		RequiresCondition: !disabled
	RenderSprites:
		PlayerPalette: playerra2
		Image: cabal_stealthgenerator

cabal_heavycabalobelisk:
