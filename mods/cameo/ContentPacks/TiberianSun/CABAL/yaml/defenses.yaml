		BuildPaletteOrder: 60
		Prerequisites: ~cabal_constructionyard, cabal_techcenter
		Queue: Defence, RADefence
		Description: actor_cabal_heavycabalobelisk.description
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	SelectionDecorations:
	Health:
		HP: 300000
	RevealsShroud:
		Range: 7c0
