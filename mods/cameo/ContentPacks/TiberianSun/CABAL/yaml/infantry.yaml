cabal_engineer:
	Inherits: ^Soldier
	Inherits@selection: ^SelectableSupportUnit
	Inherits@anim: ^TSInfantry
	Inherits@Template: ^MechanicTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^CABALRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@Cyborg: ^TSCyborgs
	Inherits@CyberneticPlating: ^CabalUpgradeCyberneticPlating
	Inherits@OVERCHARGE: ^CabalUpgradeOverchargedServos
	Inherits@VehicleTurnRateInfantry: ^VehicleTurnRateInfantry
	Armor:
		Type: None
		-RequiresCondition:
	Armor@Secondary:
		Type: Scout
	Tooltip:
		Name: CABAL Engineer
	Buildable:
		Queue: Infantry, RAInfantry
		Prerequisites: ~cabal_cyborgfactory
		Description: actor_cabal_engineer.description
	Voiced:
		VoiceSet: TSCyborg
	-TemporaryOwnerManager:
	RenderSprites:
		PlayerPalette: playerra2
		Image: tscabalengi
	-TakeCover:
	-DamagedByTerrain:
	-SpawnActorOnDeath:
	Valued:
		Cost: 800
	Health:
		HP: 20000
	Mobile:
		TurnSpeed: 12
		Speed: 40
	ChangesHealth@SelfHealing:
		Step: 20
	Shielded:
		RequiresCondition: armored
		ShieldsUpCondition: armored
		SelectionBarColor: FFFF88FF
		InitialPercentageStrength: 100
		MaxPercentageStrength: 100
		DamageRegenDelay: 125
		RegenInterval: 1
		RegenAmount: 40
	Armament@REPAIRBEAM:
		Name: primary
		Weapon: CabalEngineerRepairBeam
		LocalOffset: 128,0,256
		TargetRelationships: Ally
		ForceTargetRelationships: None
		PauseOnCondition: !ammo
	AmmoPool:
		Ammo: 10
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 10
		Count: 1
		ResetOnFire: true
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
	Captures:
		CaptureTypes: building, tech
		PlayerExperience: 500
		CaptureDelay: 375
		ConsumedByCapture: False
		EnterCursor: ability
		EnterBlockedCursor: move-blocked
		Voice: Move

