cabal_manticore_backup:
	Inherits: cabal_manticore
	Valued:
		Cost: 1400
	Tooltip:
		Name: Manticore (Backup Mode)
	Buildable:
		BuildPaletteOrder: 30
		Prerequisites: ~cabal_mechfactory, ~disabled
		Queue: Disabled
		Description: HuskMode
	Mobile:
		Locomotor: wheeled
		TurnSpeed: 0
		Speed: 0
	Health:
		HP: 200000
	Repairable:
		HpPerStep: 1500
	ChangesHealth@SelfHealing:
		Step: 12
	Voiced:
		VoiceSet: TSCABALVehicles
	RenderSprites:
		PlayerPalette: playerra2
		Image: cabal_manticore
	WithFacingSpriteBody:
		Sequence: stand
	WithMoveAnimation:
		MoveSequence: walk
		ValidMovementTypes: Horizontal, Turn
	-SpawnActorOnDeath@backup:
	GrantPeriodicCondition@rebuild:
		Condition: buildingrebirth
		CooldownDuration: 40
		PauseOnCondition: chronobeamed
	TransformOnCondition@buildingrebirth:
		RequiresCondition: buildingrebirth
		IntoActor: cabal_manticore
		SkipMakeAnims: true
	WithColoredOverlay@backup:
		Color: 000000b4

