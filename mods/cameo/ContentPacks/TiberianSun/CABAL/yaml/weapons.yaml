## CABAL missile projectile family (3-way split). TS-authentic launch
## (near-vertical, replicating Shattered Paradise's 255 = 90 degrees) with a
## turn rate fast enough not to overshoot close targets (DESIGN 3), plus the
## purple smoke trail that carries the CABAL colour identity. Two variants:
## ^CabalMissileLight (fast/agile, no contrail — the default CABAL missile
## identity) and ^CabalMissileMedium (adds the orange Flak-style contrail,
## reserved for weapons that deliberately combine the missile with a
## flak/AA warhead, e.g. CabalAscendedRockets). Every CABAL missile weapon
## inherits its `@proj` LAST so these bespoke fields win.
^CabalMissileLight:
	Inherits: ^Projectile_Missile_Light
	Projectile: Missile
		MinimumLaunchAngle: 255
		MaximumLaunchAngle: 255
		HorizontalRateOfTurn: 80
		VerticalRateOfTurn: 80
		CruiseAltitude: 6000
		TerrainHeightAware: true
		TrailImage: cabal_rockettrail
		TrailInterval: 1

^CabalMissileMedium:
	Inherits: ^Projectile_Missile_Medium
	Projectile: Missile
		MinimumLaunchAngle: 255
		MaximumLaunchAngle: 255
		HorizontalRateOfTurn: 80
		VerticalRateOfTurn: 80
		CruiseAltitude: 6000
		TerrainHeightAware: true
		TrailImage: cabal_rockettrail
		TrailInterval: 1
		ContrailLength: 10
		ContrailZOffset: 4000
		ContrailStartColor: FF884400
		ContrailEndColor: 000000FF
		ContrailStartWidth: 50
		ContrailEndWidth: 100

^CabalMissileEffect:
	Warhead@Effect: CreateEffect
		Explosions: cabal_missileexplosion
		ImpactSounds: expnew12.aud
		ValidTargets: Ground, Ship, Air
	Warhead@EffectAir: CreateEffect
		Explosions: med_explosion_air
		ImpactSounds: xplos.aud
		ImpactActors: false
		ValidTargets: Air
	Warhead@EffectWater: CreateEffect
		Explosions: med_splash
		ImpactSounds: splash9.aud
		ValidTargets: Water, Underwater
		InvalidTargets: Ship, Structure, Bridge
	Warhead@ShieldHitEffect: CreateEffect
		ImpactSounds: shielded_shell_hit1.wav, shielded_shell_hit2.wav, shielded_shell_hit3.wav, shielded_shell_hit4.wav
		ValidTargets: Shielded

