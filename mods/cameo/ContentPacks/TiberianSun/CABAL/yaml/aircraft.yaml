cabal_hunterdronecarrier:
	Inherits: ^Helicopter
	Inherits@Template: ^SpaceshipTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^CABALRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@OVERCHARGE: ^CabalUpgradeOverchargedServos
	Valued:
		Cost: 4000
	Tooltip:
		Name: Hunter Drone Carrier
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~cabal_helipad, cabal_radar, ~cabal_promotion_hunterdronecarrier
		Queue: Aircraft, RAAircraft
		Description: actor_cabal_hunterdronecarrier.description
	Aircraft:
		Speed: 50
		TurnSpeed: 10
	Health:
		HP: 300000
	Repairable:
		HpPerStep: 15000
	ChangesHealth@SelfHealing:
		Step: 120
	CarrierMaster:
		ArmamentNames: primary
		Actors: cabal_orbdrone_slave, cabal_orbdrone_slave, cabal_orbdrone_slave
		RearmTicks: 25
		RespawnTicks: 75
		InstaRepair: true
		SlaveDisposalOnKill: KillSlaves
		SpawnAllAtOnce: false
	Armament@drones:
		Name: primary
		Weapon: CabalOverkillDroneLauncher
	Armament@charge:
		Name: charge
		Weapon: CabalOverkillCharge
		LocalOffset: 1500,0,-250
		PauseOnCondition: discharged
	Armament:
		Name: secondary
		Weapon: CabalOverkillLaser
		LocalOffset: 1500,0,-250
		PauseOnCondition: !charged
		ReloadingCondition: discharged
	AmmoPool:
		Armaments: secondary
		Ammo: 100
		InitialAmmo: 0
		AmmoCondition: charged
	ReloadAmmoPoolCA@charged:
		Count: 100
		Delay: 50
		RequiresCondition: charging
	ReloadAmmoPoolCA@discharge:
		Count: -1
		Delay: 1
		RequiresCondition: charged && !charging
	GrantConditionOnAttack@charged:
		Condition: charging
		RequiredShotsPerInstance: 1
		ArmamentNames: charge
		RevokeDelay: 50
		RevokeOnNewTarget: true
	WithAmmoPipsDecoration:
		PipCount: 10
		FullSequence: pip-red
		Position: BottomLeft
		RequiresSelection: true
	Turreted:
	AttackAircraft:
		Armaments: primary, secondary, charge
		Voice: Attack
		FacingTolerance: 40
		PauseOnCondition: disabled
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1536, 1536
	Voiced:
		VoiceSet: TSScrin
	DeathSounds:
		VolumeMultiplier: 2
	SpawnActorOnDeath:
		Actor: cabal_hunterdronecarrier_husk
	RenderSprites:
		Image: cabal_hunterdronecarrier
		PlayerPalette: player_rgba

