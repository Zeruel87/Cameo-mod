asianalliance_phoenix:
	Inherits: ^RANeutralPlane
	Inherits@reload: ^RearmableAircraft
	Inherits@Template: ^BomberTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@AsianPhalanxUpgrade: ^AsianPhalanxUpgrade
	Inherits@DragonFireUpgrades: ^DragonFireUpgrades
	Valued:
		Cost: 1800
	Tooltip:
		Name: Phoenix
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: ~asianalliance_asianairforcecommand, asianalliance_asianbattlelab
		Queue: Aircraft, RAAircraft
		Description: actor_aaphoenix.description
	Aircraft:
		CruiseAltitude: 2560
		TurnSpeed: 12
		Speed: 180
		IdleTurnSpeed: 10
		IdleSpeed: 125
		TakeoffSounds: vintupa.wav
		LandingSounds: vintdna.wav
		Voice: Move
	Health:
		HP: 90000
	Repairable:
		HpPerStep: 4500
	ChangesHealth@SelfHealing:
		Step: 36
	Armament@PRIMARY:
		Name: primary
		Weapon: AsianPhoenixRocket
		LocalOffset: 425,-250,-225, 425,250,-225, 425,-150,-225, 425,150,-225
		LocalYaw: 100, -100, 50, -50
		AmmoUsage: 2
		PauseOnCondition: !ammo
		RequiresCondition: !rank-elite
	Armament@PRIMARYELITE:
		Name: primary
		Weapon: AsianPhoenixRocket_elite
		LocalOffset: 425,-250,-225, 425,250,-225, 425,-150,-225, 425,150,-225
		LocalYaw: 100, -100, 50, -50
		AmmoUsage: 1
		PauseOnCondition: !ammo
		RequiresCondition: rank-elite
	AmmoPool:
		Ammo: 4
		ReloadDelay: 50
		AmmoCondition: ammo
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 2
	SpawnActorOnDeath:
		Actor: phoenix_husk.asian
	#GrantConditionOnMovement@Turn:
	#	Condition: Aircraft-Turning
	#	ValidMovementTypes: Turn
	#GrantConditionOnMovement@H:
	#	ValidMovementTypes: Horizontal
	#	Condition: Aircraft-Horizontal
	#GrantConditionOnMovement@V:
	#	ValidMovementTypes: Vertical
	#	Condition: Aircraft-Vertical
	WithMoveAnimation@Turn-L:
		MoveSequence: move-l
		ValidMovementTypes: Horizontal, Turn
	WithMoveAnimation@Turn-R:
		MoveSequence: move-r
		ValidMovementTypes: Vertical, Turn
	WithMoveAnimation:
		MoveSequence: move
	Contrail@1:
		Offset: -512,0,256
		TrailLength: 15
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1280, 1024
	Voiced:
		VoiceSet: CHMiGVoice
	AttackAircraft:
		Voice: Attack
		FacingTolerance: 80
	AttackMove:
		Voice: AttackMove
	DeathSounds:
	RenderSprites:
		PlayerPalette: playerra2
	ActorStatValues:
		Upgrades: asianalliance_upgrade_asiandiplomacy, asianalliance_doctrine_asianphalanx, asianalliance_upgrade_dragonfire

asianalliance_pelican:
	Inherits: ^Helicopter
	Inherits@Template: ^HelicopterTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@AsianPhalanxUpgrade: ^AsianPhalanxUpgrade
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 20
		Prerequisites: ~asianalliance_asianairforcecommand
		Description: actor_aapelican.description
	Valued:
		Cost: 2000
	Tooltip:
		Name: Pelican
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 40000
	Repairable:
		HpPerStep: 2000
	ChangesHealth@SelfHealing:
		Step: 16
	Armament@PRIMARY:
		Weapon: AsianPelicanMissile
		LocalOffset: 85,-213,-85, 85,213,-85
		MuzzleSequence: muzzle
		RequiresCondition: !rank-elite
		PauseOnCondition: ammo < 2
		AmmoUsage: 2
	Armament@PRIMARYELITE:
		Weapon: AsianPelicanMissile_elite
		LocalOffset: 85,-213,-85, 85,213,-85
		MuzzleSequence: muzzle
		RequiresCondition: rank-elite
		PauseOnCondition: ammo < 2
		AmmoUsage: 2
	Armament@MG:
		Weapon: AsianPelicanMG
		LocalOffset: 85,-213,-85, 85,213,-85
		MuzzleSequence: muzzle-mg
		MuzzlePalette: ra2effect
		PauseOnCondition: ammo < 2
		RequiresCondition: asianalliance_doctrine_asianphalanx && !rank-elite
	Armament@MGelite:
		Weapon: AsianPelicanMG_elite
		LocalOffset: 85,-213,-85, 85,213,-85
		MuzzleSequence: muzzle-mg
		MuzzlePalette: ra2effect
		PauseOnCondition: ammo < 2
		RequiresCondition: asianalliance_doctrine_asianphalanx && rank-elite
	ReloadAmmoDelayMultiplier@asianalliance_doctrine_asianphalanx:
		RequiresCondition: asianalliance_doctrine_asianphalanx
		Modifier: 50
	AttackAircraft:
		FacingTolerance: 80
		PersistentTargeting: false
		AttackType: Hover
	Aircraft:
		Speed: 125
		TurnSpeed: 25
	WithIdleOverlay@ROTORAIR:
		Sequence: rotor
		RequiresCondition: airborne
		PauseOnCondition: disabled
	WithIdleOverlay@ROTORGROUND:
		Sequence: slow-rotor
		RequiresCondition: !airborne
		PauseOnCondition: disabled
	SelectionDecorations:
	WithMuzzleOverlay:
	SpawnActorOnDeath:
		Actor: pelican_husk.asian
	LeavesTrails:
		Offsets: -427,0,0
		Image: smokey
		MovingInterval: 3
		StationaryInterval: 3
		SpawnAtLastPosition: False
		TrailWhileStationary: True
		Type: CenterPosition
		RequiresCondition: enable-smoke
	Selectable:
		DecorationBounds: 1280, 1280
	Voiced:
		VoiceSet: CHHelixVoice
	GrantConditionOnDamageState@SmokeTrail:
		Condition: enable-smoke
	AmmoPool:
		Ammo: 12
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 25
		Count: 1
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 6
	FireWarheadsOnDeath:
		Weapon: LargeHeliExplode
	RenderSprites:
		PlayerPalette: playerra2
	ActorStatValues:
		Upgrades: asianalliance_doctrine_asianphalanx

