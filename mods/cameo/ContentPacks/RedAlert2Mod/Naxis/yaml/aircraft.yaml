naxis_interceptor:
	Inherits: ^RANeutralPlane
	Inherits@Template: ^FighterTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Valued:
		Cost: 200
	Tooltip:
		Name: Interceptor
	Buildable:
		Description: template_carrier_slave.description
	Aircraft:
		AltitudeVelocity: 3000
		InitialFacing: 768
		TurnSpeed: 25
		IdleTurnSpeed: 25
		Speed: 160
		Repulsable: false
		MaximumPitch: 48
		TakeUpCellWhenLand: false
	Health:
		HP: 10000
	ChangesHealth@SelfHealing:
		Step: 4
	RevealsShroud:
		Range: 7500
		Type: GroundPosition
	Armament@PRIMARY:
		Name: primary
		Weapon: NaxiInterceptorGun
		LocalOffset: 400,-200,-200, 400,200,-200
		PauseOnCondition: !ammo
	Armament@Rockets:
		Name: primary
		Weapon: NaxInterceptorRockets
		LocalOffset: 425,-350,-225, 425,350,-225
		LocalYaw: 50, -50, 25, -25
		PauseOnCondition: !ammo
	FirepowerMultiplier@MultiWeapon:
		Modifier: 50
	AmmoPool:
		Ammo: 6
		AmmoCondition: ammo
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 6
	SpawnActorOnDeath:
		Actor: naxis_interceptor_husk
	WithMoveAnimation:
		MoveSequence: move
		Condition: !Aircraft-Turning
	AttackAircraft:
		FacingTolerance: 40
		PersistentTargeting: false
		RequiresCondition: ammo
	CarrierSlave:
		LandingDistance: 8000
	AutoTarget:
		InitialStanceAI: AttackAnything
		InitialStance: AttackAnything
	HasParent:
	-UpdatesPlayerStatistics:
	-ActorLostNotification:
	-MapEditorData:
	RejectsOrders:
	RenderSprites:
		PlayerPalette: playerra2
	GrantConditionOnMovement@Turn:
		Condition: Aircraft-Turning
		ValidMovementTypes: Turn
	GrantConditionOnMovement@H:
		ValidMovementTypes: Horizontal
		Condition: Aircraft-Horizontal
	GrantConditionOnMovement@V:
		ValidMovementTypes: Vertical
		Condition: Aircraft-Vertical
	WithMoveAnimation@Turn-L:
		MoveSequence: move-l
		RequiresCondition: Aircraft-Turning && Aircraft-Horizontal
	WithMoveAnimation@Turn-R:
		MoveSequence: move-r
		RequiresCondition: Aircraft-Turning && Aircraft-Vertical
	Contrail:
		Offset: -500,0,250
		TrailLength: 15
	-Voiced:

naxis_interceptor_husk:
	Inherits: ^PlaneHusk
	Tooltip:
		Name: Interceptor
	Aircraft:
		TurnSpeed: 20
		Speed: 160
	LeavesTrails:
		Offsets: -853,0,171
		MovingInterval: 1
		Image: smokey
		StationaryInterval: 1
		SpawnAtLastPosition: False
		TrailWhileStationary: True
		Type: CenterPosition
	RenderSprites:
		Image: naxis_interceptor
		PlayerPalette: playerra2
