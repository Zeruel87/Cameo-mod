futuretech_twister:
	Inherits: ^RANeutralPlane
	Inherits@Template: ^FighterTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@FutureTechEqualizerUpgrades: ^FutureTechEqualizerUpgrades
	Tooltip:
		Name: Twister
	Valued:
		Cost: 1000
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 100
		Prerequisites: ~futuretech_launchpad
		Queue: Aircraft, RAAircraft
		Description: actor_future_twister.description
	Aircraft:
		CruiseAltitude: 2560
		TurnSpeed: 10
		Speed: 150
		IdleTurnSpeed: 10
		IdleSpeed: 100
		TakeoffSounds: twisSounda.wav, twisSoundb.wav
		LandingSounds: twisSounda.wav, twisSoundb.wav
		CanHover: false
		CanSlide: false
		VTOL: true
		Voice: Move
	Health:
		HP: 50000
	Repairable:
		HpPerStep: 2500
	ChangesHealth@SelfHealing:
		Step: 50
	Armament@PRIMARY:
		Name: primary
		Weapon: SteelTwisterMissiles
		LocalOffset: 425,-250,-225, 425,250,-225, 425,-150,-225, 425,150,-225, 425,0,-225
		LocalYaw: 100, -100, 50, -50, 0
		PauseOnCondition: !ammo
		RequiresCondition: !rank-elite
	Armament@PRIMARYELITE:
		Name: primary
		Weapon: SteelTwisterMissiles_elite
		LocalOffset: 425,-250,-225, 425,250,-225, 425,-150,-225, 425,150,-225, 425,0,-225
		LocalYaw: 100, -100, 50, -50, 0
		PauseOnCondition: !ammo
		RequiresCondition: rank-elite
	AmmoPool:
		Ammo: 10
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 42
		Count: 1
	SpawnActorOnDeath:
		Actor: twister_husk.steel
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1280, 1024
	Contrail@1:
		Offset: -100,256,0
		TrailLength: 15
	Contrail@2:
		Offset: -100,-256,0
		TrailLength: 15
	Voiced:
		VoiceSet: SteelAircraftVoice
	DeathSounds:
	AttackAircraft:
		Voice: Attack
		FacingTolerance: 80
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
	RenderSprites:
		PlayerPalette: playerra2cons

futuretech_cryocopter:
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits: ^Helicopter
	Inherits@Template: ^HelicopterTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@FutureTechEqualizerUpgrades: ^FutureTechEqualizerUpgrades
	Inherits@gat: ^GatlingSpinUpUnitBehavior
	Buildable:
		Queue: Aircraft, RAAircraft, Vehicle, RAVehicle
		BuildPaletteOrder: 405
		Prerequisites: ~futuretech_warpgate, futuretech_battlelab, ~futuretech_promotion_cryocopter
		Description: actor_futuretech_cryo.description
	Valued:
		Cost: 900
	Tooltip:
		Name: Cryocopter
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 90000
	Repairable:
		HpPerStep: 4500
	ChangesHealth@SelfHealing:
		Step: 36
	Armament@Rocket:
		Name: secondary
		Weapon: Future_Cryocopter_Rocket
		LocalOffset: 85,-213,-85, 85,213,-85
		MuzzleSequence: muzzle
		AmmoUsage: 4
		PauseOnCondition: ammo < 4
	Armament@PRIMARY:
		Weapon: Future_Cryocopter_Cryo
		LocalOffset: 350,0,-85
		MuzzleSequence: muzzle
		AmmoUsage: 1
		PauseOnCondition: ammo < 4
	FirepowerMultiplier@Cryo:
		Modifier: 12
	AttackAircraft:
		FacingTolerance: 80
		PersistentTargeting: false
		AttackType: Hover
	Aircraft:
		Speed: 125
		TurnSpeed: 25
	WithMoveAnimation:
		MoveSequence: move
	SelectionDecorations:
	WithMuzzleOverlay:
	SpawnActorOnDeath:
		Actor: cryo_husk.futu
	LeavesTrails:
		Offsets: -427,0,0
		Image: smokey
		MovingInterval: 3
		StationaryInterval: 3
		SpawnAtLastPosition: False
		TrailWhileStationary: True
		Type: CenterPosition
		RequiresCondition: enable-smoke
	Selectable:
		DecorationBounds: 1280, 1280
	Voiced:
		VoiceSet: CHHelixVoice
	GrantConditionOnDamageState@SmokeTrail:
		Condition: enable-smoke
	AmmoPool:
		#Armaments: secondary
		Ammo: 32
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 8
		Count: 1
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 8
	ReloadAmmoDelayMultiplier@ammo:
		Modifier: 50
		RequiresCondition: ammo < 4
	FireWarheadsOnDeath:
		Weapon: LargeHeliExplode
	RenderSprites:
		PlayerPalette: player_rgba

cryo_husk.futu:
	Inherits: ^HelicopterHusk
	Tooltip:
		Name: Cryocopter
	Aircraft:
		TurnSpeed: 15
		Speed: 75
	RenderSprites:
		Image: futuretech_cryocopter
		PlayerPalette: player_rgba

