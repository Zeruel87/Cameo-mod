		LocalOffset: 800,320,250, 800,-320,250, 600,320,250, 600,-320,250, 400,320,250, 400,-320,250, 200,320,250, 200,-320,250
	FirepowerMultiplier@latinsyndicate_upgrade_asianalliancestolentechhotfire:
