latin_triton:
	Inherits: ^BoatUnit
	Inherits@effects: ^RA2Vehicle
	Inherits@Template: ^BattleShipTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@EMP: ^FrontalEMP
	Inherits@uprecover: ^LatinCashrecover
	Inherits@gat: ^GatlingSpinUpUnitBehavior
	Valued:
		Cost: 700
	Tooltip:
		Name: Triton Speedboat
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 30
		Prerequisites: ~latin_cgyard
		Queue: Naval, RANaval
		Description: actor_hyd.description
	Mobile:
		Speed: 125
		TurnSpeed: 50
	Health:
		HP: 37500
	ChangesHealth@SelfHealing:
		Step: 15
	Armor:
		Type: Light
	Armament@PRIMARY:
		Weapon: LatinSentryMG
		Recoil: 43
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		LocalOffset: 512,0,256
		RequiresCondition: !rank-elite
	Armament@ELITE:
		Weapon: LatinSentryMG_elite
		Recoil: 43
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		LocalOffset: 512,0,256
		RequiresCondition: rank-elite
	WithMuzzleOverlay:
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 0
	GrantConditionOnPrerequisite@latinsyndicate_upgrade_yuristolentechchainguns:
		Condition: latinsyndicate_upgrade_yuristolentechchainguns
		Prerequisites: latinsyndicate_upgrade_yuristolentechchainguns
	ReloadDelayMultiplier@gat1:
		Modifier: 50
		RequiresCondition: gatling == 1 && latinsyndicate_upgrade_yuristolentechchainguns
	ReloadDelayMultiplier@gat2:
		Modifier: 25
		RequiresCondition: gatling > 1 && latinsyndicate_upgrade_yuristolentechchainguns
	RangeMultiplier@gat1:
		Modifier: 111
		RequiresCondition: gatling == 1 && latinsyndicate_upgrade_yuristolentechchainguns
	RangeMultiplier@gat2:
		Modifier: 123
		RequiresCondition: gatling > 1 && latinsyndicate_upgrade_yuristolentechchainguns
	GrantConditionOnAttack@gatling:
		Condition: gatling
		RequiredShotsPerInstance: 3, 8
		RequiresCondition: !rank-elite && latinsyndicate_upgrade_yuristolentechchainguns
	GrantConditionOnAttack@elitegatling:
		Condition: gatling
		RequiredShotsPerInstance: 2, 4
		RequiresCondition: rank-elite && latinsyndicate_upgrade_yuristolentechchainguns
	Selectable:
		DecorationBounds: 1024, 1024
	Voiced:
		VoiceSet: LatinSoldierVoice
	ActorStatValues:
		Upgrades: latinsyndicate_upgrade_cashrecovery, latinsyndicate_upgrade_sovietstolentechindustrialmethods, latinsyndicate_upgrade_alliedstolentechextramissilesandmiraging, latinsyndicate_upgrade_yuristolentechchainguns
	RenderSprites:
		PlayerPalette: playerra2

