tkm_bunker:
	Inherits: ^Defense
	Inherits@Template: ^BunkerTemplate
	Inherits@exp: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetGround
	Inherits@EMP: ^DefenseTurretedEMP
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@shape: ^1x1Shape
	Inherits@gar: ^ClearableGarrison
	Valued:
		Cost: 600
	Tooltip:
		Name: TKM Bunker
	Buildable:
		BuildPaletteOrder: 40
		Prerequisites: ~tkm_constructionyard, tkm_barracks
		Queue: Defence, RADefence
		Description: template_anti_infantry_defense.description
	Building:
	Health:
		HP: 120000
	WithBuildingBib:
		HasMinibib: true
	Cargo:
		Types: Infantry, Hacker, Fremen
		MaxWeight: 4
		EjectOnDeath: false
	Armament:
		Weapon: tkmbunkmg
		LocalOffset: 256,0,256
		MuzzleSequence: muzzle
		RequiresCondition: !td_gdi_upgrade_armorpiercingbullets
	Armament@Upgrade:
		Weapon: HighVAP
		LocalOffset: 256,0,256
		MuzzleSequence: muzzle
		RequiresCondition: td_gdi_upgrade_armorpiercingbullets
	AttackOpenTopped:
		Armaments: garrisoned
		PortOffsets: 300,400,200, -400,500,200, 300,-400,200, -400,-500,200
		PauseOnCondition: chronobeamed
	AttackTurreted:
		RequiresCondition: !build-incomplete
	BodyOrientation:
		QuantizedFacings: 8
	WithCargoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
	WithMuzzleOverlay:
	Turreted:
		TurnSpeed: 1023
	RevealsShroud:
		Range: 7496
	RenderSprites:
		PlayerPalette: player_rgba

