tkmratflakdeployed:
	Inherits: ^Defense
	Inherits@Template: ^BasicDefenseTemplate
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@exp: ^GainsExperienceRA2
	Inherits@AntiAirTemplate: ^AntiAirDefenseTemplate
	Inherits@AUTOTARGET: ^AutoTargetAir
	Inherits@EMP: ^DefenseTurretedEMP
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@shape: ^1x1Shape
	Valued:
		Cost: 1600
	Tooltip:
		Name: Flak Bus (Deployed)
	-Buildable:
	Building:
	Health:
		HP: 120000
	ChangesHealth@SelfHealing:
		Step: 10
	WithBuildingBib:
		HasMinibib: true
	Armament:
		Weapon: FlakbusAA
		LocalOffset: 256,0,256
		MuzzleSequence: muzzle
	Transforms:
		IntoActor: tkm_flakbus
		Offset: 0,0
		TransformSounds: tsplace2.aud
		NoTransformNotification: BuildingCannotPlaceAudio
		Facing: 100
	Armor:
		Type: Heavy
	AttackTurreted:
		RequiresCondition: !build-incomplete
		PauseOnCondition: disabled
	BodyOrientation:
		QuantizedFacings: 8
	WithMuzzleOverlay:
	WithMakeAnimation:
	Turreted:
		TurnSpeed: 40
		Offset: 0,445,-15
		InitialFacing: 640
	WithSpriteBody:
	WithSpriteTurret:
		RequiresCondition: !build-incomplete
	ActorStatValues:
		Upgrades: tkm_upgrade_heavytitanplating
	DamageMultiplier:
		Modifier: 75
		RequiresCondition: tkm_upgrade_heavytitanplating
	GrantConditionOnPrerequisite@tkm_upgrade_titanarsenalupgrade:
		Condition: tkm_upgrade_heavytitanplating
		Prerequisites: tkm_upgrade_heavytitanplating
	RevealsShroud:
		Range: 6720
	RenderSprites:
		PlayerPalette: player_rgba
		Image: tkmratflakdeployed
