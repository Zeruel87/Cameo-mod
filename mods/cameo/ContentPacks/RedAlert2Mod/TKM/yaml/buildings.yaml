tkm_constructionyard:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x2Shape
	Inherits@conyard: ^Conyard
	Inherits@sell: ^TKMSpawnActorsOnSell
	Tooltip:
		Name: TKM Construction Yard
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	Selectable:
		Bounds: 3072, 2048
	SelectionDecorations:
	Transforms:
		IntoActor: tkm_mobileconstructionvehicletkm
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@wirefence:
		Prerequisite: wirefence
	Production@Upgrades:
		Produces: Upgrades
	ProductionBar@Upgrades:
		ProductionType: Upgrades
	Targetable@TechStealerInfiltrate:
		TargetTypes: TechStealerInfiltrate
	ActorStatValues:
		Upgrades: tkm_upgrade_berezkaarsenalupgrade,  tkm_upgrade_titanarsenalupgrade, tkm_upgrade_natoarsenalupgrade
	WithBuildingPlacedOverlay@Front:
		Sequence: idle-front
	RenderSprites:
		PlayerPalette: playerra2

#######################################
# TKM Buildings
#######################################
tkm_powerplant:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x3Shape
	Inherits@power: ^PowerPlant
	Inherits@storage: ^StoresResources
	Tooltip:
		Name: Power Plant
	Valued:
		Cost: 400
	Power:
		Amount: 200
	ProvidesPrerequisite@buildingname:
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~tkm_constructionyard
		Queue: Building, RABuilding
		Description: Provides supply and stores resources
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 250,-512,0
	Health:
		HP: 100000
	RevealsShroud:
		Range: 4c0
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
		FullSequence: pip-yellow
	RenderSprites:
		PlayerPalette: playerra2
tkm_orerefinery:
	Inherits: ^RA2Building
	Inherits@sell: ^TKMSpawnActorsOnSell
	Inherits@ref: ^Refinery
	Inherits@shape: ^2x2Shape
	Inherits@plug: ^BuildingPlugProducer
	Tooltip:
		Name: TKM Ore Refinery
	Buildable:
		BuildPaletteOrder: 11
		Prerequisites: ~tkm_constructionyard, tkm_powerplant
		Description: Processes ore into credits.
	Building:
		Footprint: xxx= xxx= xxx=
		Dimensions: 4,3
	Refinery:
	DockHost:
		Type: Unload
		DockAngle: 640
		DockOffset: 1086,1086,0
	DrawLineToTarget:
	FreeActor:
		Actor: tkm_templateharvesterraname
		SpawnOffset: 2,2
		Facing: 256
	SelectionDecorations:
	GivesBuildableArea:
		AreaTypes: building, cityi
	CashTrickler@refineryupg:
		RequiresCondition: refineryupg
		Interval: 50
		Amount: 25
		ShowTicks: True
	ProvidesPrerequisite:
		Prerequisite: tkmrefineryupgradeavailable
		RequiresCondition: !refineryupg
	Pluggable:
		Offset: 1,0
		Conditions:
			tkm_orerefinery: refineryupg
		Requirements:
			tkm_orerefinery: !build-incomplete && !refineryupg
	SlaveMinerSpawnerMaster:
		PauseOnCondition: !refineryupg
		Actors: tkmworker, tkmworker, tkmworker, tkmworker, tkmworker
		SlavesHaveFreeWill: true
		SlaveDisposalOnKill: GiveSlavesToAttacker
		SlaveDisposalOnOwnerChange: GiveSlavesToAttacker
		SpawnOffset: 511,511,0, 511,511,0, 511,511,0, 511,511,0
	RenderSprites:
		PlayerPalette: player_rgba
tkm_supportlabor:
	Inherits: ^BuildingPlug
	Tooltip:
		Name: TKM Support Labor
	Valued:
		Cost: 2500
	Buildable:
		Queue: BuildingAddons
		Prerequisites: ~tkm_constructionyard, tkmrefineryupgradeavailable
		Description: The Refinery spawns workers and passive income.
	Plug:
		Type: tkm_orerefinery
	RenderSprites:
		Image: tkm_orerefinery
