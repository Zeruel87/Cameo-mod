schwarzermond_lunarsoldier_rifle:
	Inherits@finalmain: ^Compatibility_Laser_HeavyFlat
	Inherits: ^Warhead_Bullet_Medium
	Inherits@2: NaxiRifle
	Inherits@3: ^RA2LaserWeapon
	# SF VERIFIER weapon (maintainer 2026-07-20): SmallArms + Chaingun +
	# Laser triad, 4000 each = 12000 @ reload 50 = 240 DPS (WC 1.0), exactly
	# 2x the japan baseline (6000@50, 120). Range 6000, air-capable.
	# W24: Bullet_Light + Bullet_Medium collapsed to Bullet_Medium 16000.
	ReloadDelay: 50
	Range: 6000
	Report: vpriatta.wav
	ValidTargets: Ground, Water, Air
	Projectile: Bullet
		ContrailStartColor: ff2d2d
		ContrailEndColor: f55105
		Width: 25
	Warhead@Bullet_Medium:
		PercentageScale: 5000
		Damage: 16000
		ValidTargets: Ground, Water, Air
	Warhead@Laser_Heavy:
		PercentageScale: 5000
		Damage: 8000
		ValidTargets: Ground, Water, Air
	-Warhead@Bullet_Light:
	-Warhead@Bullet_Medium:
	-Warhead@Laser_Heavy:
	Warhead@Laser_HeavyFlatCompatibility:
		ValidTargets: Ground, Water, Air
		Damage: 24000
		PercentageScale: 4996
		PhysicalStateScale: 25
schwarzermond_lunarsoldier_rifle_elite:
	Inherits: schwarzermond_lunarsoldier_rifle
	Range: 5500
	Burst: 2
	BurstDelays: 3
	Warhead@Laser_HeavyFlatCompatibility:
