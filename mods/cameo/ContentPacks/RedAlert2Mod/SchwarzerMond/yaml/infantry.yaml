schwarzermond_lunarsoldier:
	Inherits: ^Soldier
	Inherits@Crypto: ^NaxiCryptofascism
	Inherits@Alloys: ^NaxiLunarAlloys
	Inherits@Propaganda: ^NaxiMoonPropaganda
	Inherits@LUpgrade: ^NaxiCrystalLens
	Inherits@LUpgrade2: ^NaxiAmplifiedLens
	Inherits@Template: ^SpecialForcesInfantryTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^RA2Infantry
	Inherits@vo: ^AttackFrontalVoice
	Inherits@VrilInfusion: ^NaxiVrilInfusion
	# ^NaxiVrilInfusion is inherited LAST, so its Shielded gate would overwrite the
	# stealth-suit term this unit alone gets from ^RA2YuriStealthSuits and quietly kill
	# that shield. RequiresCondition is a scalar — it cannot be appended to — so the only
	# way to keep both paths is to restate the whole expression here, on the actor, where
	# it wins over every template.
	Shielded:
		RequiresCondition: !disabled && (schwarzermond_upgrade_vrilinfusion || yuri_upgrade_infantrystealthsuits || shieldgen || shielded)
	# SPECIAL-FORCES VERIFIER (Formula v2, maintainer 2026-07-20): the
	# Tier-1 clean tripwire (no tech penalty, no specials — the moon-
	# propaganda is a RECEIVED upgrade buff, not an aura). Exactly 2x the
	# japan baseline — 30000 HP (2x 15000), 50 speed & 6000 range (same),
	# SmallArms+Chaingun+Laser triad 12000 @ reload 50 = 240 DPS (2x 120),
	# cost 500 (2.5x 200). Must resolve to 500.00. This makes SM's basic
	# infantry very strong on purpose — flagged for in-game testing.
	Valued:
		Cost: 500
	Tooltip:
		Name: Lunar Soldier
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~schwarzermond_barracks
		Queue: Infantry, RAInfantry
		Description: template_scout_infantry.description
	Mobile:
		Speed: 50
	Health:
		HP: 30000
	ChangesHealth@SelfHealing:
		Step: 30
	DamageMultiplier@ScoutInfantryBuff:
		Modifier: 100
	FirepowerMultiplier@ScoutInfantryBuff:
		Modifier: 100
	FirepowerMultiplier@schwarzermond_lunarsoldier:
		Modifier: 100
	Armament@PRIMARY:
		Weapon: schwarzermond_lunarsoldier_rifle
		LocalOffset: 500,0,400
		RequiresCondition: !rank-elite && !schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@ELITE:
		Weapon: schwarzermond_lunarsoldier_rifle_elite
		LocalOffset: 500,0,400
		RequiresCondition: rank-elite && !schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@PRIMARY_UP:
		Weapon: schwarzermond_lunarsoldier_rifle_yellow
		LocalOffset: 500,0,400
		RequiresCondition: !rank-elite && schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@ELITE_UP:
		Weapon: schwarzermond_lunarsoldier_rifle_yellow_elite
		LocalOffset: 500,0,400
		RequiresCondition: rank-elite && schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@PRIMARY_AMP:
		Weapon: schwarzermond_lunarsoldier_rifle_amplified
		LocalOffset: 500,0,400
		RequiresCondition: !rank-elite && schwarzermond_upgrade_amplifiedlens
	Armament@ELITE_AMP:
		Weapon: schwarzermond_lunarsoldier_rifle_amplified_elite
		LocalOffset: 500,0,400
		RequiresCondition: rank-elite && schwarzermond_upgrade_amplifiedlens
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: schwarzermond_lunarsoldier_rifle
		RequiresCondition: !rank-elite && !schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@GARRISONEDELITE:
		Name: garrisoned
		Weapon: schwarzermond_lunarsoldier_rifle_elite
		RequiresCondition: rank-elite && !schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@GARRISONED_UP:
