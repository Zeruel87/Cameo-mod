	Inherits@Propaganda: ^NaxiMoonPropaganda
	Inherits@Template: ^HeavyInfantryTemplate
	Inherits@anim: ^RA2Vehicle
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@detect: ^GenericGroundDetector
	Inherits@vo: ^AttackFrontalVoice
	Inherits@EMP: ^FrontalEMP
	Inherits@MC: ^MCImmune
	Inherits@HackableRobot: ^HackableRobot
	Inherits@LUpgrade: ^NaxiCrystalLens
	Inherits@LUpgrade2: ^NaxiAmplifiedLens
	Inherits@VrilInfusion: ^NaxiVrilInfusion
	Selectable:
		Bounds: 600, 600, 0, -125
	Valued:
		Cost: 500
	Tooltip:
		Name: Noid MG Armor
	Buildable:
		BuildPaletteOrder: 75
		Prerequisites: ~schwarzermond_barracks, schwarzermond_radar, ~schwarzermond_promotion_noidmg
		Queue: Infantry, RAInfantry
		Description: actor_aamecha.description
	Mobile:
		Speed: 40
		TurnSpeed: 16
		Locomotor: tracked
	Health:
		HP: 50000
	Repairable:
		HpPerStep: 2500
	ChangesHealth@SelfHealing:
		Step: 50
	# W21 layer stack, R5: while the plating holds, BOTH armors are enabled and the
	# warhead AVERAGES them (AreaDamage.MultiArmorCombination) — so anti-infantry fire
	# is never useless against a plated walker and AP fire is never oppressive. Once
	# the bar is stripped only the body armor is left. NEVER let two armors multiply.
	Armor:                      # body — always on
		Type: Plate
	Armor@Plating:              # averaged with the body while the plating bar holds
		Type: Superheavy
		RequiresCondition: plating_up && !shielded
	ArmorPlating:
		MaxPercentageStrength: 50
		PercentageRegenAmount: 1
		RegenInterval: 25
		RampTicks: 125
		FullCondition: plating_up
	Armament@PRIMARY:
		Weapon: NaxiMP40Laser
		LocalOffset: 500,0,400
		RequiresCondition: !rank-elite && !schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@ELITE:
		Weapon: NaxiMP40Laser_elite
		LocalOffset: 500,0,400
		RequiresCondition: rank-elite && !schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@PRIMARY_UP:
		Weapon: Lunar_YellowMP40Laser
		LocalOffset: 500,0,400
		RequiresCondition: !rank-elite && schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@ELITE_UP:
		Weapon: Lunar_YellowMP40Laser_elite
		LocalOffset: 500,0,400
		RequiresCondition: rank-elite && schwarzermond_upgrade_crystallens && !schwarzermond_upgrade_amplifiedlens
	Armament@PRIMARY_AMP:
		Weapon: Lunar_AmplifiedMP40Laser
		LocalOffset: 500,0,400
		RequiresCondition: !rank-elite && schwarzermond_upgrade_amplifiedlens
	Armament@ELITE_AMP:
		Weapon: Lunar_AmplifiedMP40Laser_elite
		LocalOffset: 500,0,400
		RequiresCondition: rank-elite && schwarzermond_upgrade_amplifiedlens
	AttackFrontal:
		FacingTolerance: 20
	WithInfantryBody:
		IdleSequences: idle1, idle2
		MinIdleDelay: 90
		MaxIdleDelay: 270
		DefaultAttackSequence: shoot
	BodyOrientation:
		QuantizedFacings: 32
	-QuantizeFacingsFromSequence:
	Passenger:
	Voiced:
		VoiceSet: NaxiRobotVoice
	RenderSprites:
		PlayerPalette: playerra2
