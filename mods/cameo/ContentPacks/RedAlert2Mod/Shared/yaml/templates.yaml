		InitialDelay: 0
		CloakDelay: 75
		CloakedCondition: underwater
		PauseOnCondition: disabled
		IsPlayerPalette: true
		CloakSound: vnavupa.wav
		UncloakSound: vnavupa.wav
		RequiresCondition: in_water
	Targetable@water:
		TargetTypes: Water, Ship, Submarine
		RequiresCondition: in_water
	Building:
		TerrainTypes: Clear,ClearTemperat,ClearWinter,ClearJungle,ClearSnow,ClearDesert,Road,Concrete,ClearDune,Water
	SpawnActorsOnSell@in_water:
		ActorTypes: steelconsortium_hoverboardgrenadier, steelconsortium_hoverboardgrenadier, steelconsortium_manta
		RequiresCondition: in_water
	GrantConditionOnTerrain@Water:
		TerrainTypes: Water
		Condition: in_water

