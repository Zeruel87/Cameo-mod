steelconsortium_stalker:
	Inherits: ^Tank
	Inherits@Template: ^HeroInfantryTemplate
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@anim: ^RA2Vehicle
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@announce: ^AnnounceGlobal
	Inherits@vo: ^AttackFrontalVoice
	Inherits@EMP: ^FrontalEMP
	Inherits@MC: ^MCImmune
	Inherits@shield: ^HasShieldGenerator
	Inherits@SteelConsortiumNaniteInfusion: ^SteelConsortiumNaniteInfusion
	Inherits@SteelConsortiumFerrocrete: ^SteelConsortiumFerrocrete
	Inherits@quantum: ^QuantumWeaponsEMP
	Valued:
		Cost: 4000
	Tooltip:
		Name: Stalker
	Buildable:
		BuildPaletteOrder: 75
		Prerequisites: ~steelconsortium_consortiumwarfactory, steelconsortium_consortiumbattlelab, ~steelconsortium_promotion_stalker
		Queue: Vehicle, RAVehicle
		Description: actor_steel_stalker.description
	Mobile:
		Locomotor: hover
		Speed: 80
		TurnSpeed: 32
	Health:
		HP: 140000
	# Repairable:
	# 	HpPerStep: 6875
	ChangesHealth@SelfHealing:
		Step: 140
	# DamageMultiplier@shielded removed with its parent (W26/R1) — see the note on
	# steelconsortium_whiterabbit below; `Modifier` is [FieldLoader.Require], so a bare
	# override left behind is a boot crash, not a no-op.
	Armor:
		RequiresCondition: shieldpermanent
	Armor@shielded:
		RequiresCondition: shieldpermanent
	Armor@Medium:
		Type: Medium
	Shielded:
		MaxPercentageStrength: 200
		InitialPercentageStrength: 200
		DamageRegenDelay: 125
		RegenAmount: 280
		RegenInterval: 1
		ShieldsUpCondition: shielded
		RequiresCondition: !disabled
		SelectionBarColor: 8888FFFF
	Armament:
		Weapon: SteelStalkerRailgun
		LocalOffset: 900,300,500
		RequiresCondition: !rank-elite && !steelconsortium_upgrade_quantumweaponpower
	Armament@Upgrade:
		Weapon: SteelStalkerRailgun_EMP
		LocalOffset: 900,300,500
		RequiresCondition: !rank-elite && steelconsortium_upgrade_quantumweaponpower
	Armament@elite:
		Weapon: SteelStalkerRailgun_elite
		LocalOffset: 900,300,500
		RequiresCondition: rank-elite
	FirepowerMultiplier@steelconsortium_upgrade_quantumweaponpower:
		Modifier: 125
		RequiresCondition: steelconsortium_upgrade_quantumweaponpower
	AttackFrontal:
		FacingTolerance: 10
	WithInfantryBody:
		IdleSequences: idle
		MinIdleDelay: 1
		MaxIdleDelay: 2
		DefaultAttackSequence: shoot
	BodyOrientation:
		QuantizedFacings: 32
	-QuantizeFacingsFromSequence:
	Passenger:
	Selectable:
		Bounds: 1536, 1536
		DecorationBounds: 1280, 1280
	Voiced:
		VoiceSet: SteelStalkerVoice
		Volume: 5
	RenderSprites:
		PlayerPalette: player_rgba
	DeathSounds:
	ActorStatValues:
		Upgrades: steelconsortium_upgrade_naniteinfusion, steelconsortium_upgrade_ferrocretecurtain, steelconsortium_upgrade_quantumweaponpower, steelconsortium_upgrade_shieldresistance

steelconsortium_whiterabbit:
	Inherits: ^Tank
	Inherits@Template: ^HeroInfantryTemplate
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@anim: ^RA2Vehicle
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@vo: ^AttackFrontalVoice
	Inherits@EMP: ^FrontalEMP
	Inherits@MC: ^MCImmune
	Inherits@UpGat: ^GatlingSpinUpUnitBehavior
	Inherits@shield: ^HasShieldGenerator
	Inherits@SteelConsortiumPulseWeapons: ^SteelConsortiumPulseWeapons
	Inherits@SteelConsortiumNaniteInfusion: ^SteelConsortiumNaniteInfusion
	Inherits@SteelConsortiumFerrocrete: ^SteelConsortiumFerrocrete
	Valued:
		Cost: 4500
	Tooltip:
		Name: White Rabbit
	Buildable:
		BuildPaletteOrder: 75
		Prerequisites: ~steelconsortium_consortiumwarfactory, steelconsortium_consortiumbattlelab, ~steelconsortium_promotion_whiterabbit
		Queue: Vehicle, RAVehicle
		Description: actor_steel_white_rabbit.description
	Mobile:
		Locomotor: hover
		Speed: 50
		TurnSpeed: 20
	Targetable@Hover:
		TargetTypes: Water, Ship
	Health:
		HP: 150000
	# Repairable:
	# 	HpPerStep: 7500
	ChangesHealth@SelfHealing:
		Step: 150
	# DamageMultiplier@shielded removed with its parent (W26/R1). It only widened the
	# condition to drop `&& !shieldpermanent` and inherited Modifier: 150 — and `Modifier` is
	# [FieldLoader.Require], so leaving this override behind would CRASH THE BOOT with a
	# missing-required-field error the moment the template block went away.
	Armor:
		RequiresCondition: shieldpermanent
	Armor@shielded:
		RequiresCondition: shieldpermanent
	Armor@Heavy:
		Type: Heavy
	Shielded:
		MaxPercentageStrength: 200
		InitialPercentageStrength: 200
		DamageRegenDelay: 125
		RegenAmount: 300
		RegenInterval: 1
		ShieldsUpCondition: shielded
		RequiresCondition: !disabled
		SelectionBarColor: 8888FFFF
	Armament@1:
		Weapon: WhiteRabbitGatling
		LocalOffset: 750,250,250
	AttackFrontal:
		FacingTolerance: 10
	GrantConditionOnAttack@attack-animation:
		Condition: attack-animation
		MaximumInstances: 1
		RevokeDelay: 12
	WithInfantryBody:
		IdleSequences: idle1, idle2, idle3
		MinIdleDelay: 25
		MaxIdleDelay: 75
		RequiresCondition: !attack-animation
	WithFacingSpriteBody@attack-animation:
		StartSequence: shoot-ready
		Sequence: shoot-loop
		RequiresCondition: attack-animation
	BodyOrientation:
		QuantizedFacings: 32
	-QuantizeFacingsFromSequence:
	Passenger:
	Selectable:
		Bounds: 1536, 1536
		DecorationBounds: 1280, 1920, 0, 256
	Voiced:
		VoiceSet: SteelTCUVoice
	RenderSprites:
		PlayerPalette: playerra
	DeathSounds:
	WithDeathAnimation:
	ActorStatValues:
		Upgrades: steelconsortium_upgrade_pulseweapons, steelconsortium_upgrade_naniteinfusion, steelconsortium_upgrade_ferrocretecurtain, steelconsortium_upgrade_shieldresistance

