	Armament@UpgradeDEPLOYEDELITE:
		Name: deployed
		Weapon: SteelInfRailgun_EMP_elite
		Turret: deploy
		LocalOffset: 384,64,384
		RequiresCondition: deployed && rank-elite && steelconsortium_upgrade_quantumweaponpower
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: SteelInfRailgun
		RequiresCondition: !rank-elite && !steelconsortium_upgrade_quantumweaponpower
	Armament@GARRISONEDELITE:
		Name: garrisoned
		Weapon: SteelInfRailgun_elite
		RequiresCondition: rank-elite && !steelconsortium_upgrade_quantumweaponpower
	Armament@UpgradeGARRISONED:
		Name: garrisoned
		Weapon: SteelInfRailgun_EMP
		RequiresCondition: !rank-elite && steelconsortium_upgrade_quantumweaponpower
	Armament@UpgradeGARRISONEDELITE:
		Name: garrisoned
		Weapon: SteelInfRailgun_EMP_elite
		RequiresCondition: rank-elite && steelconsortium_upgrade_quantumweaponpower
	AttackFrontal:
		Armaments: primary, targeting
		RequiresCondition: undeployed
		FacingTolerance: 2
	AttackTurreted@deployed:
		Armaments: deployed
		Turrets: deploy
		PauseOnCondition: disabled
		RequiresCondition: deployed
		Voice: Attack
	Turreted:
		Turret: deploy
		RealignDelay: -1
		TurnSpeed: 1023
		InitialFacing: 368
	WithSpriteTurret@idle:
		Turret: deploy
		Sequence: deployed
		RequiresCondition: deployed && !animate-turret
	WithSpriteTurret@animated:
		Turret: deploy
		Sequence: shoot-deployed
		RequiresCondition: deployed && animate-turret
	WithSpriteBody:
		Sequence: dot
		Name: dot
		RequiresCondition: !undeployed
	GrantConditionOnAttack:
		Condition: animate-turret
		RevokeDelay: 5
		ArmamentNames: deployed
	WithInfantryBody:
		-DefaultAttackSequence:
		AttackSequences:
			primary: shoot
		RequiresCondition: undeployed
	WithMakeAnimation:
		Sequence: deploy
		BodyNames: dot
	GrantConditionOnDeploy:
		Facing: 384
		DeploySounds: iggidepa.wav
		UndeploySounds: iggidepa.wav
		RequiresCondition: !parachute
		Voice: Deploy
	Crushable:
		RequiresCondition: undeployed
	Crushable@deployed:
		CrushClasses: vehicle
		RequiresCondition: !undeployed
	Voiced:
		VoiceSet: SteelSentinelVoice
	QuantizeFacingsFromSequence:
		Sequence: stand
	RenderSprites:
		PlayerPalette: playerra2cons
	ActorStatValues:
		Upgrades: steelconsortium_upgrade_naniteinfusion, steelconsortium_upgrade_quantumweaponpower, steelconsortium_upgrade_shieldresistance
	# DEPLOYING ADDS THE STEEL DEFENCE ARMOUR ON TOP OF THE UNIT'S OWN CLASS ARMOUR.
	# Maintainer 2026-08-22: *"activate the steel armor type on deploy but keep the underlying
	# regular armor intact and then create the average between them"* — a deployed unit is a
	# static defence, and Steel is what defences wear.
	#
	# Both traits stay ENABLED together, which is the whole point:
	# `AreaDamageWarhead.MultiArmorCombination` defaults to `Average`, so the class row and the
	# Steel row meet in the middle instead of one replacing the other. Gating the class armour
	# on `undeployed` — what the defence rig, siege tank and matador used to do — makes Steel a
	# REPLACEMENT and throws the unit's own class away.
	#
	# ⚠ Averaging only happens for warheads routing through AreaDamage (62.9% of the tree).
	# The legacy inline-Versus SpreadDamage nodes still MULTIPLY, and under multiplication the
	# class row cancels out entirely (the ratio becomes just Steel/100) — so those weapons see a
	# flatter effect than designed until item A5 retires them onto ^Warhead_* templates.
	Armor@deployed:
		Type: Steel
		RequiresCondition: !shielded && deployed

