# Map/editor-ready visual foundation. Production, weapons, abilities, and final
# gameplay values are intentionally deferred with the rest of the Scrin roster.

^ScrinVehicleVisual:
	Inherits: ^Vehicle
	Inherits@materialization: ^ScrinFactoryMaterialization
	Health:
		HP: 100000
	Armor:
		Type: Heavy
	Mobile:
		Locomotor: wheeled
		Speed: 50
		TurnSpeed: 8
		PauseOnCondition: disabled || materializing
		Voice: Move
	DeathSounds:
	Selectable:
		Bounds: 1024, 1024
	-Voiced:

^ScrinHoverVisual:
	Inherits: ^ScrinVehicleVisual
	Mobile:
		Locomotor: hover

scrin_explorer:
	Inherits: ^ScrinHoverVisual
	Voiced:
		VoiceSet: ScrinExplorerVoice
	Tooltip:
		Name: actor_scrin_explorer.name
	Buildable:
		Queue: ScrinVehicle, ScrinAdvancedVehicle
		BuildPaletteOrder: 10
		Prerequisites: scrin_reactor, scrin_extractor
		Icon: icon
		IconPalette: player_rgba
		IconPaletteIsPlayerPalette: true
		Description: Deploys into a Scrin Outpost.
	Valued:
		Cost: 800
	Health:
		HP: 50000
	Transforms:
		IntoActor: scrin_outpost
	RenderSprites:
		PlayerPalette: scrin_explorer_player

