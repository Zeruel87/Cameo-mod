# Map/editor-ready visual foundation. Production roles, weapons, abilities, and
# final gameplay values are intentionally deferred with the rest of the roster.

^ScrinInfantryVisual:
	Inherits: ^DefaultInfantry
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@materialization: ^ScrinFactoryMaterialization
	WithActorMaterialization:
		LockFacing: false
	Health:
		HP: 10000
	Mobile:
		Speed: 50
		Voice: Move
	WithInfantryBody:
		IdleSequences: stand
		StandSequences: stand
		DefaultAttackSequence: stand
	-WithDeathAnimation:
	-Voiced:

scrin_disintegrator:
	Inherits: ^ScrinInfantryVisual
	Voiced:
		VoiceSet: ScrinDisintegratorVoice
	Tooltip:
		Name: actor_scrin_disintegrator.name
	Buildable:
		Queue: ScrinInfantry
		BuildPaletteOrder: 10
		Prerequisites: ~scrin_portal
		Icon: icon
		IconPalette: player_rgba
		IconPaletteIsPlayerPalette: true
		Description: Basic ranged infantry.
	Valued:
		Cost: 200
	Health:
		HP: 15000
	Armament:
		Weapon: ScrinDisintegratorBeam
		LocalOffset: 252,35,227
	AttackFrontal:
		FacingTolerance: 64
		Voice: Attack
		PauseOnCondition: disabled
	RenderSprites:
		PlayerPalette: scrin_disintegrator_player

scrin_assimilator:
	Inherits: ^ScrinInfantryVisual
	Inherits@engineer: ^EngineerDefaultWeapons
	Inherits@isengineer: ^IsEngineer
	Voiced:
		VoiceSet: ScrinAssimilatorVoice
	Tooltip:
		Name: actor_scrin_assimilator.name
	Buildable:
		Queue: ScrinInfantry
		BuildPaletteOrder: 20
		Prerequisites: ~scrin_portal
		Icon: icon
		IconPalette: player_rgba
		IconPaletteIsPlayerPalette: true
		Description: Captures and repairs structures.
	Valued:
		Cost: 500
	Health:
		HP: 5000
	Passenger:
		CustomPipType: engineer
	Garrisoner:
		CustomPipType: engineer
	InstantlyRepairs:
		Types: building
		EnterBehaviour: Dispose
	InstantlyRepairs@Tech:
		Types: tech
		EnterBehaviour: Dispose
	RepairsBridges:
		EnterBehaviour: Exit
	CaptureManager:
	Captures:
		CaptureTypes: building, defense, tech
		PlayerExperience: 500
		ConsumedByCapture: true
	AttackFrontal:
		FacingTolerance: 0
		PauseOnCondition: disabled
	Selectable:
		Priority: 5
	RenderSprites:
		PlayerPalette: scrin_assimilator_player

