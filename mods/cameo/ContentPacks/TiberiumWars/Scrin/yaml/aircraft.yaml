	WithIdleOverlay@shield_damage:
		Sequence: capital-mobile-standard
		Offset: 0,0,853
	Tooltip:
		Name: actor_scrin_mothership.name
	Buildable:
		Queue: ScrinWarpAircraft
		BuildAtProductionType: ScrinCapitalAircraft
		BuildPaletteOrder: 50
		Prerequisites: ~scrin_warp_chasm, scrin_technology_assembler, scrin_signal_transmitter
		BuildLimit: 1
		Icon: icon
		IconPalette: player_rgba
