# Structures-and-defenses foundation. These actors are available to maps and the
# editor, but stay outside production until the Drone Ship, weapons, and the rest
# of the faction exist.

^Scrin3x1Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1536, -512
			BottomRight: 1536, 512
	Selectable:
		Bounds: 3072, 1024

# Standard base-building lifecycle without borrowing faction-specific TD/RA art.
# Scrin structures can be placed, repaired, captured, and sold like other bases;
# procedural materialization replaces baked make/deconstruction sequences.
^ScrinBuilding:
	Inherits: ^BaseBuilding
	DeathSounds:
	-WithMakeAnimation:
	-WithDeathAnimation:
	Building:
		TerrainTypes: Clear,ClearTemperat,ClearWinter,ClearJungle,ClearSnow,ClearDesert,Road,Concrete,ClearDune
		BuildSounds: scrin_building_placed.wav
	ProvidesPrerequisite@buildingname:

^ScrinDefense:
	Inherits: ^ScrinBuilding
	Inherits@defense: ^BasicDefense
	-GivesBuildableArea:
	-CommandBarBlacklist:
	-AcceptsDeliveredCash:

^ScrinAuthenticBuildup:
	WithMakeAnimation:
		Condition: build-incomplete
	WithMakeOverlay@AURORA:
		Sequence: aurora-make
		Palette: effect

scrin_drone_platform:
	Inherits: ^ScrinBuilding
	Voiced:
		VoiceSet: ScrinDronePlatformVoice
	Inherits@conyard: ^Conyard
	Inherits@shape: ^3x3Shape
	-Buildable:
	Tooltip:
		Name: actor_scrin_drone_platform.name
	Building:
		Dimensions: 3,3
		Footprint: _x_ xxx _x_
		LocalCenterOffset: 0,0,0
		TerrainTypes: Clear,ClearTemperat,ClearWinter,ClearJungle,ClearSnow,ClearDesert,Road,Concrete,ClearDune
	RenderSprites:
		PlayerPalette: player_rgba
	WithMakeAnimation:
	BaseBuilding:
	BaseProvider:
		Range: 15c0
	Production@NORMAL:
		Produces: Building, Defence
		RequiresCondition: !(classicproductionqueues || hybridproductionqueues)
	Production@CLASSICPRODUCTIONQUEUES:
		Produces: RABuilding, RADefence
		RequiresCondition: classicproductionqueues || hybridproductionqueues
	ProductionQueue@Building:
		Type: Building
		DisplayOrder: 0
		Group: Building
		LowPowerModifier: 200
		ReadyAudio: ConstructionComplete
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		InfiniteBuildLimit: 10
	ProductionBar@BUILDING:
		ProductionType: Building
		RequiresCondition: !(classicproductionqueues || hybridproductionqueues)
	ProductionBar@RABUILDING:
		ProductionType: RABuilding
		RequiresCondition: classicproductionqueues || hybridproductionqueues
	ProvidesPrerequisite@buildingname:
	Transforms:
		-RequiresCondition:
		-PauseOnCondition:
		IntoActor: scrin_drone_ship
		Offset: 1,1
		Facing: 480
		NoTransformNotification: BuildingCannotPlaceAudio
	-TransformsIntoMobile:
	-TransformsIntoPassenger:
	-TransformsIntoRepairable:
	-TransferTimedExternalConditionOnTransform:
	-GrantConditionOnPrerequisite@GLOBALFACTUNDEPLOY:

