ScrinRiftInit:
	ValidTargets: Ground, Water
	Projectile: InstantExplode
	# Match Cameo's nuclear terrain distortion radius and strength, but keep its
	# fade bounded to the Rift's ten-second lifetime.
	Warhead@Distortion: HeatDistortion
		# Keep the refraction concentrated tightly inside the visible orb.
		RadiusScale: 0.5
		StrengthScale: 2.0
		# 0.5 s fade-in + 9 s steady hold + 0.5 s fade-out.
		FadeFrames: 60
		FadeInFrames: 30
		HoldFrames: 540
	Warhead@Spawn: SpawnActor
		Actors: scrin_rift_weapon_effect
		Range: 1
		ForceGround: true
		ValidTargets: Ground, Water
		ImpactActors: false

ScrinRiftShockwavePulse:
	ReloadDelay: 250
	Burst: 15
	# PeriodicExplosion adds one tick: alternate 17/18 ticks (0.68/0.72 s)
	# for a 0.7 s average throughout the unchanged ten-second lifetime.
	BurstDelays: 16, 17, 16, 17, 16, 17, 16, 17, 16, 17, 16, 17, 16, 17
	Warhead@InverseShockwave: Shockwave
		# Cameo's active renderer has a 500 px base radius. Terrain uses 48 px
		# tiles, so 0.768 starts the ring at 384 px = 8 tiles.
		RadiusScale: 0.768
		StrengthScale: 1.0
		Reverse: true
		ReverseEndRadiusFraction: 0
		FadeFrames: 60
		FadeInFrames: 6

# DAMAGE-ONLY companion to the Rift's shockwave pulse. It inherits the resolved
# RedAlert Allied Chrono Vortex reference (ra1_allies_chronovortex) so every damage
# warhead - AreaDamage @Magic_HeavyFlatCompatibility, both AreaDamagePercentage
# warheads, DamagesConcrete - is identical to the reference, including friendly
# fire, targets, radii, falloff, Versus and percentages.
# Every NON-damage warhead the reference chain carries is cancelled, so the Rift
# deals damage and nothing else: no freezing (PhysicalStateCryo1..12), no smudges,
# no effect explosions, no impact sounds and no shield-hit condition.
ScrinRiftDamage:
	Inherits@roleflat: ^Warhead_Magic_Heavy
	Inherits@fx_cover: ^Effect_Concussion_Heavy
	ReloadDelay: 5
	Range: 1250
