		MaximumLaunchSpeed: 333
		MinimumLaunchSpeed: 333
		ContrailLength: 33
		ContrailStartColor: 77CCFF
		ContrailEndColorUsePlayerColor: true
		ContrailEndColor: FFFFFF
		Blockable: false
	Report: ra1_shared_sounds|rift1.aud, ra1_shared_sounds|rift2.aud, ra1_shared_sounds|rift3.aud
