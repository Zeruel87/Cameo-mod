ra1_allies_alliedapc:
	Inherits: ^Tank
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@EMP: ^TurretEMP
	Inherits@cargo: ^CargoVehicle
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@botmicro: ^BotAutoDeployTransport
	Inherits@AdvancedRadarSystems: ^AdvancedRadarSystems
	Inherits@LaserTargetingSystems: ^LaserTargetingSystems
	Inherits@ChronoArmor: ^ChronoArmor
	Valued:
		Cost: 1300
	Tooltip:
		Name: Allied APC
	Buildable:
		Queue: Vehicle, RAVehicle
		BuildPaletteOrder: 120
		Prerequisites: ~ra1_allies_alliedbarracks, ~!ra1_allies_promotion_phasetransport
		Description: actor_apc.description
	Mobile:
		Speed: 105
		TurnSpeed: 21
	Health:
		HP: 50000
	Repairable:
		HpPerStep: 2500
	ChangesHealth@SelfHealing:
		Step: 20
	Armor:
		Type: Medium
	Turreted:
		TurnSpeed: 21
	Armament@PRIMARY:
		Weapon: APCGunAllies
		Recoil: 48
		RecoilRecovery: 18
		LocalOffset: 85,85,299, 85,-85,299
		MuzzleSequence: muzzle
	Armament@SECONDARY:
		Name: secondary
		Weapon: APCGunAllies_AA
		Recoil: 48
		RecoilRecovery: 18
		LocalOffset: 85,85,299, 85,-85,299
		MuzzleSequence: muzzle
	AttackTurreted:
	WithMuzzleOverlay:
	WithSpriteTurret:
	Cargo:
		Types: Infantry, Hacker, Fremen
		MaxWeight: 5
		InitialUnits: ra1_allies_rifleinfantry, ra1_allies_rifleinfantry, ra1_allies_medic, ra1_allies_alliedrocketsoldier, ra1_allies_alliedrocketsoldier
	RenderSprites:
		Image: ra1_allies_alliedapc
	Voiced:
		VoiceSet: RAVehicleVoice
	FireWarheadsOnDeath:
		Weapon: UnitExplode
	Selectable:
		Class: ra1_allies_alliedapc
	ActorStatValues:
		Upgrades: ra1_allies_upgrade_advancedradarsystems, ra1_allies_upgrade_lasertargetingsystems, ra1_allies_upgrade_chronoarmor, ra1_allies_upgrade_gpssatellitesupport

