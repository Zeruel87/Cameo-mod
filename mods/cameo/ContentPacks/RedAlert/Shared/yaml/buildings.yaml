ra1_powerplant:
	Inherits: ^BaseBuilding
	Inherits@power: ^PowerPlant
	Inherits@sell: ^RASpawnActorsOnSell
	Inherits@shape: ^2x2Shape
	Inherits@ReinforcedStructures: ^ReinforcedStructures
	HitShape:
		UseTargetableCellsOffsets: false
		TargetableOffsets: 0,0,0, 640,-384,0, 640,512,0, -710,-512,0, -710,512,0
	Buildable:
		Queue: Building, RABuilding
		BuildPaletteOrder: 10
		Prerequisites: ~rafact
		Description: actor_nuke.description
	Valued:
		Cost: 500
	Tooltip:
		Name: Power Plant
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 125000 #40000
	Armor:
		Type: Wood
	RevealsShroud:
		Range: 4c0
	WithBuildingBib:
	Power:
		Amount: 150
	ScalePowerWithHealth:
	WithDeathAnimation:
		DeathSequence: dead
		UseDeathTypeSuffix: false
		DeathSequencePalette: raplayer
	ProvidesPrerequisite@buildingname:
	RenderSprites:
		PlayerPalette: raplayer

