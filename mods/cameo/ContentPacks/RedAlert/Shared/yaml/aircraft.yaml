ra1_soviets_spyplane:
	Inherits: ^AirstrikePlane
	Inherits@HeavyArmorDoctrineRA1: ^HeavyArmorDoctrineRA1
	Inherits@Afterburners: ^AfterburnersUpgradeRA1
	Inherits@StaliniumTeamUpgradeRA1: ^StaliniumTeamUpgradeRA1
	Tooltip:
		Name: Spy Plane
	Valued:
		Cost: 5000
	Health:
		HP: 100000
	Armor:
		Type: Bomber
	Aircraft:
		CruiseAltitude: 2560
		TurnSpeed: 20
		Speed: 300
		Repulsable: False
		MaximumPitch: 25
	AttackBomber:
		FacingTolerance: 32
	Selectable:
	SelectionDecorations:
	# -Voiced:
	# -Targetable@AIRBORNE:
	Contrail@1:
		Offset: -725,683,0
	Contrail@2:
		Offset: -725,-683,0
	SpawnActorOnDeath:
		Actor: U2.Husk
	Armament:
		Weapon: SpyPlaneTargeting
	ParaDrop:
		DropRange: 5c0
		ChuteSound: chute1.aud
	Cargo:
		MaxWeight: 25
	LeavesTrails:
		Offsets: -1c43,0,0
		MovingInterval: 2
		Image: smokey
		StationaryInterval: 2
		SpawnAtLastPosition: False
		TrailWhileStationary: True
		Type: CenterPosition
		RequiresCondition: enable-smoke
	RejectsOrders:
	GivesExperience:
	DynamicSpeedMultiplier:
	GrantConditionOnDamageState@SmokeTrail:
		Condition: enable-smoke
	RenderSprites:
		Image: ra1_soviets_spyplane
		PlayerPalette: raplayer
	ActorStatValues:
		Upgrades: ra1_soviets_doctrine_heavyarmordoctrine, ra1_soviets_upgrade_afterburners, ra1_soviets_upgrade_stalinium

ra1_soviets_superspyplane:
	Inherits: ra1_soviets_spyplane
	Armament:
		Weapon: SpyPlaneTargeting2

