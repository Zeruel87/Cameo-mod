ra1_soviets_rifleinfantry:
	Inherits: ^RA1AlliesRifleInfantry
	Inherits@IncendiaryBulletsUpgradeRA1: ^IncendiaryBulletsUpgradeRA1
	Inherits@SuperOpticsPromotionRA1: ^SuperOpticsPromotionRA1
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	# Formula v2 scout conversion (2026-07-19): unique classic-rifle
	# character at the original cost 100; O/P/Q priced via the scout
	# anchor; class knobs neutralized (2x-health bake); burst flavor
	# trimmed to formula DPS by the unit-named multiplier.
	Mobile:
		Speed: 54
	Health:
		HP: 34000
	ChangesHealth@SelfHealing:
		Step: 34
	DamageMultiplier@ScoutInfantryBuff:
		Modifier: 100
	FirepowerMultiplier@ScoutInfantryBuff:
		Modifier: 100
	FirepowerMultiplier@ra1_soviets_rifleinfantry:
		Modifier: 42
	Buildable:
		Prerequisites: ~ra1_soviets_sovietbarracks, ~!ra1_soviets_doctrine_conscriptiondoctrine
		Description: Basic infantry unit.\n  Strong vs Infantry\n  Weak vs Vehicles
	Armament@PRIMARY:
		Weapon: ra1_soviets_rifleinfantry_carbine
		LocalOffset: 128,0,256
		RequiresCondition: !ra1_soviets_upgrade_incendiarybullets
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: ra1_soviets_rifleinfantry_carbine
		MuzzleSequence: garrison-muzzle
		RequiresCondition: !ra1_soviets_upgrade_incendiarybullets
	Armament@Upgrade:
		Weapon: ra1_soviets_rifleinfantry_carbine_incendiary
		LocalOffset: 128,0,256
		RequiresCondition: ra1_soviets_upgrade_incendiarybullets
	Armament@UpgradeGARRISONED:
		Name: garrisoned
		Weapon: ra1_soviets_rifleinfantry_carbine_incendiary
		MuzzleSequence: garrison-muzzle
		RequiresCondition: ra1_soviets_upgrade_incendiarybullets
	Voiced:
		VoiceSet: RussianVoice
	ActorStatValues:
		Upgrades: ra1_soviets_promotion_infantrysuperoptics, ra1_soviets_doctrine_conscriptiondoctrine, ra1_soviets_upgrade_incendiarybullets, ra1_soviets_upgrade_menofsteel

