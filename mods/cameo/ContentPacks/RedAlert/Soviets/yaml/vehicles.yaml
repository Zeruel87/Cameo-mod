ra1_soviets_v1rockettruck:
	Inherits: ^Tank
	Inherits@Template: ^ArtilleryTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@EMP: ^FrontalEMP
	Inherits@InfernoDoctrineRA1: ^InfernoDoctrineRA1
	Inherits@HeavyArmorDoctrineRA1: ^HeavyArmorDoctrineRA1
	Inherits@NuclearWarDoctrineRA1: ^NuclearWarDoctrineRA1
	Inherits@UnstableIsotopesUpgradeRA1: ^UnstableIsotopesUpgradeRA1
	Valued:
		Cost: 850
	Tooltip:
		Name: V1 Rocket Truck
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 70
		Prerequisites: ~ra1_soviets_warfactory, ra1_soviets_radardome, ~!ra1_soviets_doctrine_heavyarmor
		Queue: Vehicle, RAVehicle
		Description: actor_v1truck.description
	Mobile:
		Speed: 100
		TurnSpeed: 20
	Health:
		HP: 25000
	Repairable:
		HpPerStep: 1250
	ChangesHealth@SelfHealing:
		Step: 10
	Turreted:
		TurnSpeed: 20
		#Offset: -128,0,128
		RealignDelay: 0
	Armament:
		Weapon: v1rockets
		LocalOffset: -512,256,256, -512,128,256, -512,-128,256, -512,-256,256
		MuzzleSequence: muzzle
		RequiresCondition: !ra1_soviets_upgrade_scorchedearth
	Armament@Upgrade:
		Weapon: v1rocketsThermobaric
		LocalOffset: -512,256,256, -512,128,256, -512,-128,256, -512,-256,256
		MuzzleSequence: muzzle
		RequiresCondition: ra1_soviets_upgrade_scorchedearth
	AmmoPool:
		Ammo: 4
		AmmoCondition: ammo
	Voiced:
		VoiceSet: RussianVehicleVoice
	WithMuzzleOverlay:
	WithSpriteTurret@FourMissiles:
		RequiresCondition: ammo == 4
		Sequence: turret4
	WithSpriteTurret@ThreeMissiles:
		RequiresCondition: ammo == 3
		Sequence: turret3
	WithSpriteTurret@TwoMissiles:
		RequiresCondition: ammo == 2
		Sequence: turret2
	WithSpriteTurret@OneMissile:
		RequiresCondition: ammo == 1
		Sequence: turret1
	WithSpriteTurret@NoMissiles:
		RequiresCondition: !ammo
		Sequence: turret0
	FireWarheadsOnDeath:
		Weapon: v1rockets
		RequiresCondition: !ra1_soviets_upgrade_scorchedearth
	FireWarheadsOnDeath@Upgrade:
		Weapon: v1rocketsThermobaric
		RequiresCondition: ra1_soviets_upgrade_scorchedearth
	ReloadAmmoPool:
		Delay: 25
		Count: 1
	Selectable:
		DecorationBounds: 1280, 1280
	ActorStatValues:
		Upgrades: ra1_soviets_doctrine_inferno, ra1_soviets_doctrine_heavyarmor, ra1_soviets_doctrine_nuclearwar, ra1_soviets_upgrade_unstableisotopes, ra1_soviets_upgrade_scorchedearth

