ra1_soviets_sovietconstructionyard:
	Inherits: ^RAFACT
	Tooltip:
		Name: Soviet Construction Yard
	Transforms:
		IntoActor: ra1_soviets_sovietmobileconstructionvehicle
	ProvidesPrerequisite@wirefence:
		Prerequisite: wirefence

ra1_soviets_sovietbarracks:
	Inherits: ^BaseBuilding
	Inherits@shape: ^2x2Shape
	Inherits@sell: ^RASovietSpawnActorsOnSell
	Inherits@ra1_soviets_sovietbarracks: ^IsBarrack
	Inherits@conscription: ^Conscription
	Buildable:
		Prerequisites: ~ra1_soviets_sovietconstructionyard, ra1_powerplant
		Description: Trains infantry units.
	Tooltip:
		Name: Soviet Barracks
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	WithBuildingBib:
	RallyPoint:
	Exit@1:
		SpawnOffset: -170,810,0
		ExitCell: 1,2
	Exit@2:
		SpawnOffset: -725,640,0
		ExitCell: 0,2
	ProvidesPrerequisite:
		Prerequisite: rabarracks
	RenderSprites:
		PlayerPalette: raplayer
	WithDeathAnimation:
		DeathSequencePalette: raplayer

ra1_soviets_sovietorerefinery:
	Inherits: ^RAPROC
	Inherits@sell: ^RASovietSpawnActorsOnSell
	GrantConditionOnPrerequisite@Normal:
		Condition: normalharvester
		Prerequisites: !ra1_soviets_doctrine_industrialefficiencydoctrine
	GrantConditionOnPrerequisite@Industrial:
		Condition: industrialminer
		Prerequisites: ra1_soviets_doctrine_industrialefficiencydoctrine
	FreeActor@Normal:
		Actor: ra1_soviets_sovietoretruck
		SpawnOffset: 1,2
		Facing: 256
		RequiresCondition: normalharvester
	FreeActor@Industrial:
		Actor: ra1_soviets_sovietheavyindustrialminer
		SpawnOffset: 1,2
		Facing: 256
		RequiresCondition: industrialminer
	Tooltip:
		Name: Soviet Ore Refinery
	RenderSprites:
		Image: raproc
	Buildable:
		Prerequisites: ~ra1_soviets_sovietconstructionyard, ra1_powerplant
		Description: Processes ore into credits.
	ProvidesPrerequisite@buildingname:
	ActorStatValues:
		Upgrades: ra1_soviets_doctrine_industrialefficiencydoctrine, ra1_soviets_upgrade_wareconomy

ra1_soviets_sovietwarfactory:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x2Shape
	Inherits@sell: ^RASovietSpawnActorsOnSell
	Inherits@td_gdi_weaponsfactory: ^IsWeaponFactory
	Buildable:
		Queue: Building, RABuilding
		Prerequisites: ~ra1_soviets_sovietconstructionyard, ra1_soviets_sovietorerefinery, ~!ra1_soviets_doctrine_industrialefficiencydoctrine
		Description: template_factory.description
	Tooltip:
		Name: Soviet War Factory
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	WithBuildingBib:
	WithProductionDoorOverlay:
		RequiresCondition: !build-incomplete
		Sequence: build-top
	RallyPoint:
	Exit@1:
		SpawnOffset: 213,-128,0
		ExitCell: 1,2
	ProvidesPrerequisite:
		Prerequisite: vehicleproduction
	RenderSprites:
		PlayerPalette: raplayer
	WithDeathAnimation:
		DeathSequencePalette: raplayer

ra1_soviets_sovietlargefactory:
	Inherits: ra1_soviets_sovietwarfactory
	Inherits@shape: ^4x3Shape
	Buildable:
		Prerequisites: ~ra1_soviets_sovietconstructionyard, ra1_soviets_sovietorerefinery, ~ra1_soviets_doctrine_industrialefficiencydoctrine
		BuildDuration: 750
		BuildDurationModifier: 100
		Description: template_factory.description
	Tooltip:
		Name: Soviet Large Factory
	Valued:
		Cost: 3000
	Health:
		HP: 600000
	Power:
		Amount: -60
	RevealsShroud:
		Range: 10000
	Building:
		Footprint: xxxx xxxx xxxx ====
		Dimensions: 4,4
		LocalCenterOffset: 0,0,0
	ProductionQueue@VEHICLE:
		BuildDurationModifier: 50
	Exit@1:
		SpawnOffset: 256,512,0
		ExitCell: 2,3
	WithIdleOverlay@smoke1:
		Offset: 250,-750,1250
		Sequence: smoke
		RequiresCondition: !build-incomplete
	WithIdleOverlay@smoke2:
		Offset: 0,-500,1500
		Sequence: smoke
		RequiresCondition: !build-incomplete
	RenderSprites:
		PlayerPalette: raplayer
	WithDeathAnimation:
		DeathSequencePalette: raplayer
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@inherits:
		Prerequisite: ra1_soviets_sovietwarfactory

ra1_soviets_sovietradardome:
	Inherits: ^BaseBuilding
	Inherits@radar: ^RadarBuilding
	Inherits@dome: ^Dome
	Inherits@sell: ^RASovietSpawnActorsOnSell
	Tooltip:
		Name: Soviet Radar Dome
	Buildable:
		Prerequisites: ~ra1_soviets_sovietconstructionyard, ra1_soviets_sovietorerefinery
		Description: Provides radar coverage of the battlefield.
	Production@Upgrades:
		Produces: Upgrades
	ProductionBar@Upgrades:
		ProductionType: Upgrades

ra1_soviets_sovietairfield:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x2Shape
	Inherits@sell: ^RASovietSpawnActorsOnSell
