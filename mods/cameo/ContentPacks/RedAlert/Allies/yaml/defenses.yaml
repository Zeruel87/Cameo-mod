ra1_allies_chronosphere:
	Inherits: ^BaseBuilding
	Inherits@shape: ^2x2Shape
	Inherits@SW: ^PrimarySuperweapon
	Inherits@ReinforcedStructures: ^ReinforcedStructures
	Inherits@sell: ^RASpawnActorsOnSell
	Buildable:
		Queue: Defence, RADefence
		Prerequisites: ~ra1_allies_alliedtechcenter, ~techlevel.superweapons, !ra1_allies_chronosphere_swlimit
		Description: actor_pdox.description
	Tooltip:
		Name: Chronosphere
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		BuildSounds: placbldg.aud, build5.aud
	WithBuildingBib:
		HasMinibib: true
	RA2ChronoshiftPower@chronoshift:
		OrderName: Chronoshift
		AllowMultiple: true
		Prerequisites:
			1: !botplayer, ~techlevel.superweapons
		PauseOnCondition: disabled
		Icons:
			1: chrono
		ChargeInterval: 4500
		Names:
			1: power_chronoshift.name
		Descriptions:
			1: power_chronoshift.description
		Dimensions:
			1: 5,5
		Footprints:
			1: __x__ _xxx_ xxxxx _xxx_ __x__
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		#BeginChargeSpeechNotification: ChronosphereCharging
		#EndChargeSpeechNotification: ChronosphereReady
		EndChargeSound: schropen.wav
		Durations:
			1: -1
		KillCargo: False
		AllowImpassable: true
		DisplayRadarPing: True
		SelectionCursor: ability
		TargetCursor: ability
		LaunchSound: schrmov.wav
		IncomingSound: schrmov.wav
		Range: 4000
		ShowTargetCircle: true
		TargetCircleColor: b6f4ff
		ImpactWeapon: ChronoshiftImpact
		TeleportWeapon: ChronoshiftImpact
		DisplayTimerRelationships: Ally, Neutral, Enemy
	DetonateWeaponPower@ChronoReinforcements:
		OrderName: ChronoReinforcements
		AllowMultiple: true
		Cost: 1000
		Prerequisites:
			1: ra1_allies_upgrade_chronoarmor, ~techlevel.superweapons
		PauseOnCondition: disabled
		Icons:
			1: chronoreinforcements
		Cursor: ability
		ChargeInterval: 6000
		Names:
			1: Chrono Reinforcements
		ActivationDelay: 25
		ActivationSequence:
		Descriptions:
			1: Teleports a small taskforce to a specified location.
		Weapons:
			1: ChronoReinforcementsSpawner
		CameraActor: camera.placeholderhack
		CameraRemoveDelay: 0
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		DisplayRadarPing: True
		LaunchSound: chrono2.aud
		IncomingSound: chrono2.aud
	# AI always has its own fake chronoshift power separate from upgrades purchased.
	DetonateWeaponPower@ChronoAI:
		OrderName: ChronoshiftAI
		AllowMultiple: true
		Prerequisites:
			1: botplayer, ~techlevel.superweapons
		PauseOnCondition: disabled
		Icons:
			1: chrono
		Cursor: ability
		ChargeInterval: 4500
		Names:
			1: power_chronoshift.name
		ActivationDelay: 25
		ActivationSequence:
		Descriptions:
			1: power_chronoshift.description
		Weapons:
			1: ChronoAI
		CameraActor: camera.placeholderhack
		CameraRemoveDelay: 0
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		DisplayRadarPing: True
		LaunchSound: schrmov.wav
		IncomingSound: schrmov.wav
		DisplayTimerRelationships: Ally, Neutral, Enemy
	DetonateWeaponPowerCA@ra1_allies_chronovortex:
		AllowMultiple: true
		OrderName: ra1_allies_chronovortex
		Prerequisites:
			1: ~techlevel.superweapons
		IconImage: ra1_allies_chronosphere
		Icons:
			1: ra1_allies_chronovortex
		Cursor: ability
		ChargeInterval: 10500
		Names:
			1: Chrono Vortex
		ActivationDelay: 100
		Descriptions:
			1: Initiate a Chrono Vortex which deals heavy damage over time to a large area.
		Weapons:
			1: ChronoVortexInit
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		EndChargeSpeechNotification: NuclearWeaponAvailable
		EndChargeTextNotification: Chrono Vortex ready.
		InsufficientPowerSpeechNotification: InsufficientPower
		IncomingSpeechNotification: NuclearWarheadApproaching
		IncomingTextNotification: Chrono Vortex activated.
		IncomingSound: Chrono.aud
		LaunchSound: Chrono.aud
		DisplayTimerRelationships: Ally, Neutral, Enemy
		PauseOnCondition: disabled
		DisplayBeacon: True
		DisplayRadarPing: True
		ArrowSequence: arrow
		ClockSequence: clocklarge
		CircleSequence: circles
		CameraRemoveDelay: 500
		Duration: 500
		ActiveCondition: active
		BeaconPosters:
			1: chronovortexicon
		TargetCircleRanges:
			1: 12345
		TargetCircleColors: ff000080
		BeaconActor: BLASTRADIUS.super
		CameraRange: 12345
	ProvidesPrerequisite@swlimit:
		Prerequisite: ra1_allies_chronosphere_swlimit
	RenderSprites:
		PlayerPalette: raplayer
	WithDeathAnimation:
		DeathSequencePalette: raplayer

