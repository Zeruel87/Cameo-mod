ra1_allies_alliedsniper:
	Inherits: ^Soldier
	Inherits@anim: ^TDRAInfantry
	Inherits@Template: ^SniperInfantryTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@cloak: ^CloakedVehicle
	Inherits@AdvancedRadarSystems: ^AdvancedRadarSystems
	Inherits@InfantryArmorPlating: ^InfantryArmorPlating
	Inherits@LaserTargetingSystems: ^LaserTargetingSystems
	Inherits@CryoMissiles: ^CryoMissiles
	Valued:
		Cost: 500
	Tooltip:
		Name: Allied Sniper
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		Queue: Infantry, RAInfantry
		BuildPaletteOrder: 80
		Prerequisites: ~ra1_allies_alliedbarracks, ra1_allies_alliedradardome
		Description: actor_rasniper.description
	Health:
		HP: 10000
	ChangesHealth@SelfHealing:
		Step: 10
	Mobile:
		Speed: 60
	Passenger:
	AutoTargetPriority@DEFAULT:
		ValidTargets: Infantry
	Armament@PRIMARY:
		Weapon: LightSniper
		LocalOffset: 128,0,256
		RequiresCondition: !ra1_allies_upgrade_cryomissiles
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: LightSniper
		MuzzleSequence: garrison-muzzle
		RequiresCondition: !ra1_allies_upgrade_cryomissiles
	Armament@Upgrade:
		Weapon: CryoLightSniper
		LocalOffset: 128,0,256
		RequiresCondition: ra1_allies_upgrade_cryomissiles
	Armament@UpgradeGARRISONED:
		Name: garrisoned
		Weapon: CryoLightSniper
		MuzzleSequence: garrison-muzzle
		RequiresCondition: ra1_allies_upgrade_cryomissiles
	WithInfantryBody:
		DefaultAttackSequence: shoot
	Cloak:
	RenderSprites:
		Image: e1sniper
		PlayerPalette: playerra
	WithDeathAnimation:
		DeathSequencePalette: playerra
	-MustBeDestroyed:
	ActorStatValues:
		Upgrades: ra1_allies_upgrade_advancedradarsystems, ra1_allies_upgrade_infantryarmorplating, ra1_allies_upgrade_lasertargetingsystems, ra1_allies_upgrade_cryomissiles, ra1_allies_upgrade_gpssatellitesupport

