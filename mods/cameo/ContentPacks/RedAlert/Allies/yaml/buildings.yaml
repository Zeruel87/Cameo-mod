ra1_allies_alliedradardome:
	Inherits: ^BaseBuilding
	Inherits@radar: ^RadarBuilding
	Inherits@AdvancedRadarSystems: ^AdvancedRadarSystems
	Inherits@ReinforcedStructures: ^ReinforcedStructures
	Inherits@dome: ^Dome
	Buildable:
		Prerequisites: ~ra1_allies_alliedconstructionyard, ra1_allies_alliedorerefinery
		Description: Provides radar coverage of the battlefield.
	Tooltip:
		Name: Allied Radar Dome
	RevealsShroudMultiplier@ra1_allies_upgrade_advancedradarsystems:
		Modifier: 150
	DetectCloakedMultiplier@ra1_allies_upgrade_advancedradarsystems:
		Modifier: 150
	RangedGpsProvider:
		Range: 20000
		RequiresCondition: !disabled && !ra1_allies_upgrade_advancedradarsystems
	WithRangeCircle:
		Range: 20000
		Color: FF000088
		RequiresCondition: !disabled && !ra1_allies_upgrade_advancedradarsystems
	RangedGpsProvider@upgrade:
		Range: 30000
		RequiresCondition: !disabled && ra1_allies_upgrade_advancedradarsystems
	WithRangeCircle@upgrade:
		Range: 30000
		Color: FF000088
		RequiresCondition: !disabled && ra1_allies_upgrade_advancedradarsystems
	ActorStatValues:
		Upgrades: ra1_allies_upgrade_advancedradarsystems, ra1_allies_upgrade_reinforcedstructures
	Production@Upgrades:
		Produces: Upgrades
	ProductionBar@Upgrades:
		ProductionType: Upgrades

