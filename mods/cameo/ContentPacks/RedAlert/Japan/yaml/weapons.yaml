	Warhead@Bullet_Medium:
		Damage: 4000
# SCOUT-CLASS BASELINE WEAPON (Formula v2, design 2026-07-18): the round
# reference stats â€” 4000 damage / 50 reload / 5000 range â€” that define
# the scout anchor together with the Imperial Scoutsman's 20000/50/100.
# Dedicated (never shared): CHGuardRifle serves civilians/other rules
# and must not carry baseline duty.
	-Warhead@Bullet_Light:
	-Warhead@Bullet_Medium:
	Warhead@Bullet_MediumFlatCompatibility:
		ValidTargets: Ground, Water, Air
		Damage: 4000
		PercentageScale: 9975
japan_imperialscoutsman_rifle:
	# Special-Forces baseline weapon (maintainer 2026-07-20): SmallArms +
	# Chaingun + railgun-AP = 6000 dmg, precise (bullet projectile, no beam
	# or blue impact â€” ^SmallArms is inherited LAST so its Bullet + Effect
	# win). Air-capable. The RailgunExtraDamage warhead inherits untouched
	# (shield-only chip damage; ignored for pricing, per maintainer).
	Inherits@collapsewh: ^Warhead_Bullet_Medium
	Inherits: ^RailgunWeapon
	Inherits@cg: ^Chaingun
	Inherits@sa: ^SmallArms
	ReloadDelay: 50
	Range: 6000
	ValidTargets: Ground, Water, Air
