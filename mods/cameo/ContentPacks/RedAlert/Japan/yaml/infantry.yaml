japan_imperialscoutsman:
	Inherits: ^RA1AlliesRifleInfantry
	Inherits@Template: ^SpecialForcesInfantryTemplate
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@BushidoDiscipline: ^BushidoDiscipline
	Inherits@StealthSuitIntegration: ^StealthSuitIntegration
	Inherits@WaveforceBullets: ^WaveforceBullets
	Buildable:
		Prerequisites: ~japan_japanesebarracks
		Queue: Infantry, RAInfantry
		Description: actor_e1.description-jp
	Tooltip:
		Name: Imperial Scoutsman
	Valued:
		Cost: 200
	Mobile:
		Speed: 50
	Health:
		HP: 15000
	ChangesHealth@SelfHealing:
		Step: 15
	# SPECIAL-FORCES BASELINE UNIT (Formula v2, maintainer 2026-07-20): the
	# living in-game reference — 15000 HP / 50 Speed / 6.0 Range / 6000
	# Damage (SmallArms + Chaingun + Railgun-AP, air-capable) / 50 Reload at
	# Cost 200, O = P = Q = 200 by construction. Fragile long-range versatile
	# anti-air/anti-armor specialist (contrast the 50000-HP closecombat
	# brawler). ^SpecialForcesInfantryTemplate replaces the scout template
	# via the @Template inherit swap; DPS comes entirely from the weapon.
	# @ScoutInfantryBuff neutralizers kept defensively in case any scout
	# trait lingers through the parent; drop once the swap is verified clean.
	DamageMultiplier@ScoutInfantryBuff:
		Modifier: 100
	FirepowerMultiplier@ScoutInfantryBuff:
		Modifier: 100
	RenderSprites:
		Image: japanesesoldier
		PlayerPalette: player
	WithDeathAnimation:
		DeathSequencePalette: player
	Voiced:
		VoiceSet: JapaneseVoice
	Armament@PRIMARY:
		Weapon: japan_imperialscoutsman_rifle
		RequiresCondition: !japan_upgrade_waveforcebullets
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: japan_imperialscoutsman_rifle
		RequiresCondition: !japan_upgrade_waveforcebullets
	Armament@Upgrade:
		Weapon: japan_imperialscoutsman_rifle_waveforce
		LocalOffset: 128,0,256
		RequiresCondition: japan_upgrade_waveforcebullets
	Armament@UpgradeGARRISONED:
		Name: garrisoned
		Weapon: japan_imperialscoutsman_rifle_waveforce
		MuzzleSequence: garrison-muzzle
		RequiresCondition: japan_upgrade_waveforcebullets
	ActorStatValues:
		Upgrades: japan_upgrade_bushidodiscipline, japan_upgrade_stealthsuitintegration, japan_upgrade_waveforcebullets

