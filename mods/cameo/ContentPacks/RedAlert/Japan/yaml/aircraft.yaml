japan_zerofighter:
	Inherits: ^RANeutralPlane
	Inherits@Template: ^FighterTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@WaveforceBullets: ^WaveforceBullets
	Inherits@DivineWindProtocol: ^DivineWindProtocol
	Inherits@EnergizedArrows: ^EnergizedArrows
	Inherits@NanoTechRepairs: ^NanoTechRepairs
	Inherits@eject: ^AircraftEjectOnDeath
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 30
		Prerequisites: ~japan_japaneseairfield
		Description: actor_yak.description
	Valued:
		Cost: 1200
	Tooltip:
		Name: Zero Fighter
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 30000
	Repairable:
		HpPerStep: 1500
	ChangesHealth@SelfHealing:
		Step: 30
	Armament@Missiles:
		Weapon: ZeroFighterArrows
		LocalOffset: 85,-300,-85, 85,300,-85
		MuzzleSequence: muzzle
		AmmoUsage: 6
		PauseOnCondition: ammo < 6
		RequiresCondition: !japan_upgrade_energizedarrows
	Armament@MissilesUpgrade:
		Weapon: ZeroFighterArrowsEnergized
		LocalOffset: 85,-300,-85, 85,300,-85
		MuzzleSequence: muzzle
		AmmoUsage: 6
		PauseOnCondition: ammo < 6
		RequiresCondition: japan_upgrade_energizedarrows
	Armament@PRIMARY:
		Weapon: ZeroFighterChainGun
		LocalOffset: 256,213,0, 256,-213,0
		MuzzleSequence: muzzle
		PauseOnCondition: ammo < 6
		RequiresCondition: !japan_upgrade_waveforcebullets
	Armament@Upgrade:
		Weapon: ZeroFighterChainGunWaveforce
		LocalOffset: 256,213,0, 256,-213,0
		MuzzleSequence: muzzle
		PauseOnCondition: ammo < 6
		RequiresCondition: japan_upgrade_waveforcebullets
	FirepowerMultiplier@DualWeapon:
		Modifier: 50
	AttackAircraft:
		FacingTolerance: 40
	Aircraft:
		TurnSpeed: 12
		Speed: 175
	SelectionDecorations:
	WithMuzzleOverlay:
	Contrail:
		Offset: -1000,0,250
	SpawnActorOnDeath:
		Actor: modkami.Husk
	EjectOnDeath:
		PilotActor: japan_imperialscoutsman
	LeavesTrails:
		Offsets: -1000,0,250
		MovingInterval: 2
		Image: smokey
		StationaryInterval: 2
		SpawnAtLastPosition: False
		TrailWhileStationary: True
		Type: CenterPosition
		RequiresCondition: enable-smoke
	Selectable:
		DecorationBounds: 1280, 1280
	Voiced:
		VoiceSet: JapaneseVehicleVoice
	RenderSprites:
		Image: japan_zerofighter
	AmmoPool:
		Ammo: 24
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 11
		Count: 1
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 6
	GrantConditionOnDamageState@SmokeTrail:
		Condition: enable-smoke
	ActorStatValues:
		Upgrades: japan_upgrade_waveforcebullets, japan_upgrade_divinewindprotocol, japan_upgrade_energizedarrows, japan_upgrade_nanotechrepairs

japan_japanesebomber:
	Inherits: ^RANeutralPlane
	Inherits@reload: ^RearmableAircraft
	Inherits@Template: ^BomberTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@AntiBuil: ^PrioritizeBuilding
	Inherits@AntiDef: ^PrioritizeDefence
	Inherits@WaveforceBullets: ^WaveforceBullets
	Inherits@AdvancedPlasmaWeapons: ^AdvancedPlasmaWeapons
	Inherits@DivineWindProtocol: ^DivineWindProtocol
	Inherits@NanoTechRepairs: ^NanoTechRepairs
	Inherits@eject: ^AircraftEjectOnDeath
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 30
		Prerequisites: ~japan_japaneseairfield, japan_japanesetechcenter
		Description: actor_jpbomber.description
	Valued:
		Cost: 1500
	Tooltip:
		Name: Japanese Bomber
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 122500
	Repairable:
		HpPerStep: 6125
	ChangesHealth@SelfHealing:
		Step: 49
	AttackAircraft:
		AttackType: Strafe
		Armaments: primary, secondary
		StrafeRunLength: 5000
		FacingTolerance: 50
	Armament@Guns:
		Name: secondary
		Weapon: ZeroFighterChainGun
		LocalOffset: 0,128,0, 0,-128,0
		MuzzleSequence: muzzle
		PauseOnCondition: !ammo
		RequiresCondition: !japan_upgrade_waveforcebullets
	Armament@UpgradeGuns:
		Name: secondary
		Weapon: ZeroFighterChainGunWaveforce
		LocalOffset: 0,128,0, 0,-128,0
		MuzzleSequence: muzzle
		PauseOnCondition: !ammo
		RequiresCondition: japan_upgrade_waveforcebullets
	Armament@Bombs:
		Name: primary
		Weapon: JapaneseHeavyBomb
		PauseOnCondition: !ammo
		RequiresCondition: !japan_upgrade_advancedplasmaweapons
	Armament@UpgradeBombs:
		Name: primary
		Weapon: JapanesePlasmaBomb
		PauseOnCondition: !ammo
		RequiresCondition: japan_upgrade_advancedplasmaweapons
	RangeMultiplier@Chaingun:
		Modifier: 70
	Aircraft:
		TurnSpeed: 11
		Speed: 165
		IdealSeparation: 2500
	AutoTarget:
		InitialStance: Defend
		InitialStanceAI: AttackAnything
		ScanRadius: 10
	AmmoPool:
		Ammo: 12
		ReloadDelay: 16
		AmmoCondition: ammo
	SelectionDecorations:
	WithMuzzleOverlay:
	Contrail@1:
		Offset: -500,-250,200
	Contrail@2:
		Offset: -500,250,200
	SpawnActorOnDeath:
		Actor: modbomber.Husk
	EjectOnDeath:
		PilotActor: japan_samurai
	LeavesTrails:
		Offsets: -500,0,200
		MovingInterval: 2
		Image: smokey
		StationaryInterval: 2
		SpawnAtLastPosition: False
		TrailWhileStationary: True
		Type: CenterPosition
		RequiresCondition: enable-smoke
	Selectable:
		DecorationBounds: 1280, 1280
	Voiced:
		VoiceSet: JapaneseVehicleVoice
	RenderSprites:
		Image: japan_japanesebomber
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 4
	GrantConditionOnDamageState@SmokeTrail:
		Condition: enable-smoke
	ActorStatValues:
		Upgrades: japan_upgrade_waveforcebullets, japan_upgrade_advancedplasmaweapons, japan_upgrade_divinewindprotocol, japan_upgrade_nanotechrepairs

