	Warhead@Smudge1: LeaveSmudge
		SmudgeType: Crater
		InvalidTargets: Vehicle, Structure, wall, Husk, Creep
	Warhead@Smudge2: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Vehicle, Structure, wall
