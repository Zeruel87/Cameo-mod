# ⭐ THE CRYO IMPACT LAYER (maintainer 2026-08-23). The cryo upgrade swaps all three legs of
# the 3-way split, not just the warhead: *"the Missile effect change into the cryo explosion
# effect"*. This is the EFFECT leg, and it is delivery-agnostic on purpose — a cryo bullet, a
# cryo shell and a cryo bomb all end in the same freeze burst, so one template serves them all.
#
# ⚠ It deliberately does NOT carry a Projectile. `^CryoMissileProjectile` (RedAlert/Shared)
# bundles the missile projectile WITH the effect, which is why every hitscan weapon that
# inherited it for the visuals — CryoM1Carbine, CryoLightSniper, the RA1 carbine — silently
# lost `InstantHitWithFakeBullets`. Keeping the effect separate lets a weapon take the cryo
# look without having its delivery rewritten.
#
# ⚠ It also carries NO ApplyPhysicalState. The freeze now rides the cryo WARHEAD
# (`PhysicalStates: Temperature -100`, or -67 for BlastCryo, emitted by gen_weapon_template),
# which is the whole point of the ruling: one number, on the warhead, scaled by real damage.
^Effect_Cryo:
	Warhead@Effect: CreateEffect
		Explosions: cryo_blast
	Warhead@EffectWater: CreateEffect
		Explosions: cryo_blast
	Warhead@EffectAir: CreateEffect
		Explosions: cryo_blast

^Effect_Sniper_Light:
	Warhead@Effect: CreateEffect
		Explosions: piffs
		ValidTargets: Ground, Ship, Air
	Warhead@EffectWater: CreateEffect
		Explosions: water_piffs
		ValidTargets: Water, Underwater
		InvalidTargets: Ship, Structure, Bridge
	Warhead@ShieldHit: GrantExternalCondition
		Condition: shieldhit
		Duration: 4
		Range: 1250
		ValidTargets: Shielded
	Warhead@ShieldHitEffect: CreateEffect
		ImpactSounds: shielded_bullet_hit1.wav, shielded_bullet_hit2.wav, shielded_bullet_hit3.wav, shielded_bullet_hit4.wav
		ValidTargets: Shielded

