# ScaledBullet derives Inaccuracy and Speed from the firing weapon's own Range (maintainer:
# *"this should be a function for range"*). ⚠ The explicit Speed / Inaccuracy below still WIN —
# they are kept deliberately, so switching these templates over changes NOTHING today. Deleting
# `Speed:` activates the 10%-of-Range rule and deleting `Inaccuracy:` activates the 1% rule; both
# are balance changes and go through the pipeline, not through a refactor.
# ONE shell, three accuracies. After the sound moved onto the weapons, the L/M/H templates
# differed by a single field, so the flight body lives here once and each level states only what
# makes it a level. ⚠ The three cannot merge YET: `Inaccuracy` is the one axis they still carry,
# and replacing it with the 1%-of-Range rule is a balance change (3.2x-11.8x tighter, measured in
# PROJECTILE_TEMPLATES.md) awaiting a maintainer order. When that lands, deleting the three
# `Inaccuracy:` lines below IS the collapse — every weapon can then inherit `^Projectile_Shell`.
^Projectile_Shell:
	# Tank shells KEEP a travel time and a real inaccuracy — maintainer 2026-08-22: "not tank
	# shells or artillery shells because those should have a travel time and inaccuracy ... for
	# tank shells those should scale their inaccuracy with their maximum range instead".
	# ⚠ `Speed: 500` and the per-level `Inaccuracy:` used to sit here and DEFEATED that scaling:
	# ScaledBullet only derives a value when the field is still at BulletInfo's default, so an
	# explicit number always wins. The percentages were computed and then thrown away for all 145
	# shell weapons. They are gone now, so Inaccuracy = 1% of Range and Speed = 10% of Range are
	# what actually reach the engine.
	Projectile: ScaledBullet
		Image: 120MM
		InaccuracyPercentage: 1
		ProjectileSpeedPercentage: 10
		Shadow: true

^Projectile_Shell_Light:
	# Inaccuracy comes from InaccuracyPercentage x Range now; a literal here would
	# silently switch the derivation back off for every weapon in this tier.
	Inherits: ^Projectile_Shell

^Projectile_Shell_Medium:
	# Inaccuracy comes from InaccuracyPercentage x Range now; a literal here would
	# silently switch the derivation back off for every weapon in this tier.
	Inherits: ^Projectile_Shell

^Projectile_Shell_Heavy:
	# Inaccuracy comes from InaccuracyPercentage x Range now; a literal here would
	# silently switch the derivation back off for every weapon in this tier.
	Inherits: ^Projectile_Shell

