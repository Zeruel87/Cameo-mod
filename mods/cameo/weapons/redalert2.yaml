		ImpactSounds: bflaattc.wav, bflaattd.wav, bflaattb.wav, bflaatta.wav

^RA2LightMissile:
	Inherits@wh: ^Warhead_MissileAP_Light
	Inherits@proj: ^Projectile_Missile_Light
	Inherits@fx: ^Effect_MissileAP_Light
	Projectile: Missile
