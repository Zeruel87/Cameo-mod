# effect families extracted from inline weapon warheads (W27)

^td_gdi_set0:
	Inherits: ^Effect_CannonHE_Medium
	-Warhead@Effect:
	Warhead@Effect: CreateEffect
		Explosions: small_poof
		ImpactSounds: kaboom12.aud
		ValidTargets: Ground, Ship

^td_gdi_set1:
	Inherits: ^Effect_MissileAP_Heavy
	-Warhead@EffectAir:
	Warhead@EffectAir: CreateEffect
		Explosions: small_building
		ImpactActors: false
		ImpactSounds: xplobig4.aud
		ValidTargets: Air

