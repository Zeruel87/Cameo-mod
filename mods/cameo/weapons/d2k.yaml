# Dune 2000 weapons — legacy remainder.
#
# Every weapon still referenced by a live actor or weapon was moved into the
# D2k ContentPacks on 2026-09-22 (devin/dawn branch, resolved-diff verified):
#   - ContentPacks/D2k/Shared/yaml/weapons.yaml — cross-faction weapons and
#     shared ^templates, plus weapons re-homed from single packs that other
#     packs referenced (OrniGun, Sound, HMG, ordos_autogunturret, HMG_turret,
#     d2k_laser).
#   - The owning faction pack for faction-unique weapons.
#
# What remains here, and why:
#   1. CROSS-THEME consumers — needs a design ruling before it can move:
#      DeathHand, oDeathHand, PulseMissile, ixian_airdrone are referenced by
#      Core/yaml Player support powers; D2K_155mm is referenced by
#      StarCraft/Zerg weapons (BehemothShoot, GuardianShoot).
#   2. UNREFERENCED weapons (the o* OpenRA-era duplicates and the d2k_*
#      specials such as D2KAPMine/d2k_quake_boom) — nothing live references
#      them (all 363 .oramap archives scanned clean; dormant commented-out
#      rules/dune2.yaml + weapons/dune2.yaml still name oDeviatorMissile and
#      oSound). Held pending the unused-file audit phase in docs/MIGRATION.md.

D2K70mm:
	Inherits@w81: ^Warhead_CannonHE_Medium  # W7MAT covering-edge
	Inherits@w82: ^Projectile_Shell_Medium_D2K  # W7MAT covering-edge
	Inherits@w83: ^Effect_CannonHE_Medium_D2K  # W7MAT covering-edge
	Report: MEDTANK1.WAV  # W7MAT w8-repin
	Warhead@CannonHE_Medium:
		PercentageScale: 2500
		Damage: 11200

	ReloadDelay: 50
^d2k_d2k_d2k76mm:
	Warhead@Concrete: DamagesConcrete
		Damage: 1000
	Warhead@DuneRock: LeaveSmudge
		SmudgeType: RockCrater
		InvalidTargets: Vehicle, Structure, wall, Husk, Creep
	Warhead@DuneSand: LeaveSmudge
		SmudgeType: SandCrater
		InvalidTargets: Vehicle, Structure, wall, Husk, Creep
	Warhead@Effect: CreateEffect
		Explosions: d2k_small_napalm
		ImpactSounds: EXPLSML2.WAV
		ValidTargets: Ground, Ship
		ExplosionPalette: effect75alpha
		ImpactActors: false
	Warhead@EffectAir: CreateEffect
		Explosions: med_explosion_air
		ImpactSounds: EXPLMD2.WAV
		ImpactActors: false
		ValidTargets: Air
	Warhead@EffectWater: CreateEffect
		Explosions: med_splash
		ImpactSounds: splash9.aud
		ValidTargets: Water, Underwater
		InvalidTargets: Ship, Structure, Bridge
	Warhead@Glow: GlowImpact
		Color: FFB84D
		Scale: 0.55
		FadeFrames: 10
	Warhead@RA2Crater: LeaveSmudge
		SmudgeType: RA2Crater
		InvalidTargets: Vehicle, Structure, wall, Husk, Creep
	Warhead@ShieldHitEffect: CreateEffect
		ImpactSounds: shielded_shell_hit1.wav, shielded_shell_hit2.wav, shielded_shell_hit3.wav, shielded_shell_hit4.wav
		ValidTargets: Shielded
	Warhead@Smudge: LeaveSmudge
		SmudgeType: SandCrater, RockCrater
		InvalidTargets: Vehicle, Structure

