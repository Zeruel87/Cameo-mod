TS25mmDep:
	# ⛔ GROUND ONLY. Maintainer + Destined 2026-08-22: the tick tank should not shoot air —
	# *"TS Nod already has good enough anti air from the buggy and bike and also later on the
	# stealth tank so the tick tank doesn't even need anti air"*. This auxiliary weapon was the
	# ONLY source of it, so removing Air here removes it from the unit entirely.
	Inherits@wh: ^Warhead_Flak_Medium
	Inherits@proj: ^Projectile_Flak_Medium
	Inherits@fx: ^Effect_Flak_Medium
	ReloadDelay: 8
	Range: 6679
	Report: chaingn1.aud
	ValidTargets: Ground, Water
	Warhead@Flak_Medium:
		ValidTargets: Ground, Water
		Damage: 2000
TSLaser25mmDep:
	Inherits@wh: ^Warhead_Laser_Heavy
	Inherits: ^FlakWeapon
	Inherits@2: ^LaserWeapon
	Inherits@3: ^TSLaserEffect
	Projectile: LaserZap
		Width: 36
		Duration: 8
		SecondaryBeamWidth: 18
	# Ground only, as TS25mmDep above — this is its T3 laser variant.
	ValidTargets: Ground, Water
	ReloadDelay: 8
	Range: 6679
	Report: chaingn1.aud
	TargetActorCenter: false
	-Warhead@FlakWeapon:
	Warhead@FlakWeaponPercentage: AreaDamagePercentage
		InvalidTargets: Air
		Damage: 1
		ValidTargets: Ground, Water, Air
	-Warhead@LaserWeapon:
	-Warhead@LaserExtraDamage:
	Warhead@LaserWeaponPercentage: AreaDamagePercentage
		InvalidTargets: Air
		Damage: 1
		ValidTargets: Ground, Water, Air
	Warhead@Laser_Heavy:
		InvalidTargets: Air
		Damage: 4600
		PercentageScale: 0
		ValidTargets: Ground, Water
	-Warhead@Laser_Heavy_ExtraDamage:
	Warhead@ShieldHit:
		InvalidTargets: Air
TS90mm:
	# ⭐ ANTI-ARMOUR, NOT ANTI-EVERYTHING. Destined 2026-08-22: the tick tank *"should be tanky
	# ... but not do any damage against infantry ... Only good against other tanks/buildings."*
	# CannonHE -> CannonAP is exactly that trade, measured across the generated profiles:
	# None 0.51x, Wood 0.69x, Scout 0.78x — but Heavy 1.27x, Concrete 1.72x, Superheavy 1.91x.
	# ⚠ The `Warhead@` override key is renamed WITH the template. Leaving it as
	# `Warhead@CannonHE_Medium` would orphan it into a bare override of a warhead the new
	# parent never defines — an abstract warhead, which is the documented empty-warhead boot
	# crash (find_empty_warhead.py).
	# PILOT (Aedis 2026-09-10 02:10/02:14, scoped): repointed onto the live
	# ^Warhead_CannonAP continuous base at the base's own h=1000 (thousandths,
	# active Medium). Only the warhead template moves; Damage 6000, ReloadDelay 26,
	# Range 5319, projectile and effect resolve exactly as before; main key is renamed
	# (h=1000 scales Spread 120 x 1 = 120, the old Medium geometry).
	Inherits: ^TSCannonEffect
	Inherits@wh: ^Warhead_CannonAP
	Inherits@proj: ^Projectile_Shell_Medium
	Inherits@fx: ^Effect_CannonAP_Medium
	Report: tnkfire6.aud
	ReloadDelay: 26
	Range: 5319
	Warhead@CannonAP:
		Damage: 6000
