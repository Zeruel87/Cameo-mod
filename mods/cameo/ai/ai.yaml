	# GC-1 (AI_ARCHITECTURE §12.19): garrison contest + enemy-garrison clear raids for genericbot.
	# The arm flips these to the genericbot tier list in the increment A/B; default fransbot-only - inert on master.
	GrantConditionOnBotOwner@garrisoncontest:
		Condition: garrison_contest
		Bots: fransbot
	# CN3 stealth squads (crystallized-nexus port): arms StealthDoctrineBotModule, the
	# detector-memory provider the stealth drafting + states read. Same convention as the
	# CN2/CN3 granters: fransbot by default (inert on master), the increment A/B flips it
	# to the genericbot tier list via tools/ai/increment_switches.yaml.
	GrantConditionOnBotOwner@cn3stealthsquads:
		Condition: cn3_stealth_squads
		Bots: fransbot

	# AF-1 (AI_ARCHITECTURE §12.20): army-first building gate for genericbot (the spacing advisor needs no condition:
	# its building gap is live for genericbot, only its re-ranking is switched, by a field).
	# Same inert-on-master pattern - the switch arm flips Bots: to the genericbot tier list.
	GrantConditionOnBotOwner@armyfirst:
		Condition: army_first
		Bots: fransbot
	# PP-1 (AI_ARCHITECTURE §12.23): parallel-queue production width. Provider-seam so the shared
	# UnitBuilderBotModuleCA@generic instance never hands the width to classic (the A/B control).
	GrantConditionOnBotOwner@parallelprod:
		Condition: parallel_production
		Bots: fransbot
	# The line-of-death fix (unified concave, AI_ARCHITECTURE 12.7a): Rush squads deploy a range-matched
	# concave arc before the commit, so the wave fires together. The arm flips this to the
	# genericbot tier list in the increment A/B; default fransbot-only - inert on master.
	GrantConditionOnBotOwner@assaultfanout:
		Condition: assault_fanout
		Bots: fransbot
	# Scale targets (DESIGN 19.10, AI_ARCHITECTURE 12.22): base and army size grow with the seen enemy, the unscouted map,
	# difficulty, personality and game time. The arm flips this to the genericbot tier list (switch group ST_scale_targets);
	# default fransbot-only - inert on master.
	GrantConditionOnBotOwner@scaletargets:
		Condition: scale_targets
