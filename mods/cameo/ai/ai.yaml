	# A/B reference bot ("classic"): the pre-Cognition-wave module stack —
	# SquadManagerBotModuleCA and the CA builders/harvesters, but none of the
	# CN-era brains (MasterAiBotModule, Scout/Beacon/CombatAnalysis, personality
	# squads, counter-demand, action budgets) and none of the Fransbot stack —
	# plus a RevealsMap on its PlayerActor for the mandated omniscience
	# handicap. `classicbot` enables the old modules; the shared `hardbot`
	# condition gives it BotLimits@hard + hard-tier build prereqs (and keeps
	# it out of brutalorhuman), so classic == "old hard bot with full vision".
	# Harness target: tools/ai/run_ai_match_batch.py --bot-b classic.
	ModularBot@ClassicAI:
		Name: bot_ai.classic
		Type: classic
		# A/B reference only (AI_ARCHITECTURE §0a); not a lobby choice.
		HiddenInLobby: True
	GrantConditionOnBotOwner@classicstack:
		Condition: classicbot
		Bots: classic
	GrantConditionOnBotOwner@classictier:
		Condition: hardbot
		Bots: classic
	# The classic reference bot's handicap: whole-map shroud+fog reveal for
	# itself and its allies (the PlayerActor owns it, so it is never lost).
	RevealsMap@classic:
		RequiresCondition: classicbot
		ValidRelationships: Ally
	# League exploiters (AI_DEEP_RESEARCH §6.2): the full genericbot stack at
	# hard tier, pinned to one personality pole via
	# BotPersonalityController.PinnedPersonalities. Fog-honest like the
	# candidate — the flaw-exposure must come from doctrine, not vision.
	# Hidden from the lobby; harness-only opponents.
	ModularBot@ExploitRushAI:
		Name: bot_ai.exploit_rush
		Type: exploit_rush
		HiddenInLobby: True
	ModularBot@ExploitTurtleAI:
		Name: bot_ai.exploit_turtle
		Type: exploit_turtle
		HiddenInLobby: True
	ModularBot@ExploitGuerrillaAI:
