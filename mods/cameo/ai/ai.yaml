	BotGlobalUnitBudget:
		# Total combat-unit budget shared across all LIVING bots (cap per bot = budget / living bots).
		# Keeps total actor count - and the single-thread sim tick - bounded in big AI games, while
		# survivors get bigger armies as opponents die. MaxUnitsPerBot stops a last-bot finale from
		# consuming the whole budget. Only pauses unit production; base construction is unaffected.
		# Resource collectors (Harvester trait) are excluded by IgnoreHarvesters (default true), so the
		# economy is never starved by a lower budget; buildings/walls were never counted (mobile units only).
		GlobalUnitBudget: 600
		MaxUnitsPerBot: 150
	UnitBuilderBotModuleCA@generic:
		RequiresCondition: genericbot || classicbot
		UseCompositions: true
		# UW-1 (AI_ARCHITECTURE §2.8b item 3): derive the UnitsToBuild weights from the enabled
		# personality's RoleMix x each unit's Versus-weighted strength. Off until the next increment
		# A/B — switch group I_derived_unit_weights. Inert on classic: it carries no RoleMix and no
		# IBotUnitRoles provider, so the same @generic instance keeps the yaml table there.
		UseDerivedUnitWeights: false
		IdleBaseUnitsMaximum: 50
		ProductionMinCashRequirement: 1000
		MaximiseProductionCashRequirement: 5000
