	# CN2 (AI_MASTER_PLAN §3, crystallized-nexus port): the UNIT side of repair - damaged idle units go to a
	# depot (Repairable), a repair-near building, or within a mobile repairer's aura. BaseRepairBotModule owns
	# buildings; this only ever orders units, and claims each one (BotLeasePurpose.Repair) so squads cannot
