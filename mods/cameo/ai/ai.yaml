	# Build-order knobs (DESIGN 19.2, AI_ARCHITECTURE 12.25): eight bounded multipliers + an opening for the shared base builder, from the
	# personality preset x learned x jitter, with a fog-honest react layer. The arm flips this to the genericbot tier list (switch group
	# AK_build_order_knobs); default fransbot-only - inert on master.
	GrantConditionOnBotOwner@buildorderknobs:
		Condition: build_order_knobs
