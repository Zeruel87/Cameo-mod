		Type: exploit_guerrilla
		HiddenInLobby: True
	GrantConditionOnBotOwner@exploitstack:
		Condition: genericbot
		Bots: exploit_rush, exploit_turtle, exploit_guerrilla
	GrantConditionOnBotOwner@exploittier:
		Condition: hardbot
		Bots: exploit_rush, exploit_turtle, exploit_guerrilla
