	# (ai/learned/build_order_knobs.yaml, only with UseLearnedBuildOrder) x per-match jitter (+-JitterPct, drawn once from the host's random),
	# clamped to [KnobMin, KnobMax]; the react layer multiplies it mid-match (bounded [ReactMin, ReactMax]) and decays back.
	# FIXED POINT: every number in the dictionaries is THOUSANDTHS (1000 = x1.0). What each knob scales (BaseBuilderQueueManagerCA):
	#   tempo        - speed of the build clock: BuildingDelays, BuildingIntervals and the general build interval are DIVIDED by it (1150 = 15% faster)
	#   greed        - refinery fractions and the refinery delay (divided); also raises NewProductionCashThreshold (economy before factories)
	#   production   - fractions of barracks/factory/production buildings; also lowers NewProductionCashThreshold
	#   tech         - fractions AND delays (divided) of tech/superweapon buildings
	#   defence      - fractions of defence/anti-air buildings
	#   power_margin - the power surplus target (MinimumExcessPower and its bonus)
	#   expansion    - published for the expansion planner (IBotBuildOrderKnobs.KnobMilli); the base builder does not read it
	#   support      - fractions of radar/repair buildings
	# Categories are rules-derived (the base builder's own type lists, then BotTargetTags/roles); no actor id is typed here.
	# ARMY STAGING (DESIGN 19.12, AI_ARCHITECTURE 12.29): a pure planner (IBotArmyStaging) - one staging point per threatened side on the rim,
	# a few cells inside the own armed buildings; groups only when several sides are hit; a centre reserve for attacks from inside the ring.
	# It issues no orders: the squad manager stages the idle pool and the base builder rallies new units at its primary cell.
