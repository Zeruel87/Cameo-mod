	# CA-2a (AI_ARCHITECTURE §12.6): record-only siege telemetry — what stand-off,
	# artillery-first, commit and retreat WOULD have decided per assault squad.
	# Issues no orders; the CA-2b behaviour lands behind its own switch after this
	# validates the remembered-defence inputs on the hard candidate.
	SiegeEvaluatorBotModule:
		RequiresCondition: genericbot
		# CA-2b: false = telemetry only. Flip true on the A/B candidate only --
		# stand-off/retreat orders then reach assault squads via EvaluateSiege.
		BehaviourEnabled: false
		# CA-2c (§12.6 rule 5): retreat verdicts write a failed-siege memory into
		# the region and later evaluations read the wall as heavier. Own A/B
		# variable -- keep false while the CA-2b gate is measured.
		SiegeMemoryEnabled: false

