	# ENG-T (#694, DESIGN §22): arms Fransbot's capture-transport service as the genericbot
	# IBotCaptureTransportProvider. Inert by itself — EngineerBotModule only requests a run when
	# TransportChance > 0 (default 0). Classic is excluded: the A/B reference stays untouched.
	# DISARMED by default (Claude, 2026-10-01): FransTransportCommanderBotModule touches actors DIRECTLY (15 CancelActivity/
	# QueueActivity sites). A bot runs on the host only and must act through orders, so in a multiplayer game this would
	# desync. Inert `Bots: fransbot` (that type arms it anyway) until its sites are orders; the increment A/B re-arms it
	# for genericbot through tools/ai/increment_switches.yaml (single-player harness: no desync possible).
	GrantConditionOnBotOwner@engttransport:
		Condition: engt-transport
		Bots: fransbot
	# INC-3 (the F1 question as a switch): arms the eight Frans pure-service modules on the
	# bots named below — the arm sets `Bots: hard, exploit_rush, exploit_turtle, exploit_guerrilla`
	# (genericbot && hardbot, exactly the F1-ctrl population; classic stays Frans-free).
	# Default grants to `fransbot` only, where the flag is already implied — inert on master.
	GrantConditionOnBotOwner@inc3f1:
		Condition: inc3_frans_services
		Bots: easiest, veryeasy, easy, medium, hard, veryhard, brutal, challenger, unbeatable, cameogod, exploit_rush, exploit_turtle, exploit_guerrilla
	# CN2 unit-repair manager + garrison defence: the arm flips these to the genericbot tier list in the
	# increment A/B (tools/ai/increment_switches.yaml); default grants to fransbot only - inert on master.
	GrantConditionOnBotOwner@cn2unitrepair:
		Condition: cn2_unit_repair
		Bots: fransbot
	GrantConditionOnBotOwner@cn2garrison:
		Condition: cn2_garrison_defense
		Bots: fransbot
	GrantConditionOnBotOwner@cn3deploy:
