	# Army staging (DESIGN 19.12, AI_ARCHITECTURE 12.29): the idle army waits at the front with the defences, split by threatened side.
	# The arm sets Bots (switch group AM_army_staging); empty by default - inert on master.
	GrantConditionOnBotOwner@armystaging:
