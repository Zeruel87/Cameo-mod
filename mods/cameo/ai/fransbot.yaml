# Fransbot side-by-side integration (OpenRA.Mods.Fransbot.dll).
# A separate lobby bot type (`fransbot`) that runs the vendored Fransbot stack
# instead of the Cameo module stack. Every module is gated on `enable-fransbot`,
# which only `ModularBot@Fransbot` owners receive, so Cameo/human players and
# Cameo bot types never tick Frans modules (and fransbot bots never receive the
# genericbot/difficulty conditions, so Cameo modules stay dormant for them).
# Unit/composition lists are empty for now (content port is a follow-up), so the
# stack boots but does little — this PR proves assembly load + isolation.

Player:
	ModularBot@Fransbot:
		Name: bot_ai.fransbot
		Type: fransbot
		# Donor only (maintainer 2026-09-28): its modules join the Frankenstein stack one at a time,
		# each A/B-tested; the type is deleted after. Not a lobby choice.
		HiddenInLobby: True
	GrantConditionOnBotOwner@fransbot:
		Condition: enable-fransbot
		Bots: fransbot
	FransbotControllerBotModule:
		RequiresCondition: enable-fransbot
		DecisionInterval: 25
	# W1 intel substrate: these pure-service modules (no orders, no production
	# requests) armed on `hard` via `genericbot && hardbot` until the W3 verdict
	# (cand 0-24) sent the whole Frans stack back to donor-only: `hard` keeps
	# the CA producers/services, and DESIGN 19.1 forbids tier-gated modules
	# anyway — strength scales via BotLimits, not RequiresCondition.
	# INC-3 (F1's question as a switch): `inc3_frans_services` re-arms exactly
	# these eight services on the A/B arm's bot population; granted only via
	# GrantConditionOnBotOwner@inc3f1 in ai.yaml, which names `fransbot` by
	# default so master behaviour is unchanged.
	FransCombatIntelBotModule:
		RequiresCondition: enable-fransbot || inc3_frans_services
	FransStrategicMapBotModule:
		RequiresCondition: enable-fransbot || inc3_frans_services
		# Representative actors whose locomotives derive the passability layers.
		# All ContentPacks are unconditionally Included today, so TD/RA picks
		# always resolve; a missing actor leaves that layer inert by design.
		GroundProbeActorType: td_gdi_battletank
		McvProbeActorType: td_gdi_mobileconstructionvehicle
		NavalProbeActorType: ra1_allies_gunboat
	FransRiskModelBotModule:
		RequiresCondition: enable-fransbot || inc3_frans_services
	FransMineClusterBotModule:
		RequiresCondition: enable-fransbot || inc3_frans_services
	FransEconomicSaturationBotModule:
		RequiresCondition: enable-fransbot || inc3_frans_services
	FransCommanderCoreBotModule:
		RequiresCondition: enable-fransbot || inc3_frans_services
	FransCommandBidBotModule:
		RequiresCondition: enable-fransbot || inc3_frans_services
	FransGeneralBotModule:
		RequiresCondition: enable-fransbot || inc3_frans_services
		RaidPublishRememberedBuildings: true
		ReconProbeSpawnRepeatTicks: 4500
		RaidInterferencePriorityBonus: 40
		RaidInterferenceMemoryTicks: 500
	FransBaseBuilderBotModule:
		RequiresCondition: enable-fransbot
		MaximumMainBaseWarFactories: 3
	ResourceMapBotModule@fransbot:
		RequiresCondition: enable-fransbot
	FransMcvExpansionManagerBotModule:
		RequiresCondition: enable-fransbot
		PreSurplusMaximumConstructionYardSlots: 3
		PreSurplusPermanentConstructionYards: 2
		DesiredPermanentConstructionYards: 3
		MaximumPermanentConstructionYards: 4
		MinimumGroundCombatValueForAdditionalMcv: 6000
		ExpansionConyardRetreatRecentDamageRisk: 150
		ExpansionTargetFailureCooldownTicks: 1500
	FransUnitBuilderBotModule:
		RequiresCondition: enable-fransbot
		# Fog-honest adaptive counter-production: CombatIntel's seen/remembered enemy
		# army steers a minority of combat picks toward the best Versus counter.
		AdaptiveCounterWeight: 40
		AdaptiveCounterObservationInterval: 250
