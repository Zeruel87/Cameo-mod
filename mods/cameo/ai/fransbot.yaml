		RequiresCondition: enable-fransbot
		HarvestersPerServicedMine: 3
	FransSupplyTruckBotModule:
		RequiresCondition: enable-fransbot
	# Ground commanders are parallel bid capacities: one BidderKey can own only one
	# committed mission at a time (CommandBid capacity rule). A single instance means a
	# single persistent RECON patrol locks the entire Ground bid surface — the "bids 0"
	# kill-chain blocker. Upstream wires 10 (fransbot-personalities @ground1-10); six
	# covers 4 fan RECON + 2 concurrent RAID + SECURE/DEFEND contention. CommanderIndex
	# phases each instance's scan. Required no-default tuning repeats per instance.
	FransGroundCommanderBotModule@ground1:
		RequiresCondition: enable-fransbot
		BidderKey: ground1
		CommanderIndex: 0
		# Hold fresh units at rally until a fighting group exists; lone trickle-push fed
		# single rifles to roaming raids. Releases automatically under DEFEND pressure.
		ForwardMoveMinimumIdleUnits: 6
		SecureKnownThreatMultiplierPercent: 500
		SecureUncertaintyAllowanceValue: 600
		SecureMinimumControlValue: 1600
		SecureSurplusCostWeight: 4
		DefendForcePreservationMinimumPackageUnits: 20
		DefendForcePreservationTriggerCommitPercent: 70
		DefendForcePreservationLowReservePercent: 25
		DefendForcePreservationMinimumReserveUnits: 8
		DefendForcePreservationTargetReservePercent: 50
		DefendForcePreservationLongEtaMinimumTicks: 1000
