	# A single distance-falloff aura reproduces the old five stacked tiers exactly: an enemy at
	# horizontal distance d receives the sum of FalloffAmounts whose FalloffRanges >= d, i.e. the
	# step gradient 4 / 12 / 24 / 40 / 60 at decreasing distance. One proximity trigger per actor
	# instead of five -> ~80% fewer ActorMap re-scans (the late-game tick bottleneck).
	PhysicalStateAura@EnemyProximity:
		PhysicalStateName: EnemyProximity
		FalloffRanges: 10000, 8000, 6000, 4000, 2000
