	# structure in the player's initial build order with a timestamp; `UpdatesUnitsProduced`
	# records every unit produced here by name, count and value. Both report into the
	# `ProductionTracker` on the player actor, and both are inert for anyone not spectating.
	UpdatesBuildOrder:
	UpdatesUnitsProduced:
	Inherits@1: ^ExistsInWorld
	Inherits@2: ^SpriteActor
	Inherits@bounty: ^GlobalBounty
	Inherits@shape: ^1x1Shape
	Inherits@selection: ^SelectableBuilding
	Inherits@Shroudable: ^Shroudable
	Inherits@Blindable: ^Blindable
	Inherits@jammable: ^ArtilleryJammable
	Huntable:
	OwnerLostAction:
		Action: Kill
	SelectionDecorations:
		MinimumZoom: 0.5
	WithSpriteControlGroupDecoration:
	Targetable:
		TargetTypes: Ground, C4, Structure, Building
	Armor:
		Type: Wood
	Health:
		HP: 40000
	Building:
		Dimensions: 1,1
		Footprint: x
	ActorPreviewPlaceBuildingPreview:
		TilesetPalettes:
			VOLCANIC: ra_temperat
	SoundOnDamageTransition:
		DamagedSounds: xplobig4.aud
		DestroyedSounds: crumble.aud, xplobig4.aud
	WithSpriteBody:
	FireWarheadsOnDeath:
		Type: Footprint
		Weapon: BuildingExplode
		EmptyWeapon: BuildingExplode
	CaptureNotification:
		Notification: BuildingCaptured
		LoseNotification: BuildingLost
	ActorLostNotification:
		Notification: BuildingLost
	ShakeOnDeath:
	Guardable:
		Range: 3c0
	Tooltip:
		Name: Structure
		GenericName: Structure
	FrozenUnderFog:
	FrozenUnderFogUpdatedByGps:
	Demolishable:
	MapEditorData:
		Categories: Building
	CommandBarBlacklist:
	AcceptsDeliveredCash:
		ValidTypes: NormalCash
	Targetable@REPAIRING:
		RequiresCondition: damaged
		TargetTypes: Repairing
	GrantConditionOnDamageState@DAMAGED:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	GrantConditionOnDamageState@ONFIRE:
		Condition: critical-fire-trigger
		ValidDamageStates: Heavy, Critical
	GrantTimedCondition@CriticalFire:
		RequiresCondition: critical-fire-trigger
		Condition: critical-fire
		# Below-half-health fire/smoke burst. GrantTimedCondition only supports a single duration value.
		Duration: 750
	WithIdleOverlay@CriticalFire:
		Image: fire_building
		Sequence: 1
		IsDecoration: True
		# Force the effect palette: the paletted fire SHP renders black on RGBA-palette buildings
		# (PlayerPalette: player_rgba, e.g. Tesla Coil / Nod Laser Turret / Chronosphere) if it
		# inherits the actor's palette. See fancy-stealth RGBA palette gotcha.
		Palette: effect
		RequiresCondition: critical-fire && !build-incomplete && !CryoFreeze
	SmokeParticleEmitter@CriticalFire:
		Image: smoke_building_fire_glow
		Sequences: idle
		Palette: effect
		# Interval (ticks) between smoke puffs, lower = more smoke.
		SpawnFrequency: 6, 12
		# Must equal the animation length (32 frames * 80ms Tick = 64 sim ticks); a longer Duration
		# loops the one-shot sprite and pops a fresh puff back in. See groundfire in misc.yaml.
		Duration: 64
		Speed: 6, 16
		Gravity: 30, 70
		TurnRate: 2
		Offset: 0,0,128
		RequiresCondition: critical-fire && !build-incomplete && !CryoFreeze
	GrantConditionOnPrerequisite@CEMENTFACTORY:
		Condition: techcementffact
		Prerequisites: techcementffact
	DamageMultiplier@CEMENTFACTORY:
		RequiresCondition: techcementffact
		Modifier: 85
	RevealsShroud:
		Range: 5c0
		#MoveRecalculationThreshold: 0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	ExternalCondition@Boris:
		Condition: BorisFlare
	WithColoredOverlay@Boris:
		RequiresCondition: BorisFlare
		Color: FF0000AA

