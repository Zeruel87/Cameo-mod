^AcceptsCloakCrate:
	Cloak@TDcloak:
		DetectionTypes: GroundCloak
		InitialDelay: 125
		CloakDelay: 75
		CloakSound: trans1.aud
		UncloakSound: trans1.aud
		CloakStyle: Palette
		CloakedPalette: cloak_stealth
		IsPlayerPalette: true
		EffectImage: stealthfade
		EffectPalette: greenspark
		CloakEffectSequence: reversed
		UncloakEffectSequence: idle
		EffectTracksActor: True
		PauseOnCondition: cloak-force-disabled || base-reveal || disabled
		RequiresCondition: cloak-crate-collected
	ExternalCondition@CLOAK:
		Condition: cloak-crate-collected

^VehicleRadiation:
