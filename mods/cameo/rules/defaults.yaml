# Complete dormant overlay pair inherited by building footprint classes.
# Palette selection remains with ^ShieldedShieldable and faction templates.
^ShieldDomeShapeVisual:
	WithIdleOverlay@shield1:
		Image: hexshield_dome
		RequiresCondition: !disabled && shielded && !shieldhit
		IsDecoration: True
	WithIdleOverlay@shield_damage:
		Image: hexshield_dome
		RequiresCondition: !disabled && shielded && shieldhit
		IsDecoration: True

^1x1Shape:
	Inherits@shieldvisual: ^ShieldDomeShapeVisual
	WithIdleOverlay@shield1:
		Sequence: dome-1x1
		StartSequence: dome-1x1
	WithIdleOverlay@shield_damage:
		Sequence: dome-1x1
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
