^InfantryExperienceHospitalHazmatOverrides:
	WithDecoration@RANK-1:
		BlinkInterval: 32
		BlinkPatterns:
			hospitalheal && hazmatsuits: On, Off, Off
			hospitalheal || hazmatsuits: On, Off
	WithDecoration@RANK-2:
		BlinkInterval: 32
		BlinkPatterns:
			hospitalheal && hazmatsuits: On, Off, Off
			hospitalheal || hazmatsuits: On, Off
	WithDecoration@RANK-3:
		BlinkInterval: 32
		BlinkPatterns:
			hospitalheal && hazmatsuits: On, Off, Off
			hospitalheal || hazmatsuits: On, Off
	WithDecoration@RANK-ELITE:
		BlinkInterval: 32
		BlinkPatterns:
			hospitalheal && hazmatsuits: On, Off, Off
			hospitalheal || hazmatsuits: On, Off
	WithDecoration@HAZMAT:
		BlinkInterval: 32
		BlinkPatterns:
			rank-veteran && hospitalheal: Off, Off, On
			rank-veteran || hospitalheal: Off, On
	WithDecoration@REDCROSS:
		BlinkPatterns:
			rank-veteran && hazmatsuits: Off, On, Off
			rank-veteran && !hazmatsuits: Off, On
			hazmatsuits: On, Off

^AutoTargetGround:
	AutoTarget:
		AttackAnythingCondition: stance-attackanything
	AutoTargetPriority@DEFAULT:
		RequiresCondition: !stance-attackanything
		ValidTargets: Infantry, Vehicle, Monster, Creep, Water, Defense
		InvalidTargets: NoAutoTarget, NavalYard
	AutoTargetPriority@ATTACKANYTHING:
		RequiresCondition: stance-attackanything
		ValidTargets: Infantry, Vehicle, Monster, Creep, Water, Structure, Defense, Ground
		InvalidTargets: NoAutoTarget

^AutoTargetGroundAssaultMove:
	Inherits: ^AutoTargetGround
	AutoTargetPriority@DEFAULT:
		RequiresCondition: !stance-attackanything && !assault-move
	AutoTargetPriority@ATTACKANYTHING:
		RequiresCondition: stance-attackanything || assault-move
	AttackMove:
		Voice: Action
		AttackMoveCondition: attack-move
		AssaultMoveCondition: assault-move

^AutoTargetGroundAssaultMoveMelee:
	Inherits: ^AutoTargetGroundAssaultMove
	AutoTargetPriority@ATTACKANYTHING:
		ValidTargets: Infantry, Vehicle, Monster, Creep, Water, Defense, Ground

^AutoTargetAir:
	AutoTarget:
	AutoTargetPriority@DEFAULT:
		ValidTargets: Air
		InvalidTargets: NoAutoTarget

^AutoTargetAll:
	AutoTarget:
		AttackAnythingCondition: stance-attackanything
	AutoTargetPriority@DEFAULT:
		RequiresCondition: !stance-attackanything
		ValidTargets: Infantry, Vehicle, Monster, Creep, Water, Air, Defense
		InvalidTargets: NoAutoTarget
	AutoTargetPriority@ATTACKANYTHING:
		RequiresCondition: stance-attackanything
		ValidTargets: Infantry, Vehicle, Monster, Creep, Water, Air, Structure, Defense, Ground
		InvalidTargets: NoAutoTarget

^AutoTargetAllAssaultMove:
	Inherits: ^AutoTargetAll
	AutoTargetPriority@DEFAULT:
		RequiresCondition: !stance-attackanything && !assault-move
	AutoTargetPriority@ATTACKANYTHING:
		RequiresCondition: stance-attackanything || assault-move
	AttackMove:
		Voice: Action
		AssaultMoveCondition: assault-move

