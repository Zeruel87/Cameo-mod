^Magnefreezable:
	Targetable@Magnet:
		TargetTypes: Magnefreezable
	# THE MAGNETIC GRIP IS A METER, NOT TEN STACKED CONDITION BANDS.
	#
	# It used to be an `ExternalCondition` counted in stacks (`RA2Magnet` is `Burst 100 /
	# BurstDelays 1`, so one volley grants 100 tokens over 99 ticks) read by ten
	# `SpeedMultiplier` traits on 10-point windows -- and every one of the nine interior
	# boundaries OVERLAPPED, because `Magnet <= 20` and `Magnet >= 20` both hold at exactly 20.
	# Two multipliers therefore MULTIPLIED at each step the burst swept through:
	# 90% x 80% = 72% at 20, 60% x 50% = 30% at 50. The ramp was non-monotonic at every
	# boundary, and the burst hit all nine of them on every single volley.
	#
	# `SlowsProportionalToPhysicalState` interpolates continuously between two endpoints, so
	# the overlap cannot exist. 20 traits collapse to 5, and the effect becomes visible to
	# `tools/balance/physical_state_price.py`, which prices a meter by how fast it fills.
	#
	# Scale: 20000 over `Burst: 100` shots = `Amount: 200` per shot, so a full volley still
	# means a full lock, exactly as the 100-token stack did.
	PhysicalState@Magnetism:
		Name: Magnetism
		MaxValue: 20000
		MinValue: 0
		RelaxedValue: 0
		# The old stack counted SHOTS, not damage -- a scout and a superheavy were pinned by
		# the same 100 hits. `false` keeps that; `true` would silently make the magnetron
		# far better against light targets than it has ever been.
		RelativeToHealth: false
		ApplyDamageModifiers: false
		# A token lasted 100 ticks, so the grip unwound over ~100 ticks after the last shot.
		# 200/tick over a 20000 bar reproduces that; `ReloadDelay: 200` still leaves the
		# target fully free between volleys.
		RelaxationLinear: 200
		RelaxationInterval: 1
		RelaxationDelay: 25
		InitialValue: 0
	# Pink, matching `WithPhysicalStateColoredOverlay`'s MaxColor (FF88FF) rather than the old
	# `TimedConditionBar` magenta, so the bar and the tint read as one effect. Same shape as the
	# Temperature and Corrosion bars; no deadzone condition is needed because Magnetism is
	# UNSIGNED and relaxes to 0, so `DisplayWhenRelaxed: false` already hides it at rest.
	PhysicalStateBar@MagnetismBar:
		PhysicalStateName: Magnetism
		PositiveColor: FF88FF
		NeutralColor: 808080
		DisplayWhenRelaxed: false
		ShowAbsoluteValues: false
	# `magnetfreeze` is CONSUMED -- it is one of the disable conditions on ^Vehicle and
	# ^Aircraft (`empdisable || superfreeze || ... || magnetfreeze`). Deleting it without
	# a replacement would leave those `RequiresCondition` expressions referencing a
	# condition nothing grants. Granted only at a completely full bar, as `Magnet >= 100` was.
	GrantConditionOnPhysicalState@magnetfreeze:
		PhysicalStateName: Magnetism
		Condition: magnetfreeze
		LowerValue: 20000
		UpperValue: 20000
	# A FULL BAR IS A DISABLE, so every axis ramps -- maintainer ruling 2026-08-22: *"turn speed
	# should be scaled, reload delay too because it's an actual disable! even if it didn't have
	# it before it should have it now"*. The old ten `SpeedMultiplier` bands moved movement only;
	# this deliberately does MORE than they did, and the ramp now agrees with `magnetfreeze`
	# instead of contradicting it -- a unit pinned at 100% used to keep firing and traversing at
	# full rate right up to the instant the disable condition landed.
	#
	# Identical in shape to `@FrostSlowdown` on the Temperature meter. Reload bottoms out at 1,
	# not 0: `ConvertReloadSpeedToDelayPercent` maps 0 to `int.MaxValue`, and 1 already means a
	# 100x reload delay.
	SlowsProportionalToPhysicalState@Magnetism:
		PhysicalStateName: Magnetism
		UseDeviationFromRelaxed: true
		OnlyPositiveValues: true
		SpeedModifierAtMinimum: 100
		SpeedModifierAtMaximum: 0
		TurnSpeedModifierAtMinimum: 100
		TurnSpeedModifierAtMaximum: 0
		TurretTurnSpeedModifierAtMinimum: 100
		TurretTurnSpeedModifierAtMaximum: 0
		ReloadDelayModifierAtMinimum: 100
		ReloadDelayModifierAtMaximum: 1
	# Same magenta ramp the ten `WithColoredOverlay` traits drew, now interpolated. It opens
	# at 2000 (the old `Magnet >= 10`) so a single stray shot still does not tint the actor.
	WithPhysicalStateColoredOverlay@Magnetism:
		PhysicalStateName: Magnetism
		MinColor: 66886611
		MaxColor: FF88FFAA
		LowerValue: 2000
		UpperValue: 20000

^EnemyInProximity:
