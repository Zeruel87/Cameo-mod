^CryoFreezable:
	# Light cyan "chill fog" creeping off the actor while it is cryo-frozen. Each puff drifts
	# sideways in a random direction (RandomFacing) with almost no vertical motion, so it spreads
	# out low rather than rising. Globally capped (with the snow below) by CryoFogLimiter (World
	# actor) so a mass-freeze never fogs the screen.
	CryoFogEmitter@CryoFog:
		RequiresCondition: CryoFreeze
		Image: smoke_cryo
		Sequences: idle
		Palette: effect
		SpawnFrequency: 12, 20
		Duration: 64
		Speed: 8, 20
		Gravity: -2, 2
		TurnRate: 1
		Offset: 0,0,96
	# Snowflakes drifting down off the actor while frozen - same emitter mechanism as the fog.
	# Gentle fall (small negative Gravity) with lateral flutter (Speed in a wandering direction)
	# so they sway rather than dropping straight.
	CryoFogEmitter@CryoSnow:
		RequiresCondition: CryoFreeze
		Image: snowflake
		Sequences: idle
		Palette: effect
		SpawnFrequency: 16, 28
		Duration: 64
		Speed: 4, 11
		Gravity: -15, -5
		TurnRate: 6
		Offset: 0,0,320
	PhysicalState@Temperature:
		Name: Temperature
		MaxValue: 20000
		MinValue: -20000
		RelaxedValue: 0
		RelativeToHealth: true
		RelaxationLinear: 5
		RelaxationScaled: 50
		RelaxationInterval: 1
		RelaxationDelay: 25
		InitialValue: 0
		ApplyDamageModifiers: true
	SelectedPhysicalStateBar@TemperatureBar:
		PhysicalStateName: Temperature
		PositiveColor: FF0000
		NegativeColor: 0080FF
		NeutralColor: 808080
		DisplayWhenRelaxed: false
		ShowAbsoluteValues: false
		RequiresCondition: !TemperatureDeadzone
	SlowsProportionalToPhysicalState@FrostSlowdown:
		PhysicalStateName: Temperature
		UseDeviationFromRelaxed: true
		OnlyNegativeValues: true
		SpeedModifierAtMinimum: 100
		SpeedModifierAtMaximum: 0
		TurnSpeedModifierAtMinimum: 100
		TurnSpeedModifierAtMaximum: 0
		TurretTurnSpeedModifierAtMinimum: 100
		TurretTurnSpeedModifierAtMaximum: 0
		ReloadDelayModifierAtMinimum: 100
		ReloadDelayModifierAtMaximum: 1
		RequiresCondition: !TemperatureDeadzone
	DamageMultiplierProportionalToPhysicalState@CryoFreeze:
		PhysicalStateName: Temperature
		DamageMultiplierAtMinimum: 100
		DamageMultiplierAtMaximum: 200
		UseDeviationFromRelaxed: true
		RequiresCondition: CryoFreeze
	ChangesHealthProportionalToPhysicalState@Overheating:
		PhysicalStateName: Temperature
		UsePercentageDamage: false
		DamageAtMaximum: 150
		DamageAtMinimum: -150
		DamageThreshold: 0
		DamageInterval: 1
		DamageTypes: FireDeath
		RequiresCondition: Overheating
	ChangesHealthProportionalToPhysicalState@superhot:
		PhysicalStateName: Temperature
		UsePercentageDamage: true
		DamageAtMaximum: 1
		DamageAtMinimum: 0
		DamageThreshold: 0
		DamageInterval: 25
		DamageTypes: FireDeath
		RequiresCondition: superhot
	# Conditions for demonstration
	GrantConditionOnPhysicalState@TemperatureDeadzone:
		PhysicalStateName: Temperature
		Condition: TemperatureDeadzone
		UpperValue: 200
		LowerValue: -200
	GrantConditionOnPhysicalState@Overheating:
