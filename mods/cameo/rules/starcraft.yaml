####################################################################################################
#		Terran Upgrade Inherits
####################################################################################################

^TerranVehicleArmorUpgrades:
	DamageMultiplier@terran_upgrade_vehicleplatinglevel1:
		Modifier: 90
		RequiresCondition: terran_upgrade_vehicleplatinglevel1 && !terran_upgrade_vehicleplatinglevel2
	GrantConditionOnPrerequisite@terran_upgrade_vehicleplatinglevel1:
		Condition: terran_upgrade_vehicleplatinglevel1
		Prerequisites: terran_upgrade_vehicleplatinglevel1
	DamageMultiplier@terran_upgrade_vehicleplatinglevel2:
		Modifier: 80
		RequiresCondition: terran_upgrade_vehicleplatinglevel2
	GrantConditionOnPrerequisite@terran_upgrade_vehicleplatinglevel2:
		Condition: terran_upgrade_vehicleplatinglevel2
		Prerequisites: terran_upgrade_vehicleplatinglevel2
	ActorStatValues:
		Upgrades: terran_upgrade_vehicleplatinglevel1

^TerranShipWeaponUpgrades:
	FirepowerMultiplier@terran_upgrade_shipweaponslevel1:
		Modifier: 115
		RequiresCondition: terran_upgrade_shipweaponslevel1 && !terran_upgrade_shipweaponslevel2
