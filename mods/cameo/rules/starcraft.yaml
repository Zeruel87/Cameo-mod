		Condition: terran_upgrade_shipweaponslevel1
		Prerequisites: terran_upgrade_shipweaponslevel1
	FirepowerMultiplier@terran_upgrade_shipweaponslevel2:
		Modifier: 135
		RequiresCondition: terran_upgrade_shipweaponslevel2
	GrantConditionOnPrerequisite@terran_upgrade_shipweaponslevel2:
		Condition: terran_upgrade_shipweaponslevel2
		Prerequisites: terran_upgrade_shipweaponslevel2
	ActorStatValues:
		Upgrades: terran_upgrade_shipweaponslevel1

