CAMERA.sw:
	Inherits: CAMERA.small
	KillsSelf:
		RemoveInstead: true
		Delay: 240

# Persistent ground-fire entity dropped by flame weapons (via SpawnActorWarhead). Shows the
# fire visual, continuously emits dark smoke, then removes itself after its lifetime. Immobile
# with OccupiesSpace:false so it never blocks units and many can overlap. No new C# - all stock
# traits (SmokeParticleEmitter is Mods.AS). Scorch smudge is left by the spawning weapon impact.
groundfire:
	Interactable:
	Tooltip:
		Name: Fire
	RenderSprites:
		Image: groundfire_flame
	BodyOrientation:
		QuantizedFacings: 1
	DeterministicCellOffset:
		MinOffset: -384,-384,0
		MaxOffset: 384,384,0
		Salt: 197
	WithDeterministicOffsetIdleOverlay:
		Image: groundfire_flame
		Sequence: 1
		IsDecoration: True
	Immobile:
		OccupiesSpace: false
	# Cap to one fire per tile (FPS): burst weapons spawn many groundfire on/near the same cell;
	# duplicates on an occupied cell remove themselves. Doesn't block movement (OccupiesSpace stays
	# false). See OpenRA.Mods.Cameo/Traits/OneActorPerCell.cs.
	OneActorPerCell:
	DeterministicOffsetSmokeParticleEmitter@GroundFireSmoke:
		Image: smoke_fire_glow
		Sequences: idle
		Palette: effect
		# Interval (ticks) between smoke puffs, lower = more smoke.
		SpawnFrequency: 6, 12
		# Must equal the animation length (32 frames * 80ms Tick = 64 sim ticks). The engine plays
		# the sprite with PlayRepeating; a longer Duration loops it and pops a fresh puff back in.
		Duration: 64
		Speed: 6, 16
		Gravity: 30, 70
		TurnRate: 2
		Offset: 0,0,128
	# Lifetime 125-250 ticks (5-10s @ 25/sec), then removes itself. Fades the fire in (10 ticks,
	# ~400ms) at spawn and out before removal so it doesn't pop. Replaces KillsSelf (the lifetime
	# is owned here so the fade-out can be timed against it). The fire visual loops and the smoke
	# emitter runs for the whole lifetime.
	WithLifetimeFade:
		Duration: 125, 250
		FadeInTicks: 10
		FadeOutTicks: 10

