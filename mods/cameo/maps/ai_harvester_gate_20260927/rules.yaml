World:
	LuaScript:
		Scripts: test.lua
	-CrateSpawner:
	-SpawnStartingUnits:
	-MapStartingLocations:
	# AdaptiveGameSpeed measures whole FRAMES (render included) against the speed's budget and slows
	# the pacing back to ~Normal when a frame overruns its budget, so the speed alone gains nothing here.
	-AdaptiveGameSpeed:
	MapOptions:
		ShortGameEnabled: False
		# Samples are tick-based, so speed changes wall-clock time only. LOCKED, because Launch.Map
		# sends `option gamespeed default` (Game.LoadMap), and the lobby refuses a locked option.
		GameSpeed: maximum
		GameSpeedDropdownLocked: True

Player:
	-ConquestVictoryConditions:
	Shroud:
		FogCheckboxEnabled: False
		ExploredMapCheckboxEnabled: True
	PlayerResources:
		DefaultCash: 0
