ProbeLegacyLight:
	Inherits: ^Warhead_CannonAP_Light
	ReloadDelay: 99999
	Range: 5120
	Projectile: InstantHit

ProbeLegacyMedium:
	Inherits: ^Warhead_CannonAP_Medium
	ReloadDelay: 99999
	Range: 5120
	Projectile: InstantHit

ProbeLegacyHeavy:
	Inherits: ^Warhead_CannonAP_Heavy
	ReloadDelay: 99999
	Range: 5120
	Projectile: InstantHit

ProbeH0:
	Inherits: ^Warhead_CannonAP
	ReloadDelay: 99999
	Range: 5120
	Projectile: InstantHit
	Warhead@CannonAP:
		Heaviness: 0

ProbeH1000:
	Inherits: ProbeH0
	Warhead@CannonAP:
		Heaviness: 1000

ProbeH2000:
	Inherits: ProbeH0
	Warhead@CannonAP:
		Heaviness: 2000

# Real projectiles and warheads; only reload is extended to isolate one shot.
ProbeTankKiller:
	Inherits: TSHighVelocity
	ReloadDelay: 99999

ProbeWarriorTank:
	Inherits: TSHighVelocity2
	ReloadDelay: 99999

ProbeWarriorTurret:
	Inherits: TSHighVelocityTur
	ReloadDelay: 99999

# Isolate the old folded component versus its proposed standalone replacement.
ProbeFreedomFolded:
	Inherits: ^Warhead_MissileAP_Medium
	ReloadDelay: 99999
	Range: 5120
	TargetActorCenter: false
	Projectile: InstantHit
	Warhead@MissileAP_Medium:
		Damage: 120000
		PercentageScale: 10000
		DamageCalculationType: ClosestTargetablePosition

ProbeFreedomCompanion:
	Inherits: RA2FreedomRocket_elite
	ReloadDelay: 99999
	TargetActorCenter: false
	-Projectile:
	Projectile: InstantHit
	-Warhead@MissileAP_Medium:
	-Warhead@FlakWeaponPercentage:
	-Warhead@ShrapnelWeaponPercentage:
	Warhead@FreedomElitePreservedPercentage:
		DamageCalculationType: ClosestTargetablePosition
