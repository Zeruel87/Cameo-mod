# X2 EMP suffix migration (Ruling 12, DESIGN.md section 1 combined-suffix order:
# <base>_<doctrine/upgrade/variant>_EMP_AA_elite). EMP moves from infix/prefix
# to true suffix; AG/Structure/Garrisoned are variant slots and precede _EMP;
# tight compounds (GrenadeExplode, MissileDefender, PatriotMiss) stay unsplit
# per Claude's example USA_EMP_PatriotMissAA -> USA_PatriotMiss_EMP_AA.
actors:
  EMPGrenade: Grenade_EMP
  EMPGrenadeExplode: GrenadeExplode_EMP
  DR_EMP_Device: DR_Device_EMP
  eden_EMP_GP: eden_GP_EMP
  plymouth_EMP_Tiger: plymouth_Tiger_EMP
  USA_EMP_PatriotMissAG: USA_PatriotMiss_AG_EMP
  USA_EMP_PatriotMissAA: USA_PatriotMiss_EMP_AA
  SUSA_EMP_MissileDefenderAG: SUSA_MissileDefender_AG_EMP
  SUSA_EMP_MissileDefenderStructure: SUSA_MissileDefender_Structure_EMP
  SUSA_EMP_MissileDefenderGarrisoned: SUSA_MissileDefender_Garrisoned_EMP
files:
