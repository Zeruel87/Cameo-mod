# DO NOT apply tools/rename/rename_map_ra1_soviets.yaml — it is stamped
# STALE (generated before the 2026-09-06 gen_rename_maps fix) and proposes
# doubled/compound targets.  Actor ids are already 106/106 compliant
# (commit ad7c5e232); this map is sequence-name ids + files only.
