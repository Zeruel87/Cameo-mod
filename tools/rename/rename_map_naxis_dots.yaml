# rename_map_naxis_dots.yaml — hand-built 2026-09-06 (Devin-Nova)
# Faction-suffix migration: legacy `<name>.nax` -> `naxis_<name>` and
# `<name>.nax2` -> `schwarzermond_<name>` per DESIGN §9.
# NOTE: `.nax2` ids live in the SchwarzerMond pack (InternalName: schwarzermond),
# so they take the schwarzermond_ prefix — this also resolves the two real
# collisions (conyard_infiltrated, zep_husk exist under both suffixes).
# CORRECTED (per Ember's grammar ruling, 2026-09-06 night): `up_*` ids are
# upgrade items / upgrade proxies, so they take `naxis_upgrade_*`, not
# `naxis_up_*`. The team proxy takes `<served upgrade>_proxy_actor`.
# Verified: zero target-name collisions tree-wide.
