# upgrades_intent.yaml — MASTER_REPORT R4: one line of intent per upgrade.
# Seeded for the Tiberian Sun faction group (TS GDI, TS Nod, CABAL, Forgotten),
# whose upgrade economies were hand-verified in the TB23 normalization work.
# Other factions' upgrades are reported by audit_upgrades.py as "no intent
# entry" until transcribed — that list is the transcription TODO.
#
# Fields:
#   faction:   owning faction slug
#   effect:    what the tooltip promises (free text, for humans)
#   coverage:  roster_wide | infantry | vehicles | aircraft | listed | narrow
#   phase:     early | mid | late
#   drawbacks: space-separated trait base names that are INTENTIONALLY
#              anti-buff (e.g. damagemultiplier for a glass-cannon upgrade)

######################## TD Nod — Temple tier #######################
td_nod_upgrade_elitecapacitors:
	faction: td_nod
	effect: laser firepower +30% with 15% longer reload; range and vision +15%; Obelisk bonuses +60% firepower, -60% reload delay, and +30% range and vision
	coverage: listed
	phase: late
	drawbacks: reloaddelaymultiplier
td_nod_upgrade_cyberneticmodifications:
	faction: td_nod
	effect: infantry shield and Medium armor profile; speed +20%
	coverage: infantry
	phase: late
	drawbacks: damagemultiplier

