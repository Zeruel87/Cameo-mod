      no RA2 Apocalypse row. Median 1.71x, mean 1.80x, spread 1.11x-2.93x. Across all 930
      dual-weapon reference actors only 29.2% sit inside 1.05x while 45.4% exceed 3x.
      ⛔ SCOPE: none of these INI rows votes on td_gdi_mammothtank. Its current voters are
      Combined Arms and OpenRA Tiberian Dawn, which differ by about 1.21x per cycle / 1.15x by
      rate. The stale map's old 1.013x result came from an excluded DTA Enhanced vote cancelling
      the two valid sources; after regeneration the target ratio is 1.220x against a 1.208x peer
