  - id: aa_split_pairs_compliant
    value: 36
    tolerance: 0
    what: >
      `_AA`/ground weapon pairs that obey the AA-split law (DESIGN 3a.1, maintainer 2026-09-14):
      a weapon split into ground and _AA halves only because OpenRA cannot give one armament 1.5x
      reach against air is ONE weapon, so Damage, ReloadDelay, Burst, BurstDelays AND MinRange
      must be identical and ONLY the maximum Range differs, by exactly 1.5x. ⛔ MinRange NEVER
      scales - "no range multiplier changes min range" - and scaling it by 1.5x alongside Range
      silently widens the dead zone the unit cannot shoot into; four pairs (Naxis_Komet, eden_EMP,
      edenTiger_EMP, plymouth_EMP) make exactly that mistake. Of 63 pairs in the tree, 36 comply,
      21 are VALUE violations and 6 have a reach ratio other than 1.5x. The violations share no
      direction: RA2GattlingMG1/2/3 and YuriGatlingCannonMG1/2/3 give the AA half double damage,
      the Lunar/Naxi laser family gives it half, SteelMantaHunterCannons scales damage and reload
      together, and Rocket_stealth makes AA weaker on a 1.19x range. This claim is a RATCHET in
      the rising direction: it may go UP as pairs are fixed, never down.
    docs: [docs/DESIGN.md]
    measure: |
      import pathlib, sys
      root = pathlib.Path('.').resolve()
      sys.path.insert(0, 'tools/audit'); sys.path.insert(0, 'tools/balance')
      import miniyaml
      rules = miniyaml.Ruleset(root)
      IDENTICAL = ('Damage', 'ReloadDelay', 'Burst', 'BurstDelays', 'MinRange')
      def wf(name):
          w = rules.resolve_weapon(name)
          if w is None:
              return None
          out = {}
          for k in ('ReloadDelay', 'Burst', 'BurstDelays', 'Range', 'MinRange'):
              n = next((c for c in w.children if c.key == k), None)
              if n is not None:
                  out[k] = str(n.value)
          dmg = [int(k.value) for c in w.children
                 if c.key.split('@', 1)[0].startswith('Warhead')
                 for k in c.children if k.key == 'Damage']
          if dmg:
              out['Damage'] = max(dmg)
          return out
      def num(v):
          try:
              return float(str(v).rstrip('c'))
          except (TypeError, ValueError):
              return None
      clean = 0
      for name in sorted(rules.weapons):
          if not name.endswith('_AA'):
              continue
          base = name[:-3]
          if base not in rules.weapons:
              continue
          a, g = wf(name), wf(base)
          if a is None or g is None:
              continue
          if any(g.get(k) != a.get(k) for k in IDENTICAL):
              continue
          gv, av = num(g.get('Range')), num(a.get('Range'))
          if gv and av and abs(av / gv - 1.5) <= 0.001:
              clean += 1
      print(clean)

