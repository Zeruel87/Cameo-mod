  - id: meters_filling_before_death
    value: 269
    tolerance: 0
    what: >
      Weapon/meter bindings on FIRED weapons whose meter reaches FULL effect while the target
      still has 25% HP left — the maintainer's condition for pricing a meter at all ("it is
      able to completely freeze a unit BEFORE it dies"). **269 bindings (2026-09-05).**
      ⛔ THE EARLIER VALUES (1, 124, 223, 534) ARE ALL VOID, for TWO different reasons, and the
      second one is the important one.
      (a) ARITHMETIC. `PhysicalState.ApplyChange` health-scales through `ScaleChangeToHealth`,
      which divides by MaxHP and multiplies by the meter's RANGE (`MaxValue - MinValue`) — NOT
      by the 10000 that `PhysicalStateInfo`'s own [Desc] still advertises. Fixed 2026-08-18,
      together with `Corrosion`'s unsigned `MinValue` (maintainer: *"the absolute maximum and
      minimum values are the same!"*), giving `ratio = 50/Scale` on both meters.
      (b) ⛔ STRUCTURE — W24, and no guard in this tree could see it. The clean form assumes
      the damage that FILLS the meter is the damage that KILLS the target. That is true for
      **41 of 427** damage-scaled weapons. The rest are multi-main Frankenstein weapons: a
      Chemical Stealth Tank fires Shrapnel 5500 + Missile 9000 + Chemical 9000 and only the
      Chemical warhead carries `PhysicalStateName`, so it kills on 27175/shot and fills on
      10350. `ratio = 50/Scale / fed_share`, and the MEDIAN fed_share across the tree is
      **0.398** — so the typical metered weapon fills ~2.5x slower than modelled and misses
      the bar entirely. 534 -> 118 is that one term.
      ⚠ THE MAINTAINER FOUND THIS BY PLAYTESTING A HARVESTER, not by any check here. This
      claim counted bindings, the unit tests pinned arithmetic, the boot gate proved it loads;
      none asked whether the two damage figures were the same damage. See `w24_multi_main_fed`
      for the work list that closes it.
      ⚠ RELAXATION IS STILL EXCLUDED and pushes this number DOWN further: `RelaxationDelay 25`
      + `RelaxationLinear 5` + `RelaxationScaled 50` bleeds ~642 meter/shot at `ReloadDelay 60`.
      Add it after W24, not before — it is a second term on the same corrected base.
      The formula lives ONLY in `tools/balance/physical_state_price.py`, which this measure
      imports, so the two can no longer disagree.
    docs: [docs/design/PHYSICAL_STATE_SYSTEM.md, docs/design/ARMOR_LAYERS.md]
    measure: |
      import sys, pathlib
      sys.path[:0] = ['tools/audit', 'tools/balance']
      from cameo_model import Model
      import physical_state_price as psp
      rows, _ref, _geom, _exp, _curves = psp.scan(Model().rs)
      print(sum(1 for r in rows
                if r['ratio'] is not None and r['ratio'] <= psp.FULL_EFFECT_BAR))

