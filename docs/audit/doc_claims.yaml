  - id: warhead_family_reach
    value: 1415
    tolerance: 0
    what: >
      Fired weapons whose inherit chain reaches a `^Warhead_*` family — the W23/W24 burn-up.
      The rest still route through the legacy templates that `audit_unconverted_templates`
      lists. BALANCE_PROGRAM_PLAN §0a carried "639 of 1620 = 39%" with no recorded method;
      this entry pins BOTH the number and how it is counted (transitive inherit chain over the
      fired-weapon set), so the next reader does not have to guess which was measured.
      ⛔ RATCHET — this may only go UP.
    docs: [docs/design/BALANCE_PROGRAM_PLAN.md, docs/HANDOFF.md]
    measure: |
      import pathlib, sys
      sys.path[:0] = ['tools/audit', 'tools/balance']
      from miniyaml import Ruleset
      rs = Ruleset(pathlib.Path('.').resolve())
      fired = set()
      for name in rs.actors:
          if name.startswith('^'): continue
          node = rs.resolve(name)
          if node is None: continue
          for c in node.children:
              if c.key == 'Armament' or c.key.startswith('Armament@'):
                  w = c.get('Weapon')
                  if w: fired.add(str(w).strip())
      def ancestors(nm, seen=None):
          seen = seen if seen is not None else set()
          n = rs.weapon(nm)
          if n is None: return seen
          for _k, v in rs.inherits_of(n):
              v = str(v).strip()
              if v and v not in seen:
                  seen.add(v); ancestors(v, seen)
          return seen
      print(sum(1 for w in fired
                if rs.weapon(w) is not None
                and any(a.startswith('^Warhead_') for a in ancestors(w))))

