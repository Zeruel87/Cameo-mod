  - id: always_on_shield_actors
    value: 58
    tolerance: 0
    what: >
      Actors that SPAWN with a shield pool and no positive gate — the only ones E1 prices.
      1318 more carry an empty capacity behind `shieldgen`; ~216 are upgrade-gated.
    docs: [docs/DESIGN.md, docs/design/ARMOR_LAYERS.md]
    measure: |
      import re, sys, pathlib
      sys.path[:0] = ['tools/audit', 'tools/balance']
      from miniyaml import Ruleset
      TOK = re.compile(r'[A-Za-z_][A-Za-z0-9_.]*')
      def num(v, d=0.0):
          try: return float(str(v).strip())
          except (TypeError, ValueError): return d
      def gated(cond):
          for t in re.split(r'&&|\|\|', str(cond or '')):
              t = t.strip().strip('()').strip()
              if t and not t.startswith('!') and TOK.match(t): return True
          return False
      rs = Ruleset(pathlib.Path('.').resolve()); n = 0
      for name in rs.actors:
          if name.startswith('^'): continue
          node = rs.resolve(name)
          if node is None: continue
          for c in node.children:
              if c.key.split('@')[0] != 'Shielded': continue
              pool = num(c.get('MaxStrength')) + num(c.get('MaxPercentageStrength'))
              init = num(c.get('InitialStrength')) + num(c.get('InitialPercentageStrength'))
              if pool > 0 and init > 0 and not gated(c.get('RequiresCondition')): n += 1
              break
      print(n)

  - id: always_on_shielded_buildings
    value: 16
    tolerance: 0
    what: >
      Buildings with an always-on shield. ALL are Protoss. Corrects an analysis that measured
      all 1016 unarmed buildings and reported a 19x shift in the Shield column's weight.
    docs: [docs/design/BALANCE_PROGRAM_PLAN.md]
    measure: |
      import re, sys, pathlib
      sys.path[:0] = ['tools/audit', 'tools/balance']
      from miniyaml import Ruleset
      TOK = re.compile(r'[A-Za-z_][A-Za-z0-9_.]*')
      def num(v, d=0.0):
          try: return float(str(v).strip())
          except (TypeError, ValueError): return d
      def gated(cond):
          for t in re.split(r'&&|\|\|', str(cond or '')):
              t = t.strip().strip('()').strip()
              if t and not t.startswith('!') and TOK.match(t): return True
          return False
      rs = Ruleset(pathlib.Path('.').resolve()); n = 0
      for name in rs.actors:
          if name.startswith('^'): continue
          node = rs.resolve(name)
          if node is None: continue
          sh = None; is_bld = False; armor = None
          for c in node.children:
              k = c.key.split('@')[0]
              if k == 'Shielded' and sh is None: sh = c
              elif k in ('Building', 'LineBuild'): is_bld = True
              elif k == 'Armor' and armor is None: armor = (c.get('Type') or '').strip()
          if sh is None: continue
          if not (is_bld or armor in ('Wood', 'Steel', 'Concrete')): continue
          pool = num(sh.get('MaxStrength')) + num(sh.get('MaxPercentageStrength'))
          init = num(sh.get('InitialStrength')) + num(sh.get('InitialPercentageStrength'))
          if pool > 0 and init > 0 and not gated(sh.get('RequiresCondition')): n += 1
      print(n)

  - id: live_damage_multipliers
    value: 356
    tolerance: 0
    what: >
      DamageMultiplier declarations in LIVE files (mod.yaml's Rules list). The tree holds 683;
      314 sit in dead files such as rules/wh40k.yaml, which is why a plain grep misleads.
      Was 369 until the shield-150% block and its two Consortium dependents were deleted
      (W26, 2026-08-17) — this claim FAILED on the audit's very first run and is the intended
      demonstration: the count moved with the work and the document had not.
    docs: [docs/design/BALANCE_PROGRAM_PLAN.md]
    measure: |
      import re, sys, pathlib
      sys.path[:0] = ['tools/audit', 'tools/balance']
      from miniyaml import Ruleset
      rs = Ruleset(pathlib.Path('.').resolve())
      pat = re.compile(r'^\tDamageMultiplier(@[\w.]+)?:\s*$')
      n = 0
      for p in sorted({q.resolve() for q in rs.manifest.rules}):
          try: lines = p.read_text(encoding='utf-8', errors='replace').split('\n')
          except OSError: continue
          n += sum(1 for ln in lines if pat.match(ln))
      print(n)

