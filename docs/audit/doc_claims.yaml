  - id: w24_multi_main_fed
    value: 290
    tolerance: 0
    what: >
      RATCHET — damage-scaled metered weapons whose meter is fed by LESS than 100% of their
      main damage (W24, the 3-way weapon split). 386 of 427; median fed share 0.398; the worst
      are 12-main EMP weapons at 4%. Each one is a weapon where the status effect the player
      was promised cannot arrive before the target dies.
      ⛔ THIS NUMBER MUST ONLY EVER GO DOWN. It is the W24 burn-down: splitting a weapon so a
      single main warhead carries both the damage and the meter removes it from the count.
      A rise means a new multi-main weapon shipped with a meter on only part of its damage.
      2026-09-05: measured 429 after origin/master merge 4fd9937f3 — the merge brought in
      new weapons from master, resetting the ratchet baseline. Previous value 376.
      2026-09-06: measured 455 after intentional_composites exemption repeal — the reviewed
      predicate now returns False for all weapons, so previously-exempt composites are counted.
      This is a one-time baseline reset, not a regression.
      Ordering, from `BALANCE_PROGRAM_PLAN` §0a and restated by the maintainer 2026-08-19
      (*"that's exactly why I said you should finish the 3 way weapon split first!"*): weapon
      STRUCTURE before pricing. Pricing a weapon whose structure is wrong measures the wrong
      object — that is exactly how `meters_filling_before_death` came to claim 534.
    docs: [docs/design/WEAPON_3WAY_SPLIT.md, docs/design/PHYSICAL_STATE_SYSTEM.md]
    measure: |
      import sys
      sys.path[:0] = ['tools/audit', 'tools/balance']
      from cameo_model import Model
      import physical_state_price as psp
      rs = Model().rs
      n = 0
      for w in psp.fired_weapons(rs):
          _d, binds = psp.weapon_bindings(rs, w)
          if not any(k == 'scaled' for _m, k, _g in binds):
              continue
          total, fed = psp.damage_split(rs, w)
          if total > 0 and fed / total < 0.999:
              n += 1
      print(n)
  - id: physical_state_fired_weapons
    value: 542
    tolerance: 0
    what: >
      FIRED weapons that deliver a PhysicalState meter (Temperature or Corrosion) and are priced
      at ZERO for it — E2. Counts all THREE shapes: a discrete `ApplyPhysicalState` warhead, a
      damage-scaled `PhysicalStateScale`, and a BLEND's `PhysicalStates:` dict — which carries no
      `PhysicalStateName` at all, so keying on that name misses every blend family. Counting one
      shape is how the docs carried "~89 bindings"; counting two gave 367.
    docs: [docs/design/ARMOR_LAYERS.md, docs/design/BALANCE_PROGRAM_PLAN.md]
    measure: |
      import sys, pathlib
      sys.path[:0] = ['tools/audit', 'tools/balance']
      from cameo_model import Model
      m = Model(); rs = m.rs
      fired = set()
      for name in rs.actors:
          if name.startswith('^'): continue
          node = rs.resolve(name)
          if node is None: continue
          for c in node.children:
              if c.key == 'Armament' or c.key.startswith('Armament@'):
                  w = (c.get('Weapon') or '').strip()
                  if w: fired.add(w)
      n = 0
      for w in sorted(fired):
          node = rs.resolve_weapon(w)
          if node is None: continue
          for wh in node.children:
              if not wh.key.startswith('Warhead'): continue
              if not (wh.get('PhysicalStateName') or '').strip(): continue
              rel = (wh.get('ValidRelationships') or '').strip()
              if 'Ally' in rel and 'Enemy' not in rel: continue
              n += 1
              break
          else:
              for wh in node.children:
                  if not wh.key.startswith('Warhead'): continue
                  if any(x.key == 'PhysicalStates' for x in wh.children):
                      n += 1
                      break
      print(n)

  - id: plating_row_ties
