      immediate - the FLOOR of its range, and the value the pipeline prices. Maintainer ruling
      2026-09-14: "for the asian alliance railgun tower it needs to charge for every shot
      unlike the tesla coil! So at 5 shots the initial charge delay is used 5 times!" -
      CONFIRMED by the engine. ChargeFire.Tick returns true when AttackBase.CanAttack is false,
      and CanAttack calls HasAnyValidWeapons(reloadingIsInvalid: true), so a reloading armament
      ENDS the activity rather than stalling it; the actor re-enters through ChargeAttack and
      pays InitialChargeDelay again. Weapon reload 10 > ChargeDelay 3, so the tower is
      charge-per-shot: 4 x (10 + 10) + 120 + 10 = 210. ⚠ It was 220 while the wind-up was 12;
      the maintainer set InitialChargeDelay to 10 on 2026-09-14 for consistency, having first
      considered ChargeDelay 10 and then rejected it because that would have silently converted
      the tower to charge-ONCE (cycle 170) and removed the per-shot charging that is the
      building's identity. ⛔ This is a FLOOR, not the runtime cadence: a charge-per-shot actor
      goes idle between shots and re-enters on AutoTarget's scan, which is
      Random.Next(MinimumScanTimeInterval 3, MaximumScanTimeInterval 8) = U{3..7}, neither
      overridden by any Cameo yaml. A 300-seed sample reports 210 minimum / 218 mean / 232
      maximum, while a valid repeating scan path produces 234; sampled maxima are not ceilings.
      Baseline Tesla Coil states are invariant when exactly one condition-gated armament is
      enabled. The ideal 210 floor is priced deliberately; the spread above it is recorded,
      not applied.
      Two withdrawn figures of mine, 172 and 180, assumed ChargeFire spins rather than exits.
      ⚠ Counting the charge cut this tower's measured rate from 968.75 to 738.1, -24%.
    measure: |
      import sys
      sys.path.insert(0, 'tools/balance')
      import sim_attack_tesla as sim
      spec = sim.ACTORS['asianalliance_railtower']
      period, closed, _, _ = sim.analyse('asianalliance_railtower', spec)
      assert period == closed, (period, closed)
      print(period)

  - id: tesla_coil_attack_period
    value: 131
    tolerance: 0
    what: >
      The RA1 Tesla Coil's attack period in ticks, as priced: 100 (AttackTesla ReloadDelay)
      plus 3 x (3-1) inter-zap gaps plus the 25-tick InitialChargeDelay. ⭐ This claim pinned
      the IMPLEMENTED 106 for as long as the charge term was withheld, and it moved to the
      ruled 131 when formula.charge_attack_cycle began counting the wind-up (maintainer,
      2026-09-14: "charged weapons come at a discount but the attack cycle duration is reload
      delay plus charge delay"). The mode is decided by ChargeDelay against the WEAPON's
      reload, now recorded by extract_stats: reload <= ChargeDelay is charge-once
      (gap = ChargeDelay), reload > ChargeDelay is charge-per-shot
      (gap = reload + wind-up), because ChargeFire.Tick returns true when AttackBase.CanAttack
      is false and CanAttack calls HasAnyValidWeapons(reloadingIsInvalid: true). Two traces of
      mine, 172 and 180, were WITHDRAWN for assuming ChargeFire spins instead of exiting;
      Codex and Astra caught it. ⚠ Counting the charge cut this coil's measured rate from
      1358.5 to 1099.2 per tick, -19%: it had been read as firing a fifth faster than it does.
      See railtower_immediate_reacquisition_period for the charge-per-shot half.
    measure: |
      import pathlib, sys
      root = pathlib.Path('.').resolve()
      sys.path.insert(0, 'tools/audit'); sys.path.insert(0, 'tools/balance')
      import armament_roles as ar, assign_references as asg, miniyaml
      rules = miniyaml.Ruleset(root)
      views = ar.cameo_views(asg.ledger()['ra1_soviets_teslacoil'], rules)
      cycles = {v['cycle'] for v in views}
      if len(cycles) != 1:
          raise SystemExit(f'the coil should have one cycle, got {sorted(cycles)}')
      print(int(cycles.pop()))
