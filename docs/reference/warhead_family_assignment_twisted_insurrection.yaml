# Reference warhead group -> Cameo warhead family — TWISTED INSURRECTION.
#
# HAND-AUTHORED, like the Combined Arms file beside it, and for the same reason: every row is a
# JUDGEMENT and every one has to be arguable. R21 forbids rebuilding this from a name-matching
# pass, and R46 measured why — four automatic matchers score ~20% against a 75% ceiling.
#
# HOW THIS PASS WAS MADE, so it can be audited rather than trusted:
#   * Group rows carry a decision per measured (delivery, element) SIGNATURE, with the reasoning
#     in `why`. A signature is what the measurement actually distinguishes.
#   * `overrides:` holds the 96 weapons looked at individually. An override BEATS its
#     group, and it is keyed by WEAPON so it survives re-clustering — which matters: the first
#     pass keyed these by GROUP and lost one within a single regrouping (R50).
#   * Everything is `status: proposed`. NOTHING here has been reviewed by the maintainer.
#
# ⚠ THE LEVEL IS NOT DECIDED HERE. `band` records which platform fires the weapon; the family is
# the only decision this file makes.
#
# Current run: tau 0.20, four platform bands, one main warhead per weapon, zeros as absences,
# element vocabulary per R45/R50, delivery per R48.
