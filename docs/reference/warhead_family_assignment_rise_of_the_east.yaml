overrides:
  AngelWH:
    family: MissileHE
    why: ⚠ its signature says Missile/Kinetic, which would be MissileAP, but the profile is 200 across
      every infantry AND vehicle rung falling only against structures — a generalist warhead, not an armour-piercing
      one. Collapsed as MissileAP it gave that family a flat 200, which is not what AP means (R52)
  AntiB:
    family: Demolition
    why: 'anti-building by name and profile: 200 on structures, nothing else'
  AvengerWH:
    family: Prism
    why: 'the Allied Avenger IFV''s `AvengerLaser` (Prism Raider report; ground and air) (R71: was a signature-level
      `Quantum` read - a flat, Verses-less laser with InfDeath=5 lumped a dozen different weapons together)'
  BlimpHE:
    family: Demolition
    why: a blimp detonating — the same weapon name as Red Resurrection's
  BusterWH:
    family: Cryo
    why: 'the Allied Cryobuster''s `BusterWeapon` (`CryobusterReport`, slows 0.8x) (R71: was a signature-level
      `Quantum` read - a flat, Verses-less laser with InfDeath=5 lumped a dozen different weapons together)'
  ChronoBeam2:
    family: '(drop: not a damage warhead)'
    why: a chrono beam — R21 names this family of weapon; it reaches buildings only and carries no damage
      ladder
  ChronoBeamD1:
    family: Cryo
    why: 'the Allied Cryo Legionnaire''s `NeutronRifle` (`CryoGunShot`, `CRYOFX2`) - named chrono, a cryo
      gun (R71: was a signature-level `Quantum` read - a flat, Verses-less laser with InfDeath=5 lumped
      a dozen different weapons together)'
  Comet2WH:
    family: Laser
    why: 'the Allied Laser Tank''s `TankLaser` (R71: was a signature-level `Quantum` read - a flat, Verses-less
      laser with InfDeath=5 lumped a dozen different weapons together)'
  CometWH:
    family: Prism
    why: 'the Allied Prism Tank''s and Shard Cruiser''s `Comet` (`PrismTankAttack`, prism fragments) -
      a real prism weapon (R71: was a signature-level `Quantum` read - a flat, Verses-less laser with
      InfDeath=5 lumped a dozen different weapons together)'
  CryoBeamWH:
    family: Cryo
    why: 'the Allied Cryo Chopper''s `CryoBeam` (`ICEDIE`, slows) (R71: was a signature-level `Quantum`
      read - a flat, Verses-less laser with InfDeath=5 lumped a dozen different weapons together)'
  DemoBombWHF:
    family: Demolition
    why: a demolition bomb
  DesolatorWH:
    family: Radiation
    why: '`DesolatorWH` - the maintainer-CONFIRMED `Radiation` family (CA review: DesolatorBeam, RadTrooperBeam,
      ApocRadBeamWeapon). Anti-infantry radiation, not the buildings-first `Nuclear` blast (R69/R70)'
  DisruptorWH:
    family: Sonic
    why: a disruptor — the Tiberian Sun sonic weapon
  ElectricE:
    family: Tesla
    why: 'the Soviet Shock Trooper''s `ShockBurstE` (IsElectricBolt) (R71: was a signature-level `Quantum`
      read - a flat, Verses-less laser with InfDeath=5 lumped a dozen different weapons together)'
  ElectricEMP:
    family: Tesla
    why: 'the Soviet Tesla Raider''s `TeslaRaiderBolt` (IsElectricBolt) (R71: was a signature-level `Quantum`
      read - a flat, Verses-less laser with InfDeath=5 lumped a dozen different weapons together)'
  FleurWH2:
    family: '(drop: not a damage warhead)'
    why: 'Yuri Commando Fleur''s `FleurLaserN` - Damage 1, Verses 3%, an AttachEffect marker: a debuff,
      not damage (R71: was a signature-level `Quantum` read - a flat, Verses-less laser with InfDeath=5
      lumped a dozen different weapons together)'
  HailWH:
    family: Laser
    why: 'the Allied Hailstorm Submarine''s `HailWeap` (R71: was a signature-level `Quantum` read - a
      flat, Verses-less laser with InfDeath=5 lumped a dozen different weapons together)'
  HoliafWH:
    family: Laser
    why: 'the Soviet Holiaf''s `MekhaLaser` (150 dmg, strips Iron Curtain, disarms) - a heavy laser (R71:
      was a signature-level `Quantum` read - a flat, Verses-less laser with InfDeath=5 lumped a dozen
      different weapons together)'
  HollowPointV:
    family: CannonAP
    why: '⚠ its measured delivery is Radiation, which a hollow-point round is not. The PROFILE decides
      (R52): 50/41/31 against infantry rising to 158/200/200 against vehicles with no building reach —
      an armour-piercing round'
  PrismRaiderWH:
    family: Prism
    why: 'the Allied Prism Raider''s `ZoneLaser` and the Avenger/Bullfrog IFV special shot (R71: was a
      signature-level `Quantum` read - a flat, Verses-less laser with InfDeath=5 lumped a dozen different
      weapons together)'
  PrismWarhead:
    family: Prism
    why: 'the Allied Prism Cannon''s `PrismShot` - a real prism weapon (CA review: Prism is reserved for
      prism weapons) (R71: was a signature-level `Quantum` read - a flat, Verses-less laser with InfDeath=5
      lumped a dozen different weapons together)'
  RadBeamWarhead:
    family: Radiation
    why: '`RadBeamWarhead` - the maintainer-CONFIRMED `Radiation` family (CA review: DesolatorBeam, RadTrooperBeam,
      ApocRadBeamWeapon). Anti-infantry radiation, not the buildings-first `Nuclear` blast (R69/R70)'
  RailShot2:
    family: Railgun
    why: 'a rail shot delivered as Laser (the beam visual again, R52): 63/47/31 against infantry rising
      to 200 across every vehicle rung'
  ScavengeWH:
    family: '(park: REVIEW - scavenge beam that also hits allies)'
    why: 'the Yuri Splicer''s `ScavengeWeapon` - rapid beam, `AffectsAllies=yes`, drains Iron Curtain;
      a drain/recycle mechanic or genetic (Mutagen)? (R71: was a signature-level `Quantum` read - a flat,
      Verses-less laser with InfDeath=5 lumped a dozen different weapons together)'
  ShadowWH2:
    family: '(drop: not a damage warhead)'
    why: 'no firing unit (`CRPulverizer`, `CRChaosGun` - unused CR variants); Damage 1, Verses 3% (R71:
      was a signature-level `Quantum` read - a flat, Verses-less laser with InfDeath=5 lumped a dozen
      different weapons together)'
  SonicBurstWH:
    family: Sonic
    why: a resonance burst
  SonicWH:
    family: Sonic
    why: named for what it is
  SpotterWH:
    family: '(drop: targeting relay)'
    why: a spotter marks targets for something else to shoot; its flat 31.6 against vehicles is a marker,
      not damage
  TerrorBombWH:
