overrides:
  AllCraneRepairWH:
    family: '(drop: support weapon)'
    why: a repair crane
  AntiB:
    family: Demolition
    why: anti-building by name and by profile — 176.6 against wood/steel/concrete and nothing else reachable
  BombDroneWH:
    family: Demolition
    why: a suicide bomb drone, not an incendiary missile
  CazadorAutocannonWH:
    family: Bullet
    why: INF 170 / VEH 74 — an autocannon
  DanteSniperWH:
    family: Sniper
    why: 'a sniper: 200 across all three infantry rungs falling to 79-97 against vehicles, and no reach
      against structures at all'
  DobriloDeployWH:
    family: '(drop: not a damage warhead)'
    why: a deploy effect, flat 10 at the floor of the window
  GunboatHealWH:
    family: '(drop: support weapon)'
    why: a heal, not a weapon
  HeadhunterGunWH:
    family: Bullet
    why: INF 192 / VEH 71 — an infantry gun
  InfCannonWH:
    family: Bullet
    why: INF 162 / VEH 62 — an infantry cannon, anti-personnel
  J20BombWH:
    family: '(drop: support weapon)'
    why: 'flat 10 at the window floor against vehicles only: a marker, despite the name'
  Mechanical:
    family: '(drop: support weapon)'
    why: 'named only `Mechanical`, reaching vehicles alone at a flat 176.6. Reads as the repair analogue
      of Mental Omega''s RepairMechanical. ⚠ REVIEW: if it is instead anti-mechanical DAMAGE it belongs
      in a real family'
  MirageBusterWH:
    family: BulletTesla
    why: 'anti-vehicle at 200 across light/medium/heavy: a vehicle-killing electrified round'
  NeutronWH:
    family: Radiation
    why: 'a neutron weapon - anti-personnel radiation - the maintainer-CONFIRMED `Radiation` family (CA
      review: DesolatorBeam, RadTrooperBeam, ApocRadBeamWeapon). Anti-infantry radiation, not the buildings-first
      `Nuclear` blast (R69/R70)'
  PerunLightningWH:
    family: Tesla
    why: Perun is the thunder god — a lightning strike. Delivered vertically, which is why its signature
      says Bomb, but the payload is electric
  RadBeamWarhead:
    family: Radiation
    why: 'the Desolator beam - the maintainer-CONFIRMED `Radiation` family (CA review: DesolatorBeam,
      RadTrooperBeam, ApocRadBeamWeapon). Anti-infantry radiation, not the buildings-first `Nuclear` blast
      (R69/R70)'
  SlaveMinerWH:
    family: Bullet
    why: INF 200 / VEH 94 / BLD 26 — an autocannon, not a railgun
  SovCraneRepairWH:
    family: '(drop: support weapon)'
    why: a repair crane
  VortexS1WH:
    family: '(park: REVIEW - chrono vortex or radiation?)'
    why: measured Radiation delivery, but the NAME is a vortex; neither Radiation nor Nuclear is safe
      without a look (R70)
