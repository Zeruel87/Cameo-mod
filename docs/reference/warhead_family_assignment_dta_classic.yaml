overrides:
  AP:
    family: CannonAP
    why: the Nod Light Tank's 75mm and GDI Medium Tank's 90mm - INF 190% against HEAVY 1000% (Classic)
  APAA:
    family: MissileAA
    why: the Mobile SAM's RedEye (`Patriot` projectile)
  APAARA:
    family: MissileAA
    why: the SAM Site's Nike
  APB:
    family: CannonAP
    why: the Nod Gun Turret
  APBRA:
    family: CannonAP
    why: the Allied Gun Turret
  APE:
    family: CannonAP
    why: the elite 75mm/90mm
  APRA:
    family: CannonAP
    why: the Allied Light Tank and the hovercraft 37mm
  BazAP:
    family: MissileAP
    why: 70mm rockets
  BazAPAA:
    family: MissileAA
    why: the Recon Bike's AA rocket and the chrono AA rail
  BazAPAARA:
    family: MissileAA
    why: the Rocket Soldier's AA rocket - `$Inherits`, read correctly since R63
  BazAPE:
    family: MissileAP
    why: the elite Hellfire - INF 1000% and HEAVY 1000%, anti-armour missile despite `InfDeath=4`
  BazAPRA:
    family: MissileAP
    why: the Rocket Hum-vee's tusk missiles
  BoatMsl2HE:
    family: MissileHE
    why: the Frigate's missiles and the cruiser's bow Tomahawks
  BoatMslAAHE:
    family: MissileAA
    why: the Gunboat's AA missile
  BoatMslHE:
    family: MissileHE
    why: the Gunboat's missiles
  Chemical:
    family: Toxic
    why: ⚠ the chem spray in CLASSIC is INF 440% / WOOD 750% against HEAVY 250% - anti-light, so Cameo's
      `Toxic`. DTA Enhanced rebalanced it to eat armour (MEDIUM 700%) and files it under `Chemical`. The
      profile decides, per source (R52)
  ChemicalE:
    family: Toxic
    why: the elite chem spray - same Classic shape
  CommandoGrenadeAP:
    family: CannonAP
    why: '⚠ the commando''s anti-materiel rifle and big grenade. Named a grenade, shaped anti-armour:
      INF 130% against HEAVY 1000%. R52'
  CruiserHE:
    family: CannonHE
    why: the Cruiser's 16-inch guns
  DISCHE:
    family: CannonHE
    why: the Disc Launcher's artillery disc - near-flat, anti-structure-leaning
  DeathExpWH:
    family: '(drop: not a damage warhead)'
    why: dummy triggers - Damage 0, 1% on everything
  DemoNuke:
    family: '(drop: not a damage warhead)'
    why: the Demolition Truck's trigger - Damage 0, flat 25%
  DogOrganic:
    family: Melee
    why: the Attack Dog - infantry only
  Fire1:
    family: Flame
    why: the Flamethrower Infantry and the Devil's Tongue
  FlakWH:
    family: Flak
    why: the AA gun, Flak Truck, Destroyer flak and Quad Tank ZSU-23-4 (`InvisibleAA`)
  GrenadeHE:
    family: BulletHE
    why: the Grenadier - the RV/SP/TI precedent for grenades
  GrenadeHERA:
    family: BulletHE
    why: the RA-side Grenadier
  HA:
    family: Bullet
    why: the Guard Tower's and Hind's heavy machine guns
  HE:
    family: Cluster
    why: the drone and cluster launchers - `Cluster` (§12.0k item 10); was MissileHE (R72)
  HHAE:
    family: Bullet
    why: the elite Apache machine gun
  HJFire:
    family: MissileFire
    why: the SSM Launcher's Honest John - the TD napalm missile
  HJFireE:
    family: MissileFire
    why: the elite Honest John
  HollowPoint:
    family: Sniper
    why: the Commando's rifle - INF 1000% against 30% on everything else
  LUNHE:
    family: MissileFire
    why: the Lun Ekranoplan's missiles (`Fire=yes`, `Sparky`) - INF 900% against HEAVY 500%
  LUNHEE:
    family: MissileFire
    why: the elite Lun missiles
  MINEWH:
    family: Demolition
    why: the Magnetic Water Mine - the TI precedent for mines
  MSubMslWH:
    family: MissileHE
    why: the Missile Submarine's SCUDs
  Mechanical:
    family: '(drop: support weapon)'
    why: the repair vehicle - negative damage
  MigAP:
    family: MissileAP
    why: the MiG's Maverick - INF 190% against HEAVY 1200%
  MslArtyHE:
    family: MissileHE
    why: the Missile Cruiser's aft Tomahawks
  MslHE:
    family: MissileHE
    why: the Rocket Launcher's 227mm rockets
  MslHEAA:
    family: MissileAA
    why: the Rocket Launcher's AA 227mm (the Mammoth's ground tusk borrows it)
  Napalm1:
    family: Flame
    why: the Soviet flamethrower's fireball
  Napalm2:
    family: Flame
    why: the Fire Ant's fireball launcher
  NapalmHE:
