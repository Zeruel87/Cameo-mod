  DiskDrainWH:
    family: '(drop: support weapon)'
    why: a drain effect, reaching buildings only
  EMPBeamWH:
    family: '(drop: not a damage warhead)'
    why: an EMP beam — a disable effect; Cameo models that as Integrity, not Versus
  FlintBomb:
    family: Demolition
    why: 'a bomb, not ball ammunition: nothing against infantry, 200 against structures'
  HuntressWH:
    family: Melee
