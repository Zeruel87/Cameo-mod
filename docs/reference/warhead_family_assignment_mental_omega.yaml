overrides:
  AlizeGunWH:
    family: Railgun
    why: a genuine IsRailgun weapon (R48), vehicle-only at 200 across light/medium/heavy. Its element
      has moved Tesla -> Fire across two extractor fixes without the weapon changing; the family is Railgun
      either way, which is why it is pinned per-weapon
  AssasinWH:
    family: '(drop: not a damage warhead)'
    why: flat 200 across all NINE armours including buildings, the same absent-Verses signature as ChronoBeam.
      An assassination is an instant kill
  BlimpHE:
    family: Demolition
    why: a blimp detonating. The name says HE and the broad blast profile agrees; the Toxin element is
      a death-animation artefact
  ChronoBeam:
    family: '(drop: not a damage warhead)'
    why: 'R21 names it: a mind-control effect. Flat 200 across all nine armours is the signature of ABSENT
      Verses data, not of a generalist warhead'
  ChronoBlasterWH:
    family: Temporal
    why: the Siren Frigate's `NeutronBlaster` (Chrono Legionnaire attack sound) - the maintainer-adopted
      `Temporal` family (DESIGN §12.0k item 10) - chrono erase/warp, flat, ignores armour; was `Quantum`
      (R72)
  ChronoFreezeWH:
    family: '(drop: not a damage warhead)'
    why: 'flat 10, the floor of the window, on every reachable armour: a marker'
  ChronoImprisonWH:
    family: '(drop: not a damage warhead)'
    why: an imprison effect. It carries IsRailgun for the beam visual, which is the R48 flag doing its
      real job
  ChronoWarpWH:
    family: Temporal
    why: the Charon Tank's `NeutronCannon` (1000 dmg, chrono warp) - the maintainer-adopted `Temporal`
      family (DESIGN §12.0k item 10) - chrono erase/warp, flat, ignores armour; was `Quantum` (R72)
