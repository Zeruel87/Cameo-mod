# Design-only per-weapon-template WeaponClass scalar — the pipeline DPS knob.
# ONLY central class templates ABOVE the 'DO NOT INHERIT BELOW THIS LINE' divider in
# weapons.yaml may carry WeaponClass (maintainer rule); pack weapons inherit it.
# RESTORED from git 04de392b3; NOT engine-loaded => the InvalidWeaponField lint can't strip it.
#
# LAW (Tier<->WeaponClass, maintainer 2026-08-03; see also
# docs/design/PROJECTILE_AND_EFFECT_LAYER.md): scale Light=0.75, Medium=1.0,
# Heavy=1.25, Super=1.5. Unit Tech Tier drives it: T1->Light, T2->Medium, T3+->Heavy,
# super-weapon units->1.5. Between-tier units MIX the two adjacent levels; specialized
# single-purpose units may be higher tier yet keep a light weapon (case-by-case).
# Warhead budget = TYPES x LEVELS (1 normal / 2 hybrid-or-between-tier / 4 only for a
# between-tier lore hybrid). Twins never count. Promote into DESIGN.md sec.4 later.
#
# WARNING (verified in the code 2026-08-23): this law had TWO halves and only one is
# still live. WeaponClass is the WARHEAD-LEVEL selector -- gen_weapon_template.py's
# WC = {Light 0.75, Medium 1.0, Heavy 1.25, Super 1.5, Trace 0.5} -- and that half is
# live. It is NO LONGER the pipeline DPS knob: formula.py removed weapon_class in W4
# (2026-08-11); it survives in the ledger only as design_weapon_class, a design
# judgement, not a price term. Do not price through WeaponClass.

